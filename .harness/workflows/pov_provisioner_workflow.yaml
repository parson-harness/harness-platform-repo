apiVersion: harness.io/v1
kind: Workflow
name: POV in a Box Provisioner
identifier: pov_in_a_box_provisioner
type: workflow
scope: project
projectIdentifier: parson
orgIdentifier: sandbox
owner: todd.parson@harness.io
metadata:
  description: |
    Provision a standardized Harness POV in a customer account using the profile-driven sandbox provisioner.
    
    What gets created:
    - Shared-cluster EKS sandbox resources for `eks` targets
    - Fully self-contained ASG sandbox resources for `asg` targets
    - Harness pipelines, services, environments, and application delivery resources
    - Harness Code and artifact delivery setup driven by the selected sandbox profile
    
    Prerequisites:
    - Customer Harness account with org/project created
    - Customer API key with admin permissions
    - Access to the shared EKS cluster for `eks` targets
  tags:
    - pov-in-a-box
    - iacm
    - cross-account
    - shared-infra
spec:
  presentation:
    customTitle: POV in a Box
    customSubTitle: Deploy a profile-driven demo environment into a customer account with shared EKS or self-contained ASG defaults
    customCreateButtonText: Provision POV
  
  output:
    links:
      - title: Pipeline Execution
        url: ${{ steps.trigger.output.PipelineUrl }}
      - title: EKS App URL
        url: http://${{ parameters.owner }}.harness-demo.dev
      - title: ASG App URL
        url: https://${{ parameters.owner }}-asg.harness-demo.dev
      - title: Project Pipelines
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/pipelines
      - title: Project Services
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/services
      - title: Artifact Registry
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/artifacts
  
  lifecycle: production
  
  parameters:
    - title: POV Identity
      required:
        - owner
      properties:
        owner:
          title: POV Owner
          type: string
          description: "Owner name (lowercase, alphanumeric). Used for resource naming (e.g., 'todd' creates 'todd_pov' workspace)"
          pattern: "^[a-z][a-z0-9]*$"
          ui:help: "Must start with a letter, lowercase alphanumeric only"
        
        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken
    
    - title: Harness Configuration
      required:
        - harness_account_id
        - harness_org_id
        - harness_project_id
        - target_api_key
        - target_api_key_email
      properties:
        harness_account_id:
          title: Target Account ID
          type: string
          description: "Harness Account ID where the POV will be provisioned"
          default: <+account.identifier>
          ui:help: "Find this in Account Settings > Overview, or in the URL after /account/"
        
        harness_cluster:
          title: Harness Cluster
          type: string
          description: "Which Harness cluster is the target account on?"
          default: "https://app.harness.io/gratis"
          enum:
            - "https://app.harness.io/gratis"
            - "https://app.harness.io"
            - "https://app3.harness.io"
          enumNames:
            - "Prod 1 - Harness Demo Account Cluster"
            - "Prod 2 - Enterprise accounts"
            - "Prod 3 - Enterprise accounts"
        
        harness_org_id:
          title: Organization ID
          type: string
          description: "Harness Organization ID for the POV (type manually for cross-account)"
          default: sandbox
          ui:help: "For cross-account provisioning, type the org ID manually instead of using the picker"
        
        harness_project_id:
          title: Project ID
          type: string
          description: "Harness Project ID for the POV (type manually for cross-account)"
          default: parson
          ui:help: "For cross-account provisioning, type the project ID manually"
        
        target_api_key:
          title: Target Account API Key
          type: string
          description: "API Key (PAT or SAT) for the target Harness account with admin permissions"
          ui:widget: password
        
        target_api_key_email:
          title: API Key Email
          type: string
          description: "Email associated with the target account API key"
          format: email
    
    - title: Infrastructure
      properties:
        deployment_target:
          title: Deployment Target
          type: string
          description: "Use eks for shared-cluster sandboxes and asg for fully self-contained POV environments"
          default: eks
          enum:
            - eks
            - asg

        sandbox_profile:
          title: Sandbox Profile
          type: string
          description: "Recommended profile for this POV. Use se-demo for the full demo path, se-pov-sandbox for iterative shared-account POV work, se-pov-ref-arch for a portable reference baseline, and se-workshop for a simplified hands-on flow"
          default: se-demo
          enum:
            - se-demo
            - se-pov-sandbox
            - se-pov-ref-arch
            - se-workshop

        eks_cluster_name:
          title: EKS Cluster
          type: string
          description: "Shared EKS cluster used when deployment_target is eks"
          default: "harness-eks-parson"
          ui:readonly: true
          ui:help: "POV in a Box uses the shared Harness EKS cluster. No AWS setup required in customer account."

    - title: Application Source
      properties:
        source_github_repo:
          title: Source GitHub Repo
          type: string
          description: "Source GitHub repository to import into Harness Code"
          default: "parson-harness/harness-demo-app"

    - title: Advanced Options
      properties:
        force_recreate:
          title: Force Recreate?
          type: string
          description: "Delete existing resources before provisioning"
          default: "false"
          enum:
            - "true"
            - "false"
        create_opa_policies:
          title: Create OPA Policies?
          type: string
          description: "Create or reuse the project-scoped governance workspace. Default true so project-level OPA assets are bootstrapped once per project."
          default: "true"
          enum:
            - "true"
            - "false"
        enable_change_governance:
          title: Enable Change Governance?
          type: string
          description: "Enable policy-driven change governance gates in generated workload deployment pipelines. Leave true to use project-level governance when available."
          default: "true"
          enum:
            - "true"
            - "false"
        enable_servicenow:
          title: Enable ServiceNow Change Mgmt?
          type: string
          description: "Enable ServiceNow change-management steps in the generated EKS deployment pipeline."
          default: "false"
          enum:
            - "true"
            - "false"
        servicenow_connector_ref:
          title: ServiceNow Connector Ref
          type: string
          description: "Account-level ServiceNow connector reference reused by the generated EKS deployment pipeline."
          default: "account.ServiceNow_Dev"
        servicenow_assignment_group:
          title: ServiceNow Assignment Group
          type: string
          description: "Assignment group set on generated ServiceNow change requests."
          default: "CAB Approval"
        create_project_factory:
          title: Create Project Factory?
          type: string
          description: "Create or reuse the project-scoped factory workspace for shared AWS/GitHub connectors, shared HAR, and an optional shared Harness Code repo. Leave false to keep those resources owned by the workload workspace."
          default: "false"
          enum:
            - "true"
            - "false"
        create_project_shared_har_registry:
          title: Create Shared HAR?
          type: string
          description: "Create the shared project-level HAR registry and DockerHub upstream in the project factory workspace. Leave false to keep an owner-scoped HAR per workload workspace."
          default: "false"
          enum:
            - "true"
            - "false"
        project_factory_har_registry_id:
          title: Shared HAR Registry Identifier
          type: string
          description: "Optional override for the shared project-level HAR registry identifier. Leave empty to use the predictable project-scoped default."
          default: ""
        project_factory_har_upstream_proxy_id:
          title: Shared HAR Upstream Identifier
          type: string
          description: "Optional override for the shared project-level DockerHub upstream identifier. Leave empty to use the predictable project-scoped default."
          default: ""
        create_project_shared_harness_code_repo:
          title: Create Shared Harness Code Repo?
          type: string
          description: "Create the shared project-level Harness Code repo in the project factory workspace. Leave false to keep an owner-scoped Harness Code repo per workload workspace."
          default: "false"
          enum:
            - "true"
            - "false"
        project_factory_harness_code_repo_identifier:
          title: Shared Harness Code Repo Identifier
          type: string
          description: "Optional override for the shared project-level Harness Code repo identifier. Leave empty to use the predictable project-scoped default."
          default: ""
        project_factory_github_token_ref:
          title: Shared GitHub Token Ref
          type: string
          description: "Optional Harness secret reference for the project-scoped shared GitHub connector (for example account.github_pat). Leave empty to skip shared GitHub connector creation."
          default: ""
        project_factory_aws_access_key_ref:
          title: Shared AWS Access Key Ref
          type: string
          description: "Optional Harness secret reference for the project-scoped shared AWS connector access key when using manual auth."
          default: ""
        project_factory_aws_secret_key_ref:
          title: Shared AWS Secret Key Ref
          type: string
          description: "Optional Harness secret reference for the project-scoped shared AWS connector secret key when using manual auth."
          default: ""

  steps:
    - id: trigger
      name: Provisioning POV Environment
      action: trigger:harness-custom-pipeline
      input:
        url: "https://app.harness.io/ng/account/EeRjnXTnS4GrLG5VNNJZUw/all/orgs/sandbox/projects/parson/pipelines/idp_pov_provisioner/pipeline-studio/?storeType=REMOTE&connectorRef=parsongh&repoName=harness-platform-repo&branch=main"
        inputset:
          owner: ${{ parameters.owner }}
          harness_account_id: ${{ parameters.harness_account_id }}
          harness_endpoint: ${{ parameters.harness_cluster }}
          harness_org_id: ${{ parameters.harness_org_id }}
          harness_project_id: ${{ parameters.harness_project_id }}
          target_api_key: ${{ parameters.target_api_key }}
          target_api_key_email: ${{ parameters.target_api_key_email }}
          deployment_target: ${{ parameters.deployment_target }}
          sandbox_profile: ${{ parameters.sandbox_profile }}
          use_profile_defaults: "true"
          eks_cluster_name: ${{ parameters.eks_cluster_name }}
          source_github_repo: ${{ parameters.source_github_repo }}
          force_recreate: ${{ parameters.force_recreate }}
          create_opa_policies: ${{ parameters.create_opa_policies }}
          enable_change_governance: ${{ parameters.enable_change_governance }}
          enable_servicenow: ${{ parameters.enable_servicenow }}
          servicenow_connector_ref: ${{ parameters.servicenow_connector_ref }}
          servicenow_assignment_group: ${{ parameters.servicenow_assignment_group }}
          create_project_factory: ${{ parameters.create_project_factory }}
          create_project_shared_har_registry: ${{ parameters.create_project_shared_har_registry }}
          project_factory_har_registry_id: ${{ parameters.project_factory_har_registry_id }}
          project_factory_har_upstream_proxy_id: ${{ parameters.project_factory_har_upstream_proxy_id }}
          create_project_shared_harness_code_repo: ${{ parameters.create_project_shared_harness_code_repo }}
          project_factory_harness_code_repo_identifier: ${{ parameters.project_factory_harness_code_repo_identifier }}
          project_factory_github_token_ref: ${{ parameters.project_factory_github_token_ref }}
          project_factory_aws_access_key_ref: ${{ parameters.project_factory_aws_access_key_ref }}
          project_factory_aws_secret_key_ref: ${{ parameters.project_factory_aws_secret_key_ref }}
        apikey: ${{ parameters.token }}
