apiVersion: harness.io/v1
kind: Workflow
name: Customer Self-Hosted Provisioner
identifier: customer_self_hosted_provisioner
type: workflow
scope: project
projectIdentifier: parson
orgIdentifier: sandbox
owner: todd.parson@harness.io
metadata:
  description: |
    ADVANCED: Provision a complete Harness demo in a customer's own AWS environment.
    
    ⚠️  This option requires the customer to set up their own AWS infrastructure.
    
    What gets created:
    - NEW EKS cluster in customer's AWS account
    - VPC, subnets, NAT gateways
    - IAM roles for IRSA (delegate permissions)
    - Harness CI/CD pipelines
    - Harness Service and Environments
    - Harness Artifact Registry
    
    Prerequisites (REQUIRED):
    1. Customer AWS account with admin permissions
    2. OIDC AWS Connector in customer's Harness account
       - Must have permissions: EKS, VPC, IAM, EC2
       - See: https://developer.harness.io/docs/platform/connectors/cloud-providers/ref-cloud-providers/aws-connector-settings-reference
    3. Customer Harness account with IACM enabled
    4. Customer API key with admin permissions
    
    Estimated provisioning time: 20-30 minutes (EKS cluster creation)
    Estimated AWS cost: ~$150/month for EKS + node groups
  tags:
    - customer-self-hosted
    - iacm
    - own-aws
    - advanced
spec:
  presentation:
    customTitle: Customer Self-Hosted (Advanced)
    customSubTitle: "⚠️ Creates AWS infrastructure in customer's account - requires OIDC AWS connector"
    customCreateButtonText: Provision Infrastructure
  
  output:
    links:
      - title: Pipeline Execution
        url: ${{ steps.trigger.output.PipelineUrl }}
      - title: CD Pipeline (Strategy Choice)
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/pipelines/${{ parameters.owner }}_k8s_strategy_deploy/pipeline-studio
      - title: CD Pipeline (Canary)
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/pipelines/${{ parameters.owner }}_k8s_canary_deploy/pipeline-studio
      - title: CD Pipeline (Blue-Green)
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/pipelines/${{ parameters.owner }}_k8s_bg_canary_deploy/pipeline-studio
      - title: CI Pipeline
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/pipelines/${{ parameters.owner }}_ci_build/pipeline-studio
      - title: Artifact Registry
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/artifacts
  
  lifecycle: production
  
  parameters:
    - title: POV Identity
      required:
        - owner
      properties:
        owner:
          title: POV Owner
          type: string
          description: "Owner name (lowercase, alphanumeric). Used for resource naming"
          pattern: "^[a-z][a-z0-9]*$"
          ui:help: "Must start with a letter, lowercase alphanumeric only. This will be used to name AWS resources."
        
        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken
    
    - title: Customer Harness Account
      required:
        - harness_account_id
        - harness_org_id
        - harness_project_id
        - harness_api_key
        - harness_api_key_email
      properties:
        harness_account_id:
          title: Customer Account ID
          type: string
          description: "Customer's Harness Account ID"
          ui:help: "Find this in Account Settings > Overview, or in the URL after /account/"
        
        harness_cluster:
          title: Harness Cluster
          type: string
          description: "Which Harness cluster is the customer account on?"
          default: "https://app.harness.io"
          enum:
            - "https://app.harness.io/gratis"
            - "https://app.harness.io"
            - "https://app3.harness.io"
          enumNames:
            - "Prod 1 - Free/Community accounts"
            - "Prod 2 - Enterprise accounts (most common)"
            - "Prod 3 - Enterprise accounts"
        
        harness_org_id:
          title: Organization ID
          type: string
          description: "Customer's Harness Organization ID"
        
        harness_project_id:
          title: Project ID
          type: string
          description: "Customer's Harness Project ID"
        
        harness_api_key:
          title: Customer API Key
          type: string
          description: "Customer's Harness API Key with admin permissions"
          ui:widget: password
        
        harness_api_key_email:
          title: API Key Email
          type: string
          description: "Email associated with the customer's API key"
          format: email
    
    - title: AWS Infrastructure
      required:
        - aws_region
      properties:
        create_eks_cluster:
          title: Create New EKS Cluster
          type: string
          description: "Create a new EKS cluster in customer's AWS account"
          default: "true"
          enum:
            - "true"
            - "false"
          ui:help: "⚠️ Requires OIDC AWS connector with EKS, VPC, IAM permissions"
        
        aws_region:
          title: AWS Region
          type: string
          description: "AWS region for infrastructure"
          default: "us-west-2"
          enum:
            - "us-east-1"
            - "us-east-2"
            - "us-west-1"
            - "us-west-2"
            - "eu-west-1"
            - "eu-central-1"
            - "ap-southeast-1"
            - "ap-northeast-1"
        
        existing_cluster_name:
          title: Existing EKS Cluster Name
          type: string
          description: "If not creating new cluster, provide existing cluster name"
          ui:options:
            hidden: ${{ parameters.create_eks_cluster === "true" }}
    
    - title: Harness Resources
      properties:
        create_harness_environment:
          title: Create Dev Environment?
          type: string
          description: "Create Harness dev environment and infrastructure"
          default: "true"
          enum:
            - "true"
            - "false"
        
        create_prod_environment:
          title: Create Prod Environment?
          type: string
          description: "Create Harness prod environment and infrastructure"
          default: "true"
          enum:
            - "true"
            - "false"
        
        create_delegate:
          title: Create Delegate?
          type: string
          description: "Create a new Harness delegate in the cluster"
          default: "true"
          enum:
            - "true"
            - "false"
    
    - title: Application Source
      properties:
        git_repo_url:
          title: Git Repository URL
          type: string
          description: "Git repository URL for the demo app source code"
          default: "https://github.com/parson-harness/harness-demo-app.git"
          ui:help: "Customer can fork this repo and use their own URL"
    
    - title: Advanced Options
      properties:
        force_recreate:
          title: Force Recreate?
          type: string
          description: "Delete existing resources before provisioning"
          default: "false"
          enum:
            - "true"
            - "false"
          ui:help: "⚠️ Use with caution - will destroy existing AWS infrastructure"

  steps:
    - id: trigger
      name: Provisioning Customer Infrastructure
      action: trigger:harness-custom-pipeline
      input:
        url: "https://app.harness.io/ng/account/EeRjnXTnS4GrLG5VNNJZUw/all/orgs/sandbox/projects/parson/pipelines/idp_pov_provisioner/pipeline-studio/?storeType=REMOTE&connectorRef=parsongh&repoName=harness-demo-app&branch=main"
        inputset:
          owner: ${{ parameters.owner }}
          harness_account_id: ${{ parameters.harness_account_id }}
          harness_endpoint: ${{ parameters.harness_cluster }}
          harness_org_id: ${{ parameters.harness_org_id }}
          harness_project_id: ${{ parameters.harness_project_id }}
          harness_api_key: ${{ parameters.harness_api_key }}
          harness_api_key_email: ${{ parameters.harness_api_key_email }}
          deployment_targets: "eks"
          create_eks_cluster: ${{ parameters.create_eks_cluster }}
          existing_cluster_name: ${{ parameters.existing_cluster_name }}
          create_harness_environment: ${{ parameters.create_harness_environment }}
          create_prod_environment: ${{ parameters.create_prod_environment }}
          create_delegate: ${{ parameters.create_delegate }}
          git_repo_url: ${{ parameters.git_repo_url }}
          force_recreate: ${{ parameters.force_recreate }}
        apikey: ${{ parameters.token }}
