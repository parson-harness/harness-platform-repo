                      #    echo "CD pipeline trigger returned: $http_code"
                      #    echo "Deployment can still be triggered manually."
                      #  fi
                      # else
                      #  echo "Auto-deploy is disabled. To deploy, run the strategy pipeline manually."
                      # fi
                    envVariables:
                      IMAGE_TAG: <+execution.steps.assemble_release_candidate_evidence.output.outputVariables.IMAGE_TAG>
                      TEST_PASS_RATE: <+execution.steps.prepare_governance_inputs.output.outputVariables.TEST_PASS_RATE>
                      CRITICAL_VULNERABILITIES: <+execution.steps.prepare_governance_inputs.output.outputVariables.CRITICAL_VULNERABILITIES>
                      HIGH_VULNERABILITIES: <+execution.steps.prepare_governance_inputs.output.outputVariables.HIGH_VULNERABILITIES>
                      CHANGE_BLAST_RADIUS: <+execution.steps.prepare_governance_inputs.output.outputVariables.CHANGE_BLAST_RADIUS>
                      ROLLBACK_READY: <+execution.steps.prepare_governance_inputs.output.outputVariables.ROLLBACK_READY>
                      OPEN_CHANGE_FAILURES: <+execution.steps.prepare_governance_inputs.output.outputVariables.OPEN_CHANGE_FAILURES>
                      CHANGE_FREEZE_ACTIVE: <+execution.steps.prepare_governance_inputs.output.outputVariables.CHANGE_FREEZE_ACTIVE>
                      REQUIRES_DATA_MIGRATION: <+execution.steps.prepare_governance_inputs.output.outputVariables.REQUIRES_DATA_MIGRATION>
                      RELEASE_CANDIDATE_EVIDENCE: <+execution.steps.assemble_release_candidate_evidence.output.outputVariables.RELEASE_EVIDENCE_JSON>
