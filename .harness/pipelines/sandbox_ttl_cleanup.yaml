pipeline:
  name: Sandbox TTL Cleanup
  identifier: sandbox_ttl_cleanup
  projectIdentifier: parson
  orgIdentifier: sandbox
  description: Scheduled audit and cleanup of template-linked POV sandboxes based on IACM workspace TTL settings
  tags:
    automation: "true"
    cleanup: "true"
    ttl: "true"
  variables:
    - name: dry_run
      type: String
      description: If true, only report expired sandboxes without destroying them
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: owner_filter
      type: String
      description: Optional owner filter. Leave blank to evaluate all managed POV workspaces
      required: false
      value: <+input>
    - name: sandbox_profile_filter
      type: String
      description: Optional profile filter for cleanup targeting
      required: false
      value: <+input>.default(all).allowedValues(all,se-demo,se-pov-sandbox,se-pov-ref-arch,se-workshop,manual)
    - name: deployment_target_filter
      type: String
      description: Optional deployment target filter for cleanup targeting
      required: false
      value: <+input>.default(all).allowedValues(all,eks,asg)
    - name: template_id
      type: String
      description: Optional template-family scope. all targets all managed POV workspaces, POV_Provisioner scopes to EKS-linked workspaces, and Sandbox_Provisioner_ASG scopes to ASG-linked workspaces.
      required: false
      value: <+input>.default(all).allowedValues(all,POV_Provisioner,Sandbox_Provisioner_ASG)
    - name: harness_api_key
      type: Secret
      description: Harness Platform API Key for IACM operations
      required: false
      value: acct-automation-svc-acct
  stages:
    - stage:
        name: Identify Expired Sandboxes
        identifier: identify_expired
        description: Query IACM workspaces and identify those past TTL
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: List IACM Workspaces
                  identifier: list_workspaces
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -e

                          echo "=== Sandbox TTL Cleanup ==="
                          echo "Dry Run: ${DRY_RUN}"
                          echo "Current Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                          echo ""

                          ACCOUNT_ID="<+account.identifier>"
                          ORG_ID="<+org.identifier>"
                          PROJECT_ID="<+project.identifier>"
                          API_KEY="${HARNESS_API_KEY}"
                          ENDPOINT="https://app.harness.io"

                          cleanup_vpc_dependencies() {
                            TARGET_VPC_ID="$1"
                            for _ in $(seq 1 30); do
                              CURRENT_VPC=$(aws ec2 describe-vpcs --vpc-ids "$TARGET_VPC_ID" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || true)
                              if [ -z "$CURRENT_VPC" ] || [ "$CURRENT_VPC" = "None" ]; then
                                return 0
                              fi

                              ENIS=$(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=${TARGET_VPC_ID}" --query 'NetworkInterfaces[].NetworkInterfaceId' --output text 2>/dev/null || true)
                              if [ -n "$ENIS" ] && [ "$ENIS" != "None" ]; then
                                echo "Waiting for VPC ENIs to detach: $ENIS"
                                sleep 10
                                continue
                              fi

                              for SG in $(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=${TARGET_VPC_ID}" --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null || true); do
                                aws ec2 delete-security-group --group-id "$SG" 2>/dev/null || true
                              done
                              for SUBNET in $(aws ec2 describe-subnets --filters "Name=vpc-id,Values=${TARGET_VPC_ID}" --query 'Subnets[].SubnetId' --output text 2>/dev/null || true); do
                                aws ec2 delete-subnet --subnet-id "$SUBNET" 2>/dev/null || true
                              done
                              for RT in $(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=${TARGET_VPC_ID}" --query 'RouteTables[?Associations[?Main!=`true`]].RouteTableId' --output text 2>/dev/null || true); do
                                for ASSOC in $(aws ec2 describe-route-tables --route-table-ids "$RT" --query 'RouteTables[0].Associations[?Main!=`true`].RouteTableAssociationId' --output text 2>/dev/null || true); do
                                  aws ec2 disassociate-route-table --association-id "$ASSOC" 2>/dev/null || true
                                done
                                aws ec2 delete-route-table --route-table-id "$RT" 2>/dev/null || true
                              done
                              for IGW in $(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=${TARGET_VPC_ID}" --query 'InternetGateways[].InternetGatewayId' --output text 2>/dev/null || true); do
                                aws ec2 detach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$TARGET_VPC_ID" 2>/dev/null || true
                                aws ec2 delete-internet-gateway --internet-gateway-id "$IGW" 2>/dev/null || true
                              done
                              aws ec2 delete-vpc --vpc-id "$TARGET_VPC_ID" 2>/dev/null || true
                              sleep 10
                            done
                            return 0
                          }

                          cleanup_orphaned_asg_resources() {
                            local VPC_ID="$1"
                            local OWNER="$2"
                            local NAME_TAG="$3"
                            local NAME_PREFIX="harness-demo-${OWNER}"
                            local ASG_PREFIX="${NAME_PREFIX}-asg"
                            local ASG_ALB_NAME="${ASG_PREFIX}-alb"
                            local AMI_PREFIX="harness-demo-app-${OWNER}"
                            local INSTANCE_PROFILE_NAME="${ASG_PREFIX}-instance-profile"
                            local INSTANCE_ROLE_NAME="${ASG_PREFIX}-instance-role"

                            echo "Directly cleaning orphaned ASG resources for ${OWNER} (${NAME_TAG})"

                            ASGS=$(aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, '${ASG_PREFIX}')].AutoScalingGroupName" --output text 2>/dev/null || true)
                            if [ -n "$ASGS" ] && [ "$ASGS" != "None" ]; then
                              for ASG in $ASGS; do
                                echo "ASG ${ASG}: deleting"
                                aws autoscaling update-auto-scaling-group --auto-scaling-group-name "$ASG" --min-size 0 --max-size 0 --desired-capacity 0 2>/dev/null || true
                                aws autoscaling delete-auto-scaling-group --auto-scaling-group-name "$ASG" --force-delete 2>/dev/null || true
                              done
                            fi

                            LTS=$(aws ec2 describe-launch-templates --query "LaunchTemplates[?starts_with(LaunchTemplateName, '${ASG_PREFIX}')].LaunchTemplateId" --output text 2>/dev/null || true)
                            if [ -n "$LTS" ] && [ "$LTS" != "None" ]; then
                              for LT_ID in $LTS; do
                                LT_NAME=$(aws ec2 describe-launch-templates --launch-template-ids "$LT_ID" --query 'LaunchTemplates[0].LaunchTemplateName' --output text 2>/dev/null || true)
                                echo "Launch Template ${LT_NAME:-$LT_ID}: deleting"
                                aws ec2 delete-launch-template --launch-template-id "$LT_ID" 2>/dev/null || true
                              done
                            fi

                            ALB_ARN=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?LoadBalancerName=='${ASG_ALB_NAME}'].LoadBalancerArn" --output text 2>/dev/null || true)
                            if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
                              echo "ALB ${ASG_ALB_NAME}: deleting"
                              aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN" 2>/dev/null || true
                            fi

                            TGS=$(aws elbv2 describe-target-groups --query "TargetGroups[?starts_with(TargetGroupName, '${NAME_PREFIX}-as')].TargetGroupArn" --output text 2>/dev/null || true)
                            if [ -n "$TGS" ] && [ "$TGS" != "None" ]; then
                              for TG_ARN in $TGS; do
                                TG_NAME=$(aws elbv2 describe-target-groups --target-group-arns "$TG_ARN" --query 'TargetGroups[0].TargetGroupName' --output text 2>/dev/null || true)
                                echo "Target Group ${TG_NAME:-$TG_ARN}: deleting"
                                aws elbv2 delete-target-group --target-group-arn "$TG_ARN" 2>/dev/null || true
                              done
                            fi

                            INSTANCE_PROFILE_XML=$(aws iam get-instance-profile --instance-profile-name "$INSTANCE_PROFILE_NAME" 2>&1 || true)
                            if echo "$INSTANCE_PROFILE_XML" | grep -q "<InstanceProfileName>${INSTANCE_PROFILE_NAME}</InstanceProfileName>"; then
                              for ROLE_NAME in $(echo "$INSTANCE_PROFILE_XML" | grep -o '<RoleName>[^<]*</RoleName>' | sed 's/<[^>]*>//g'); do
                                aws iam remove-role-from-instance-profile --instance-profile-name "$INSTANCE_PROFILE_NAME" --role-name "$ROLE_NAME" 2>/dev/null || true
                              done
                              aws iam delete-instance-profile --instance-profile-name "$INSTANCE_PROFILE_NAME" 2>/dev/null || true
                            fi

                            INSTANCE_ROLE_XML=$(aws iam get-role --role-name "$INSTANCE_ROLE_NAME" 2>&1 || true)
                            if echo "$INSTANCE_ROLE_XML" | grep -q "<RoleName>${INSTANCE_ROLE_NAME}</RoleName>"; then
                              ATTACHED_XML=$(aws iam list-attached-role-policies --role-name "$INSTANCE_ROLE_NAME" 2>&1 || true)
                              for ARN in $(echo "$ATTACHED_XML" | grep -o '<PolicyArn>[^<]*</PolicyArn>' | sed 's/<[^>]*>//g'); do
                                aws iam detach-role-policy --role-name "$INSTANCE_ROLE_NAME" --policy-arn "$ARN" 2>/dev/null || true
                              done
                              INLINE_XML=$(aws iam list-role-policies --role-name "$INSTANCE_ROLE_NAME" 2>&1 || true)
                              for POLICY in $(echo "$INLINE_XML" | grep -o '<member>[^<]*</member>' | sed 's/<[^>]*>//g'); do
                                aws iam delete-role-policy --role-name "$INSTANCE_ROLE_NAME" --policy-name "$POLICY" 2>/dev/null || true
                              done
                              aws iam delete-role --role-name "$INSTANCE_ROLE_NAME" 2>/dev/null || true
                            fi

                            AMI_IDS=$(aws ec2 describe-images --owners self --query "Images[?starts_with(Name, '${AMI_PREFIX}-')].ImageId" --output text 2>/dev/null || true)
                            if [ -n "$AMI_IDS" ] && [ "$AMI_IDS" != "None" ]; then
                              for AMI_ID in $AMI_IDS; do
                                SNAPSHOT_IDS=$(aws ec2 describe-images --image-ids "$AMI_ID" --query 'Images[0].BlockDeviceMappings[?Ebs.SnapshotId!=null].Ebs.SnapshotId' --output text 2>/dev/null || true)
                                AMI_NAME=$(aws ec2 describe-images --image-ids "$AMI_ID" --query 'Images[0].Name' --output text 2>/dev/null || true)
                                echo "AMI ${AMI_NAME:-$AMI_ID}: deregistering"
                                aws ec2 deregister-image --image-id "$AMI_ID" 2>/dev/null || true
                                if [ -n "$SNAPSHOT_IDS" ] && [ "$SNAPSHOT_IDS" != "None" ]; then
                                  for SNAPSHOT_ID in $SNAPSHOT_IDS; do
                                    echo "Snapshot ${SNAPSHOT_ID}: deleting"
                                    aws ec2 delete-snapshot --snapshot-id "$SNAPSHOT_ID" 2>/dev/null || true
                                  done
                                fi
                              done
                            fi

                            cleanup_vpc_dependencies "$VPC_ID"
                          }
                          OWNER_FILTER="${OWNER_FILTER}"
                          PROFILE_FILTER="${PROFILE_FILTER}"
                          TARGET_FILTER="${TARGET_FILTER}"
                          TEMPLATE_SCOPE="${TEMPLATE_SCOPE}"

                          case "$TEMPLATE_SCOPE" in
                            POV_Provisioner)
                              TEMPLATE_TARGET_FILTER="eks"
                              ;;
                            Sandbox_Provisioner_ASG)
                              TEMPLATE_TARGET_FILTER="asg"
                              ;;
                            *)
                              TEMPLATE_TARGET_FILTER="all"
                              ;;
                          esac

                          # List all IACM workspaces in the project
                          echo "Fetching IACM workspaces..."
                          WORKSPACES=$(curl -s -X GET \
                            "${ENDPOINT}/iacm/api/orgs/${ORG_ID}/projects/${PROJECT_ID}/workspaces?accountIdentifier=${ACCOUNT_ID}" \
                            -H "x-api-key: ${API_KEY}" \
                            -H "Harness-Account: ${ACCOUNT_ID}" \
                            -H "Content-Type: application/json")

                          # Parse workspaces and check TTL
                          EXPIRED_WORKSPACES=""
                          PROTECTED_WORKSPACES=""
                          ACTIVE_WORKSPACES=""

                          CURRENT_EPOCH=$(date +%s)

                          # Extract workspace identifiers that match SE sandbox pattern
                          for WS_ID in $(echo "$WORKSPACES" | jq -r '.content[]?.identifier // empty' | grep -E '_sandbox$|_pov$' || true); do
                            echo "Checking workspace: $WS_ID"
                            
                            # Get workspace details including tfvars
                            WS_DETAILS=$(curl -s -X GET \
                              "${ENDPOINT}/iacm/api/orgs/${ORG_ID}/projects/${PROJECT_ID}/workspaces/${WS_ID}?accountIdentifier=${ACCOUNT_ID}" \
                              -H "x-api-key: ${API_KEY}" \
                              -H "Harness-Account: ${ACCOUNT_ID}" \
                              -H "Content-Type: application/json")
                            
                            # Extract TTL and created_at from terraform_variable_files or environment_variables
                            TTL_DAYS=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "ttl_days") | .value // "45"' 2>/dev/null || echo "45")
                            CREATED_AT=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "created_at") | .value // empty' 2>/dev/null || echo "")
                            OWNER=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "owner") | .value // empty' 2>/dev/null || echo "unknown")
                            PROFILE=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "sandbox_profile") | .value // "unknown"' 2>/dev/null || echo "unknown")
                            TARGET=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "deployment_target") | .value // "unknown"' 2>/dev/null || echo "unknown")
                            WORKSPACE_TEMPLATE_ID=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "workspace_template_id") | .value // empty' 2>/dev/null || echo "")
                            TARGET_ACCOUNT_ID=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "harness_account_id") | .value // empty' 2>/dev/null || echo "")
                            EKS_CLUSTER_NAME=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "eks_cluster_name") | .value // "harness-eks-parson"' 2>/dev/null || echo "harness-eks-parson")

                            if [ -z "$WORKSPACE_TEMPLATE_ID" ] || [ "$WORKSPACE_TEMPLATE_ID" = "null" ]; then
                              case "$TARGET" in
                                eks)
                                  WORKSPACE_TEMPLATE_ID="POV_Provisioner"
                                  ;;
                                asg)
                                  WORKSPACE_TEMPLATE_ID="Sandbox_Provisioner_ASG"
                                  ;;
                                *)
                                  WORKSPACE_TEMPLATE_ID="unknown"
                                  ;;
                              esac
                            fi
                            
                            # If no created_at, use workspace created timestamp
                            if [ -z "$CREATED_AT" ]; then
                              CREATED_AT=$(echo "$WS_DETAILS" | jq -r '.created // empty' 2>/dev/null || echo "")
                            fi

                            if [ -n "$OWNER_FILTER" ] && [ "$OWNER_FILTER" != "$OWNER" ]; then
                              echo "  → Skipping due to owner filter"
                              continue
                            fi

                            if [ "$PROFILE_FILTER" != "all" ] && [ "$PROFILE_FILTER" != "$PROFILE" ]; then
                              echo "  → Skipping due to profile filter"
                              continue
                            fi

                            if [ "$TARGET_FILTER" != "all" ] && [ "$TARGET_FILTER" != "$TARGET" ]; then
                              echo "  → Skipping due to target filter"
                              continue
                            fi

                            if [ "$TEMPLATE_SCOPE" != "all" ] && [ "$TEMPLATE_SCOPE" != "$WORKSPACE_TEMPLATE_ID" ]; then
                              echo "  → Skipping due to template filter"
                              continue
                            fi

                            if [ "$TEMPLATE_TARGET_FILTER" != "all" ] && [ "$TEMPLATE_TARGET_FILTER" != "$TARGET" ]; then
                              echo "  → Skipping due to template target filter"
                              continue
                            fi
                            
                            # TTL of 0 means never expire
                            if [ "$TTL_DAYS" = "0" ]; then
                              echo "  → TTL disabled (protected) [profile=${PROFILE}, target=${TARGET}, template=${WORKSPACE_TEMPLATE_ID}]"
                              PROTECTED_WORKSPACES="${PROTECTED_WORKSPACES}${WS_ID}|${OWNER}|${PROFILE}|${TARGET}|${WORKSPACE_TEMPLATE_ID}|protected\n"
                              continue
                            fi
                            
                            # Calculate expiry
                            if [ -n "$CREATED_AT" ]; then
                              CREATED_EPOCH=$(date -d "$CREATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "$CREATED_AT" +%s 2>/dev/null || echo "0")
                              EXPIRY_EPOCH=$((CREATED_EPOCH + TTL_DAYS * 86400))
                              DAYS_REMAINING=$(( (EXPIRY_EPOCH - CURRENT_EPOCH) / 86400 ))
                              
                              if [ $CURRENT_EPOCH -gt $EXPIRY_EPOCH ]; then
                                echo "  → EXPIRED (${DAYS_REMAINING} days past TTL) [profile=${PROFILE}, target=${TARGET}, template=${WORKSPACE_TEMPLATE_ID}]"
                                EXPIRED_WORKSPACES="${EXPIRED_WORKSPACES}${WS_ID}|${OWNER}|${PROFILE}|${TARGET}|${WORKSPACE_TEMPLATE_ID}|${TARGET_ACCOUNT_ID}|${EKS_CLUSTER_NAME}|${DAYS_REMAINING}\n"
                              else
                                echo "  → Active (${DAYS_REMAINING} days remaining) [profile=${PROFILE}, target=${TARGET}, template=${WORKSPACE_TEMPLATE_ID}]"
                                ACTIVE_WORKSPACES="${ACTIVE_WORKSPACES}${WS_ID}|${OWNER}|${PROFILE}|${TARGET}|${WORKSPACE_TEMPLATE_ID}|${DAYS_REMAINING}\n"
                              fi
                            else
                              echo "  → No created_at timestamp, skipping"
                            fi
                          done

                          echo ""
                          echo "=== Summary ==="
                          echo "Protected (TTL=0): $(echo -e "$PROTECTED_WORKSPACES" | grep -c '|' || echo 0)"
                          echo "Active: $(echo -e "$ACTIVE_WORKSPACES" | grep -c '|' || echo 0)"
                          echo "Expired: $(echo -e "$EXPIRED_WORKSPACES" | grep -c '|' || echo 0)"
                          echo ""

                          # Output for next steps
                          printf "%b" "$EXPIRED_WORKSPACES" > /tmp/expired_workspaces.txt
                    environmentVariables:
                      - name: DRY_RUN
                        type: String
                        value: <+pipeline.variables.dry_run>
                      - name: TEMPLATE_SCOPE
                        type: String
                        value: <+pipeline.variables.template_id>
                      - name: OWNER_FILTER
                        type: String
                        value: <+pipeline.variables.owner_filter>
                      - name: PROFILE_FILTER
                        type: String
                        value: <+pipeline.variables.sandbox_profile_filter>
                      - name: TARGET_FILTER
                        type: String
                        value: <+pipeline.variables.deployment_target_filter>
                      - name: HARNESS_API_KEY
                        type: String
                        value: <+pipeline.variables.harness_api_key>
                    outputVariables:
                      - name: EXPIRED_WORKSPACES
                        type: String
                        value: EXPIRED_WORKSPACES
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: Detect Orphaned ASG VPCs
                  identifier: detect_orphaned_asg_vpcs
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - parson-eks-delegate
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -euo pipefail

                          ACCOUNT_ID="<+account.identifier>"
                          ORG_ID="<+org.identifier>"
                          PROJECT_ID="<+project.identifier>"
                          API_KEY="${HARNESS_API_KEY}"
                          ENDPOINT="https://app.harness.io"
                          OWNER_FILTER="${OWNER_FILTER}"
                          PROFILE_FILTER="${PROFILE_FILTER}"
                          TARGET_FILTER="${TARGET_FILTER}"
                          TEMPLATE_SCOPE="${TEMPLATE_SCOPE}"

                          AWS_REGION="${AWS_DEFAULT_REGION:-us-east-1}"
                          IAM_AUTH_USER="${AWS_ACCESS_KEY_ID:-}:${AWS_SECRET_ACCESS_KEY:-}"

                          ec2_post() {
                            curl -s --aws-sigv4 "aws:amz:${AWS_REGION}:ec2" \
                              --user "${IAM_AUTH_USER}" \
                              -H "x-amz-security-token: ${AWS_SESSION_TOKEN:-}" \
                              -d "$1" "https://ec2.${AWS_REGION}.amazonaws.com/"
                          }

                          if [ "$TARGET_FILTER" != "all" ] && [ "$TARGET_FILTER" != "asg" ]; then
                            echo "Skipping orphaned ASG VPC scan because deployment_target_filter=${TARGET_FILTER}"
                            : > /tmp/orphaned_asg_vpcs.txt
                            exit 0
                          fi

                          if [ "$TEMPLATE_SCOPE" != "all" ] && [ "$TEMPLATE_SCOPE" != "Sandbox_Provisioner_ASG" ]; then
                            echo "Skipping orphaned ASG VPC scan because template_id=${TEMPLATE_SCOPE}"
                            : > /tmp/orphaned_asg_vpcs.txt
                            exit 0
                          fi

                          if [ "$PROFILE_FILTER" != "all" ]; then
                            echo "Skipping orphaned ASG VPC scan because sandbox_profile_filter=${PROFILE_FILTER} cannot be mapped safely to orphaned AWS resources"
                            : > /tmp/orphaned_asg_vpcs.txt
                            exit 0
                          fi

                          echo "=== Orphaned ASG VPC Audit ==="

                          if [ -z "$OWNER_FILTER" ] || [ "$OWNER_FILTER" = "all" ]; then
                            echo "Skipping orphaned ASG VPC scan because owner_filter must be set for direct AWS cleanup"
                            : > /tmp/orphaned_asg_vpcs.txt
                            exit 0
                          fi

                          WORKSPACES=$(curl -s -X GET \
                            "${ENDPOINT}/iacm/api/orgs/${ORG_ID}/projects/${PROJECT_ID}/workspaces?accountIdentifier=${ACCOUNT_ID}" \
                            -H "x-api-key: ${API_KEY}" \
                            -H "Harness-Account: ${ACCOUNT_ID}" \
                            -H "Content-Type: application/json")

                          WORKSPACE_JSON=$(mktemp)
                          printf "%s" "$WORKSPACES" > "$WORKSPACE_JSON"

                          ORPHANED_VPCS=""

                          VPCS_XML=$(ec2_post "Action=DescribeVpcs&Filter.1.Name=tag:Project&Filter.1.Value.1=harness-demo&Filter.2.Name=tag:Stack&Filter.2.Value.1=asg&Filter.3.Name=tag:ManagedBy&Filter.3.Value.1=tofu&Filter.4.Name=tag:Owner&Filter.4.Value.1=${OWNER_FILTER}&Version=2016-11-15")

                          while IFS='|' read -r VPC_ID OWNER NAME_TAG; do
                            if [ -z "$VPC_ID" ] || [ -z "$OWNER" ]; then
                              continue
                            fi

                            if echo "$WORKSPACE_JSON" | grep -q "\"identifier\":\"${OWNER}_pov\"\|\"identifier\":\"${OWNER}_sandbox\""; then
                              echo "VPC ${VPC_ID} (${NAME_TAG}): owner ${OWNER} still has an active workspace"
                              continue
                            fi

                            echo "VPC ${VPC_ID} (${NAME_TAG}): orphaned owner ${OWNER}"
                            ORPHANED_VPCS="${ORPHANED_VPCS}${VPC_ID}|${OWNER}|${NAME_TAG}\n"
                          done < <(
                            printf "%s" "$VPCS_XML" | awk -v RS="<item>" '
                              /<vpcId>/ {
                                id=$0; sub(/.*<vpcId>/, "", id); sub(/<.*/, "", id)
                                owner=""; name=""
                                if (match($0, /<key>Owner<\/key>[[:space:]]*<value>([^<]*)<\/value>/, o)) owner=o[1]
                                if (match($0, /<key>Name<\/key>[[:space:]]*<value>([^<]*)<\/value>/, n)) name=n[1]
                                if (id != "") print id "|" owner "|" name
                              }
                            '
                          )

                          printf "%b" "$ORPHANED_VPCS" > /tmp/orphaned_asg_vpcs.txt
                          ORPHAN_COUNT=$(echo -e "$ORPHANED_VPCS" | grep -c '|' || true)
                          echo "Orphaned ASG VPCs: ${ORPHAN_COUNT}"

                          rm -f "$WORKSPACE_JSON"
                    environmentVariables:
                      - name: HARNESS_API_KEY
                        type: String
                        value: <+pipeline.variables.harness_api_key>
                      - name: TEMPLATE_SCOPE
                        type: String
                        value: <+pipeline.variables.template_id>
                      - name: OWNER_FILTER
                        type: String
                        value: <+pipeline.variables.owner_filter>
                      - name: PROFILE_FILTER
                        type: String
                        value: <+pipeline.variables.sandbox_profile_filter>
                      - name: TARGET_FILTER
                        type: String
                        value: <+pipeline.variables.deployment_target_filter>
                      - name: AWS_DEFAULT_REGION
                        type: String
                        value: us-east-1
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: Report Expired Sandboxes
                  identifier: report_expired
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash

                          echo "=== Expired Sandboxes Report ==="
                          echo ""

                          if [ -f /tmp/expired_workspaces.txt ]; then
                            EXPIRED=$(cat /tmp/expired_workspaces.txt)
                            ORPHANED_VPCS=$(cat /tmp/orphaned_asg_vpcs.txt 2>/dev/null || true)
                            
                            EXPIRED_COUNT=$(printf "%s" "$EXPIRED" | grep -c '|' || true)
                            ORPHAN_VPC_COUNT=$(printf "%s" "$ORPHANED_VPCS" | grep -c '|' || true)

                            if [ "$EXPIRED_COUNT" = "0" ] && [ "$ORPHAN_VPC_COUNT" = "0" ]; then
                              echo "✓ No expired sandboxes or orphaned ASG VPCs found!"
                              echo "DESTROY_COUNT=0" >> $HARNESS_OUTPUT_FILE
                              exit 0
                            fi
                            
                            if [ "$EXPIRED_COUNT" != "0" ]; then
                              echo "The following sandboxes have exceeded their TTL:"
                              echo ""
                              echo "| Workspace ID | Owner | Profile | Target | Template | Days Past TTL |"
                              echo "|--------------|-------|---------|--------|----------|---------------|"
                              echo -e "$EXPIRED" | while IFS='|' read -r WS_ID OWNER PROFILE TARGET TEMPLATE_ID TARGET_ACCOUNT_ID EKS_CLUSTER_NAME DAYS; do
                                if [ -n "$WS_ID" ]; then
                                  echo "| $WS_ID | $OWNER | $PROFILE | $TARGET | $TEMPLATE_ID | $DAYS |"
                                fi
                              done
                              echo ""
                            fi

                            if [ "$ORPHAN_VPC_COUNT" != "0" ]; then
                              echo "The following ASG VPCs are orphaned (no matching active workspace):"
                              echo ""
                              echo "| VPC ID | Owner | Name Tag |"
                              echo "|--------|-------|----------|"
                              echo -e "$ORPHANED_VPCS" | while IFS='|' read -r VPC_ID OWNER NAME_TAG; do
                                if [ -n "$VPC_ID" ]; then
                                  echo "| $VPC_ID | $OWNER | $NAME_TAG |"
                                fi
                              done
                              echo ""
                            fi

                            TOTAL_COUNT=$((EXPIRED_COUNT + ORPHAN_VPC_COUNT))
                            echo "Total cleanup actions to trigger: $TOTAL_COUNT"
                            echo "DESTROY_COUNT=$TOTAL_COUNT" >> $HARNESS_OUTPUT_FILE
                          else
                            echo "No workspace data found"
                            echo "DESTROY_COUNT=0" >> $HARNESS_OUTPUT_FILE
                          fi
                    outputVariables:
                      - name: DESTROY_COUNT
                        type: String
                        value: DESTROY_COUNT
                  timeout: 5m
        delegateSelectors:
          - parson-eks-delegate
    - stage:
        name: Destroy Expired Sandboxes
        identifier: destroy_expired
        description: Trigger destroy for each expired sandbox
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.dry_run> == "false" && <+pipeline.stages.identify_expired.spec.execution.steps.report_expired.output.outputVariables.DESTROY_COUNT> != "0"
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Trigger Destroy Pipelines
                  identifier: trigger_destroys
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -e

                          echo "=== Triggering Destroy for Expired Sandboxes ==="
                          echo ""

                          ACCOUNT_ID="<+account.identifier>"
                          ORG_ID="<+org.identifier>"
                          PROJECT_ID="<+project.identifier>"
                          API_KEY="${HARNESS_API_KEY}"
                          ENDPOINT="https://app.harness.io"

                          if [ ! -f /tmp/expired_workspaces.txt ]; then
                            echo "No expired workspaces file found"
                            exit 0
                          fi

                          EXPIRED=$(cat /tmp/expired_workspaces.txt)

                          echo -e "$EXPIRED" | while IFS='|' read -r WS_ID OWNER PROFILE TARGET TEMPLATE_ID TARGET_ACCOUNT_ID EKS_CLUSTER_NAME DAYS; do
                            if [ -n "$WS_ID" ]; then
                              echo "Destroying workspace: $WS_ID (owner: $OWNER, profile: $PROFILE, target: $TARGET, template: $TEMPLATE_ID)"
                              
                              RESPONSE=$(curl -s -X POST \
                                "${ENDPOINT}/pipeline/api/pipeline/execute/idp_pov_destroyer_v2?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}" \
                                -H "x-api-key: ${API_KEY}" \
                                -H "Content-Type: application/json" \
                                -d "{
                                  \"owner\": \"${OWNER}\",
                                  \"deployment_target\": \"${TARGET}\",
                                  \"harness_account_id\": \"${TARGET_ACCOUNT_ID:-$ACCOUNT_ID}\",
                                  \"harness_endpoint\": \"${ENDPOINT}\",
                                  \"provisioner_api_key\": \"${API_KEY}\",
                                  \"target_api_key\": \"${API_KEY}\",
                                  \"harness_org_id\": \"${ORG_ID}\",
                                  \"harness_project_id\": \"${PROJECT_ID}\",
                                  \"eks_cluster_name\": \"${EKS_CLUSTER_NAME:-harness-eks-parson}\",
                                  \"skip_terraform_destroy\": \"false\",
                                  \"auto_approve\": \"true\"
                                }")
                              
                              EXEC_ID=$(echo "$RESPONSE" | jq -r '.data.planExecution.uuid // "unknown"')
                              echo "  → Triggered execution: $EXEC_ID"
                              echo ""
                            fi
                          done

                          ORPHANED_VPCS=$(cat /tmp/orphaned_asg_vpcs.txt 2>/dev/null || true)
                          echo -e "$ORPHANED_VPCS" | while IFS='|' read -r VPC_ID OWNER NAME_TAG; do
                            if [ -n "$VPC_ID" ]; then
                              cleanup_orphaned_asg_resources "$VPC_ID" "$OWNER" "$NAME_TAG"
                              echo "  → Direct orphan VPC cleanup complete"
                              echo ""
                            fi
                          done
                          echo "All cleanup actions completed."
                    environmentVariables:
                      - name: HARNESS_API_KEY
                        type: String
                        value: <+pipeline.variables.harness_api_key>
                      - name: AWS_DEFAULT_REGION
                        type: String
                        value: us-east-1
                  timeout: 15m
              - step:
                  type: ShellScript
                  name: Cleanup Summary
                  identifier: cleanup_summary
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=== TTL Cleanup Complete ==="
                          echo ""
                          echo "Destroy pipelines have been triggered for all expired sandboxes."
                          echo "Orphaned ASG VPCs were cleaned directly in this janitor run."
                          echo "Check individual destroyer executions for expired workspaces if needed."
                          echo ""
                          echo "To prevent a sandbox from being cleaned up:"
                          echo "  1. Go to the IACM workspace"
                          echo "  2. Set ttl_days = 0 in terraform variables"
                          echo "  3. Run a plan/apply to update the workspace"
                  timeout: 1m
        delegateSelectors:
          - parson-eks-delegate
