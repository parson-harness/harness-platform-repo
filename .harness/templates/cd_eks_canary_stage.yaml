template:
  name: CD EKS Canary Stage
  identifier: cd_eks_canary_stage
  type: Stage
  projectIdentifier: parson
  orgIdentifier: sandbox
  description: "Project-level deployment stage template for Kubernetes canary delivery with optional chaos trigger"
  tags:
    stage-type: deployment
    deployment-target: eks
    deployment-strategy: canary
  versionLabel: "1.0.0"
  spec:
    type: Deployment
    spec:
      deploymentType: Kubernetes
      service:
        serviceRef: <+input>
        serviceInputs:
          serviceDefinition:
            type: Kubernetes
            spec:
              artifacts:
                primary:
                  primaryArtifactRef: <+input>
                  sources: <+input>
      environment:
        environmentRef: <+input>
        deployToAll: false
        infrastructureDefinitions:
          - identifier: <+input>
      execution:
        steps:
          - step:
              type: K8sCanaryDeploy
              name: Canary Deployment
              identifier: canary_deploy
              spec:
                skipDryRun: false
                instanceSelection:
                  type: Count
                  spec:
                    count: 1
              timeout: 10m
          - step:
              type: Http
              name: Trigger Chaos for CV Demo
              identifier: trigger_chaos
              spec:
                url: http://<+execution.steps.canary_deploy.output.canaryWorkload>:8080/api/chaos/degrade-canary?durationSeconds=180
                method: POST
                headers: []
                assertion: <+httpResponseCode> == 200
                timeout: 30s
              when:
                stageStatus: Success
                condition: <+input>.allowedValues(true,false)
              description: "Optional: Trigger chaos to demonstrate CV rollback"
          - step:
              type: Verify
              name: Verify Canary
              identifier: verify_canary
              spec:
                isMultiServicesOrEnvs: false
                type: Canary
                monitoredService:
                  type: Default
                  spec: {}
                spec:
                  sensitivity: HIGH
                  duration: 5m
                  deploymentTag: <+artifacts.primary.tag>
              timeout: 15m
              failureStrategies:
                - onFailure:
                    errors:
                      - Verification
                    action:
                      type: ManualIntervention
                      spec:
                        timeout: 2h
                        onTimeout:
                          action:
                            type: StageRollback
          - step:
              type: K8sCanaryDelete
              name: Delete Canary
              identifier: canary_delete
              spec: {}
              timeout: 10m
          - step:
              type: K8sRollingDeploy
              name: Rolling Deployment
              identifier: rolling_deploy
              spec:
                skipDryRun: false
              timeout: 10m
        rollbackSteps:
          - step:
              type: K8sCanaryDelete
              name: Canary Rollback
              identifier: canary_rollback
              spec: {}
              timeout: 10m
          - step:
              type: K8sRollingRollback
              name: Rolling Rollback
              identifier: rolling_rollback
              spec: {}
              timeout: 10m
    tags: {}
    failureStrategies:
      - onFailure:
          errors:
            - AllErrors
          action:
            type: StageRollback
