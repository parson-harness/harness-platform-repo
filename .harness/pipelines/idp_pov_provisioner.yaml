pipeline:
  name: IDP POV Provisioner
  identifier: idp_pov_provisioner
  projectIdentifier: parson
  orgIdentifier: sandbox
  description: IDP-triggered pipeline that creates an IACM workspace and provisions a POV environment using the decoupled EKS or ASG stacks
  tags:
    idp: "true"
    pov: "true"
    iacm: "true"
  allowStageExecutions: false
  concurrency:
    maxConcurrency: 1
    label: pov_provisioner_<+pipeline.variables.owner>
  variables:
    - name: owner
      type: String
      description: Owner name (lowercase, used for resource naming and workspace ID)
      required: true
      value: <+input>
    - name: deployment_target
      type: String
      description: Deployment target stack to provision. Use eks for shared-cluster sandboxes and asg for fully self-contained POV environments.
      required: false
      value: <+input>.default(eks).allowedValues(eks,asg)
    - name: sandbox_profile
      type: String
      description: Recommended one-click profile. Supports the named profiles plus legacy aliases for backward compatibility.
      required: false
      value: <+input>.default(se-demo).allowedValues(se-demo,se-pov-sandbox,se-pov-ref-arch,se-workshop,auto,self_contained_ci_cd,self_contained_cd_only,self_contained_asg)
    - name: use_profile_defaults
      type: String
      description: Recommended true. When true, sandbox_profile drives the delivery defaults. Set false only for advanced manual override mode.
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: harness_account_id
      type: String
      description: Target Harness Account ID (for cross-account provisioning)
      required: true
      value: <+input>.default(<+account.identifier>)
    - name: harness_endpoint
      type: String
      description: Harness platform endpoint
      required: true
      value: <+input>.default(https://app.harness.io/gratis)
    - name: github_pat
      type: Secret
      description: GitHub PAT for importing repo to Harness Code (needs repo read access)
      required: true
      value: github_pat
    - name: source_github_repo
      type: String
      description: Source GitHub repo to import (org/repo format)
      required: true
      value: <+input>.default(parson-harness/harness-demo-app)
    - name: provisioner_api_key
      type: Secret
      description: SAT for IACM workspace management in provisioner account (sandbox/parson)
      required: true
      value: acct-automation-svc-acct
    - name: target_api_key
      type: Secret
      description: API Key for target Harness account (where resources are provisioned). Defaults to provisioner SAT for same-account use.
      required: false
      value: acct-automation-svc-acct
    - name: target_api_key_email
      type: String
      description: Email associated with the target account API key. Defaults to service account email.
      required: false
      value: <+input>.default(accountautomation@service.harness.io)
    - name: harness_org_id
      type: String
      description: Harness Org ID for the POV
      required: true
      value: <+org.identifier>
    - name: harness_project_id
      type: String
      description: Harness Project ID for the POV
      required: true
      value: <+project.identifier>
    - name: create_harness_org
      type: String
      description: Create new org
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: create_harness_project
      type: String
      description: Create new project
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: eks_cluster_name
      type: String
      description: Existing EKS cluster name to deploy to
      required: true
      value: <+input>.default(harness-eks-parson)
    - name: create_harness_environment
      type: String
      description: Create Harness environment
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_prod_environment
      type: String
      description: Create production environment
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: artifact_registry_type
      type: String
      description: Sandbox invariant for EKS delivery artifact registry. HAR is the only supported registry mode.
      required: false
      value: <+input>.default(har).allowedValues(har)
    - name: create_dockerhub_upstream
      type: String
      description: Sandbox invariant for EKS delivery. The HAR DockerHub upstream proxy is always enabled for base image pulls.
      required: false
      value: <+input>.default(true).allowedValues(true)
    - name: create_strategy_pipeline
      type: String
      description: Advanced override when use_profile_defaults is false. Create the EKS strategy deployment pipeline.
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_standard_ci_gradle
      type: String
      description: Advanced override when use_profile_defaults is false. Create the recommended Gradle CI pipeline with intelligence and security features.
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_opa_policies
      type: String
      description: Create or reuse the project-scoped governance workspace. Default true so project-level OPA assets are bootstrapped once per project.
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: enable_change_governance
      type: String
      description: Enable policy-driven change governance gates in generated workload deployment pipelines. Leave true to use project-level governance when available.
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_asg_strategy_pipeline
      type: String
      description: Advanced override when use_profile_defaults is false. Create the ASG strategy deployment pipeline.
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_asg_ci_pipeline
      type: String
      description: Advanced override when use_profile_defaults is false. Create the ASG CI pipeline.
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: asg_startup_script_use_file_store
      type: String
      description: Use Harness File Store for the ASG startup script by default. Set false only when Harness Code fully supports ASG startup scripts.
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: acm_cert_arn
      type: String
      description: ACM certificate ARN for HTTPS ingress
      required: false
      value: <+input>.default(arn:aws:acm:us-east-1:759984737373:certificate/9c90d4f8-208d-46cd-bdc1-bc13f1759c05)
    - name: shared_alb_dns_name
      type: String
      description: DNS name of the shared ALB for EKS ingress (e.g., k8s-harnessdemo-xxx.us-east-1.elb.amazonaws.com)
      required: false
      value: <+input>.default(k8s-harnessdemo-d1317bf02a-762333093.us-east-1.elb.amazonaws.com)
    - name: shared_aws_connector_ref
      type: String
      description: Optional shared project-level AWS connector ref to reuse instead of creating an owner-scoped connector in the workload workspace.
      required: false
      value: <+input>.default("")
    - name: shared_github_connector_ref
      type: String
      description: Optional shared project-level GitHub connector ref to reuse instead of creating an owner-scoped connector in the workload workspace.
      required: false
      value: <+input>.default("")
    - name: create_project_factory
      type: String
      description: Create or reuse the project-scoped factory workspace for shared connectors. Leave false to preserve workload-owned connector behavior.
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: project_factory_delegate_selector
      type: String
      description: Stable delegate selector used by project-scoped shared connectors.
      required: false
      value: <+input>.default(parson-eks-delegate)
    - name: create_project_shared_aws_connector
      type: String
      description: Create the shared project-level AWS connector in the project factory workspace when project factory bootstrapping is enabled.
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: project_factory_aws_connector_id
      type: String
      description: Optional override for the shared project-level AWS connector identifier.
      required: false
      value: <+input>.default("")
    - name: project_factory_aws_connector_name
      type: String
      description: Optional override for the shared project-level AWS connector name.
      required: false
      value: <+input>.default("")
    - name: project_factory_aws_region
      type: String
      description: AWS region for the shared project-level AWS connector.
      required: false
      value: <+input>.default(us-east-1)
    - name: project_factory_aws_auth_type
      type: String
      description: AWS auth type for the shared project-level AWS connector.
      required: false
      value: <+input>.default(irsa).allowedValues(delegate,manual,irsa)
    - name: project_factory_aws_access_key_ref
      type: String
      description: Optional Harness secret reference for the shared project-level AWS connector access key when using manual auth.
      required: false
      value: <+input>.default("")
    - name: project_factory_aws_secret_key_ref
      type: String
      description: Optional Harness secret reference for the shared project-level AWS connector secret key when using manual auth.
      required: false
      value: <+input>.default("")
    - name: project_factory_enable_cross_account_access
      type: String
      description: Enable cross-account STS access on the shared project-level AWS connector.
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: project_factory_cross_account_role_arn
      type: String
      description: Optional cross-account role ARN for the shared project-level AWS connector.
      required: false
      value: <+input>.default("")
    - name: project_factory_cross_account_external_id
      type: String
      description: Optional external ID for the shared project-level AWS connector cross-account role.
      required: false
      value: <+input>.default("")
    - name: create_project_shared_github_connector
      type: String
      description: Create the shared project-level GitHub connector in the project factory workspace when a token ref is supplied.
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: project_factory_github_connector_id
      type: String
      description: Optional override for the shared project-level GitHub connector identifier.
      required: false
      value: <+input>.default("")
    - name: project_factory_github_connector_name
      type: String
      description: Optional override for the shared project-level GitHub connector name.
      required: false
      value: <+input>.default("")
    - name: project_factory_github_url
      type: String
      description: GitHub URL for the shared project-level GitHub connector.
      required: false
      value: <+input>.default(https://github.com)
    - name: project_factory_github_connection_type
      type: String
      description: GitHub connection type for the shared project-level GitHub connector.
      required: false
      value: <+input>.default(Account).allowedValues(Account,Repo)
    - name: project_factory_github_validation_repo
      type: String
      description: Validation repository for the shared project-level GitHub connector.
      required: false
      value: <+input>.default(parson-harness/harness-demo-app)
    - name: project_factory_github_token_ref
      type: String
      description: Harness secret reference for the shared project-level GitHub connector token.
      required: false
      value: <+input>.default("")
    - name: project_factory_github_username
      type: String
      description: GitHub username used by the shared project-level GitHub connector.
      required: false
      value: <+input>.default(x-access-token)
    - name: force_recreate
      type: String
      description: If workspace exists, destroy it first and recreate (clean slate). If false, will update existing workspace.
      required: false
      value: <+input>.default(false).allowedValues(true,false)
  stages:
    - stage:
        name: Create Workspace from Template
        identifier: create_workspace
        description: Create a new IACM workspace from the selected EKS or ASG template using "Use Template" linkage
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Check Workspace Exists
                  identifier: check_workspace_exists
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov
                    method: GET
                    headers:
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    outputVariables:
                      - name: workspace_exists
                        value: <+httpResponseCode>
                        type: String
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 404
                  timeout: 1m
              - step:
                  type: ShellScript
                  name: Resolve Sandbox Profile
                  identifier: resolve_sandbox_profile
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail

                          DEPLOYMENT_TARGET="<+pipeline.variables.deployment_target>"
                          SANDBOX_PROFILE="<+pipeline.variables.sandbox_profile>"
                          USE_PROFILE_DEFAULTS="<+pipeline.variables.use_profile_defaults>"
                          RAW_CREATE_STRATEGY_PIPELINE="<+pipeline.variables.create_strategy_pipeline>"
                          RAW_CREATE_STANDARD_CI_GRADLE="<+pipeline.variables.create_standard_ci_gradle>"
                          RAW_CREATE_ASG_STRATEGY_PIPELINE="<+pipeline.variables.create_asg_strategy_pipeline>"
                          RAW_CREATE_ASG_CI_PIPELINE="<+pipeline.variables.create_asg_ci_pipeline>"

                          RESOLVED_USE_HARNESS_CODE="true"

                          if [ "$USE_PROFILE_DEFAULTS" = "true" ]; then
                            case "$SANDBOX_PROFILE" in
                              auto|self_contained_ci_cd)
                                RESOLVED_PROFILE="se-demo"
                                ;;
                              self_contained_cd_only)
                                RESOLVED_PROFILE="se-workshop"
                                ;;
                              self_contained_asg)
                                RESOLVED_PROFILE="se-demo"
                                ;;
                              se-demo|se-pov-sandbox|se-pov-ref-arch|se-workshop)
                                RESOLVED_PROFILE="$SANDBOX_PROFILE"
                                ;;
                              *)
                                echo "Unsupported sandbox profile: ${SANDBOX_PROFILE}"
                                exit 1
                                ;;
                            esac

                            case "$RESOLVED_PROFILE:$DEPLOYMENT_TARGET" in
                              se-demo:eks|se-pov-sandbox:eks|se-pov-ref-arch:eks)
                                RESOLVED_ARTIFACT_REGISTRY_TYPE="har"
                                RESOLVED_CREATE_DOCKERHUB_UPSTREAM="true"
                                RESOLVED_CREATE_STRATEGY_PIPELINE="true"
                                RESOLVED_CREATE_STANDARD_CI_GRADLE="true"
                                RESOLVED_CREATE_ASG_STRATEGY_PIPELINE="false"
                                RESOLVED_CREATE_ASG_CI_PIPELINE="false"
                                ;;
                              se-demo:asg|se-pov-sandbox:asg|se-pov-ref-arch:asg)
                                RESOLVED_ARTIFACT_REGISTRY_TYPE="har"
                                RESOLVED_CREATE_DOCKERHUB_UPSTREAM="true"
                                RESOLVED_CREATE_STRATEGY_PIPELINE="false"
                                RESOLVED_CREATE_STANDARD_CI_GRADLE="false"
                                RESOLVED_CREATE_ASG_STRATEGY_PIPELINE="true"
                                RESOLVED_CREATE_ASG_CI_PIPELINE="true"
                                ;;
                              se-workshop:eks)
                                RESOLVED_ARTIFACT_REGISTRY_TYPE="har"
                                RESOLVED_CREATE_DOCKERHUB_UPSTREAM="true"
                                RESOLVED_CREATE_STRATEGY_PIPELINE="true"
                                RESOLVED_CREATE_STANDARD_CI_GRADLE="true"
                                RESOLVED_CREATE_ASG_STRATEGY_PIPELINE="false"
                                RESOLVED_CREATE_ASG_CI_PIPELINE="false"
                                ;;
                              se-workshop:asg)
                                RESOLVED_ARTIFACT_REGISTRY_TYPE="har"
                                RESOLVED_CREATE_DOCKERHUB_UPSTREAM="true"
                                RESOLVED_CREATE_STRATEGY_PIPELINE="false"
                                RESOLVED_CREATE_STANDARD_CI_GRADLE="false"
                                RESOLVED_CREATE_ASG_STRATEGY_PIPELINE="true"
                                RESOLVED_CREATE_ASG_CI_PIPELINE="true"
                                ;;
                              *)
                                echo "Profile ${RESOLVED_PROFILE} is not compatible with deployment_target=${DEPLOYMENT_TARGET}"
                                exit 1
                                ;;
                            esac
                          else
                            RESOLVED_PROFILE="manual"

                            RESOLVED_ARTIFACT_REGISTRY_TYPE="har"
                            RESOLVED_CREATE_DOCKERHUB_UPSTREAM="true"
                            RESOLVED_CREATE_STRATEGY_PIPELINE="$RAW_CREATE_STRATEGY_PIPELINE"
                            RESOLVED_CREATE_STANDARD_CI_GRADLE="$RAW_CREATE_STANDARD_CI_GRADLE"
                            RESOLVED_CREATE_ASG_STRATEGY_PIPELINE="$RAW_CREATE_ASG_STRATEGY_PIPELINE"
                            RESOLVED_CREATE_ASG_CI_PIPELINE="$RAW_CREATE_ASG_CI_PIPELINE"
                          fi

                          export RESOLVED_PROFILE
                          export RESOLVED_USE_HARNESS_CODE
                          export RESOLVED_ARTIFACT_REGISTRY_TYPE
                          export RESOLVED_CREATE_DOCKERHUB_UPSTREAM
                          export RESOLVED_CREATE_STRATEGY_PIPELINE
                          export RESOLVED_CREATE_STANDARD_CI_GRADLE
                          export RESOLVED_CREATE_ASG_STRATEGY_PIPELINE
                          export RESOLVED_CREATE_ASG_CI_PIPELINE

                          echo "Resolved profile: ${RESOLVED_PROFILE}"
                          echo "Deployment target: ${DEPLOYMENT_TARGET}"
                    environmentVariables: []
                    outputVariables:
                      - name: resolved_profile
                        type: String
                        value: RESOLVED_PROFILE
                      - name: resolved_use_harness_code
                        type: String
                        value: RESOLVED_USE_HARNESS_CODE
                      - name: resolved_artifact_registry_type
                        type: String
                        value: RESOLVED_ARTIFACT_REGISTRY_TYPE
                      - name: resolved_create_dockerhub_upstream
                        type: String
                        value: RESOLVED_CREATE_DOCKERHUB_UPSTREAM
                      - name: resolved_create_strategy_pipeline
                        type: String
                        value: RESOLVED_CREATE_STRATEGY_PIPELINE
                      - name: resolved_create_standard_ci_gradle
                        type: String
                        value: RESOLVED_CREATE_STANDARD_CI_GRADLE
                      - name: resolved_create_asg_strategy_pipeline
                        type: String
                        value: RESOLVED_CREATE_ASG_STRATEGY_PIPELINE
                      - name: resolved_create_asg_ci_pipeline
                        type: String
                        value: RESOLVED_CREATE_ASG_CI_PIPELINE
                  timeout: 2m
              - step:
                  type: ShellScript
                  name: Resolve Shared Connector References
                  identifier: resolve_shared_connector_refs
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail

                          PROJECT_ID="<+pipeline.variables.harness_project_id>"
                          RAW_SHARED_AWS_CONNECTOR_REF="<+pipeline.variables.shared_aws_connector_ref>"
                          RAW_SHARED_GITHUB_CONNECTOR_REF="<+pipeline.variables.shared_github_connector_ref>"
                          CREATE_PROJECT_FACTORY="<+pipeline.variables.create_project_factory>"
                          CREATE_PROJECT_SHARED_AWS_CONNECTOR="<+pipeline.variables.create_project_shared_aws_connector>"
                          CREATE_PROJECT_SHARED_GITHUB_CONNECTOR="<+pipeline.variables.create_project_shared_github_connector>"
                          PROJECT_FACTORY_AWS_CONNECTOR_ID="<+pipeline.variables.project_factory_aws_connector_id>"
                          PROJECT_FACTORY_GITHUB_CONNECTOR_ID="<+pipeline.variables.project_factory_github_connector_id>"
                          PROJECT_FACTORY_GITHUB_TOKEN_REF="<+pipeline.variables.project_factory_github_token_ref>"

                          if [ -n "$RAW_SHARED_AWS_CONNECTOR_REF" ]; then
                            RESOLVED_SHARED_AWS_CONNECTOR_REF="$RAW_SHARED_AWS_CONNECTOR_REF"
                          elif [ "$CREATE_PROJECT_FACTORY" = "true" ] && [ "$CREATE_PROJECT_SHARED_AWS_CONNECTOR" = "true" ]; then
                            if [ -n "$PROJECT_FACTORY_AWS_CONNECTOR_ID" ]; then
                              RESOLVED_SHARED_AWS_CONNECTOR_REF="$PROJECT_FACTORY_AWS_CONNECTOR_ID"
                            else
                              RESOLVED_SHARED_AWS_CONNECTOR_REF="${PROJECT_ID}_aws_reference_architecture"
                            fi
                          else
                            RESOLVED_SHARED_AWS_CONNECTOR_REF=""
                          fi

                          if [ -n "$RAW_SHARED_GITHUB_CONNECTOR_REF" ]; then
                            RESOLVED_SHARED_GITHUB_CONNECTOR_REF="$RAW_SHARED_GITHUB_CONNECTOR_REF"
                          elif [ "$CREATE_PROJECT_FACTORY" = "true" ] && [ "$CREATE_PROJECT_SHARED_GITHUB_CONNECTOR" = "true" ] && [ -n "$PROJECT_FACTORY_GITHUB_TOKEN_REF" ]; then
                            if [ -n "$PROJECT_FACTORY_GITHUB_CONNECTOR_ID" ]; then
                              RESOLVED_SHARED_GITHUB_CONNECTOR_REF="$PROJECT_FACTORY_GITHUB_CONNECTOR_ID"
                            else
                              RESOLVED_SHARED_GITHUB_CONNECTOR_REF="${PROJECT_ID}_github_reference_architecture"
                            fi
                          else
                            RESOLVED_SHARED_GITHUB_CONNECTOR_REF=""
                          fi

                          echo "Resolved shared AWS connector ref: ${RESOLVED_SHARED_AWS_CONNECTOR_REF:-<none>}"
                          echo "Resolved shared GitHub connector ref: ${RESOLVED_SHARED_GITHUB_CONNECTOR_REF:-<none>}"
                    environmentVariables: []
                    outputVariables:
                      - name: resolved_shared_aws_connector_ref
                        type: String
                        value: RESOLVED_SHARED_AWS_CONNECTOR_REF
                      - name: resolved_shared_github_connector_ref
                        type: String
                        value: RESOLVED_SHARED_GITHUB_CONNECTOR_REF
                  timeout: 2m
              - step:
                  type: Http
                  name: Check Governance Workspace Exists
                  identifier: check_governance_workspace_exists
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.harness_project_id>_governance
                    method: GET
                    headers:
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    outputVariables:
                      - name: workspace_exists
                        value: <+httpResponseCode>
                        type: String
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 404
                  timeout: 1m
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.create_opa_policies> == "true"
              - step:
                  type: Http
                  name: Create Governance Workspace
                  identifier: create_governance_workspace
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces
                    method: POST
                    headers:
                      - key: Content-Type
                        value: application/json
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    requestBody: |
                      {
                        "identifier": "<+pipeline.variables.harness_project_id>_governance",
                        "name": "<+pipeline.variables.harness_project_id> Project Governance Workspace",
                        "description": "Project-scoped governance assets for <+pipeline.variables.harness_org_id>/<+pipeline.variables.harness_project_id>",
                        "provisioner": "opentofu",
                        "provisioner_version": "1.11.2",
                        "repository_connector": "parsongh",
                        "repository": "harness-demo-app",
                        "repository_branch": "main",
                        "repository_path": "tofu/stacks/project-governance",
                        "provider_connector": "aws_oidc_iacm",
                        "cost_estimation_enabled": false,
                        "provider_connectors": [
                          {
                            "connector_ref": "aws_oidc_iacm",
                            "type": "aws"
                          }
                        ],
                        "default_pipelines": {
                          "provision": {
                            "project_pipeline": "pov_provisioning"
                          },
                          "destroy": {
                            "project_pipeline": "pov_destroy"
                          }
                        },
                        "terraform_variables": {
                          "harness_account_id": {
                            "key": "harness_account_id",
                            "value": "<+pipeline.variables.harness_account_id>",
                            "value_type": "string"
                          },
                          "harness_endpoint": {
                            "key": "harness_endpoint",
                            "value": "<+pipeline.variables.harness_endpoint>",
                            "value_type": "string"
                          },
                          "harness_api_key": {
                            "key": "harness_api_key",
                            "value": "<+pipeline.variables.target_api_key>",
                            "value_type": "string"
                          },
                          "harness_org_id": {
                            "key": "harness_org_id",
                            "value": "<+pipeline.variables.harness_org_id>",
                            "value_type": "string"
                          },
                          "harness_project_id": {
                            "key": "harness_project_id",
                            "value": "<+pipeline.variables.harness_project_id>",
                            "value_type": "string"
                          },
                          "create_harness_org": {
                            "key": "create_harness_org",
                            "value": "<+pipeline.variables.create_harness_org>",
