                        echo "Using blast radius: $CHANGE_BLAST_RADIUS"
                        echo "Using rollback ready: $ROLLBACK_READY"
                        echo "Using open change failures: $OPEN_CHANGE_FAILURES"
                        echo "Using change freeze active: $CHANGE_FREEZE_ACTIVE"
                        echo "Using requires data migration: $REQUIRES_DATA_MIGRATION"
                        echo "Using release candidate evidence bundle from CI"

                      #  WEBHOOK_URL="$HARNESS_ENDPOINT/pipeline/api/webhook/custom/v2?accountIdentifier=$ACCOUNT_ID&orgIdentifier=$ORG_ID&projectIdentifier=$PROJECT_ID&pipelineIdentifier=toddfour_k8s_strategy_deploy&triggerIdentifier=auto_deploy_webhook"

                      #  response=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" \
                      #    -H "Content-Type: application/json" \
                      #    -d "{\"image_tag\": \"$IMAGE_TAG\", \"deployment_strategy\": \"canary\", \"test_pass_rate\": \"$TEST_PASS_RATE\", \"critical_vulnerabilities\": \"$CRITICAL_VULNERABILITIES\", \"high_vulnerabilities\": \"$HIGH_VULNERABILITIES\", \"change_blast_radius\": \"$CHANGE_BLAST_RADIUS\", \"rollback_ready\": \"$ROLLBACK_READY\", \"open_change_failures\": \"$OPEN_CHANGE_FAILURES\", \"change_freeze_active\": \"$CHANGE_FREEZE_ACTIVE\", \"requires_data_migration\": \"$REQUIRES_DATA_MIGRATION\", \"release_candidate_evidence\": $RELEASE_CANDIDATE_EVIDENCE}")

                      #  http_code=$(echo "$response" | tail -n1)
                      #  body=$(echo "$response" | sed '$d')

                      #  echo "Response code: $http_code"
                      #  echo "Response: $body"

                      #  if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
                      #    echo "CD pipeline triggered successfully!"
                      #  else
                      #    echo "CD pipeline trigger returned: $http_code"
                      #    echo "Deployment can still be triggered manually."
                      #  fi
                      # else
                      #  echo "Auto-deploy is disabled. To deploy, run the strategy pipeline manually."
                      # fi
                    envVariables:
                      IMAGE_TAG: <+execution.steps.assemble_release_candidate_evidence.output.outputVariables.IMAGE_TAG>
                      TEST_PASS_RATE: <+execution.steps.prepare_governance_inputs.output.outputVariables.TEST_PASS_RATE>
                      CRITICAL_VULNERABILITIES: <+execution.steps.prepare_governance_inputs.output.outputVariables.CRITICAL_VULNERABILITIES>
                      HIGH_VULNERABILITIES: <+execution.steps.prepare_governance_inputs.output.outputVariables.HIGH_VULNERABILITIES>
                      CHANGE_BLAST_RADIUS: <+execution.steps.prepare_governance_inputs.output.outputVariables.CHANGE_BLAST_RADIUS>
                      ROLLBACK_READY: <+execution.steps.prepare_governance_inputs.output.outputVariables.ROLLBACK_READY>
                      OPEN_CHANGE_FAILURES: <+execution.steps.prepare_governance_inputs.output.outputVariables.OPEN_CHANGE_FAILURES>
                      CHANGE_FREEZE_ACTIVE: <+execution.steps.prepare_governance_inputs.output.outputVariables.CHANGE_FREEZE_ACTIVE>
                      REQUIRES_DATA_MIGRATION: <+execution.steps.prepare_governance_inputs.output.outputVariables.REQUIRES_DATA_MIGRATION>
                      RELEASE_CANDIDATE_EVIDENCE: <+execution.steps.assemble_release_candidate_evidence.output.outputVariables.RELEASE_EVIDENCE_JSON>
                      AUTO_DEPLOY: <+execution.steps.prepare_governance_inputs.output.outputVariables.AUTO_DEPLOY>
                      HARNESS_ENDPOINT: <+pipeline.variables.harness_endpoint>
                      ACCOUNT_ID: <+account.identifier>
                      ORG_ID: <+org.identifier>
                      PROJECT_ID: <+project.identifier>
                  when:
                    stageStatus: Success
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: ITSM
        identifier: ITSM
        description: ""
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Open Change Request
                  identifier: Open_Change_Request
                  type: ServiceNowCreate
                  timeout: 5m
                  spec:
                    connectorRef: account.ServiceNow_Dev
                    ticketType: change_request
                    fields:
                      - name: description
                        value: |-
                          Harness automated change management.
                          Service: <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.SERVICE_NAME>
                          Pipeline Name: <+pipeline.name> 
                          Artifact: <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.ARTIFACT> 
                          Build URL: <+pipeline.stages.build_test_scan_push.spec.execution.steps.prepare_artifact_links.output.outputVariables.BUILD_EXECUTION_URL> 
                          Requested by <+pipeline.triggeredBy.name>
                      - name: short_description
                        value: Begin deployment of <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.SERVICE_NAME> to QA
                    createType: Normal
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: MarkAsSuccess
        tags: {}
    - stage:
        name: Deploy to QA
        identifier: deploy_to_qa
        description: Blue-Green deployment with instant traffic swap
        type: Deployment
        when:
          pipelineStatus: Success
        delegateSelectors:
          - delegate-toddfour
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: toddfour_demo_app
          environment:
            environmentRef: Toddfour_K8s_QA
            deployToAll: false
            infrastructureDefinitions:
              - identifier: toddfour_k8s_qa
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Pipeline Context
                  identifier: pipeline_context
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "========================================"
                          echo "  HARNESS PIPELINE CONTEXT"
                          echo "========================================"
                          echo "Pipeline: <+pipeline.name> | Execution: <+pipeline.executionId>"
                          echo "Stage: <+stage.name> | Service: <+service.name>"
                          echo "Environment: <+env.name> (<+env.type>)"
                          echo "Infrastructure: <+infra.name> | Namespace: <+infra.namespace>"
                          echo "Artifact: <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.ARTIFACT>"
                          echo "Primary URL: https://<+serviceVariables.ingressHost>"
                          echo "Stage URL:   https://<+serviceVariables.ingressStageHost>"
                          echo "========================================"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
              - step:
                  name: Stage Deployment
                  identifier: stage_deployment
                  type: K8sBlueGreenDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
              - step:
                  name: Approval
                  identifier: bg_approval
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |
                      Blue/Green deployment staged successfully.

                      Artifact:
                        Image tag: <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.IMAGE_TAG>

                      Validate the new version on the Stage environment:
                        Stage URL:   https://<+serviceVariables.ingressStageHost>

                      Current production traffic continues to:
                        Primary URL: https://<+serviceVariables.ingressHost>

                      Approve to swap traffic to the new version. Reject to abort.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
              - step:
                  name: Swap Primary
                  identifier: swap_primary
                  type: K8sBGSwapServices
                  timeout: 10m
                  spec:
                    skipDryRun: false
              - step:
                  name: Scale Down Old Version
                  identifier: scale_down_old
                  type: K8sBlueGreenStageScaleDown
                  timeout: 10m
                  spec: {}
              - parallel:
                  - step:
                      type: ShellScript
                      name: Deployment Complete
                      identifier: deployment_complete
                      spec:
                        shell: Bash
                        executionTarget: {}
                        source:
                          type: Inline
                          spec:
                            script: |
                              echo "========================================"
                              echo "  BLUE-GREEN DEPLOYMENT COMPLETE"
                              echo "========================================"
                              echo ""
                              echo "Production URL: https://<+serviceVariables.ingressHost>"
                              echo "Stage URL:      https://<+serviceVariables.ingressStageHost>"
                              echo ""
                              echo "Traffic has been swapped to the new version."
                              echo "The old version has been scaled down."
                              echo "========================================"

                              export SERVICE_NAME="<+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.SERVICE_NAME>"
                              export ARTIFACT="<+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.ARTIFACT>"
                        environmentVariables: []
                        outputVariables:
                          - name: SERVICE_NAME
                            type: String
                            value: SERVICE_NAME
                          - name: ARTIFACT
                            type: String
                            value: ARTIFACT
                      timeout: 1m
                  - step:
                      type: ServiceNowUpdate
                      name: Update Change Record
                      identifier: Update_Change_Record
                      spec:
                        useServiceNowTemplate: false
                        connectorRef: account.ServiceNow_Dev
                        ticketType: change_request
                        ticketNumber: <+pipeline.stages.ITSM.spec.execution.steps.Open_Change_Request.ticket.ticketNumber>
                        fields:
                          - name: state
                            value: "-1"
                          - name: work_notes
                            value: |-
                              <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.SERVICE_NAME> service passed <+env.name> security and quality gates. Ready to release <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.ARTIFACT>.
                              Pipeline Execution: <+pipeline.executionUrl>.
                      timeout: 5m
            rollbackSteps: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: Release Governance
        identifier: release_governance
        description: Policy-driven approval gate for deployment risk evaluation
        type: Custom
        when:
          pipelineStatus: Success
        delegateSelectors:
          - delegate-toddfour
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Assemble Release Context
                  identifier: assemble_release_context
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          cat <<'EOF' > change_context.json
                          {
                            "pipeline": {
                              "identifier": "<+pipeline.identifier>",
                              "execution_id": "<+pipeline.executionId>",
                              "sequence_id": "<+pipeline.sequenceId>"
                            },
                            "change": {
                              "request_id": "<+pipeline.identifier>-<+pipeline.sequenceId>",
                              "service": "<+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.SERVICE_NAME>",
                              "environment": "Toddfour_Prod",
                              "environment_type": "Production",
                              "blast_radius": "<+pipeline.stages.build_test_scan_push.spec.execution.steps.prepare_governance_inputs.output.outputVariables.CHANGE_BLAST_RADIUS>",
                              "freeze_window_active": <+pipeline.stages.build_test_scan_push.spec.execution.steps.prepare_governance_inputs.output.outputVariables.CHANGE_FREEZE_ACTIVE>,
                              "requires_data_migration": <+pipeline.stages.build_test_scan_push.spec.execution.steps.prepare_governance_inputs.output.outputVariables.REQUIRES_DATA_MIGRATION>
                            },
                            "validation": {
                              "tests": {
                                "pass_rate": <+pipeline.stages.build_test_scan_push.spec.execution.steps.prepare_governance_inputs.output.outputVariables.TEST_PASS_RATE>
                              },
                              "security": {
                                "critical_vulns": <+pipeline.stages.build_test_scan_push.spec.execution.steps.prepare_governance_inputs.output.outputVariables.CRITICAL_VULNERABILITIES>,
                                "high_vulns": <+pipeline.stages.build_test_scan_push.spec.execution.steps.prepare_governance_inputs.output.outputVariables.HIGH_VULNERABILITIES>
                              },
                              "operations": {
                                "open_failures": <+pipeline.stages.build_test_scan_push.spec.execution.steps.prepare_governance_inputs.output.outputVariables.OPEN_CHANGE_FAILURES>,
                                "rollback_ready": <+pipeline.stages.build_test_scan_push.spec.execution.steps.prepare_governance_inputs.output.outputVariables.ROLLBACK_READY>
                              }
                            },
                            "release_candidate": <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.RELEASE_EVIDENCE_JSON>
                          }
                          EOF

                          change_context="$(tr -d '\n' < change_context.json)"
                          export change_context
                          echo "$change_context"
                    environmentVariables: []
                    outputVariables:
                      - name: change_context
                        type: String
                        value: change_context
                  timeout: 10m
              - stepGroup:
                  name: Governance
                  identifier: governance
                  steps:
                    - step:
                        type: Policy
                        name: Evaluate Change Risk
                        identifier: evaluate_change_risk
                        spec:
                          policySets:
                            - change_risk_guardrails
                          type: Custom
                          policySpec:
                            payload: <+execution.steps.assemble_release_context.output.outputVariables.change_context>
                        timeout: 10m
                        failureStrategies:
                          - onFailure:
                              errors:
                                - PolicyEvaluationFailure
                              action:
                                type: MarkAsSuccess
              - step:
                  type: ServiceNowUpdate
                  name: Update Change Record
                  identifier: update_change_record
                  spec:
                    useServiceNowTemplate: false
                    connectorRef: account.ServiceNow_Dev
                    ticketType: change_request
                    ticketNumber: <+pipeline.stages.ITSM.spec.execution.steps.Open_Change_Request.ticket.ticketNumber>
                    fields:
                      - name: test_plan
                        value: |-
                          Harness production deployment ready for release.
                          Service: <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.SERVICE_NAME>
                          Environment: Production
                          Artifact: <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.ARTIFACT>
                          Execution URL: <+pipeline.executionUrl>
                      - name: backout_plan
                        value: Harness Automatic Rollback.
                      - name: risk_impact_analysis
                        value: |-
                          Test coverage: <+pipeline.stages.build_test_scan_push.spec.execution.steps.prepare_governance_inputs.output.outputVariables.TEST_PASS_RATE>

                          Critical Vulnerabilities: <+pipeline.stages.build_test_scan_push.spec.execution.steps.prepare_governance_inputs.output.outputVariables.CRITICAL_VULNERABILITIES>

                          High Vulnerabilities: <+pipeline.stages.build_test_scan_push.spec.execution.steps.prepare_governance_inputs.output.outputVariables.HIGH_VULNERABILITIES>

                          Artifact: <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.ARTIFACT>

                          Commit SHA: <+pipeline.stages.build_test_scan_push.spec.execution.steps.prepare_governance_inputs.output.outputVariables.COMMIT_SHA>

                          Change Risk Guard Rails: <+pipeline.stages.release_governance.spec.execution.steps.governance.steps.evaluate_change_risk.output.policySetDetails.change_risk_guardrails.status>

                          Change Risk Score: <+pipeline.stages.release_governance.spec.execution.steps.governance.steps.evaluate_change_risk.output.policySetDetails.change_risk_guardrails.policyDetails.change_risk_score.status>

                          Change Readiness Guardrails: <+pipeline.stages.release_governance.spec.execution.steps.governance.steps.evaluate_change_risk.output.policySetDetails.change_risk_guardrails.policyDetails.change_readiness_guardrails.status>

                          Change Validation Quality: <+pipeline.stages.release_governance.spec.execution.steps.governance.steps.evaluate_change_risk.output.policySetDetails.change_risk_guardrails.policyDetails.change_validation_quality.status>
                  timeout: 5m
                contextType: Pipeline
              - parallel:
                  - stepGroup:
                      name: Manual Approval Required
                      identifier: manual_approval_required
                      steps:
                        - step:
                            type: ServiceNowApproval
                            name: ServiceNow Approval
                            identifier: ServiceNow_Approval
                            spec:
                              connectorRef: account.ServiceNow_Dev
                              ticketNumber: <+pipeline.stages.ITSM.spec.execution.steps.Open_Change_Request.ticket.ticketNumber>
                              retryInterval: 1m
                              ticketType: change_request
                              approvalCriteria:
                                type: KeyValues
                                spec:
                                  matchAnyCondition: true
                                  conditions:
                                    - key: state
                                      operator: equals
                                      value: Review
                              rejectionCriteria:
                                type: KeyValues
                                spec:
                                  matchAnyCondition: true
                                  conditions: []
                            timeout: 5m
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - Timeout
                                  action:
                                    type: MarkAsSuccess
                      when:
                        stageStatus: All
                        condition: <+execution.steps.governance.steps.evaluate_change_risk.output.status> == "error"
                  - stepGroup:
                      name: Auto Approval Path
                      identifier: auto_approval_path
                      steps:
                        - step:
                            type: ServiceNowUpdate
                            name: Approve Standard Change Request
                            identifier: approve_standard_change_request
                            spec:
                              useServiceNowTemplate: false
                              connectorRef: account.ServiceNow_Dev
                              ticketType: change_request
                              ticketNumber: <+pipeline.stages.ITSM.spec.execution.steps.Open_Change_Request.ticket.ticketNumber>
                              fields:
                                - name: state
                                  value: "0"
                            timeout: 5m
                      when:
                        stageStatus: All
                        condition: <+execution.steps.governance.steps.evaluate_change_risk.output.status> != "error"
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: Deploy to Prod
        identifier: deploy_to_prod
        description: Canary deployment with gradual traffic shift
        type: Deployment
        when:
          pipelineStatus: Success
        delegateSelectors:
          - delegate-toddfour
        spec:
          deploymentType: Kubernetes
          environment:
            environmentRef: Toddfour_Prod
            deployToAll: false
            infrastructureDefinitions:
              - identifier: toddfour_k8s_prod
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Pipeline Context
                  identifier: pipeline_context
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "========================================"
                          echo "  HARNESS PIPELINE CONTEXT"
                          echo "========================================"
                          echo "Pipeline: <+pipeline.name> | Execution: <+pipeline.executionId>"
                          echo "Stage: <+stage.name> | Service: <+service.name>"
                          echo "Environment: <+env.name> (<+env.type>)"
                          echo "Infrastructure: <+infra.name> | Namespace: <+infra.namespace>"
                          echo "Artifact: <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.ARTIFACT>"
                          echo "App URL: https://<+serviceVariables.ingressHost>"
                          echo "========================================"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
              - step:
                  name: Canary Deployment
                  identifier: canary_deploy
                  type: K8sCanaryDeploy
                  timeout: 10m
                  spec:
                    instanceSelection:
                      type: Count
                      spec:
                        count: 1
                    skipDryRun: false
              - step:
                  type: ShellScript
                  name: Get Canary Traffic Split
                  identifier: get_validation_urls
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          NAMESPACE="<+infra.namespace>"
                          CANARY_PODS=$(kubectl get pods -n $NAMESPACE -l harness.io/track=canary --no-headers 2>/dev/null | wc -l | tr -d ' ')
                          STABLE_PODS=$(kubectl get pods -n $NAMESPACE -l harness.io/track=stable --no-headers 2>/dev/null | wc -l | tr -d ' ')
                          TOTAL=$((CANARY_PODS + STABLE_PODS))
                          if [ $TOTAL -gt 0 ]; then
                            CANARY_PCT=$((CANARY_PODS * 100 / TOTAL))
                            STABLE_PCT=$((STABLE_PODS * 100 / TOTAL))
                          else
                            CANARY_PCT=0
                            STABLE_PCT=100
                          fi
                          echo "App URL: https://<+serviceVariables.ingressHost>"
                          echo "Traffic: ~${CANARY_PCT}% canary (${CANARY_PODS} pods), ~${STABLE_PCT}% stable (${STABLE_PODS} pods)"
                    environmentVariables: []
                    outputVariables:
                      - name: CANARY_PCT
                        type: String
                        value: CANARY_PCT
                      - name: STABLE_PCT
                        type: String
                        value: STABLE_PCT
                  timeout: 10m
              - step:
                  name: Approval
                  identifier: canary_approval
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |
                      Canary deployment complete.

                      Artifact:
                        Image tag: <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.IMAGE_TAG>

                      Validation target:
                        App URL: https://<+serviceVariables.ingressHost>
                      Traffic split: ~<+execution.steps.get_validation_urls.output.outputVariables.CANARY_PCT>% canary, ~<+execution.steps.get_validation_urls.output.outputVariables.STABLE_PCT>% stable

                      Approve to promote canary to 100% of pods. Reject to roll back.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
              - step:
                  name: Canary Delete
                  identifier: canary_delete
                  type: K8sCanaryDelete
                  timeout: 10m
                  spec: {}
              - step:
                  name: Rolling Deployment
                  identifier: rolling_deploy
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
              - step:
                  type: ServiceNowUpdate
                  name: Close ServiceNow
                  identifier: Close_ServiceNow
                  spec:
                    useServiceNowTemplate: false
                    connectorRef: account.ServiceNow_Dev
                    ticketType: change_request
                    ticketNumber: <+pipeline.stages.ITSM.spec.execution.steps.Open_Change_Request.ticket.ticketNumber>
                    fields:
                      - name: state
                        value: "3"
                      - name: close_code
                        value: successful
                      - name: close_notes
                        value: |-
                          Deployment successful for <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.ARTIFACT> for the <+pipeline.stages.build_test_scan_push.spec.execution.steps.assemble_release_candidate_evidence.output.outputVariables.SERVICE_NAME> service to <+env.name> 
                          Pipeline Execution: <+pipeline.executionUrl> 
                  timeout: 5m
              - step:
                  type: ShellScript
                  name: Deployment Complete
                  identifier: deployment_complete
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "========================================"
                          echo "  CANARY DEPLOYMENT COMPLETE"
                          echo "========================================"
                          echo ""
                          echo "App URL: https://<+serviceVariables.ingressHost>"
                          echo ""
                          echo "Canary validated and promoted to 100%."
                          echo "All pods now running the new version."
                          echo "========================================"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
            rollbackSteps:
              - step:
                  name: Canary Delete
                  identifier: strategy_rollback_canary_delete
                  type: K8sCanaryDelete
                  timeout: 10m
                  spec: {}
          service:
            useFromStage:
              stage: deploy_to_qa
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        tags: {}
  identifier: E2E_Enterprise_Pipeline_Toddfour
  description: "End-to-end enterprise CI/CD pipeline: Gradle build, Test Intelligence, Security Scanning (SAST/SCA/Trivy), Supply Chain (SBOM/SLSA), Change Management, QA B/G deploy, Prod Canary deploy"
  name: E2E Enterprise Pipeline - Toddfour
