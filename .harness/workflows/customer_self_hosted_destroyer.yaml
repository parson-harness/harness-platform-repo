apiVersion: harness.io/v1
kind: Workflow
name: Customer Self-Hosted Destroyer
identifier: customer_self_hosted_destroyer
type: workflow
scope: project
projectIdentifier: parson
orgIdentifier: sandbox
owner: todd.parson@harness.io
metadata:
  description: |
    ADVANCED: Destroy a POV environment in a customer Harness account.
    
    ⚠️  This workflow targets the canonical `idp_pov_destroyer_v2` pipeline.
    
    What gets destroyed:
    - Harness pipelines, services, environments
    - K8s namespaces and deployments for EKS targets
    - ASG-related AWS and Harness resources for ASG targets
    
    Prerequisites:
    - Customer API key with admin permissions
  tags:
    - customer-self-hosted
    - iacm
    - own-aws
    - advanced
spec:
  presentation:
    customTitle: Customer Self-Hosted Destroyer (Advanced)
    customSubTitle: "⚠️ Destroys AWS infrastructure in customer's account"
    customCreateButtonText: Destroy Infrastructure
  
  output:
    links:
      - title: Pipeline Execution
        url: ${{ steps.trigger.output.PipelineUrl }}
  
  lifecycle: production
  
  parameters:
    - title: POV Identity
      required:
        - owner
      properties:
        owner:
          title: POV Owner
          type: string
          description: "Owner name of the POV to destroy (must match exactly)"
          pattern: "^[a-z][a-z0-9]*$"
          ui:help: "Enter the same owner name used when provisioning"
        
        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken
    
    - title: Customer Harness Account
      required:
        - harness_account_id
        - harness_org_id
        - harness_project_id
        - target_api_key
      properties:
        harness_account_id:
          title: Customer Account ID
          type: string
          description: "Customer's Harness Account ID"
        
        harness_cluster:
          title: Harness Cluster
          type: string
          description: "Which Harness cluster is the customer account on?"
          default: "https://app.harness.io"
          enum:
            - "https://app.harness.io/gratis"
            - "https://app.harness.io"
            - "https://app3.harness.io"
          enumNames:
            - "Prod 1 - Free/Community accounts"
            - "Prod 2 - Enterprise accounts"
            - "Prod 3 - Enterprise accounts"
        
        harness_org_id:
          title: Organization ID
          type: string
          description: "Customer's Harness Organization ID"
        
        harness_project_id:
          title: Project ID
          type: string
          description: "Customer's Harness Project ID"
        
        target_api_key:
          title: Customer API Key
          type: string
          description: "Customer's Harness API Key with admin permissions"
          ui:widget: password
    
    - title: Destruction Options
      properties:
        deployment_target:
          title: Deployment Target
          type: string
          description: "Which target stack should be destroyed"
          default: eks
          enum:
            - eks
            - asg
        
        skip_terraform_destroy:
          title: Skip Terraform Destroy?
          type: string
          description: "Use API-only/orphan cleanup instead of Terraform destroy"
          default: "false"
          enum:
            - "true"
            - "false"
        
        auto_approve:
          title: Auto Approve?
          type: string
          description: "Auto-approve the destroy pipeline"
          default: "true"
          enum:
            - "true"
            - "false"

  steps:
    - id: trigger
      name: Destroying Customer Infrastructure
      action: trigger:harness-custom-pipeline
      input:
        url: "https://app.harness.io/ng/account/EeRjnXTnS4GrLG5VNNJZUw/all/orgs/sandbox/projects/parson/pipelines/idp_pov_destroyer_v2/pipeline-studio/?storeType=REMOTE&connectorRef=parsongh&repoName=harness-demo-app&branch=main"
        inputset:
          owner: ${{ parameters.owner }}
          harness_account_id: ${{ parameters.harness_account_id }}
          harness_endpoint: ${{ parameters.harness_cluster }}
          harness_org_id: ${{ parameters.harness_org_id }}
          harness_project_id: ${{ parameters.harness_project_id }}
          target_api_key: ${{ parameters.target_api_key }}
          deployment_target: ${{ parameters.deployment_target }}
          skip_terraform_destroy: ${{ parameters.skip_terraform_destroy }}
          auto_approve: ${{ parameters.auto_approve }}
        apikey: ${{ parameters.token }}
