                            update_tf_var "instance_type" "t3.small" "string"
                            update_tf_var "asg_min_size" "1" "string"
                            update_tf_var "asg_desired_capacity" "1" "string"
                            update_tf_var "asg_max_size" "4" "string"
                            update_tf_var "asg_canary_instance_count" "1" "string"
                            update_tf_var "asg_startup_script_use_file_store" "$ASG_STARTUP_SCRIPT_USE_FILE_STORE" "string"
                            update_tf_var "create_asg_strategy_pipeline" "$CREATE_ASG_STRATEGY_PIPELINE" "string"
                            update_tf_var "create_asg_ci_pipeline" "$CREATE_ASG_CI_PIPELINE" "string"
                            update_tf_var "enable_change_governance" "$ENABLE_CHANGE_GOVERNANCE" "string"
                            update_tf_var "standard_ci_gradle_test_packages" "io.harness.demo" "string"
                            update_tf_var "acm_cert_arn" "$ACM_CERT_ARN" "string"
                            update_tf_var "create_dns_record" "true" "string"
                            update_tf_var "route53_zone_name" "harness-demo.dev" "string"
                            update_tf_var "create_delegate" "true" "string"
                            update_tf_var "eks_cluster_name" "$EKS_CLUSTER_NAME" "string"
                            update_tf_var "aws_auth_type" "irsa" "string"
                            update_tf_var "enable_cross_account_access" "false" "string"
                            update_tf_var "cross_account_role_arn" "" "string"
                            update_tf_var "cross_account_external_id" "" "string"
                          else
                            update_tf_var "eks_cluster_name" "$EKS_CLUSTER_NAME" "string"
                            update_tf_var "harness_api_key_email" "$TARGET_API_KEY_EMAIL" "string"
                            update_tf_var "artifact_registry_type" "$ARTIFACT_REGISTRY_TYPE" "string"
                            update_tf_var "create_dockerhub_upstream" "$CREATE_DOCKERHUB_UPSTREAM" "string"
                            update_tf_var "create_strategy_pipeline" "$CREATE_STRATEGY_PIPELINE" "string"
                            update_tf_var "create_standard_ci_gradle" "$CREATE_STANDARD_CI_GRADLE" "string"
                            update_tf_var "enable_change_governance" "$ENABLE_CHANGE_GOVERNANCE" "string"
                            update_tf_var "create_opa_policies" "false" "string"
                            update_tf_var "acm_cert_arn" "$ACM_CERT_ARN" "string"
                            update_tf_var "create_delegate" "true" "string"
                            update_tf_var "manage_dns" "true" "string"
                            update_tf_var "shared_alb_dns_name" "$SHARED_ALB_DNS_NAME" "string"
                          fi

                          echo "Workspace variables reconciled for ${WORKSPACE_ID} (${DEPLOYMENT_TARGET}, profile=${RESOLVED_PROFILE})"
                    environmentVariables:
                      - name: PROVISIONER_API_KEY
                        type: String
                        value: <+pipeline.variables.provisioner_api_key>
                      - name: TARGET_API_KEY
                        type: String
                        value: <+pipeline.variables.target_api_key>
                    outputVariables: []
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: ShellScript
                  name: Workspace Created
                  identifier: workspace_created
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          if [ "<+pipeline.variables.deployment_target>" = "asg" ]; then
                            echo "=== IACM Workspace Created (ASG Stack) ==="
                            echo "Workspace ID: <+pipeline.variables.owner>_pov"
                            echo "Stack: tofu/stacks/asg"
                            echo ""
                            echo "Owner: <+pipeline.variables.owner>"
                            echo "EKS Cluster: <+pipeline.variables.eks_cluster_name>"
                            echo "Org: <+pipeline.variables.harness_org_id>"
                            echo "Project: <+pipeline.variables.harness_project_id>"
                            echo ""
                            echo "Proceeding to provision Harness entities..."
                          else
                            echo "=== IACM Workspace Created (EKS Stack) ==="
                            echo "Workspace ID: <+pipeline.variables.owner>_pov"
                            echo "Stack: tofu/stacks/eks"
                            echo ""
                            echo "Owner: <+pipeline.variables.owner>"
                            echo "EKS Cluster: <+pipeline.variables.eks_cluster_name>"
                            echo "Org: <+pipeline.variables.harness_org_id>"
                            echo "Project: <+pipeline.variables.harness_project_id>"
                            echo ""
                            echo "Proceeding to provision Harness entities..."
                          fi
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
              - step:
                  type: ShellScript
                  name: Check State Health
                  identifier: check_state_health
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - parson-eks-delegate
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=== Checking State Health ==="
                          echo ""
                          STATE_STALE="false"
                          TARGET="<+pipeline.variables.deployment_target>"

                          OWNER="<+pipeline.variables.owner>"
                          ENDPOINT="<+pipeline.variables.harness_endpoint>"
                          ACCOUNT_ID="<+pipeline.variables.harness_account_id>"
                          ORG_ID="<+pipeline.variables.harness_org_id>"
                          PROJECT_ID="<+pipeline.variables.harness_project_id>"

                          # Check if workspace has any state (GET workspace state info)
                          WS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                            "${ENDPOINT}/iacm/api/orgs/${ORG_ID}/projects/${PROJECT_ID}/workspaces/${OWNER}_pov/state" \
                            -H "Harness-Account: ${ACCOUNT_ID}" \
                            -H "x-api-key: ${API_KEY}")
                          echo "Workspace state: HTTP ${WS_CODE}"

                          if [ "$WS_CODE" = "404" ] || [ "$WS_CODE" = "400" ]; then
                            echo "No state found - workspace is fresh, nothing to check"
                            export STATE_STALE="false"
                          else
                            REPO_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                              "${ENDPOINT}/code/api/v1/repos/${OWNER}-demo-app?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}" \
                              -H "x-api-key: ${API_KEY}")
                            echo "Code repo: HTTP ${REPO_CODE}"

                            if [ "$TARGET" = "asg" ]; then
                              if [ "$REPO_CODE" = "404" ]; then
                                echo ""
                                echo " State is STALE - Harness Code repo is missing"
                                echo "Will delete and recreate workspace to start fresh"
                                STATE_STALE="true"
                              else
                                echo ""
                                echo " State appears healthy"
                              fi
                            else
                              HAR_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                                "${ENDPOINT}/har/api/v1/registry/${ACCOUNT_ID}/${ORG_ID}/${PROJECT_ID}/${OWNER}-dockerhub-proxy/%2B" \
                                -H "x-api-key: ${API_KEY}")
                              echo "HAR upstream proxy: HTTP ${HAR_CODE}"

                              REG_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                                "${ENDPOINT}/har/api/v1/registry/${ACCOUNT_ID}/${ORG_ID}/${PROJECT_ID}/har-${OWNER}/%2B" \
                                -H "x-api-key: ${API_KEY}")
                              echo "HAR virtual registry: HTTP ${REG_CODE}"

                              if [ "$HAR_CODE" = "404" ] || [ "$REG_CODE" = "404" ] || [ "$REPO_CODE" = "404" ]; then
                                echo ""
                                echo " State is STALE - key EKS resources in state were deleted from Harness"
                                echo "Will delete and recreate workspace to start fresh"
                                STATE_STALE="true"
                              else
                                echo ""
                                echo " State appears healthy"
                              fi
                            fi
                          fi
                    environmentVariables:
                      - name: API_KEY
                        type: String
                        value: <+pipeline.variables.target_api_key>
                    outputVariables:
                      - name: state_stale
                        type: String
                        value: STATE_STALE
                  timeout: 1m
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "200"
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                          spec: {}
    - stage:
        name: Destroy Existing
        identifier: destroy_existing
        description: Terraform destroy existing workspace before recreating (force_recreate mode)
        type: IACM
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.create_workspace.spec.execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "200" && <+pipeline.variables.force_recreate> == "true"
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          workspace: <+pipeline.variables.owner>_pov
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: Plan Destroy
                  identifier: plan_destroy
                  timeout: 15m
                  spec:
                    command: plan-destroy
              - step:
                  type: Run
                  name: Show Destroy Plan
                  identifier: show_destroy_plan
                  spec:
                    shell: Bash
                    command: |
                      echo "=============================================="
                      echo "  Force Recreate: Destroying Existing POV"
                      echo "=============================================="
                      echo ""
                      echo "Owner: <+pipeline.variables.owner>"
                      echo "Workspace: <+pipeline.variables.owner>_pov"
                      echo ""
                      if [ -f /harness/plan.json ]; then
                        echo "Resources to be destroyed before recreating:"
                        jq -r '.resource_changes[] | select(.change.actions | contains(["delete"])) | "  ✗ \(.type).\(.name)"' /harness/plan.json 2>/dev/null || echo "  (unable to parse plan)"
                      fi
              - step:
                  type: IACMApproval
                  name: Auto Approve Destroy
                  identifier: approve_destroy
                  spec:
                    autoApprove: true
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: MarkAsSuccess
              - step:
                  type: IACMTerraformPlugin
                  name: Destroy
                  identifier: destroy
                  timeout: 30m
                  spec:
                    command: destroy
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: Run
                  name: Destroy Complete
                  identifier: destroy_complete
                  spec:
                    shell: Bash
                    command: |
                      echo "✓ Existing POV destroyed via Terraform"
                      echo "Proceeding to delete workspace and recreate..."
    - stage:
        name: Delete Old Workspace
        identifier: delete_old_workspace
        description: Delete the IACM workspace after Terraform destroy or when state is stale
        type: Custom
        when:
