apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-pov-app
  labels:
    app: harness-pov-app
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harness-pov-app
  template:
    metadata:
      labels:
        app: harness-pov-app
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: harness-pov-app
          image: harness-pov-app:1.0.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: APP_ENVIRONMENT
              value: "production"
            - name: DEPLOYMENT_VARIANT
              value: "blue"
            - name: VARIANT_COLOR
              value: "#3B82F6"
            - name: CUSTOMER_NAME
              value: "Harness Customer"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CHAOS_ENABLED
              value: "true"
            - name: CHAOS_LATENCY_MS
              value: "0"
            - name: CHAOS_ERROR_RATE
              value: "0.0"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: harness-pov-app
  labels:
    app: harness-pov-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: harness-pov-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harness-pov-app
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: harness-pov.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harness-pov-app
                port:
                  number: 80
