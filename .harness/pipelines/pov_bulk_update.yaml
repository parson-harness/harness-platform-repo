pipeline:
  name: POV Bulk Update
  identifier: pov_bulk_update
  projectIdentifier: parson
  orgIdentifier: sandbox
  description: Trigger plan/apply style reconciliation on managed POV workspaces using owner/profile/target filters. Use this to push shared Terraform or template changes across existing demos and sandboxes.
  tags:
    pov: "true"
    iacm: "true"
    bulk: "true"
  allowStageExecutions: false
  variables:
    - name: harness_account_id
      type: String
      description: Harness Account ID
      required: true
      value: <+input>.default(<+account.identifier>)
    - name: harness_endpoint
      type: String
      description: Harness platform endpoint
      required: true
      value: <+input>.default(https://app.harness.io/gratis)
    - name: provisioner_api_key
      type: Secret
      description: SAT for IACM workspace management
      required: true
      value: acct-automation-svc-acct
    - name: template_id
      type: String
      description: Optional template-family scope. all targets all managed POV workspaces, POV_Provisioner scopes to EKS-linked workspaces, and Sandbox_Provisioner_ASG scopes to ASG-linked workspaces.
      required: false
      value: <+input>.default(all).allowedValues(all,POV_Provisioner,Sandbox_Provisioner_ASG)
    - name: owner_filter
      type: String
      description: Optional owner filter. Leave blank to target all matching managed workspaces.
      required: false
      value: <+input>
    - name: sandbox_profile_filter
      type: String
      description: Optional sandbox profile filter.
      required: false
      value: <+input>.default(all).allowedValues(all,se-demo,se-pov-sandbox,se-pov-ref-arch,se-workshop,manual)
    - name: deployment_target_filter
      type: String
      description: Optional deployment target filter.
      required: false
      value: <+input>.default(all).allowedValues(all,eks,asg)
    - name: action
      type: String
      description: Action label to perform on each workspace. Both modes trigger the provisioner workspace pipeline for reconciliation.
      required: true
      value: <+input>.default(apply).allowedValues(plan,apply)
    - name: dry_run
      type: String
      description: If true, only list workspaces without triggering pipelines
      required: false
      value: <+input>.default(false).allowedValues(true,false)
  stages:
    - stage:
        name: List Linked Workspaces
        identifier: list_workspaces
        description: Find all managed POV workspaces matching the requested filters
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Get Managed Workspaces
                  identifier: get_workspaces
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+org.identifier>/projects/<+project.identifier>/workspaces?accountIdentifier=<+pipeline.variables.harness_account_id>
                    method: GET
                    headers:
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    outputVariables:
                      - name: workspaces_json
                        value: <+httpResponseBody>
                        type: String
                      - name: workspace_count
                        value: <+json.select("length(@)", httpResponseBody)>
                        type: String
                    assertion: <+httpResponseCode> == 200
                  timeout: 1m
              - step:
                  type: ShellScript
                  name: Parse Workspace List
                  identifier: parse_workspaces
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail

                          echo "=== Managed POV Workspaces Matching Filters ==="
                          echo ""
                          WORKSPACES_JSON='<+execution.steps.get_workspaces.output.outputVariables.workspaces_json>'
                          ACCOUNT_ID="<+pipeline.variables.harness_account_id>"
                          ENDPOINT="<+pipeline.variables.harness_endpoint>"
                          ORG_ID="<+org.identifier>"
                          PROJECT_ID="<+project.identifier>"
                          API_KEY="<+pipeline.variables.provisioner_api_key>"
                          TEMPLATE_SCOPE="<+pipeline.variables.template_id>"
                          OWNER_FILTER="<+pipeline.variables.owner_filter>"
                          PROFILE_FILTER="<+pipeline.variables.sandbox_profile_filter>"
                          TARGET_FILTER="<+pipeline.variables.deployment_target_filter>"

                          case "$TEMPLATE_SCOPE" in
                            POV_Provisioner)
                              TEMPLATE_TARGET_FILTER="eks"
                              ;;
                            Sandbox_Provisioner_ASG)
                              TEMPLATE_TARGET_FILTER="asg"
                              ;;
                            *)
                              TEMPLATE_TARGET_FILTER="all"
                              ;;
                          esac

                          ALL_IDS=$(printf "%s" "$WORKSPACES_JSON" | python3 -c 'import sys,json; raw=sys.stdin.read(); data=json.loads(raw) if raw.strip() else []; items=data.get("content", []) if isinstance(data, dict) else data if isinstance(data, list) else []; print("\\n".join(item.get("identifier", "") for item in items if item.get("identifier")))')

                          FILTERED_IDS=""
                          WORKSPACE_REPORT=""

                          while IFS= read -r WS_ID; do
                            if [ -z "$WS_ID" ]; then
                              continue
                            fi

                            case "$WS_ID" in
                              *_pov|*_sandbox)
                                ;;
                              *)
                                continue
                                ;;
                            esac

                            WS_DETAILS=$(curl -s -X GET \
                              "${ENDPOINT}/iacm/api/orgs/${ORG_ID}/projects/${PROJECT_ID}/workspaces/${WS_ID}?accountIdentifier=${ACCOUNT_ID}" \
                              -H "x-api-key: ${API_KEY}" \
                              -H "Harness-Account: ${ACCOUNT_ID}" \
                              -H "Content-Type: application/json")

                            OWNER=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "owner") | .value // "unknown"' 2>/dev/null || echo "unknown")
                            PROFILE=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "sandbox_profile") | .value // "unknown"' 2>/dev/null || echo "unknown")
                            TARGET=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "deployment_target") | .value // "unknown"' 2>/dev/null || echo "unknown")
                            TTL_DAYS=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "ttl_days") | .value // "unknown"' 2>/dev/null || echo "unknown")

                            if [ -n "$OWNER_FILTER" ] && [ "$OWNER_FILTER" != "$OWNER" ]; then
                              continue
                            fi

                            if [ "$PROFILE_FILTER" != "all" ] && [ "$PROFILE_FILTER" != "$PROFILE" ]; then
                              continue
                            fi

                            if [ "$TARGET_FILTER" != "all" ] && [ "$TARGET_FILTER" != "$TARGET" ]; then
                              continue
                            fi

                            if [ "$TEMPLATE_TARGET_FILTER" != "all" ] && [ "$TEMPLATE_TARGET_FILTER" != "$TARGET" ]; then
                              continue
                            fi

                            if [ -n "$FILTERED_IDS" ]; then
                              FILTERED_IDS="${FILTERED_IDS},${WS_ID}"
                            else
                              FILTERED_IDS="$WS_ID"
                            fi

                            WORKSPACE_REPORT="${WORKSPACE_REPORT}- ${WS_ID} | owner=${OWNER} | profile=${PROFILE} | target=${TARGET} | ttl=${TTL_DAYS}\n"
                          done <<< "$ALL_IDS"

                          if [ -z "$FILTERED_IDS" ]; then
                            WORKSPACE_COUNT=0
                          else
                            WORKSPACE_COUNT=$(printf "%s" "$FILTERED_IDS" | tr ',' '\n' | grep -c . || true)
                          fi

                          echo "Template scope: $TEMPLATE_SCOPE"
                          echo "Owner filter: ${OWNER_FILTER:-<none>}"
                          echo "Profile filter: $PROFILE_FILTER"
                          echo "Target filter: $TARGET_FILTER"
                          echo ""
                          printf "%b" "$WORKSPACE_REPORT"
                          echo "Total: $WORKSPACE_COUNT workspace(s)"
                          
                          export WORKSPACE_IDS="$FILTERED_IDS"
                          export WORKSPACE_COUNT
                          export WORKSPACE_REPORT
                    environmentVariables: []
                    outputVariables:
                      - name: workspace_ids
                        type: String
                        value: WORKSPACE_IDS
                      - name: workspace_count
                        type: String
                        value: WORKSPACE_COUNT
                      - name: workspace_report
                        type: String
                        value: WORKSPACE_REPORT
                  timeout: 2m
    - stage:
        name: Update Workspaces
        identifier: update_workspaces
        description: Trigger plan/apply on each workspace
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.dry_run> == "false"
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Trigger Updates
                  identifier: trigger_updates
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -e
                          
                          HARNESS_ENDPOINT="<+pipeline.variables.harness_endpoint>"
                          ACCOUNT_ID="<+pipeline.variables.harness_account_id>"
                          ORG_ID="<+org.identifier>"
                          PROJECT_ID="<+project.identifier>"
                          API_KEY="<+pipeline.variables.provisioner_api_key>"
                          ACTION="<+pipeline.variables.action>"
                          WORKSPACE_IDS="<+stages.list_workspaces.spec.execution.steps.parse_workspaces.output.outputVariables.workspace_ids>"
                          
                          echo "=== POV Bulk Update ==="
                          echo "Action: $ACTION"
                          echo ""

                          if [ -z "$WORKSPACE_IDS" ]; then
                            echo "No workspaces found to update."
                            exit 0
                          fi
                          
                          # Determine pipeline to trigger based on action
                          if [ "$ACTION" == "apply" ]; then
                            PIPELINE_ID="pov_provisioning"
                          else
                            PIPELINE_ID="pov_provisioning"  # Same pipeline, just plan stage
                          fi
                          
                          SUCCESS_COUNT=0
                          FAIL_COUNT=0
                          
                          for WORKSPACE_ID in $(printf "%s" "$WORKSPACE_IDS" | tr ',' ' '); do
                            if [ -z "$WORKSPACE_ID" ]; then
                              continue
                            fi
                            
                            echo "----------------------------------------"
                            echo "Triggering $ACTION for workspace: $WORKSPACE_ID"
                            
                            # Trigger the provisioning pipeline for this workspace
                            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                              "$HARNESS_ENDPOINT/pipeline/api/pipeline/execute/$PIPELINE_ID?accountIdentifier=$ACCOUNT_ID&orgIdentifier=$ORG_ID&projectIdentifier=$PROJECT_ID&moduleType=IACM" \
                              -H "Content-Type: application/json" \
                              -H "x-api-key: $API_KEY" \
                              -d "{
                                \"workspaceId\": \"$WORKSPACE_ID\"
                              }")
                            
                            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                            BODY=$(echo "$RESPONSE" | head -n -1)
                            
                            if [ "$HTTP_CODE" == "200" ]; then
                              EXECUTION_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('data',{}).get('planExecution',{}).get('uuid',''))" 2>/dev/null || echo "")
                              echo "✓ Triggered successfully (execution: $EXECUTION_ID)"
                              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                            else
                              echo "✗ Failed to trigger (HTTP $HTTP_CODE)"
                              echo "  Response: $BODY"
                              FAIL_COUNT=$((FAIL_COUNT + 1))
                            fi
                          done
                          
                          echo ""
                          echo "=== Summary ==="
                          echo "Successful: $SUCCESS_COUNT"
                          echo "Failed: $FAIL_COUNT"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: Update Complete
                  identifier: update_complete
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=============================================="
                          echo "   POV Bulk Update Complete"
                          echo "=============================================="
                          echo ""
                          echo "Template: <+pipeline.variables.template_id>"
                          echo "Action: <+pipeline.variables.action>"
                          echo ""
                          echo "All matching managed workspaces have been triggered."
                          echo "Check individual workspace executions for status."
                          echo "=============================================="
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
    - stage:
        name: Dry Run Summary
        identifier: dry_run_summary
        description: Show what would be updated (dry run mode)
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.dry_run> == "true"
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Dry Run Report
                  identifier: dry_run_report
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=============================================="
                          echo "   POV Bulk Update - DRY RUN"
                          echo "=============================================="
                          echo ""
                          echo "Template: <+pipeline.variables.template_id>"
                          echo "Action: <+pipeline.variables.action>"
                          echo ""
                          echo "The following workspaces WOULD be updated:"
                          echo ""
                          printf "%b" "<+stages.list_workspaces.spec.execution.steps.parse_workspaces.output.outputVariables.workspace_report>"
                          echo ""
                          echo "Total: <+stages.list_workspaces.spec.execution.steps.parse_workspaces.output.outputVariables.workspace_count> workspace(s)"
                          
                          echo ""
                          echo "To actually trigger updates, run again with dry_run=false"
                          echo "=============================================="
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
