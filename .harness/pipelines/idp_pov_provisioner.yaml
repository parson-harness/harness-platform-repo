              - step:
                  type: Http
                  name: Update eks_cluster_name Variable
                  identifier: update_eks_cluster_name_var
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov/variables/tf/eks_cluster_name
                    method: PUT
                    headers:
                      - key: Content-Type
                        value: application/json
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    requestBody: |
                      {
                        "value": "<+pipeline.variables.eks_cluster_name>",
                        "value_type": "string"
                      }
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 201
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: ShellScript
                  name: Reconcile Workspace Variables
                  identifier: reconcile_workspace_variables
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail

                          WORKSPACE_ID="<+pipeline.variables.owner>_pov"
                          ACCOUNT_ID="<+pipeline.variables.harness_account_id>"
                          ENDPOINT="<+pipeline.variables.harness_endpoint>"
                          ORG_ID="<+pipeline.variables.harness_org_id>"
                          PROJECT_ID="<+pipeline.variables.harness_project_id>"
                          TARGET_API_KEY_EMAIL="<+pipeline.variables.target_api_key_email>"
                          DEPLOYMENT_TARGET="<+pipeline.variables.deployment_target>"
                          SOURCE_GITHUB_REPO="<+pipeline.variables.source_github_repo>"
                          EKS_CLUSTER_NAME="<+pipeline.variables.eks_cluster_name>"
                          WORKSPACE_TEMPLATE_ID=$([ "<+pipeline.variables.deployment_target>" = "asg" ] && echo "Sandbox_Provisioner_ASG" || echo "POV_Provisioner")
                          RESOLVED_PROFILE="<+execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_profile>"
                          RESOLVED_USE_HARNESS_CODE="true"
                          ASG_STARTUP_SCRIPT_USE_FILE_STORE="<+pipeline.variables.asg_startup_script_use_file_store>"
                          CREATE_HARNESS_ORG="<+pipeline.variables.create_harness_org>"
                          CREATE_HARNESS_PROJECT="<+pipeline.variables.create_harness_project>"
                          ARTIFACT_REGISTRY_TYPE="<+execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_artifact_registry_type>"
                          CREATE_DOCKERHUB_UPSTREAM="<+execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_create_dockerhub_upstream>"
                          CREATE_STRATEGY_PIPELINE="<+execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_create_strategy_pipeline>"
                          CREATE_STANDARD_CI_GRADLE="<+execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_create_standard_ci_gradle>"
                          CREATE_ASG_STRATEGY_PIPELINE="<+execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_create_asg_strategy_pipeline>"
                          CREATE_ASG_CI_PIPELINE="<+execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_create_asg_ci_pipeline>"
                          ENABLE_CHANGE_GOVERNANCE="<+pipeline.variables.enable_change_governance>"
                          ACM_CERT_ARN="<+pipeline.variables.acm_cert_arn>"
                          SHARED_ALB_DNS_NAME="<+pipeline.variables.shared_alb_dns_name>"
                          RESOLVED_SHARED_AWS_CONNECTOR_REF="<+execution.steps.resolve_shared_connector_refs.output.outputVariables.resolved_shared_aws_connector_ref>"
                          RESOLVED_SHARED_GITHUB_CONNECTOR_REF="<+execution.steps.resolve_shared_connector_refs.output.outputVariables.resolved_shared_github_connector_ref>"
                          CURRENT_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

                          WORKSPACE_DETAILS=$(curl -s \
                            -X GET "${ENDPOINT}/iacm/api/orgs/${ORG_ID}/projects/${PROJECT_ID}/workspaces/${WORKSPACE_ID}?accountIdentifier=${ACCOUNT_ID}" \
                            -H "Content-Type: application/json" \
                            -H "Harness-Account: ${ACCOUNT_ID}" \
                            -H "x-api-key: ${PROVISIONER_API_KEY}")

                          EXISTING_CREATED_AT=$(echo "$WORKSPACE_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "created_at") | .value // empty' 2>/dev/null || true)
                          EXISTING_TTL_DAYS=$(echo "$WORKSPACE_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "ttl_days") | .value // empty' 2>/dev/null || true)

                          if [ -n "$EXISTING_CREATED_AT" ] && [ "$EXISTING_CREATED_AT" != "null" ]; then
                            CREATED_AT_VALUE="$EXISTING_CREATED_AT"
                          else
                            CREATED_AT_VALUE="$CURRENT_TIMESTAMP"
                          fi

                          if [ -n "$EXISTING_TTL_DAYS" ] && [ "$EXISTING_TTL_DAYS" != "null" ]; then
                            TTL_DAYS_VALUE="$EXISTING_TTL_DAYS"
                          else
                            TTL_DAYS_VALUE="45"
                          fi

                          json_escape() {
                            local value="$1"
                            value=${value//\\/\\\\}
                            value=${value//"/\\"}
                            value=${value//$'\n'/\\n}
                            value=${value//$'\r'/\\r}
                            value=${value//$'\t'/\\t}
                            printf '%s' "$value"
                          }

                          build_payload() {
                            printf '{"value":"%s","value_type":"%s"}' "$(json_escape "$1")" "$(json_escape "$2")"
                          }

                          build_create_payload() {
                            printf '{"key":"%s","kind":"tf","value":"%s","value_type":"%s"}' "$(json_escape "$1")" "$(json_escape "$2")" "$(json_escape "$3")"
                          }

                          update_tf_var() {
                            local key="$1"
                            local value="$2"
                            local value_type="$3"
                            local payload
                            local create_payload
                            local status_code
                            local response_file

                            payload=$(build_payload "$value" "$value_type")
                            response_file=$(mktemp)

                            status_code=$(curl -s -o "$response_file" -w "%{http_code}" \
                              -X PUT "${ENDPOINT}/iacm/api/orgs/${ORG_ID}/projects/${PROJECT_ID}/workspaces/${WORKSPACE_ID}/variables/tf/${key}" \
                              -H "Content-Type: application/json" \
                              -H "Harness-Account: ${ACCOUNT_ID}" \
                              -H "x-api-key: ${PROVISIONER_API_KEY}" \
                              -d "$payload")

                            if [ "$status_code" = "404" ]; then
                              create_payload=$(build_create_payload "$key" "$value" "$value_type")

                              status_code=$(curl -s -o "$response_file" -w "%{http_code}" \
                                -X POST "${ENDPOINT}/iacm/api/orgs/${ORG_ID}/projects/${PROJECT_ID}/workspaces/${WORKSPACE_ID}/variables" \
                                -H "Content-Type: application/json" \
                                -H "Harness-Account: ${ACCOUNT_ID}" \
                                -H "x-api-key: ${PROVISIONER_API_KEY}" \
                                -d "$create_payload")
                            fi

                            if [ "$status_code" != "200" ] && [ "$status_code" != "201" ]; then
                              echo "Failed to upsert tf variable ${key} (HTTP ${status_code})"
                              cat "$response_file"
                              rm -f "$response_file"
                              exit 1
                            fi

                            rm -f "$response_file"
                          }

                          update_tf_var "owner" "<+pipeline.variables.owner>" "string"
                          update_tf_var "workspace_id" "$WORKSPACE_ID" "string"
                          update_tf_var "workspace_template_id" "$WORKSPACE_TEMPLATE_ID" "string"
                          update_tf_var "sandbox_profile" "$RESOLVED_PROFILE" "string"
                          update_tf_var "deployment_target" "$DEPLOYMENT_TARGET" "string"
                          update_tf_var "created_at" "$CREATED_AT_VALUE" "string"
                          update_tf_var "last_touched_at" "$CURRENT_TIMESTAMP" "string"
                          update_tf_var "ttl_days" "$TTL_DAYS_VALUE" "string"
                          update_tf_var "harness_account_id" "$ACCOUNT_ID" "string"
                          update_tf_var "harness_endpoint" "$ENDPOINT" "string"
                          update_tf_var "harness_api_key" "$TARGET_API_KEY" "string"
                          update_tf_var "harness_org_id" "$ORG_ID" "string"
                          update_tf_var "harness_project_id" "$PROJECT_ID" "string"
                          update_tf_var "create_harness_org" "$CREATE_HARNESS_ORG" "string"
                          update_tf_var "create_harness_project" "$CREATE_HARNESS_PROJECT" "string"
                          update_tf_var "aws_connector_ref" "$RESOLVED_SHARED_AWS_CONNECTOR_REF" "string"
                          update_tf_var "github_repo_name" "$SOURCE_GITHUB_REPO" "string"
                          update_tf_var "github_connector_ref" "$RESOLVED_SHARED_GITHUB_CONNECTOR_REF" "string"
                          update_tf_var "use_harness_code" "$RESOLVED_USE_HARNESS_CODE" "string"

                          if [ "$DEPLOYMENT_TARGET" = "asg" ]; then
