pipeline:
  projectIdentifier: parson
  orgIdentifier: sandbox
  tags:
    owner: toddfour
    security-scanning: enabled
    managed-by: provisioner
    build: gradle
    harness-intelligence: enabled
    standard-template: "true"
    workspace-id: toddfour_pov
    deployment-target: eks
    workspace-template-id: POV_Provisioner
    deployment-type: kubernetes
    strategy: multi-strategy
    tofu-managed: "true"
  variables:
    - name: auto_deploy
      type: String
      description: Automatically trigger CD pipeline after successful build
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: harness_endpoint
      type: String
      description: Harness API endpoint
      required: false
      value: <+input>.default(https://app.harness.io/gratis)
    - name: change_blast_radius
      type: String
      description: Expected blast radius for the release governance evaluation
      required: false
      value: <+input>.default(low).allowedValues(low,medium,high)
    - name: rollback_ready
      type: String
      description: Whether rollback readiness has been verified for release governance
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: open_change_failures
      type: String
      description: Demo-time count of unresolved change failures for release governance; typically sourced from ITSM in production
      required: false
      value: <+input>.default(0)
    - name: change_freeze_active
      type: String
      description: Whether a release freeze is active for this deployment
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: requires_data_migration
      type: String
      description: Whether the release includes a database or data migration
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: test_pass_rate
      type: String
      description: Aggregated automated test pass rate percentage; auto-populated from CI on webhook runs or entered manually for demo/manual runs
      required: false
      value: <+input>.default(100)
    - name: critical_vulnerabilities
      type: String
      description: Critical vulnerability count; auto-populated from CI on webhook runs or entered manually for demo/manual runs
      required: false
      value: <+input>.default(0)
    - name: high_vulnerabilities
      type: String
      description: High vulnerability count; auto-populated from CI on webhook runs or entered manually for demo/manual runs
      required: false
      value: <+input>.default(0)
    - name: release_candidate_evidence
      type: String
      description: JSON release-candidate evidence bundle; auto-populated from CI on webhook runs or entered manually for demo/manual runs
      required: false
      value: <+input>.default({"artifact":{"image":"manual-demo","tag":"manual"},"attestations":{"sbom":"unknown","slsa_provenance":"unknown"}})
  properties:
    ci:
      codebase:
        repoName: harness-demo-app
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build - Test - Scan - Push
        identifier: build_test_scan_push
        description: CI Intelligence + Security Scanning + Supply Chain
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
          sharedPaths:
            - /var/run
            - /harness/.gradle
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          buildIntelligence:
            enabled: true
          execution:
            steps:
              - step:
                  type: Gitleaks
                  name: Gitleaks Secret Scan
                  identifier: gitleaks
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      detection: auto
                    advanced:
                      log:
                        level: info
              - stepGroup:
                  name: Build and Test
                  identifier: build_and_test
                  steps:
                    - parallel:
                        - step:
                            type: Test
                            name: Test Intelligence
                            identifier: test_intelligence
                            spec:
                              command: gradle test --build-cache --profile
                              shell: Sh
                              connectorRef: account.harnessImage
                              image: gradle:8.5-jdk17
                              intelligenceMode: true
                        - step:
                            type: Run
                            name: Build Intelligence
                            identifier: build_intelligence
                            spec:
                              registryRef: har-docker-shared
                              image: gradle:8.5-jdk17
                              shell: Sh
                              command: |-
                                echo "=== GRADLE BUILD INTELLIGENCE ==="
                                gradle build -x test --build-cache --parallel --profile
                                echo "Build artifacts:"
                                ls -la build/libs/
              - step:
                  type: Run
                  name: Upload Code Coverage
                  identifier: upload_code_coverage
                  spec:
                    registryRef: har-docker-shared
                    image: gradle:8.5-jdk17
                    shell: Sh
                    command: |-
                      set -e
                      /tmp/harness/bin/auto-injection || true
                      $HARNESS_WORKSPACE/bi/auto-injection || true

                      echo "=== GENERATING CODE COVERAGE REPORT ==="
                      gradle clean test jacocoTestReport bootJar --no-build-cache --rerun-tasks

                      if ! ls build/test-results/test/*.xml >/dev/null 2>&1; then
                        echo "JUnit test reports not found at build/test-results/test/*.xml"
                        exit 1
                      fi

                      echo ""
                      echo "=== UPLOADING TEST REPORTS TO HARNESS ==="
                      hcli --verbose test-reports upload "build/test-results/test/*.xml"

                      COVERAGE_FILE="build/reports/jacoco/test/jacocoTestReport.xml"

                      if [ ! -s "$COVERAGE_FILE" ]; then
                        echo "Coverage report not found at $COVERAGE_FILE"
                        exit 1
                      fi

                      if [ "$COVERAGE_PROVIDER" = "github" ]; then
                        COVERAGE_OWNER="${COVERAGE_REPO_NAME%%/*}"
                        COVERAGE_IDENTIFIER="${COVERAGE_REPO_NAME##*/}"
                      else
                        COVERAGE_OWNER="$HARNESS_COVERAGE_OWNER"
                        COVERAGE_IDENTIFIER="$COVERAGE_REPO_NAME"
                      fi

                      mkdir -p jacoco
                      cp "$COVERAGE_FILE" jacoco/jacoco.xml
                      UPLOAD_COVERAGE_FILE="$(pwd)/jacoco/jacoco.xml"

                      echo ""
                      echo "=== COVERAGE FILE DETAILS ==="
                      ls -lah build/reports/jacoco/test || true
                      ls -lah jacoco || true
                      echo "=== JAR FILE DETAILS ==="
                      ls -lah build/libs || true
                      find build/libs -maxdepth 1 -name '*.jar' | sort || true
                      wc -c "$UPLOAD_COVERAGE_FILE" || true

                      hcli cov analyze --file "$UPLOAD_COVERAGE_FILE" || true

                      echo ""
                      echo "=== UPLOADING COVERAGE TO HARNESS ==="

                      hcli --verbose cov upload \
                        --file "$UPLOAD_COVERAGE_FILE" \
                        --provider "$COVERAGE_PROVIDER" \
                        --owner "$COVERAGE_OWNER" \
                        --identifier "$COVERAGE_IDENTIFIER" \
                        -- sh -c "test -s '$UPLOAD_COVERAGE_FILE'"

                      echo "Full report: build/reports/jacoco/test/html/index.html"
                    envVariables:
                      CI_ENABLE_HCLI_FOR_TESTS: "true"
                      CI_ENABLE_QUARANTINED_TEST_SKIP: "true"
              - stepGroup:
                  name: SAST Scans
                  identifier: sast_scans
                  steps:
                    - parallel:
                        - step:
                            type: HarnessSAST
                            name: Harness SAST
                            identifier: harness_sast
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: repository
                                detection: auto
                              advanced:
                                log:
                                  level: info
                        - step:
                            type: Semgrep
                            name: Semgrep
                            identifier: semgrep
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: repository
                                detection: auto
                              advanced:
                                log:
                                  level: info
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - AllErrors
                                  action:
                                    type: Ignore
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Push to HAR
                  identifier: push_to_har
                  spec:
                    repo: toddfourdemoapp
                    tags:
                      - 1.0.<+pipeline.sequenceId>
                      - latest
                    caching: true
                    labels:
                      org.opencontainers.image.title: toddfourdemoapp
                      org.opencontainers.image.version: 1.0.<+pipeline.sequenceId>
                      org.opencontainers.image.revision: <+codebase.commitSha>
                      org.opencontainers.image.source: <+codebase.repoUrl>
                      org.opencontainers.image.created: <+pipeline.startTs>
                      io.harness.pipeline.id: <+pipeline.identifier>
                      io.harness.pipeline.execution_id: <+pipeline.executionId>
                      io.harness.build.number: <+pipeline.sequenceId>
                      io.harness.supply_chain.sbom: spdx-json
                      io.harness.supply_chain.provenance: slsa
                    buildArgs:
                      JAR_PATH: build/libs/*.jar
                      BUILD_COMMIT_SHA: <+codebase.commitSha>
                      BUILD_REPO_URL: <+codebase.repoUrl>
                      IMAGE_TAG: 1.0.<+pipeline.sequenceId>
                      PIPELINE_EXECUTION_ID: <+pipeline.executionId>
                      PIPELINE_ID: <+pipeline.identifier>
                      BUILD_TIMESTAMP: <+pipeline.startTs>
                      BASE_IMAGE_REGISTRY: pkg.harness.io/eerjnxtns4grlg5vnnjzuw/har-toddfour
                    optimize: true
                    registryRef: har-docker-shared
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 2
                            retryIntervals:
                              - 2m
                            onRetryFailure:
                              action:
                                type: Abort
              - stepGroup:
                  name: Supply Chain Security
                  identifier: supply_chain_security
                  steps:
                    - step:
                        type: SscaOrchestration
                        name: SBOM Generation
                        identifier: sbom_generation
                        spec:
                          mode: generation
                          tool:
                            type: Syft
                            spec:
                              format: spdx-json
                          source:
                            type: har
                            spec:
                              registry: har-docker-shared
                              image: toddfourdemoapp:1.0.<+pipeline.sequenceId>
                          sbom_drift:
                            base: last_generated_sbom
                          resources:
                            limits:
                              memory: 500Mi
                              cpu: "0.5"
                    - step:
                        type: provenance
                        name: SLSA Provenance
                        identifier: slsa_provenance
                        spec:
                          source:
                            type: har
                            spec:
                              registry: har-docker-shared
                              image: toddfourdemoapp:1.0.<+pipeline.sequenceId>
              - stepGroup:
                  name: Container Scans
                  identifier: container_scans
                  steps:
                    - parallel:
                        - step:
                            type: HarnessSCA
                            name: Harness SCA
                            identifier: harness_sca
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: container
                                detection: auto
                              advanced:
                                log:
                                  level: info
                              privileged: true
                              image:
                                type: harness
                                tag: 1.0.<+pipeline.sequenceId>
                                registry: har-docker-shared
                                image_path: toddfourdemoapp:1.0.<+pipeline.sequenceId>
                            when:
                              stageStatus: Success
                              condition: "\"true\" == \"false\""
                        - step:
                            type: AquaTrivy
                            name: Aqua Trivy
                            identifier: aqua_trivy
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: container
                                detection: auto
                              advanced:
                                log:
                                  level: info
                                args:
                                  cli: "--scanners vuln"
                              privileged: false
                              image:
                                type: harness
                                registry: har-docker-shared
                                image_path: toddfourdemoapp:1.0.<+pipeline.sequenceId>
                              sbom:
                                format: spdx-json
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - AllErrors
                                  action:
                                    type: Ignore
              - step:
                  type: Run
                  name: Prepare Governance Inputs
                  identifier: prepare_governance_inputs
                  spec:
                    shell: Sh
                    command: |-
                      TEST_PASS_RATE=100
                      if ls build/test-results/test/*.xml >/dev/null 2>&1; then
                        TOTAL_TESTS=0
                        TOTAL_FAILURES=0
                        TOTAL_ERRORS=0

                        for REPORT in build/test-results/test/*.xml; do
                          TESTS=$(grep -o 'tests="[0-9][0-9]*"' "$REPORT" | head -n1 | cut -d'"' -f2)
                          FAILURES=$(grep -o 'failures="[0-9][0-9]*"' "$REPORT" | head -n1 | cut -d'"' -f2)
                          ERRORS=$(grep -o 'errors="[0-9][0-9]*"' "$REPORT" | head -n1 | cut -d'"' -f2)

                          TOTAL_TESTS=$((TOTAL_TESTS + ${TESTS:-0}))
                          TOTAL_FAILURES=$((TOTAL_FAILURES + ${FAILURES:-0}))
                          TOTAL_ERRORS=$((TOTAL_ERRORS + ${ERRORS:-0}))
                        done

                        if [ "$TOTAL_TESTS" -gt 0 ]; then
                          PASSED_TESTS=$((TOTAL_TESTS - TOTAL_FAILURES - TOTAL_ERRORS))
                          TEST_PASS_RATE=$((PASSED_TESTS * 100 / TOTAL_TESTS))
                        fi
                      fi

                      CRITICAL_VULNERABILITIES="${TRIVY_CRITICAL:-0}"
                      HIGH_VULNERABILITIES="${TRIVY_HIGH:-0}"
                      CHANGE_BLAST_RADIUS="${CHANGE_BLAST_RADIUS_INPUT:-low}"
                      ROLLBACK_READY="${ROLLBACK_READY_INPUT:-true}"
                      OPEN_CHANGE_FAILURES="${OPEN_CHANGE_FAILURES_INPUT:-0}"
                      CHANGE_FREEZE_ACTIVE="${CHANGE_FREEZE_ACTIVE_INPUT:-false}"
                      REQUIRES_DATA_MIGRATION="${REQUIRES_DATA_MIGRATION_INPUT:-false}"
                      AUTO_DEPLOY="${AUTO_DEPLOY_INPUT:-true}"
                      COMMIT_SHA="${COMMIT_SHA_INPUT}"
                      BRANCH_NAME="${BRANCH_NAME_INPUT}"
                      REPO_URL="${REPO_URL_INPUT}"

                      export TEST_PASS_RATE
                      export CRITICAL_VULNERABILITIES
                      export HIGH_VULNERABILITIES
                      export CHANGE_BLAST_RADIUS
                      export ROLLBACK_READY
                      export OPEN_CHANGE_FAILURES
                      export CHANGE_FREEZE_ACTIVE
                      export REQUIRES_DATA_MIGRATION
                      export AUTO_DEPLOY
                      export COMMIT_SHA
                      export BRANCH_NAME
                      export REPO_URL

                      echo "Computed test pass rate: $TEST_PASS_RATE%"
                      echo "Computed critical vulnerabilities: $CRITICAL_VULNERABILITIES"
                      echo "Computed high vulnerabilities: $HIGH_VULNERABILITIES"
                    envVariables:
                      TRIVY_CRITICAL: <+pipeline.stages.build_test_scan_push.spec.execution.steps.container_scans.steps.aqua_trivy.output.outputVariables.CRITICAL>
                      TRIVY_HIGH: <+pipeline.stages.build_test_scan_push.spec.execution.steps.container_scans.steps.aqua_trivy.output.outputVariables.HIGH>
                      CHANGE_BLAST_RADIUS_INPUT: <+pipeline.variables.change_blast_radius>
                      ROLLBACK_READY_INPUT: <+pipeline.variables.rollback_ready>
                      OPEN_CHANGE_FAILURES_INPUT: <+pipeline.variables.open_change_failures>
                      CHANGE_FREEZE_ACTIVE_INPUT: <+pipeline.variables.change_freeze_active>
                      REQUIRES_DATA_MIGRATION_INPUT: <+pipeline.variables.requires_data_migration>
                      AUTO_DEPLOY_INPUT: <+pipeline.variables.auto_deploy>
                      COMMIT_SHA_INPUT: <+codebase.commitSha>
                      BRANCH_NAME_INPUT: <+codebase.branch>
                      REPO_URL_INPUT: <+codebase.repoUrl>
                    outputVariables:
                      - name: TEST_PASS_RATE
                        type: String
                        value: TEST_PASS_RATE
                      - name: CRITICAL_VULNERABILITIES
                        type: String
                        value: CRITICAL_VULNERABILITIES
                      - name: HIGH_VULNERABILITIES
                        type: String
                        value: HIGH_VULNERABILITIES
                      - name: CHANGE_BLAST_RADIUS
                        type: String
                        value: CHANGE_BLAST_RADIUS
                      - name: ROLLBACK_READY
                        type: String
                        value: ROLLBACK_READY
                      - name: OPEN_CHANGE_FAILURES
                        type: String
                        value: OPEN_CHANGE_FAILURES
                      - name: CHANGE_FREEZE_ACTIVE
                        type: String
                        value: CHANGE_FREEZE_ACTIVE
                      - name: REQUIRES_DATA_MIGRATION
                        type: String
                        value: REQUIRES_DATA_MIGRATION
                      - name: AUTO_DEPLOY
                        type: String
                        value: AUTO_DEPLOY
                      - name: COMMIT_SHA
                        type: String
                        value: COMMIT_SHA
                      - name: BRANCH_NAME
                        type: String
                        value: BRANCH_NAME
                      - name: REPO_URL
                        type: String
                        value: REPO_URL
              - step:
                  type: Run
                  name: Assemble Release Candidate Evidence
                  identifier: assemble_release_candidate_evidence
                  spec:
                    shell: Sh
                    command: |
                      SERVICE_NAME="toddfour_demo_app"
                      IMAGE_NAME="toddfourdemoapp"
                      IMAGE_TAG="1.0.<+pipeline.sequenceId>"
                      IMAGE_PATH="$IMAGE_NAME"
                      ARTIFACT="$IMAGE_PATH:$IMAGE_TAG"
                      IMAGE_REFERENCE="$ARTIFACT"
                      RELEASE_EVIDENCE_JSON=$(printf '{"artifact":{"service":"%s","image":"%s","tag":"%s","commit":"%s","branch":"%s","repository":"%s"},"build":{"pipeline_identifier":"%s","execution_id":"%s","sequence_id":"%s"},"attestations":{"sbom":"spdx-json","slsa_provenance":"generated"},"governance_inputs":{"test_pass_rate":%s,"critical_vulnerabilities":%s,"high_vulnerabilities":%s,"change_blast_radius":"%s","rollback_ready":"%s","open_change_failures":"%s","change_freeze_active":"%s","requires_data_migration":"%s"}}' \
                        "$SERVICE_NAME" \
                        "$IMAGE_REFERENCE" \
                        "$IMAGE_TAG" \
                        "$COMMIT_SHA" \
                        "$BRANCH_NAME" \
                        "$REPO_URL" \
                        "<+pipeline.identifier>" \
                        "<+pipeline.executionId>" \
                        "<+pipeline.sequenceId>" \
                        "$TEST_PASS_RATE" \
                        "$CRITICAL_VULNERABILITIES" \
                        "$HIGH_VULNERABILITIES" \
                        "$CHANGE_BLAST_RADIUS" \
                        "$ROLLBACK_READY" \
                        "$OPEN_CHANGE_FAILURES" \
                        "$CHANGE_FREEZE_ACTIVE" \
                        "$REQUIRES_DATA_MIGRATION")

                      export SERVICE_NAME
                      export IMAGE_NAME
                      export IMAGE_TAG
                      export IMAGE_PATH
                      export ARTIFACT
                      export IMAGE_REFERENCE
                      export RELEASE_EVIDENCE_JSON

                      echo "Release candidate service: $SERVICE_NAME"
                      echo "Release candidate artifact: $IMAGE_REFERENCE"
                      echo "$RELEASE_EVIDENCE_JSON"
                    envVariables:
                      TEST_PASS_RATE: <+execution.steps.prepare_governance_inputs.output.outputVariables.TEST_PASS_RATE>
                      CRITICAL_VULNERABILITIES: <+execution.steps.prepare_governance_inputs.output.outputVariables.CRITICAL_VULNERABILITIES>
                      HIGH_VULNERABILITIES: <+execution.steps.prepare_governance_inputs.output.outputVariables.HIGH_VULNERABILITIES>
                      CHANGE_BLAST_RADIUS: <+execution.steps.prepare_governance_inputs.output.outputVariables.CHANGE_BLAST_RADIUS>
                      ROLLBACK_READY: <+execution.steps.prepare_governance_inputs.output.outputVariables.ROLLBACK_READY>
                      OPEN_CHANGE_FAILURES: <+execution.steps.prepare_governance_inputs.output.outputVariables.OPEN_CHANGE_FAILURES>
                      CHANGE_FREEZE_ACTIVE: <+execution.steps.prepare_governance_inputs.output.outputVariables.CHANGE_FREEZE_ACTIVE>
                      REQUIRES_DATA_MIGRATION: <+execution.steps.prepare_governance_inputs.output.outputVariables.REQUIRES_DATA_MIGRATION>
                      COMMIT_SHA: <+execution.steps.prepare_governance_inputs.output.outputVariables.COMMIT_SHA>
                      BRANCH_NAME: <+execution.steps.prepare_governance_inputs.output.outputVariables.BRANCH_NAME>
                      REPO_URL: <+execution.steps.prepare_governance_inputs.output.outputVariables.REPO_URL>
                    outputVariables:
                      - name: SERVICE_NAME
                        type: String
                        value: SERVICE_NAME
                      - name: IMAGE_NAME
                        type: String
                        value: IMAGE_NAME
                      - name: IMAGE_TAG
                        type: String
                        value: IMAGE_TAG
                      - name: IMAGE_PATH
                        type: String
                        value: IMAGE_PATH
                      - name: ARTIFACT
                        type: String
                        value: ARTIFACT
                      - name: IMAGE_REFERENCE
                        type: String
                        value: IMAGE_REFERENCE
                      - name: RELEASE_EVIDENCE_JSON
                        type: String
                        value: RELEASE_EVIDENCE_JSON
              - step:
                  type: Run
                  name: Build Summary
                  identifier: build_summary
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== BUILD SUMMARY ==="
                      echo "Pipeline: <+pipeline.name>"
                      echo "Build Number: <+pipeline.sequenceId>"
                      echo "Commit: <+execution.steps.prepare_governance_inputs.output.outputVariables.COMMIT_SHA>"
                      echo "Branch: <+execution.steps.prepare_governance_inputs.output.outputVariables.BRANCH_NAME>"
                      echo "Artifact: <+execution.steps.assemble_release_candidate_evidence.output.outputVariables.ARTIFACT>"
                      echo "Image Tag: <+execution.steps.assemble_release_candidate_evidence.output.outputVariables.IMAGE_TAG>"
                      echo ""
                      echo "=== HARNESS CI INTELLIGENCE FEATURES ==="
                      echo "- Test Intelligence: Runs only affected tests"
                      echo "- Test Splitting: Parallelizes test execution"
                      echo "- Build Intelligence: Caches compiled classes"
                      echo "- Cache Intelligence: Auto-caches dependencies"
                      echo "- Docker Layer Caching: Reuses image layers"
                      echo ""
                      echo "=== SECURITY SCANNING ==="
                      echo "- Gitleaks: Secret detection"
                      echo "- Harness SAST: Static analysis"
                      echo "- Semgrep: Code patterns"
                      echo "- Harness SCA: Configured but temporarily skipped"
                      echo "- Aqua Trivy: Container vulnerabilities"
                      echo ""
                      echo "=== SUPPLY CHAIN SECURITY ==="
                      echo "- SBOM Generation: SPDX-JSON format"
                      echo "- SLSA Provenance: Build attestation"
                      echo "- OCI Image Metadata: Commit, source, version, and Harness execution labels embedded in image"
                      echo "- Release Candidate Evidence: <+execution.steps.assemble_release_candidate_evidence.output.outputVariables.IMAGE_REFERENCE>"
                      echo "- Evidence Bundle: <+execution.steps.assemble_release_candidate_evidence.output.outputVariables.RELEASE_EVIDENCE_JSON>"
                      echo ""
                      echo "=== GOVERNANCE INPUTS ==="
                      echo "- Test Pass Rate: <+execution.steps.prepare_governance_inputs.output.outputVariables.TEST_PASS_RATE>%"
                      echo "- Critical Vulnerabilities: <+execution.steps.prepare_governance_inputs.output.outputVariables.CRITICAL_VULNERABILITIES>"
                      echo "- High Vulnerabilities: <+execution.steps.prepare_governance_inputs.output.outputVariables.HIGH_VULNERABILITIES>"
                      echo "- Blast Radius: <+execution.steps.prepare_governance_inputs.output.outputVariables.CHANGE_BLAST_RADIUS>"
                      echo "- Rollback Ready: <+execution.steps.prepare_governance_inputs.output.outputVariables.ROLLBACK_READY>"
                      echo "- Open Change Failures: <+execution.steps.prepare_governance_inputs.output.outputVariables.OPEN_CHANGE_FAILURES>"
                      echo "- Change Freeze Active: <+execution.steps.prepare_governance_inputs.output.outputVariables.CHANGE_FREEZE_ACTIVE>"
                      echo "- Requires Data Migration: <+execution.steps.prepare_governance_inputs.output.outputVariables.REQUIRES_DATA_MIGRATION>"
                      echo "- Auto-deploy: <+execution.steps.prepare_governance_inputs.output.outputVariables.AUTO_DEPLOY>"
              - step:
                  type: Run
                  name: Prepare Artifact Links
                  identifier: prepare_artifact_links
                  spec:
                    shell: Sh
                    command: |
                      HARNESS_UI_BASE="$HARNESS_ENDPOINT"
                      HARNESS_UI_BASE="${HARNESS_UI_BASE%/gratis}"
                      HARNESS_UI_BASE="${HARNESS_UI_BASE%/}"
                      ACCOUNT_SLUG=$(echo "$ACCOUNT_ID" | tr '[:upper:]' '[:lower:]')

                      PUBLISHED_IMAGE_URL="https://pkg.harness.io/$ACCOUNT_SLUG/$HAR_REGISTRY_REF/$HAR_IMAGE_NAME:$IMAGE_TAG"
                      BUILD_EXECUTION_URL="$HARNESS_UI_BASE/ng/account/$ACCOUNT_ID/all/orgs/$ORG_ID/projects/$PROJECT_ID/pipelines/$PIPELINE_ID/executions/$PIPELINE_EXECUTION_ID/pipeline?storeType=INLINE"

                      export PUBLISHED_IMAGE_URL
                      export BUILD_EXECUTION_URL

                      echo "Published image URL: $PUBLISHED_IMAGE_URL"
                      echo "Build execution URL: $BUILD_EXECUTION_URL"
                    envVariables:
                      HAR_IMAGE_NAME: <+execution.steps.assemble_release_candidate_evidence.output.outputVariables.IMAGE_NAME>
                      HAR_REGISTRY_REF: har-toddfour
                      IMAGE_TAG: <+execution.steps.assemble_release_candidate_evidence.output.outputVariables.IMAGE_TAG>
                      HARNESS_ENDPOINT: <+pipeline.variables.harness_endpoint>
                      ACCOUNT_ID: <+account.identifier>
                      ORG_ID: <+org.identifier>
                      PROJECT_ID: <+project.identifier>
                      PIPELINE_ID: <+pipeline.identifier>
                      PIPELINE_EXECUTION_ID: <+pipeline.executionId>
                    outputVariables:
                      - name: PUBLISHED_IMAGE_URL
                        type: String
                        value: PUBLISHED_IMAGE_URL
                      - name: BUILD_EXECUTION_URL
                        type: String
                        value: BUILD_EXECUTION_URL
              - step:
                  type: Plugin
                  name: Publish Artifact Links
                  identifier: publish_artifact_links
                  spec:
                    registryRef: har-docker-shared
                    image: plugins/artifact-metadata-publisher
                    settings:
                      artifact_file: artifact-links.txt
                      file_urls:
                        - Published Image:::<+execution.steps.prepare_artifact_links.output.outputVariables.PUBLISHED_IMAGE_URL>
                        - Build Execution:::<+execution.steps.prepare_artifact_links.output.outputVariables.BUILD_EXECUTION_URL>
              - step:
                  type: Run
                  name: Trigger CD Pipeline
                  identifier: trigger_cd
                  spec:
                    shell: Sh
                    command: |-
                      # if [ "$AUTO_DEPLOY" = "true" ]; then
                        echo "=== AUTO-DEPLOYING TO DEV (Canary Strategy) ==="
                        echo "Triggering deployment with image tag: $IMAGE_TAG"
                        echo "Using test pass rate: $TEST_PASS_RATE%"
                        echo "Using critical vulnerabilities: $CRITICAL_VULNERABILITIES"
