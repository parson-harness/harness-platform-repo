apiVersion: harness.io/v1
kind: Workflow
name: SE Sandbox Provisioner
identifier: se_sandbox_provisioner
type: workflow
scope: project
projectIdentifier: parson
orgIdentifier: sandbox
owner: todd.parson@harness.io
metadata:
  description: |
    Quick provisioning for standardized SE sandbox environments in the Harness demo account.
    
    What gets created:
    - Shared-cluster EKS sandbox resources for `eks` targets
    - Fully self-contained ASG sandbox resources for `asg` targets
    - Harness pipelines, services, environments, and application delivery resources
    - Harness Code and artifact delivery setup driven by the selected sandbox profile
    
    Prerequisites:
    - Access to sandbox org (you're already here!)
  tags:
    - se-sandbox
    - iacm
    - self-service
    - same-account
spec:
  presentation:
    customTitle: SE Sandbox
    customSubTitle: Create a profile-driven demo environment in this Harness account with shared EKS or self-contained ASG defaults
    customCreateButtonText: Provision Sandbox
  
  output:
    links:
      - title: Pipeline Execution
        url: ${{ steps.trigger.output.PipelineUrl }}
      - title: EKS App URL
        url: http://${{ parameters.owner }}.harness-demo.dev
      - title: ASG App URL
        url: https://${{ parameters.owner }}-asg.harness-demo.dev
      - title: Project Pipelines
        url: https://app.harness.io/ng/account/<+account.identifier>/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/pipelines
      - title: Project Services
        url: https://app.harness.io/ng/account/<+account.identifier>/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/services
      - title: Artifact Registry
        url: https://app.harness.io/ng/account/<+account.identifier>/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/artifacts
  
  lifecycle: production
  
  parameters:
    - title: Sandbox Identity
      required:
        - owner
      properties:
        owner:
          title: Sandbox Owner
          type: string
          description: "Your name (lowercase, alphanumeric). Used for resource naming (e.g., 'todd' creates 'todd_pov' workspace)"
          pattern: "^[a-z][a-z0-9]*$"
          ui:help: "Must start with a letter, lowercase alphanumeric only"
        
        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken
    
    - title: Target Location
      required:
        - harness_org_id
        - harness_project_id
      properties:
        harness_org_id:
          title: Organization
          type: string
          description: "Select the organization for your sandbox"
          default: sandbox
          ui:field: HarnessOrgPicker
        
        harness_project_id:
          title: Project
          type: string
          description: "Select the project for your sandbox"
          default: parson
          ui:field: HarnessProjectPicker
    
    - title: Infrastructure Options
      properties:
        deployment_target:
          title: Deployment Target
          type: string
          description: "Use eks for shared-cluster sandboxes and asg for fully self-contained POV environments"
          enum:
            - eks
            - asg
          default: eks

        sandbox_profile:
          title: Sandbox Profile
          type: string
          description: "Recommended profile for this sandbox. Use se-demo for the full demo path, se-pov-sandbox for iterative shared-account POV work, se-pov-ref-arch for a portable reference baseline, and se-workshop for a simplified hands-on flow"
          default: se-demo
          enum:
            - se-demo
            - se-pov-sandbox
            - se-pov-ref-arch
            - se-workshop

        eks_cluster_name:
          title: EKS Cluster Name
          type: string
          description: "Name of the shared EKS cluster used when deployment_target is eks"
          default: "harness-eks-parson"

    - title: Advanced Options
      properties:
        create_opa_policies:
          title: Create OPA Policies?
          type: string
          description: "Create or reuse the project-scoped governance workspace and enable policy-driven deployment governance for this sandbox. Default true so project-level OPA assets are bootstrapped once per project."
          default: "true"
          enum:
            - "true"
            - "false"
        create_project_factory:
          title: Create Project Factory?
          type: string
          description: "Create or reuse the project-scoped factory workspace for shared AWS and GitHub connectors. Leave false to keep connector ownership inside the workload workspace."
          default: "false"
          enum:
            - "true"
            - "false"
        project_factory_github_token_ref:
          title: Shared GitHub Token Ref
          type: string
          description: "Optional Harness secret reference for the project-scoped shared GitHub connector (for example account.github_pat). Leave empty to skip shared GitHub connector creation."
          default: ""

  steps:
    - id: trigger
      name: Provisioning SE Sandbox
      action: trigger:harness-custom-pipeline
      input:
        url: "https://app.harness.io/ng/account/EeRjnXTnS4GrLG5VNNJZUw/all/orgs/sandbox/projects/parson/pipelines/idp_pov_provisioner/pipeline-studio/?storeType=REMOTE&connectorRef=parsongh&repoName=harness-demo-app&branch=main"
        inputset:
          owner: ${{ parameters.owner }}
          harness_account_id: <+account.identifier>
          harness_endpoint: "https://app.harness.io/gratis"
          harness_org_id: ${{ parameters.harness_org_id }}
          harness_project_id: ${{ parameters.harness_project_id }}
          deployment_target: ${{ parameters.deployment_target }}
          sandbox_profile: ${{ parameters.sandbox_profile }}
          use_profile_defaults: "true"
          eks_cluster_name: ${{ parameters.eks_cluster_name }}
          create_opa_policies: ${{ parameters.create_opa_policies }}
          create_project_factory: ${{ parameters.create_project_factory }}
          project_factory_github_token_ref: ${{ parameters.project_factory_github_token_ref }}
        apikey: ${{ parameters.token }}
