template:
  name: Sandbox Provisioner ASG
  identifier: Sandbox_Provisioner_ASG
  projectIdentifier: parson
  orgIdentifier: sandbox
  versionLabel: "1.0"
  type: Workspace
  tags: {}
  spec:
    provider:
      type: others
      title: thirdPartyGitProvider
      info: thirdPartyGitProviderInfo
      icon: service-github
      size: 20
      disabled: false
    tags: []
    cost_estimation:
      enabled: false
      locked: false
    default_pipelines:
      plan: pov_provisioning
      apply: pov_provisioning
      destroy: pov_destroy
      drift: pov_provisioning
      locked: true
    provisioner:
      type: opentofu
      version: 1.11.2
      connector: aws_oidc_iacm
      locked: true
    provider_connectors:
      - connector_ref: aws_oidc_iacm
        type: aws
        locked: true
    repository:
      isHarnessCode: false
      connector: parsongh
      name: harness-demo-app
      branch: main
      gitFetchType: branch
      path: tofu/stacks/asg
      locked: true
    variables: []
    terraform_variables:
      - key: owner
        value: <+pipeline.variables.owner>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: workspace_template_id
        value: Sandbox_Provisioner_ASG
        value_type: string
        status: manual
        locked: true
        type: String
      - key: harness_account_id
