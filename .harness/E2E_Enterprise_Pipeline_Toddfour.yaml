pipeline:
  projectIdentifier: parson
  orgIdentifier: sandbox
  tags:
    owner: toddfour
    security-scanning: enabled
    managed-by: provisioner
    build: gradle
    harness-intelligence: enabled
    standard-template: "true"
    workspace-id: toddfour_pov
    deployment-target: eks
    workspace-template-id: POV_Provisioner
    deployment-type: kubernetes
    strategy: multi-strategy
    tofu-managed: "true"
  variables:
    - name: auto_deploy
      type: String
      description: Automatically trigger CD pipeline after successful build
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: qa_playwright_image
      type: String
      description: Container image used for the QA Playwright smoke tests; point this at the dedicated runner image when it is published
      required: false
      value: <+input>.default(har-docker-shared/custom-runner:latest)
    - name: qa_playwright_image_connector_ref
      type: String
      description: Connector reference used to pull the QA Playwright runner image
      required: false
      value: <+input>.default(dockershared)
    - name: harness_code_api_key
      type: Secret
      description: Harness API key used to post QA smoke summaries to Harness Code pull requests in harness-demo-app
      required: false
      value: acct-automation-svc-acct
    - name: trigger_cv_chaos
      type: String
      description: Trigger the demo chaos endpoint during production canary verification
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: cv_duration
      type: String
      description: Continuous Verification duration for the production canary stage
      required: false
      value: <+input>.default(5m)
    - name: cv_sensitivity
      type: String
      description: Continuous Verification sensitivity for the production canary stage
      required: false
      value: <+input>.default(HIGH).allowedValues(HIGH,MEDIUM,LOW)
    - name: harness_endpoint
      type: String
      description: Harness API endpoint
      required: false
      value: <+input>.default(https://app.harness.io/gratis)
    - name: change_blast_radius
      type: String
      description: Expected blast radius for the release governance evaluation
      required: false
      value: <+input>.default(low).allowedValues(low,medium,high)
    - name: rollback_ready
      type: String
      description: Whether rollback readiness has been verified for release governance
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: open_change_failures
      type: String
      description: Demo-time count of unresolved change failures for release governance; typically sourced from ITSM in production
      required: false
      value: <+input>.default(0)
    - name: change_freeze_active
      type: String
      description: Whether a release freeze is active for this deployment
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: requires_data_migration
      type: String
      description: Whether the release includes a database or data migration
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: dynamic_config_profile
      type: String
      description: Shared application-level dynamic configuration profile injected into the deployed workload
      required: false
      value: <+input>.default(shared-base)
    - name: dynamic_config_tenant
      type: String
      description: Shared tenant-level dynamic configuration value used across QA and Prod
      required: false
      value: <+input>.default(toddfour)
    - name: dynamic_config_support_contact
      type: String
      description: Shared support contact exposed through the deployed workload configuration
      required: false
      value: <+input>.default(platform@harness.io)
  properties:
    ci:
      codebase:
        repoName: harness-demo-app
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build - Test - Scan - Push
        identifier: build_test_scan_push
        description: CI Intelligence + Security Scanning + Supply Chain
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
          sharedPaths:
            - /var/run
            - /harness/.gradle
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          buildIntelligence:
            enabled: true
          execution:
            steps:
              - step:
                  type: Gitleaks
                  name: Gitleaks Secret Scan
                  identifier: gitleaks
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      detection: auto
                    advanced:
                      log:
                        level: info
              - stepGroup:
                  name: Build and Test
                  identifier: build_and_test
                  steps:
                    - parallel:
                        - step:
                            type: Test
                            name: Test Intelligence
                            identifier: test_intelligence
                            spec:
                              connectorRef: account.harnessImage
                              image: gradle:8.5-jdk17
                              shell: Sh
                              command: gradle test --build-cache --profile
                              reports:
                                type: JUnit
                                spec:
                                  paths:
                                    - build/test-results/test/*.xml
                              intelligenceMode: true
                        - step:
                            type: Run
                            name: Build Intelligence
                            identifier: build_intelligence
                            spec:
                              registryRef: har-docker-shared
                              image: gradle:8.5-jdk17
                              shell: Sh
                              command: |-
                                echo "=== GRADLE BUILD INTELLIGENCE ==="
                                gradle build -x test --build-cache --parallel --profile
                                echo "Build artifacts:"
                                ls -la build/libs/
              - step:
                  type: Run
                  name: Upload Code Coverage
                  identifier: upload_code_coverage
                  spec:
                    registryRef: har-docker-shared
                    image: gradle:8.5-jdk17
                    shell: Sh
                    command: |-
                      set -e
                      /tmp/harness/bin/auto-injection || true
                      $HARNESS_WORKSPACE/bi/auto-injection || true

                      echo "=== VERIFYING TEST AND COVERAGE ARTIFACTS ==="
                      echo "Using reports generated by the Test Intelligence and Build Intelligence steps"

                      if ! ls build/test-results/test/*.xml >/dev/null 2>&1; then
                        echo "JUnit test reports not found at build/test-results/test/*.xml"
                        exit 1
                      fi

                      echo ""
                      echo "=== TEST REPORTS ARE PUBLISHED BY THE TI V2 TEST STEP ==="

                      COVERAGE_FILE="build/reports/jacoco/test/jacocoTestReport.xml"

                      if [ ! -s "$COVERAGE_FILE" ]; then
                        echo "Coverage report not found at $COVERAGE_FILE"
                        exit 1
                      fi

                      if ! find build/libs -maxdepth 1 -name '*.jar' | grep -q .; then
                        echo "Jar artifacts not found at build/libs"
                        exit 1
                      fi

                      if [ "$COVERAGE_PROVIDER" = "github" ]; then
                        COVERAGE_OWNER="${COVERAGE_REPO_NAME%%/*}"
                        COVERAGE_IDENTIFIER="${COVERAGE_REPO_NAME##*/}"
                      else
                        COVERAGE_OWNER="$HARNESS_COVERAGE_OWNER"
                        COVERAGE_IDENTIFIER="$COVERAGE_REPO_NAME"
                      fi

                      mkdir -p jacoco
                      cp "$COVERAGE_FILE" jacoco/jacoco.xml
                      UPLOAD_COVERAGE_FILE="$(pwd)/jacoco/jacoco.xml"

                      echo ""
                      echo "=== COVERAGE FILE DETAILS ==="
                      ls -lah build/reports/jacoco/test || true
                      ls -lah jacoco || true
                      echo "=== JAR FILE DETAILS ==="
                      ls -lah build/libs || true
                      find build/libs -maxdepth 1 -name '*.jar' | sort || true
                      wc -c "$UPLOAD_COVERAGE_FILE" || true

                      hcli cov analyze --file "$UPLOAD_COVERAGE_FILE" || true

                      echo ""
                      echo "=== UPLOADING COVERAGE TO HARNESS ==="

                      hcli --verbose cov upload \
                        --file "$UPLOAD_COVERAGE_FILE" \
                        --provider "$COVERAGE_PROVIDER" \
                        --owner "$COVERAGE_OWNER" \
                        --identifier "$COVERAGE_IDENTIFIER" \
                        -- sh -c "test -s '$UPLOAD_COVERAGE_FILE'"

                      echo "Full report: build/reports/jacoco/test/html/index.html"
                    envVariables:
                      CI_ENABLE_HCLI_FOR_TESTS: "true"
                      CI_ENABLE_QUARANTINED_TEST_SKIP: "true"
              - stepGroup:
                  name: SAST Scans
                  identifier: sast_scans
                  steps:
                    - parallel:
                        - step:
                            type: HarnessSAST
                            name: Harness SAST
                            identifier: harness_sast
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: repository
                                detection: auto
                              advanced:
                                log:
                                  level: info
                        - step:
                            type: Semgrep
                            name: Semgrep
                            identifier: semgrep
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: repository
                                detection: auto
                              advanced:
                                log:
                                  level: info
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - AllErrors
                                  action:
                                    type: Ignore
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Push to HAR
                  identifier: push_to_har
                  spec:
                    repo: toddfourdemoapp
                    tags:
                      - 1.0.<+pipeline.sequenceId>
                      - latest
                    caching: true
                    labels:
                      org.opencontainers.image.title: toddfourdemoapp
                      org.opencontainers.image.version: 1.0.<+pipeline.sequenceId>
                      org.opencontainers.image.revision: <+codebase.commitSha>
                      org.opencontainers.image.source: <+codebase.repoUrl>
                      org.opencontainers.image.created: <+pipeline.startTs>
                      io.harness.pipeline.id: <+pipeline.identifier>
                      io.harness.pipeline.execution_id: <+pipeline.executionId>
                      io.harness.build.number: <+pipeline.sequenceId>
                      io.harness.supply_chain.sbom: spdx-json
                      io.harness.supply_chain.provenance: slsa
                    buildArgs:
                      JAR_PATH: build/libs/*.jar
                      BUILD_COMMIT_SHA: <+codebase.commitSha>
                      BUILD_REPO_URL: <+codebase.repoUrl>
                      IMAGE_TAG: 1.0.<+pipeline.sequenceId>
                      PIPELINE_EXECUTION_ID: <+pipeline.executionId>
                      PIPELINE_ID: <+pipeline.identifier>
                      BUILD_TIMESTAMP: <+pipeline.startTs>
                      BASE_IMAGE_REGISTRY: pkg.harness.io/eerjnxtns4grlg5vnnjzuw/har-toddfour
                    optimize: true
                    registryRef: har-docker-shared
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 2
                            retryIntervals:
                              - 2m
                            onRetryFailure:
                              action:
                                type: Abort
              - stepGroup:
                  name: Supply Chain Security
                  identifier: supply_chain_security
                  steps:
                    - step:
                        type: SscaOrchestration
                        name: SBOM Generation
                        identifier: sbom_generation
                        spec:
                          mode: generation
                          tool:
                            type: Syft
                            spec:
                              format: spdx-json
                          source:
                            type: har
                            spec:
                              registry: har-docker-shared
                              image: toddfourdemoapp:1.0.<+pipeline.sequenceId>
                          sbom_drift:
                            base: last_generated_sbom
                          resources:
                            limits:
                              memory: 500Mi
                              cpu: "0.5"
                    - step:
                        type: provenance
                        name: SLSA Provenance
                        identifier: slsa_provenance
                        spec:
                          source:
                            type: har
                            spec:
                              registry: har-docker-shared
                              image: toddfourdemoapp:1.0.<+pipeline.sequenceId>
                    - step:
                        type: Run
                        name: Artifact Signing Evidence
                        identifier: artifact_signing_evidence
                        spec:
                          registryRef: har-docker-shared
                          image: gradle:8.5-jdk17
                          shell: Bash
                          command: |-
                            set -euo pipefail
                            IMAGE_NAME="toddfourdemoapp"
                            IMAGE_TAG="1.0.<+pipeline.sequenceId>"
                            IMAGE_REFERENCE="${IMAGE_NAME}:${IMAGE_TAG}"
                            SERVICE_NAME="toddfour_demo_app"
                            SIGNING_MODE="cosign-blob"
                            SIGNING_STATUS="signed"
                            SIGNING_KEY="pipeline-ephemeral-cosign"
                            SIGNATURE_REFERENCE="inline://release-candidate/<+pipeline.executionId>/artifact-signature"
                            COSIGN_VERSION="v2.2.4"
                            TOOLS_DIR="$(pwd)/.supply-chain-tools"
                            COSIGN_BIN="${TOOLS_DIR}/cosign"

                            mkdir -p "$TOOLS_DIR"
                            if command -v curl >/dev/null 2>&1; then
                              curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o "$COSIGN_BIN"
                            elif command -v wget >/dev/null 2>&1; then
                              wget -qO "$COSIGN_BIN" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
                            else
                              echo "Artifact signing requires curl or wget to download cosign"
                              exit 1
                            fi
                            chmod +x "$COSIGN_BIN"

                            cat <<EOF > artifact-payload.json
                            {"service":"${SERVICE_NAME}","image":"${IMAGE_NAME}","tag":"${IMAGE_TAG}","reference":"${IMAGE_REFERENCE}","commit":"${COMMIT_SHA}","branch":"${BRANCH_NAME}","repository":"${REPO_URL}","pipeline_execution_id":"<+pipeline.executionId>","pipeline_identifier":"<+pipeline.identifier>"}
                            EOF

                            COSIGN_PASSWORD="" "$COSIGN_BIN" generate-key-pair --output-key-prefix cosign >/dev/null 2>&1
                            COSIGN_PASSWORD="" "$COSIGN_BIN" sign-blob --yes --key cosign.key --output-signature artifact.sig artifact-payload.json >/dev/null

                            SIGNATURE_CHECKSUM=$(sha256sum artifact-payload.json | awk '{print $1}')
                            PUBLIC_KEY_CHECKSUM=$(sha256sum cosign.pub | awk '{print $1}')
                            SIGNATURE_BASE64=$(base64 < artifact.sig | tr -d '\n')
                            PUBLIC_KEY_BASE64=$(base64 < cosign.pub | tr -d '\n')
                            SIGNED_PAYLOAD_BASE64=$(base64 < artifact-payload.json | tr -d '\n')

                            export SIGNING_STATUS
                            export SIGNING_MODE
                            export SIGNING_KEY
                            export SIGNATURE_REFERENCE
                            export SIGNATURE_CHECKSUM
                            export PUBLIC_KEY_CHECKSUM
                            export SIGNATURE_BASE64
                            export PUBLIC_KEY_BASE64
                            export SIGNED_PAYLOAD_BASE64

                            echo "Artifact signing status: ${SIGNING_STATUS}"
                            echo "Signature reference: ${SIGNATURE_REFERENCE}"
                            echo "Signed payload checksum: ${SIGNATURE_CHECKSUM}"
                            echo "Public key checksum: ${PUBLIC_KEY_CHECKSUM}"
                          envVariables:
                            COMMIT_SHA: <+codebase.commitSha>
                            BRANCH_NAME: <+codebase.branch>
                            REPO_URL: <+codebase.repoUrl>
                          outputVariables:
                            - name: SIGNING_MODE
                              type: String
                              value: SIGNING_MODE
                            - name: SIGNING_STATUS
                              type: String
                              value: SIGNING_STATUS
                            - name: SIGNING_KEY
                              type: String
                              value: SIGNING_KEY
                            - name: SIGNATURE_REFERENCE
                              type: String
                              value: SIGNATURE_REFERENCE
                            - name: SIGNATURE_CHECKSUM
                              type: String
                              value: SIGNATURE_CHECKSUM
                            - name: PUBLIC_KEY_CHECKSUM
                              type: String
                              value: PUBLIC_KEY_CHECKSUM
                            - name: SIGNATURE_BASE64
                              type: String
                              value: SIGNATURE_BASE64
                            - name: PUBLIC_KEY_BASE64
                              type: String
                              value: PUBLIC_KEY_BASE64
                            - name: SIGNED_PAYLOAD_BASE64
                              type: String
                              value: SIGNED_PAYLOAD_BASE64
                    - step:
                        type: SscaArtifactSigning
                        name: Native Artifact Signing
                        identifier: native_artifact_signing
                        spec:
                          source:
                            type: har
                            spec:
                              registry: har-docker-shared
                              image: toddfourdemoapp:1.0.<+pipeline.sequenceId>
                          signing:
                            type: cosign
                            spec:
                              private_key: toddfour_cosign_private_key
                              password: toddfour_cosign_password
                          uploadSignature:
                            upload: true
              - stepGroup:
                  name: Container Security Scans
                  identifier: container_security_scans
                  steps:
                    - parallel:
                        - step:
                            type: HarnessSCA
                            name: Harness SCA
                            identifier: harness_sca
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: container
                                detection: auto
                              advanced:
                                log:
                                  level: info
                              privileged: true
                              image:
                                type: harness
                                tag: 1.0.<+pipeline.sequenceId>
                                registry: har-docker-shared
                                image_path: toddfourdemoapp:1.0.<+pipeline.sequenceId>
                            when:
                              stageStatus: Success
                              condition: "\"true\" == \"false\""
                        - step:
                            type: AquaTrivy
                            name: Aqua Trivy
                            identifier: aqua_trivy
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: container
                                detection: auto
                              advanced:
                                log:
                                  level: info
                                args:
                                  cli: "--scanners vuln"
                              privileged: false
                              image:
                                type: harness
                                registry: har-docker-shared
                                image_path: toddfourdemoapp:1.0.<+pipeline.sequenceId>
                              sbom:
                                format: spdx-json
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - AllErrors
                                  action:
                                    type: Ignore
              - step:
                  type: Run
                  name: Prepare Governance Inputs
                  identifier: prepare_governance_inputs
                  spec:
                    shell: Sh
                    command: |-
                      TEST_PASS_RATE=100
                      if ls build/test-results/test/*.xml >/dev/null 2>&1; then
                        TOTAL_TESTS=0
                        TOTAL_FAILURES=0
                        TOTAL_ERRORS=0

                        for REPORT in build/test-results/test/*.xml; do
                          TESTS=$(grep -o 'tests="[0-9][0-9]*"' "$REPORT" | head -n1 | cut -d'"' -f2)
                          FAILURES=$(grep -o 'failures="[0-9][0-9]*"' "$REPORT" | head -n1 | cut -d'"' -f2)
                          ERRORS=$(grep -o 'errors="[0-9][0-9]*"' "$REPORT" | head -n1 | cut -d'"' -f2)

                          TOTAL_TESTS=$((TOTAL_TESTS + ${TESTS:-0}))
                          TOTAL_FAILURES=$((TOTAL_FAILURES + ${FAILURES:-0}))
                          TOTAL_ERRORS=$((TOTAL_ERRORS + ${ERRORS:-0}))
                        done

                        if [ "$TOTAL_TESTS" -gt 0 ]; then
                          PASSED_TESTS=$((TOTAL_TESTS - TOTAL_FAILURES - TOTAL_ERRORS))
                          TEST_PASS_RATE=$((PASSED_TESTS * 100 / TOTAL_TESTS))
                        fi
                      fi

                      CRITICAL_VULNERABILITIES="${TRIVY_CRITICAL:-0}"
                      HIGH_VULNERABILITIES="${TRIVY_HIGH:-0}"
                      CHANGE_BLAST_RADIUS="${CHANGE_BLAST_RADIUS_INPUT:-low}"
                      ROLLBACK_READY="${ROLLBACK_READY_INPUT:-true}"
                      OPEN_CHANGE_FAILURES="${OPEN_CHANGE_FAILURES_INPUT:-0}"
                      CHANGE_FREEZE_ACTIVE="${CHANGE_FREEZE_ACTIVE_INPUT:-false}"
                      REQUIRES_DATA_MIGRATION="${REQUIRES_DATA_MIGRATION_INPUT:-false}"
                      AUTO_DEPLOY="${AUTO_DEPLOY_INPUT:-true}"
                      COMMIT_SHA="${COMMIT_SHA_INPUT}"
                      BRANCH_NAME="${BRANCH_NAME_INPUT}"
                      REPO_URL="${REPO_URL_INPUT}"

                      export TEST_PASS_RATE
                      export CRITICAL_VULNERABILITIES
                      export HIGH_VULNERABILITIES
                      export CHANGE_BLAST_RADIUS
                      export ROLLBACK_READY
                      export OPEN_CHANGE_FAILURES
                      export CHANGE_FREEZE_ACTIVE
                      export REQUIRES_DATA_MIGRATION
                      export AUTO_DEPLOY
                      export COMMIT_SHA
                      export BRANCH_NAME
                      export REPO_URL

                      echo "Computed test pass rate: $TEST_PASS_RATE%"
                      echo "Computed critical vulnerabilities: $CRITICAL_VULNERABILITIES"
                      echo "Computed high vulnerabilities: $HIGH_VULNERABILITIES"
                    envVariables:
                      TRIVY_CRITICAL: <+pipeline.stages.build_test_scan_push.spec.execution.steps.container_security_scans.steps.aqua_trivy.output.outputVariables.CRITICAL>
                      TRIVY_HIGH: <+pipeline.stages.build_test_scan_push.spec.execution.steps.container_security_scans.steps.aqua_trivy.output.outputVariables.HIGH>
                      CHANGE_BLAST_RADIUS_INPUT: <+pipeline.variables.change_blast_radius>
                      ROLLBACK_READY_INPUT: <+pipeline.variables.rollback_ready>
                      OPEN_CHANGE_FAILURES_INPUT: <+pipeline.variables.open_change_failures>
                      CHANGE_FREEZE_ACTIVE_INPUT: <+pipeline.variables.change_freeze_active>
                      REQUIRES_DATA_MIGRATION_INPUT: <+pipeline.variables.requires_data_migration>
                      AUTO_DEPLOY_INPUT: <+pipeline.variables.auto_deploy>
                      COMMIT_SHA_INPUT: <+codebase.commitSha>
                      BRANCH_NAME_INPUT: <+codebase.branch>
                      REPO_URL_INPUT: <+codebase.repoUrl>
                    outputVariables:
                      - name: TEST_PASS_RATE
                        type: String
                        value: TEST_PASS_RATE
                      - name: CRITICAL_VULNERABILITIES
                        type: String
                        value: CRITICAL_VULNERABILITIES
                      - name: HIGH_VULNERABILITIES
                        type: String
                        value: HIGH_VULNERABILITIES
                      - name: CHANGE_BLAST_RADIUS
                        type: String
                        value: CHANGE_BLAST_RADIUS
                      - name: ROLLBACK_READY
                        type: String
                        value: ROLLBACK_READY
                      - name: OPEN_CHANGE_FAILURES
                        type: String
                        value: OPEN_CHANGE_FAILURES
                      - name: CHANGE_FREEZE_ACTIVE
                        type: String
                        value: CHANGE_FREEZE_ACTIVE
                      - name: REQUIRES_DATA_MIGRATION
                        type: String
                        value: REQUIRES_DATA_MIGRATION
                      - name: AUTO_DEPLOY
                        type: String
                        value: AUTO_DEPLOY
                      - name: COMMIT_SHA
                        type: String
                        value: COMMIT_SHA
                      - name: BRANCH_NAME
                        type: String
                        value: BRANCH_NAME
                      - name: REPO_URL
                        type: String
                        value: REPO_URL
              - step:
                  type: Run
                  name: Assemble Release Candidate Evidence
                  identifier: assemble_release_candidate_evidence
                  spec:
                    shell: Sh
                    command: |
                      SERVICE_NAME="toddfour_demo_app"
                      IMAGE_NAME="toddfourdemoapp"
                      IMAGE_TAG="1.0.<+pipeline.sequenceId>"
                      IMAGE_PATH="$IMAGE_NAME"
                      ARTIFACT="$IMAGE_PATH:$IMAGE_TAG"
                      IMAGE_REFERENCE="$ARTIFACT"
                      cat <<EOF > release_evidence.json
                      {"artifact":{"service":"${SERVICE_NAME}","image":"${IMAGE_REFERENCE}","tag":"${IMAGE_TAG}","commit":"${COMMIT_SHA}","branch":"${BRANCH_NAME}","repository":"${REPO_URL}"},"build":{"pipeline_identifier":"<+pipeline.identifier>","execution_id":"<+pipeline.executionId>","sequence_id":"<+pipeline.sequenceId>"},"attestations":{"sbom":"spdx-json","slsa_provenance":"generated","artifact_signing":{"status":"${SIGNING_STATUS}","mode":"${SIGNING_MODE}","key":"${SIGNING_KEY}","signature_reference":"${SIGNATURE_REFERENCE}","payload_checksum":"${SIGNATURE_CHECKSUM}","public_key_checksum":"${PUBLIC_KEY_CHECKSUM}","signature_base64":"${SIGNATURE_BASE64}","public_key_base64":"${PUBLIC_KEY_BASE64}","signed_payload_base64":"${SIGNED_PAYLOAD_BASE64}"}},"governance_inputs":{"test_pass_rate":${TEST_PASS_RATE},"critical_vulnerabilities":${CRITICAL_VULNERABILITIES},"high_vulnerabilities":${HIGH_VULNERABILITIES},"change_blast_radius":"${CHANGE_BLAST_RADIUS}","rollback_ready":"${ROLLBACK_READY}","open_change_failures":"${OPEN_CHANGE_FAILURES}","change_freeze_active":"${CHANGE_FREEZE_ACTIVE}","requires_data_migration":"${REQUIRES_DATA_MIGRATION}"}}
                      EOF

                      RELEASE_EVIDENCE_JSON="$(tr -d '\n' < release_evidence.json)"

                      export SERVICE_NAME
                      export IMAGE_NAME
                      export IMAGE_TAG
                      export IMAGE_PATH
                      export ARTIFACT
                      export IMAGE_REFERENCE
                      export RELEASE_EVIDENCE_JSON

                      echo "Release candidate service: $SERVICE_NAME"
                      echo "Release candidate artifact: $IMAGE_REFERENCE"
                      echo "$RELEASE_EVIDENCE_JSON"
                    envVariables:
                      TEST_PASS_RATE: <+execution.steps.prepare_governance_inputs.output.outputVariables.TEST_PASS_RATE>
                      CRITICAL_VULNERABILITIES: <+execution.steps.prepare_governance_inputs.output.outputVariables.CRITICAL_VULNERABILITIES>
                      HIGH_VULNERABILITIES: <+execution.steps.prepare_governance_inputs.output.outputVariables.HIGH_VULNERABILITIES>
                      CHANGE_BLAST_RADIUS: <+execution.steps.prepare_governance_inputs.output.outputVariables.CHANGE_BLAST_RADIUS>
                      ROLLBACK_READY: <+execution.steps.prepare_governance_inputs.output.outputVariables.ROLLBACK_READY>
