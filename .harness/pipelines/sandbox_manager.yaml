pipeline:
  name: Sandbox Manager
  identifier: sandbox_manager
  projectIdentifier: parson
  orgIdentifier: sandbox
  description: "Self-service demo and sandbox management - list, extend TTL, protect, or destroy current POV workspaces"
  tags:
    self-service: "true"
    sandbox: "true"
  
  variables:
    - name: action
      type: String
      description: "Action to perform: list, extend, protect, destroy"
      required: true
      value: <+input>.allowedValues(list,extend,protect,destroy)
    
    - name: owner
      type: String
      description: "Sandbox owner name (required for extend/protect/destroy)"
      required: false
      value: <+input>
    
    - name: harness_api_key
      type: Secret
      description: "Harness Platform API Key"
      required: true
      value: <+input>

  stages:
    # Stage 1: List all sandboxes with TTL status
    - stage:
        name: List Sandboxes
        identifier: list_sandboxes
        description: "Display all sandboxes with their TTL status"
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.action> == "list"
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Fetch Sandbox Status
                  identifier: fetch_status
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          
                          echo "╔══════════════════════════════════════════════════════════════╗"
                          echo "║              SE SANDBOX STATUS REPORT                        ║"
                          echo "╚══════════════════════════════════════════════════════════════╝"
                          echo ""
                          
                          ACCOUNT_ID="<+account.identifier>"
                          ORG_ID="<+org.identifier>"
                          PROJECT_ID="<+project.identifier>"
                          API_KEY="${HARNESS_API_KEY}"
                          ENDPOINT="https://app.harness.io"
                          CURRENT_EPOCH=$(date +%s)
                          
                          # Fetch workspaces
                          WORKSPACES=$(curl -s -X GET \
                            "${ENDPOINT}/iacm/api/orgs/${ORG_ID}/projects/${PROJECT_ID}/workspaces?accountIdentifier=${ACCOUNT_ID}" \
                            -H "x-api-key: ${API_KEY}" \
                            -H "Harness-Account: ${ACCOUNT_ID}" \
                            -H "Content-Type: application/json")
                          
                          echo "| Owner | Profile | Target | Workspace | TTL | Status | Expires/Protected |"
                          echo "|-------|---------|--------|-----------|-----|--------|-------------------|"
                          
                          for WS_ID in $(echo "$WORKSPACES" | jq -r '.content[]?.identifier // empty' | grep -E '_sandbox$|_pov$' || true); do
                            WS_DETAILS=$(curl -s -X GET \
                              "${ENDPOINT}/iacm/api/orgs/${ORG_ID}/projects/${PROJECT_ID}/workspaces/${WS_ID}?accountIdentifier=${ACCOUNT_ID}" \
                              -H "x-api-key: ${API_KEY}" \
                              -H "Harness-Account: ${ACCOUNT_ID}" \
                              -H "Content-Type: application/json")
                            
                            TTL_DAYS=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "ttl_days") | .value // "45"' 2>/dev/null || echo "45")
                            CREATED_AT=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "created_at") | .value // empty' 2>/dev/null || echo "")
                            OWNER=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "owner") | .value // "unknown"' 2>/dev/null || echo "unknown")
                            PROFILE=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "sandbox_profile") | .value // "unknown"' 2>/dev/null || echo "unknown")
                            TARGET=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "deployment_target") | .value // "unknown"' 2>/dev/null || echo "unknown")

                            if [ -z "$CREATED_AT" ]; then
                              CREATED_AT=$(echo "$WS_DETAILS" | jq -r '.created // empty' 2>/dev/null || echo "")
                            fi

                            if [ "$TTL_DAYS" = "0" ]; then
                              echo "| $OWNER | $PROFILE | $TARGET | $WS_ID | ∞ | 🛡️ Protected | Never |"
                            elif [ -n "$CREATED_AT" ]; then
                              CREATED_EPOCH=$(date -d "$CREATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "$CREATED_AT" +%s 2>/dev/null || echo "0")
                              EXPIRY_EPOCH=$((CREATED_EPOCH + TTL_DAYS * 86400))
                              DAYS_REMAINING=$(( (EXPIRY_EPOCH - CURRENT_EPOCH) / 86400 ))
                              
                              if [ $DAYS_REMAINING -lt 0 ]; then
                                echo "| $OWNER | $PROFILE | $TARGET | $WS_ID | ${TTL_DAYS}d | ⚠️ EXPIRED | ${DAYS_REMAINING}d ago |"
                              elif [ $DAYS_REMAINING -lt 7 ]; then
                                echo "| $OWNER | $PROFILE | $TARGET | $WS_ID | ${TTL_DAYS}d | 🟡 Expiring | ${DAYS_REMAINING}d left |"
                              else
                                echo "| $OWNER | $PROFILE | $TARGET | $WS_ID | ${TTL_DAYS}d | 🟢 Active | ${DAYS_REMAINING}d left |"
                              fi
                            else
                              echo "| $OWNER | $PROFILE | $TARGET | $WS_ID | ${TTL_DAYS}d | ❓ Unknown | No timestamp |"
                            fi
                          done
                          
                          echo ""
                          echo "Legend:"
                          echo "  🛡️ Protected - TTL disabled, will never auto-cleanup"
                          echo "  🟢 Active - Sandbox is within TTL"
                          echo "  🟡 Expiring - Less than 7 days until cleanup"
                          echo "  ⚠️ EXPIRED - Past TTL, will be cleaned up on next scheduled run"
                    environmentVariables:
                      - name: HARNESS_API_KEY
                        type: String
                        value: <+pipeline.variables.harness_api_key>
                  timeout: 10m

    # Stage 2: Extend TTL
    - stage:
        name: Extend TTL
        identifier: extend_ttl
        description: "Extend sandbox TTL by 30 days"
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.action> == "extend"
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Extend Sandbox TTL
                  identifier: extend_sandbox
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -e
                          
                          OWNER="<+pipeline.variables.owner>"
                          WS_ID="${OWNER}_pov"
                          
                          echo "=== Extending TTL for ${WS_ID} ==="
                          echo ""
                          
                          ACCOUNT_ID="<+account.identifier>"
                          ORG_ID="<+org.identifier>"
                          PROJECT_ID="<+project.identifier>"
                          API_KEY="${HARNESS_API_KEY}"
                          ENDPOINT="https://app.harness.io"
                          
                          # Get current TTL
                          WS_DETAILS=$(curl -s -X GET \
                            "${ENDPOINT}/iacm/api/orgs/${ORG_ID}/projects/${PROJECT_ID}/workspaces/${WS_ID}?accountIdentifier=${ACCOUNT_ID}" \
                            -H "x-api-key: ${API_KEY}" \
                            -H "Harness-Account: ${ACCOUNT_ID}" \
                            -H "Content-Type: application/json")
                          
                          CURRENT_TTL=$(echo "$WS_DETAILS" | jq -r '.terraform_variable[]? | select(.key == "ttl_days") | .value // "45"' 2>/dev/null || echo "45")
                          
                          if [ "$CURRENT_TTL" = "0" ]; then
                            echo "Sandbox is already protected (TTL=0). No extension needed."
                            exit 0
                          fi
                          
                          NEW_TTL=$((CURRENT_TTL + 30))
                          
                          echo "Current TTL: ${CURRENT_TTL} days"
                          echo "New TTL: ${NEW_TTL} days"
                          echo ""
                          
                          # Update the workspace variable
                          curl -s -X PATCH \
                            "${ENDPOINT}/iacm/api/orgs/${ORG_ID}/projects/${PROJECT_ID}/workspaces/${WS_ID}/variables?accountIdentifier=${ACCOUNT_ID}" \
                            -H "x-api-key: ${API_KEY}" \
                            -H "Harness-Account: ${ACCOUNT_ID}" \
                            -H "Content-Type: application/json" \
                            -d "[{\"key\": \"ttl_days\", \"value\": \"${NEW_TTL}\", \"value_type\": \"string\"}]"
                          
                          echo "✓ TTL extended successfully!"
                          echo ""
                          echo "Your sandbox will now expire in ${NEW_TTL} days from creation."
                    environmentVariables:
                      - name: HARNESS_API_KEY
                        type: String
                        value: <+pipeline.variables.harness_api_key>
                  timeout: 5m

    # Stage 3: Protect (disable TTL)
    - stage:
        name: Protect Sandbox
        identifier: protect_sandbox
        description: "Disable TTL to prevent auto-cleanup"
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.action> == "protect"
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Disable TTL
                  identifier: disable_ttl
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -e
                          
                          OWNER="<+pipeline.variables.owner>"
                          WS_ID="${OWNER}_pov"
                          
                          echo "=== Protecting ${WS_ID} (Disabling TTL) ==="
                          echo ""
                          
                          ACCOUNT_ID="<+account.identifier>"
                          ORG_ID="<+org.identifier>"
                          PROJECT_ID="<+project.identifier>"
                          API_KEY="${HARNESS_API_KEY}"
                          ENDPOINT="https://app.harness.io"
                          
                          # Set TTL to 0 (disabled)
                          curl -s -X PATCH \
                            "${ENDPOINT}/iacm/api/orgs/${ORG_ID}/projects/${PROJECT_ID}/workspaces/${WS_ID}/variables?accountIdentifier=${ACCOUNT_ID}" \
                            -H "x-api-key: ${API_KEY}" \
                            -H "Harness-Account: ${ACCOUNT_ID}" \
                            -H "Content-Type: application/json" \
                            -d "[{\"key\": \"ttl_days\", \"value\": \"0\", \"value_type\": \"string\"}]"
                          
                          echo "✓ Sandbox protected!"
                          echo ""
                          echo "Your sandbox will no longer be automatically cleaned up."
                          echo "To re-enable TTL, set ttl_days to a positive number in the IACM workspace."
                    environmentVariables:
                      - name: HARNESS_API_KEY
                        type: String
                        value: <+pipeline.variables.harness_api_key>
                  timeout: 5m

    # Stage 4: Destroy
    - stage:
        name: Destroy Sandbox
        identifier: destroy_sandbox
        description: "Trigger sandbox destruction"
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.action> == "destroy"
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Confirm Destruction
                  identifier: confirm_destroy
                  spec:
                    approvalMessage: |
                      ⚠️ WARNING: You are about to destroy sandbox '<+pipeline.variables.owner>_pov'
                      
                      This will permanently delete:
                      - All Kubernetes deployments in harness-demo-<+pipeline.variables.owner>
                      - Harness delegate, connectors, service, environments
                      - HAR registry and images
                      
                      This action is IRREVERSIBLE!
                      
                      Approve to proceed with destruction.
                    includePipelineExecutionHistory: false
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                  timeout: 1h

              - step:
                  type: ShellScript
                  name: Trigger Destroy Pipeline
                  identifier: trigger_destroy
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -e
                          
                          OWNER="<+pipeline.variables.owner>"
                          
                          echo "=== Triggering Destroy for ${OWNER}_pov ==="
                          echo ""
                          
                          ACCOUNT_ID="<+account.identifier>"
                          ORG_ID="<+org.identifier>"
                          PROJECT_ID="<+project.identifier>"
                          API_KEY="${HARNESS_API_KEY}"
                          ENDPOINT="https://app.harness.io"
                          
                          # Trigger the POV destroy pipeline
                          RESPONSE=$(curl -s -X POST \
                            "${ENDPOINT}/pipeline/api/pipeline/execute/pov_destroy?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}" \
                            -H "x-api-key: ${API_KEY}" \
                            -H "Content-Type: application/json" \
                            -d "{
                              \"owner\": \"${OWNER}\",
                              \"harness_account_id\": \"${ACCOUNT_ID}\",
                              \"harness_org_id\": \"${ORG_ID}\",
                              \"harness_project_id\": \"${PROJECT_ID}\",
                              \"harness_endpoint\": \"${ENDPOINT}\"
                            }")
                          
                          EXEC_ID=$(echo "$RESPONSE" | jq -r '.data.planExecution.uuid // "unknown"')
                          
                          echo "✓ Destroy pipeline triggered!"
                          echo ""
                          echo "Execution ID: $EXEC_ID"
                          echo ""
                          echo "Monitor progress at:"
                          echo "${ENDPOINT}/ng/account/${ACCOUNT_ID}/all/orgs/${ORG_ID}/projects/${PROJECT_ID}/pipelines/pov_destroy/executions/${EXEC_ID}/pipeline"
                    environmentVariables:
                      - name: HARNESS_API_KEY
                        type: String
                        value: <+pipeline.variables.harness_api_key>
                  timeout: 5m
