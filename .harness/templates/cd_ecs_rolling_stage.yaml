template:
  name: CD ECS Rolling Stage
  identifier: cd_ecs_rolling_stage
  type: Stage
  projectIdentifier: parson
  orgIdentifier: sandbox
  description: "Project-level deployment stage template for ECS rolling delivery"
  tags:
    stage-type: deployment
    deployment-target: ecs
    deployment-strategy: rolling
  versionLabel: "1.0.0"
  spec:
    type: Deployment
    spec:
      deploymentType: ECS
      service:
        serviceRef: <+input>
        serviceInputs:
          serviceDefinition:
            type: ECS
            spec:
              artifacts:
                primary:
                  primaryArtifactRef: <+input>
                  sources: <+input>
      environment:
        environmentRef: <+input>
        deployToAll: false
        infrastructureDefinitions:
          - identifier: <+input>
      execution:
        steps:
          - step:
              type: EcsRollingDeploy
              name: ECS Rolling Deploy
              identifier: ecs_rolling_deploy
              spec:
                sameAsAlreadyRunningInstances: false
                forceNewDeployment: true
              timeout: 10m
          - step:
              type: Verify
              name: Verify Deployment
              identifier: verify_deployment
              spec:
                isMultiServicesOrEnvs: false
                type: Rolling
                monitoredService:
                  type: Default
                  spec: {}
                spec:
                  sensitivity: MEDIUM
                  duration: 5m
                  deploymentTag: <+artifacts.primary.tag>
              timeout: 15m
              when:
                stageStatus: Success
                condition: <+input>.allowedValues(true,false)
        rollbackSteps:
          - step:
              type: EcsRollingRollback
              name: ECS Rollback
              identifier: ecs_rollback
              spec: {}
              timeout: 10m
    tags: {}
    failureStrategies:
      - onFailure:
          errors:
            - AllErrors
          action:
            type: StageRollback
