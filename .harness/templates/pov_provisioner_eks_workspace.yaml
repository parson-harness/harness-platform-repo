template:
  name: POV Provisioner
  identifier: POV_Provisioner
  projectIdentifier: parson
  orgIdentifier: sandbox
  versionLabel: "1.0"
  type: Workspace
  tags: {}
  spec:
    provider:
      type: others
      title: thirdPartyGitProvider
      info: thirdPartyGitProviderInfo
      icon: service-github
      size: 20
      disabled: false
    tags: []
    cost_estimation:
      enabled: false
      locked: false
    default_pipelines:
      plan: pov_provisioning
      apply: pov_provisioning
      destroy: pov_destroy
      drift: pov_provisioning
      locked: true
    provisioner:
      type: opentofu
      version: 1.11.2
      connector: aws_oidc_iacm
      locked: true
    provider_connectors:
      - connector_ref: aws_oidc_iacm
        type: aws
        locked: true
    repository:
      isHarnessCode: false
      connector: parsongh
      name: harness-demo-app
      branch: main
      gitFetchType: branch
      path: tofu/stacks/eks
      locked: true
    variables: []
    terraform_variables:
      - key: owner
        value: <+pipeline.variables.owner>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: eks_cluster_name
        value: <+pipeline.variables.eks_cluster_name>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: harness_account_id
        value: <+pipeline.variables.harness_account_id>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: harness_endpoint
        value: <+pipeline.variables.harness_endpoint>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: harness_api_key
        value: <+pipeline.variables.target_api_key>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: harness_api_key_email
        value: <+pipeline.variables.target_api_key_email>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: harness_org_id
        value: <+pipeline.variables.harness_org_id>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: harness_project_id
        value: <+pipeline.variables.harness_project_id>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: create_harness_org
        value: <+pipeline.variables.create_harness_org>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: create_harness_project
        value: <+pipeline.variables.create_harness_project>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: artifact_registry_type
        value: <+pipeline.stages.create_workspace.spec.execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_artifact_registry_type>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: create_dockerhub_upstream
        value: <+pipeline.stages.create_workspace.spec.execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_create_dockerhub_upstream>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: create_strategy_pipeline
        value: <+pipeline.stages.create_workspace.spec.execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_create_strategy_pipeline>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: create_ci_pipeline
        value: <+pipeline.stages.create_workspace.spec.execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_create_ci_pipeline>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: create_standard_ci_gradle
        value: <+pipeline.stages.create_workspace.spec.execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_create_standard_ci_gradle>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: create_opa_policies
        value: <+pipeline.variables.create_opa_policies>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: acm_cert_arn
        value: <+pipeline.variables.acm_cert_arn>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: use_harness_code
        value: <+pipeline.stages.create_workspace.spec.execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_use_harness_code>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: github_repo_name
        value: <+pipeline.variables.source_github_repo>
        value_type: string
        status: manual
        locked: false
        type: String
      - key: github_pat
        value: github_pat
        value_type: secret
        status: manual
        locked: false
        type: Secret
      - key: github_repo_is_public
        value: "true"
        value_type: string
        status: manual
        locked: false
        type: String
      - key: git_branch
        value: main
        value_type: string
        status: manual
        locked: false
        type: String
      - key: create_delegate
        value: "true"
        value_type: string
        status: manual
        locked: false
        type: String
      - key: manage_dns
        value: "true"
        value_type: string
        status: manual
        locked: false
        type: String
      - key: shared_alb_dns_name
        value: <+pipeline.variables.shared_alb_dns_name>
        value_type: string
        status: manual
        locked: false
        type: String
    terraform_variable_files: []
