pipeline:
  name: IDP POV Destroyer
  identifier: idp_pov_destroyer
  projectIdentifier: parson
  orgIdentifier: sandbox
  description: IDP-triggered pipeline that destroys a POV environment and deletes the IACM workspace
  tags:
    idp: "true"
    pov: "true"
    iacm: "true"
  variables:
    - name: owner
      type: String
      description: Owner name (identifies the workspace to destroy)
      required: true
      value: <+input>
    - name: harness_account_id
      type: String
      description: Target Harness Account ID (for cross-account destruction)
      required: true
      value: <+input>.default(<+account.identifier>)
    - name: harness_endpoint
      type: String
      description: Harness platform endpoint
      required: true
      value: <+input>.default(https://app.harness.io/gratis)
    - name: provisioner_api_key
      type: Secret
      description: SAT for IACM workspace management in provisioner account (sandbox/parson)
      required: true
      value: acct-automation-svc-acct
    - name: target_api_key
      type: String
      description: API Key for target Harness account (where resources are destroyed). Defaults to provisioner SAT for same-account use.
      required: false
      value: <+input>.default(<+pipeline.variables.provisioner_api_key>)
    - name: target_api_key_email
      type: String
      description: Email associated with the target account API key. Defaults to service account email.
      required: false
      value: <+input>.default(accountautomation@service.harness.io)
    - name: harness_org_id
      type: String
      description: Harness Org ID
      required: true
      value: <+org.identifier>
    - name: harness_project_id
      type: String
      description: Harness Project ID
      required: true
      value: <+project.identifier>
    - name: deployment_targets
      type: String
      description: Deployment targets
      required: false
      value: <+input>.default(eks)
    - name: create_harness_org
      type: String
      description: Create new org
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: create_harness_project
      type: String
      description: Create new project
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: create_harness_environment
      type: String
      description: Create Harness environment
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_prod_environment
      type: String
      description: Create production environment
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_delegate
      type: String
      description: Create Harness delegate
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_eks_cluster
      type: String
      description: Create new EKS cluster
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: existing_cluster_name
      type: String
      description: Existing EKS cluster name
      required: false
      value: <+input>.default(harness-eks-parson)
  stages:
    - stage:
        name: Pre-Cleanup
        identifier: pre_cleanup
        description: Force delete Harness resources with active instances/references before terraform destroy
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Force Delete Blocking Resources
                  identifier: force_delete_blocking
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - parson-eks-delegate
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=============================================="
                          echo "  PRE-CLEANUP: Force Deleting Harness Resources"
                          echo "=============================================="
                          echo ""
                          echo "Owner: ${OWNER}"
                          echo "Org: ${ORG_ID}, Project: ${PROJECT_ID}"
                          echo ""

                          # Force delete pipelines FIRST (they reference services/environments)
                          echo "=== Deleting Pipelines ==="
                          for PIPELINE in ci_build k8s_canary_deploy k8s_bg_canary_deploy k8s_strategy_deploy canary_deployment blue_green_deployment strategy_choice; do
                            echo "  Deleting pipeline: ${OWNER}_${PIPELINE}"
                            RESP=$(curl -s -w "\n%{http_code}" -X DELETE "${ENDPOINT}/pipeline/api/pipelines/${OWNER}_${PIPELINE}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}" \
                              -H "x-api-key: ${API_KEY}" \
                              -H "Content-Type: application/json")
                            HTTP_CODE=$(echo "$RESP" | tail -n1)
                            BODY=$(echo "$RESP" | head -n -1)
                            echo "    Response: $HTTP_CODE"
                            [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "404" ] && echo "    Body: $BODY"
                          done

                          # Force delete service (has active instances)
                          echo ""
                          echo "=== Deleting Service ==="
                          echo "  Force deleting service: ${OWNER}_demo_app"
                          RESP=$(curl -s -w "\n%{http_code}" -X DELETE "${ENDPOINT}/ng/api/servicesV2/${OWNER}_demo_app?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true" \
                            -H "x-api-key: ${API_KEY}" \
                            -H "Content-Type: application/json")
                          HTTP_CODE=$(echo "$RESP" | tail -n1)
                          BODY=$(echo "$RESP" | head -n -1)
                          echo "    Response: $HTTP_CODE"
                          [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "404" ] && echo "    Body: $BODY"

                          # Force delete infrastructures (referenced by pipelines)
                          echo ""
                          echo "=== Deleting Infrastructures ==="
                          for ENV in dev prod; do
                            echo "  Force deleting infrastructure: ${OWNER}_k8s_${ENV}"
                            RESP=$(curl -s -w "\n%{http_code}" -X DELETE "${ENDPOINT}/ng/api/infrastructures/${OWNER}_k8s_${ENV}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&environmentIdentifier=${OWNER}_${ENV}&forceDelete=true" \
                              -H "x-api-key: ${API_KEY}" \
                              -H "Content-Type: application/json")
                            HTTP_CODE=$(echo "$RESP" | tail -n1)
                            echo "    Response: $HTTP_CODE"
                          done

                          # Force delete environments
                          echo ""
                          echo "=== Deleting Environments ==="
                          for ENV in dev prod; do
                            echo "  Force deleting environment: ${OWNER}_${ENV}"
                            RESP=$(curl -s -w "\n%{http_code}" -X DELETE "${ENDPOINT}/ng/api/environmentsV2/${OWNER}_${ENV}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true" \
                              -H "x-api-key: ${API_KEY}" \
                              -H "Content-Type: application/json")
                            HTTP_CODE=$(echo "$RESP" | tail -n1)
                            echo "    Response: $HTTP_CODE"
                          done

                          # Force delete connectors
                          echo ""
                          echo "=== Deleting Connectors ==="
                          for CONN in k8s_reference_architecture aws_reference_architecture github_reference_architecture; do
                            echo "  Force deleting connector: ${OWNER}_${CONN}"
                            RESP=$(curl -s -w "\n%{http_code}" -X DELETE "${ENDPOINT}/ng/api/connectors/${OWNER}_${CONN}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true" \
                              -H "x-api-key: ${API_KEY}" \
                              -H "Content-Type: application/json")
                            HTTP_CODE=$(echo "$RESP" | tail -n1)
                            echo "    Response: $HTTP_CODE"
                          done

                          # Delete HAR registries (project-level registry and org-level upstream proxy)
                          # API format: DELETE /har/api/v1/registry/{registry_ref}
                          # registry_ref format: account_id/org_id/project_id/registry_name/+ (project-level)
                          #                      account_id/org_id/registry_name/+ (org-level)
                          echo ""
                          echo "=== Deleting HAR Registries ==="

                          # Delete project-level registry
                          REGISTRY_REF="${ACCOUNT_ID}/${ORG_ID}/${PROJECT_ID}/har-${OWNER}/+"
                          echo "  Deleting project registry: har-${OWNER}"
                          echo "    Registry ref: ${REGISTRY_REF}"
                          RESP=$(curl -s -w "\n%{http_code}" -X DELETE "${ENDPOINT}/har/api/v1/registry/${REGISTRY_REF}" \
                            -H "x-api-key: ${API_KEY}" \
                            -H "Content-Type: application/json")
                          HTTP_CODE=$(echo "$RESP" | tail -n1)
                          BODY=$(echo "$RESP" | head -n -1)
                          echo "    Response: $HTTP_CODE"
                          [ "$HTTP_CODE" != "200" ] && echo "    Body: $BODY"

                          # Delete org-level upstream proxy
                          UPSTREAM_REF="${ACCOUNT_ID}/${ORG_ID}/${OWNER}-dockerhub-proxy/+"
                          echo "  Deleting upstream proxy: ${OWNER}-dockerhub-proxy"
                          echo "    Registry ref: ${UPSTREAM_REF}"
                          RESP=$(curl -s -w "\n%{http_code}" -X DELETE "${ENDPOINT}/har/api/v1/registry/${UPSTREAM_REF}" \
                            -H "x-api-key: ${API_KEY}" \
                            -H "Content-Type: application/json")
                          HTTP_CODE=$(echo "$RESP" | tail -n1)
                          BODY=$(echo "$RESP" | head -n -1)
                          echo "    Response: $HTTP_CODE"
                          [ "$HTTP_CODE" != "200" ] && echo "    Body: $BODY"

                          # Delete delegate token (using grep/sed instead of jq which may not be available)
                          echo ""
                          echo "=== Deleting Delegate Token ==="
                          # List delegate tokens and extract names matching pattern
                          TOKEN_RESP=$(curl -s "${ENDPOINT}/ng/api/delegate-token-ng?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}" \
                            -H "x-api-key: ${API_KEY}")
                          # Extract token names using grep/sed (jq may not be available)
                          TOKENS=$(echo "$TOKEN_RESP" | grep -o '"name":"[^"]*"' | sed 's/"name":"//g' | sed 's/"//g' | grep "^${OWNER}-delegate-token" || true)
                          if [ -n "$TOKENS" ]; then
                            for TOKEN in $TOKENS; do
                              echo "  Deleting delegate token: $TOKEN"
                              curl -s -X DELETE "${ENDPOINT}/ng/api/delegate-token-ng?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&tokenName=$TOKEN" \
                                -H "x-api-key: ${API_KEY}" || true
                            done
                          else
                            echo "  No matching delegate tokens found"
                          fi

                          # Delete Harness Code Repository
                          echo ""
                          echo "=== Deleting Harness Code Repository ==="
                          RESP=$(curl -s -w "\n%{http_code}" -X DELETE "${ENDPOINT}/code/api/v1/repos/${OWNER}-demo-app?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}" \
                            -H "x-api-key: ${API_KEY}")
                          HTTP_CODE=$(echo "$RESP" | tail -n1)
                          echo "  Deleting HCR repo: ${OWNER}-demo-app"
                          echo "    Response: $HTTP_CODE"
                          [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "204" ] && [ "$HTTP_CODE" != "404" ] && echo "    Body: $(echo "$RESP" | head -n -1)"

                          echo ""
                          echo "=============================================="
                          echo "  Harness resource cleanup complete."
                          echo "=============================================="
                    environmentVariables:
                      - name: OWNER
                        type: String
                        value: <+pipeline.variables.owner>
                      - name: ACCOUNT_ID
                        type: String
                        value: <+pipeline.variables.harness_account_id>
                      - name: ORG_ID
                        type: String
                        value: <+pipeline.variables.harness_org_id>
                      - name: PROJECT_ID
                        type: String
                        value: <+pipeline.variables.harness_project_id>
                      - name: API_KEY
                        type: String
                        value: <+pipeline.variables.target_api_key>
                      - name: ENDPOINT
                        type: String
                        value: <+pipeline.variables.harness_endpoint>
                    outputVariables: []
                  timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                          spec: {}
              - step:
                  type: ShellScript
                  name: Delete Delegate Namespace
                  identifier: delete_delegate_namespace
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - parson-eks-delegate
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=== Deleting Delegate Kubernetes Resources ==="
                          NAMESPACE="harness-delegate-ng-${OWNER}"
                          CRB_NAME="harness-delegate-admin-${OWNER}"

                          # Delete ClusterRoleBinding (cluster-scoped, not deleted with namespace)
                          echo "  Checking for ClusterRoleBinding: ${CRB_NAME}"
                          if kubectl get clusterrolebinding "${CRB_NAME}" 2>/dev/null; then
                            echo "  ClusterRoleBinding exists, deleting..."
                            kubectl delete clusterrolebinding "${CRB_NAME}" || true
                            echo "  ClusterRoleBinding deleted"
                          else
                            echo "  ClusterRoleBinding does not exist, skipping"
                          fi

                          # Delete namespace
                          echo ""
                          echo "  Checking for namespace: ${NAMESPACE}"
                          if kubectl get namespace "${NAMESPACE}" 2>/dev/null; then
                            echo "  Namespace exists, deleting..."
                            kubectl delete namespace "${NAMESPACE}" --wait=false || true
                            echo "  Namespace deletion initiated"
                          else
                            echo "  Namespace does not exist, skipping"
                          fi

                          echo ""
                          echo "=============================================="
                          echo "  Pre-cleanup complete. Terraform destroy can now proceed."
                          echo "=============================================="
                    environmentVariables:
                      - name: OWNER
                        type: String
                        value: <+pipeline.variables.owner>
                    outputVariables: []
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                          spec: {}
    - stage:
        name: Check Workspace
        identifier: check_workspace
        description: Check if the IACM workspace exists before attempting destroy
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Check Workspace Exists
                  identifier: check_workspace_exists
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov
                    method: GET
                    headers:
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    outputVariables:
                      - name: workspace_exists
                        value: <+httpResponseCode>
                        type: String
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 404
                  timeout: 1m
              - step:
                  type: ShellScript
                  name: Log Workspace Status
                  identifier: log_workspace_status
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          if [ "<+execution.steps.check_workspace_exists.output.outputVariables.workspace_exists>" = "200" ]; then
                            echo "✓ Workspace exists - will proceed with terraform destroy"
                          else
                            echo "○ Workspace not found - skipping terraform destroy stages"
                          fi
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
    - stage:
        name: Destroy
        identifier: destroy
        description: Run tofu plan -destroy to preview remaining infrastructure destruction then destroy upon approval
        type: IACM
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.check_workspace.spec.execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "200"
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          workspace: <+pipeline.variables.owner>_pov
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: Plan Destroy
                  identifier: plan_destroy
                  timeout: 15m
                  spec:
                    command: plan-destroy
              - step:
                  type: Run
                  name: Show Destroy Plan
                  identifier: show_destroy_plan
                  spec:
                    shell: Bash
                    command: |
                      echo "=== POV Destroy Plan ==="
                      echo "Owner: <+pipeline.variables.owner>"
                      echo "Workspace: <+pipeline.variables.owner>_pov"
                      echo ""
                      echo "Note: Harness resources (pipelines, services, environments, connectors)"
                      echo "have already been force-deleted in the Pre-Cleanup stage."
                      echo ""
                      echo "The following INFRASTRUCTURE resources will be DESTROYED:"
                      echo ""

                      if [ -f /harness/plan.json ]; then
                        jq -r '.resource_changes[] | select(.change.actions | contains(["delete"])) | "  - \(.type).\(.name)"' /harness/plan.json 2>/dev/null || echo "  (unable to parse plan)"
                      fi

                      echo ""
                      echo "⚠️  This action is IRREVERSIBLE!"
              - step:
                  type: IACMApproval
                  name: Approve Destroy
                  identifier: approve_destroy
                  spec:
                    autoApprove: true
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: MarkAsSuccess
              - step:
                  type: IACMTerraformPlugin
                  name: Destroy
                  identifier: Destroy
                  spec:
                    command: destroy
                  timeout: 1h
    - stage:
        name: Delete Workspace
        identifier: delete_workspace
        description: Delete the IACM workspace
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.check_workspace.spec.execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "200"
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Delete IACM Workspace
                  identifier: delete_iacm_workspace
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov
                    method: DELETE
                    headers:
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 204 || <+httpResponseCode> == 404
                  timeout: 2m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                          spec: {}
              - step:
                  type: ShellScript
                  name: POV Destroyed
                  identifier: pov_destroyed
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=============================================="
                          echo "   POV Environment Destroyed"
                          echo "=============================================="
                          echo ""
                          echo "Owner: <+pipeline.variables.owner>"
                          echo "Workspace: <+pipeline.variables.owner>_pov (deleted)"
                          echo ""
                          echo "All resources have been cleaned up:"
                          echo "  ✓ Terraform-managed resources destroyed"
                          echo "  ✓ Harness resources force-deleted"
                          echo "  ✓ IACM workspace deleted"
                          echo ""
                          echo "The POV environment for '<+pipeline.variables.owner>' no longer exists."
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
