apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-pov-app-green
  labels:
    app: harness-pov-app
    variant: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harness-pov-app
      variant: green
  template:
    metadata:
      labels:
        app: harness-pov-app
        variant: green
    spec:
      containers:
        - name: harness-pov-app
          image: harness-pov-app:2.0.0
          ports:
            - containerPort: 8080
          env:
            - name: DEPLOYMENT_VARIANT
              value: "green"
            - name: VARIANT_COLOR
              value: "#10B981"
            - name: APP_VERSION
              value: "2.0.0"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
