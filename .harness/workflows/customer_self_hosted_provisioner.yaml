apiVersion: harness.io/v1
kind: Workflow
name: Customer Self-Hosted Provisioner
identifier: customer_self_hosted_provisioner
type: workflow
scope: project
projectIdentifier: parson
orgIdentifier: sandbox
owner: todd.parson@harness.io
metadata:
  description: |
    ADVANCED: Provision a complete Harness demo in a customer's Harness account.
    
    ⚠️  This workflow targets the current canonical POV provisioner pipeline.
    
    What gets created:
    - Harness CI/CD pipelines
    - Harness Service and Environments
    - Harness Artifact Registry or ASG delivery resources depending on target
    
    Prerequisites (REQUIRED):
    1. Customer Harness account with IACM enabled
    2. Customer API key with admin permissions
    3. Existing cluster access for EKS targets, or the required shared-cluster inputs for ASG targets
    
    Estimated provisioning time depends on the selected target and any existing workspace state.
  tags:
    - customer-self-hosted
    - iacm
    - own-aws
    - advanced
spec:
  presentation:
    customTitle: Customer Self-Hosted (Advanced)
    customSubTitle: "⚠️ Advanced cross-account provisioning into a customer Harness project"
    customCreateButtonText: Provision Infrastructure
  
  output:
    links:
      - title: Pipeline Execution
        url: ${{ steps.trigger.output.PipelineUrl }}
      - title: EKS App URL
        url: http://${{ parameters.owner }}.harness-demo.dev
      - title: ASG App URL
        url: https://${{ parameters.owner }}-asg.harness-demo.dev
      - title: Project Pipelines
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/pipelines
      - title: Project Services
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/services
      - title: Artifact Registry
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/artifacts
  
  lifecycle: production
  
  parameters:
    - title: POV Identity
      required:
        - owner
      properties:
        owner:
          title: POV Owner
          type: string
          description: "Owner name (lowercase, alphanumeric). Used for resource naming"
          pattern: "^[a-z][a-z0-9]*$"
          ui:help: "Must start with a letter, lowercase alphanumeric only. This will be used to name AWS resources."
        
        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken
    
    - title: Customer Harness Account
      required:
        - harness_account_id
        - harness_org_id
        - harness_project_id
        - target_api_key
        - target_api_key_email
      properties:
        harness_account_id:
          title: Customer Account ID
          type: string
          description: "Customer's Harness Account ID"
          ui:help: "Find this in Account Settings > Overview, or in the URL after /account/"
        
        harness_cluster:
          title: Harness Cluster
          type: string
          description: "Which Harness cluster is the customer account on?"
          default: "https://app.harness.io"
          enum:
            - "https://app.harness.io/gratis"
            - "https://app.harness.io"
            - "https://app3.harness.io"
          enumNames:
            - "Prod 1 - Free/Community accounts"
            - "Prod 2 - Enterprise accounts (most common)"
            - "Prod 3 - Enterprise accounts"
        
        harness_org_id:
          title: Organization ID
          type: string
          description: "Customer's Harness Organization ID"
        
        harness_project_id:
          title: Project ID
          type: string
          description: "Customer's Harness Project ID"
        
        target_api_key:
          title: Customer API Key
          type: string
          description: "Customer's Harness API Key with admin permissions"
          ui:widget: password
        
        target_api_key_email:
          title: API Key Email
          type: string
          description: "Email associated with the customer's API key"
          format: email
    
    - title: Infrastructure
      properties:
        deployment_target:
          title: Deployment Target
          type: string
          description: "Where to deploy the demo app"
          default: eks
          enum:
            - eks
            - asg
        
        eks_cluster_name:
          title: EKS Cluster Name
          type: string
          description: "Cluster name used by the canonical provisioner workflows"
          default: "harness-eks-parson"
    
    - title: Harness Resources
      properties:
        create_harness_environment:
          title: Create Dev Environment?
          type: string
          description: "Create Harness dev environment and infrastructure"
          default: "true"
          enum:
            - "true"
            - "false"
        
        create_prod_environment:
          title: Create Prod Environment?
          type: string
          description: "Create Harness prod environment and infrastructure"
          default: "true"
          enum:
            - "true"
            - "false"

    - title: Application Source
      properties:
        source_github_repo:
          title: Source GitHub Repo
          type: string
          description: "Source GitHub repository to import into Harness Code"
          default: "parson-harness/harness-demo-app"
    
    - title: Advanced Options
      properties:
        force_recreate:
          title: Force Recreate?
          type: string
          description: "Delete existing resources before provisioning"
          default: "false"
          enum:
            - "true"
            - "false"
          ui:help: "⚠️ Use with caution - will destroy existing AWS infrastructure"

  steps:
    - id: trigger
      name: Provisioning Customer Infrastructure
      action: trigger:harness-custom-pipeline
      input:
        url: "https://app.harness.io/ng/account/EeRjnXTnS4GrLG5VNNJZUw/all/orgs/sandbox/projects/parson/pipelines/idp_pov_provisioner/pipeline-studio/?storeType=REMOTE&connectorRef=parsongh&repoName=harness-demo-app&branch=main"
        inputset:
          owner: ${{ parameters.owner }}
          harness_account_id: ${{ parameters.harness_account_id }}
          harness_endpoint: ${{ parameters.harness_cluster }}
          harness_org_id: ${{ parameters.harness_org_id }}
          harness_project_id: ${{ parameters.harness_project_id }}
          target_api_key: ${{ parameters.target_api_key }}
          target_api_key_email: ${{ parameters.target_api_key_email }}
          deployment_target: ${{ parameters.deployment_target }}
          eks_cluster_name: ${{ parameters.eks_cluster_name }}
          create_harness_environment: ${{ parameters.create_harness_environment }}
          create_prod_environment: ${{ parameters.create_prod_environment }}
          source_github_repo: ${{ parameters.source_github_repo }}
          force_recreate: ${{ parameters.force_recreate }}
        apikey: ${{ parameters.token }}
