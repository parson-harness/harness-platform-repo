    - stage:
        name: Orphan Cleanup
        identifier: orphan_cleanup
        description: Clean up orphaned resources when no workspace exists (API-only cleanup)
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.create_workspace.spec.execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "404"
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Cleanup Orphaned Resources
                  identifier: cleanup_orphans
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - parson-eks-delegate
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=============================================="
                          echo "  Orphan Cleanup (No Workspace Found)"
                          echo "=============================================="
                          echo ""
                          echo "No IACM workspace exists for owner: ${OWNER}"
                          echo "Cleaning up any orphaned resources before creating fresh workspace..."
                          echo ""

                          # Helper function
                          api_delete() {
                            local NAME="$1"
                            local URL="$2"
                            echo -n "  ${NAME}: "
                            RESP=$(curl -s -w "\n%{http_code}" -X DELETE "${URL}" \
                              -H "x-api-key: ${API_KEY}" 2>/dev/null)
                            HTTP_CODE=$(echo "$RESP" | tail -n1)
                            case "$HTTP_CODE" in
                              200|204) echo "deleted" ;;
                              404) echo "not found" ;;
                              *) echo "error ($HTTP_CODE)" ;;
                            esac
                          }

                          echo "=== Pipelines ==="
                          api_delete "${OWNER}_ci_build" "${ENDPOINT}/pipeline/api/pipelines/${OWNER}_ci_build?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"
                          api_delete "${OWNER}_standard_ci_gradle" "${ENDPOINT}/pipeline/api/pipelines/${OWNER}_standard_ci_gradle?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"
                          api_delete "${OWNER}_k8s_strategy_deploy" "${ENDPOINT}/pipeline/api/pipelines/${OWNER}_k8s_strategy_deploy?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"
                          api_delete "${OWNER}_asg_ci_build" "${ENDPOINT}/pipeline/api/pipelines/${OWNER}_asg_ci_build?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"
                          api_delete "${OWNER}_asg_strategy_deploy" "${ENDPOINT}/pipeline/api/pipelines/${OWNER}_asg_strategy_deploy?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"

                          echo ""
                          echo "=== Service ==="
                          api_delete "${OWNER}_demo_app" "${ENDPOINT}/ng/api/servicesV2/${OWNER}_demo_app?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true"
                          api_delete "${OWNER}_demo_app_asg" "${ENDPOINT}/ng/api/servicesV2/${OWNER}_demo_app_asg?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true"

                          echo ""
                          echo "=== Environments ==="
                          api_delete "${OWNER}_dev" "${ENDPOINT}/ng/api/environmentsV2/${OWNER}_dev?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true"

                          echo ""
                          echo "=== Infrastructures ==="
                          api_delete "${OWNER}_k8s_dev" "${ENDPOINT}/ng/api/infrastructures/${OWNER}_k8s_dev?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&environmentIdentifier=${OWNER}_dev&forceDelete=true"
                          api_delete "${OWNER}_k8s_prod" "${ENDPOINT}/ng/api/infrastructures/${OWNER}_k8s_prod?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&environmentIdentifier=${OWNER}_prod&forceDelete=true"
                          api_delete "${OWNER}_asg_dev" "${ENDPOINT}/ng/api/infrastructures/${OWNER}_asg_dev?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&environmentIdentifier=${OWNER}_dev&forceDelete=true"

                          echo ""
                          echo "=== Connectors ==="
                          api_delete "${OWNER}_k8s_reference_architecture" "${ENDPOINT}/ng/api/connectors/${OWNER}_k8s_reference_architecture?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true"
                          api_delete "${OWNER}_aws_reference_architecture" "${ENDPOINT}/ng/api/connectors/${OWNER}_aws_reference_architecture?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true"

                          echo ""
                          echo "=== HAR Registry ==="
                          api_delete "har-${OWNER}" "${ENDPOINT}/har/api/v1/v1/registry/${ACCOUNT_ID}/${ORG_ID}/${PROJECT_ID}/har-${OWNER}/+"

                          echo ""
                          echo "=== Harness Code Repo ==="
                          api_delete "${OWNER}-demo-app" "${ENDPOINT}/code/api/v1/repos/${OWNER}-demo-app?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"

                          if [ "<+pipeline.variables.deployment_target>" = "asg" ]; then
                            echo ""
                            echo "=== ASG AWS Resources ==="
                            ASG_PREFIX="harness-demo-${OWNER}-asg"

                            ASGS=$(aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, '${ASG_PREFIX}')].AutoScalingGroupName" --output text 2>/dev/null || true)
                            if [ -n "$ASGS" ] && [ "$ASGS" != "None" ]; then
                              for ASG in $ASGS; do
                                echo "  ${ASG}: deleting"
                                aws autoscaling update-auto-scaling-group --auto-scaling-group-name "$ASG" --min-size 0 --max-size 0 --desired-capacity 0 2>/dev/null || true
                                aws autoscaling delete-auto-scaling-group --auto-scaling-group-name "$ASG" --force-delete 2>/dev/null || true
                              done
                            else
                              echo "  No ASGs found with prefix ${ASG_PREFIX}"
                            fi

                            LT_ID=$(aws ec2 describe-launch-templates --filters "Name=launch-template-name,Values=${ASG_PREFIX}-lt" --query 'LaunchTemplates[0].LaunchTemplateId' --output text 2>/dev/null || true)
                            if [ -n "$LT_ID" ] && [ "$LT_ID" != "None" ]; then
                              echo "  ${ASG_PREFIX}-lt: deleting"
                              aws ec2 delete-launch-template --launch-template-id "$LT_ID" 2>/dev/null || true
                            else
                              echo "  ${ASG_PREFIX}-lt: not found"
                            fi

                            ALB_ARN=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?LoadBalancerName=='${ASG_PREFIX}-alb'].LoadBalancerArn" --output text 2>/dev/null || true)
                            if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
                              echo "  ${ASG_PREFIX}-alb: deleting"
                              aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN" 2>/dev/null || true
                            else
                              echo "  ${ASG_PREFIX}-alb: not found"
                            fi

                            for TG in "${ASG_PREFIX}-prod-tg" "${ASG_PREFIX}-stage-tg"; do
                              TG_ARN=$(aws elbv2 describe-target-groups --names "$TG" --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || true)
                              if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
                                echo "  ${TG}: deleting"
                                aws elbv2 delete-target-group --target-group-arn "$TG_ARN" 2>/dev/null || true
                              else
                                echo "  ${TG}: not found"
                              fi
                            done

                            PROFILE_NAME="${ASG_PREFIX}-instance-profile"
                            ROLE_NAME_APP="${ASG_PREFIX}-instance-role"
                            if aws iam get-instance-profile --instance-profile-name "$PROFILE_NAME" 2>/dev/null >/dev/null; then
                              echo "  ${PROFILE_NAME}: deleting"
                              aws iam remove-role-from-instance-profile --instance-profile-name "$PROFILE_NAME" --role-name "$ROLE_NAME_APP" 2>/dev/null || true
                              aws iam delete-instance-profile --instance-profile-name "$PROFILE_NAME" 2>/dev/null || true
                            else
                              echo "  ${PROFILE_NAME}: not found"
                            fi

                            if aws iam get-role --role-name "$ROLE_NAME_APP" 2>/dev/null >/dev/null; then
                              APP_POLICIES=$(aws iam list-role-policies --role-name "$ROLE_NAME_APP" --query 'PolicyNames[]' --output text 2>/dev/null || true)
                              if [ -n "$APP_POLICIES" ] && [ "$APP_POLICIES" != "None" ]; then
                                for POLICY in $APP_POLICIES; do
                                  aws iam delete-role-policy --role-name "$ROLE_NAME_APP" --policy-name "$POLICY" 2>/dev/null || true
                                done
                              fi
                              APP_ATTACHED=$(aws iam list-attached-role-policies --role-name "$ROLE_NAME_APP" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null || true)
                              if [ -n "$APP_ATTACHED" ] && [ "$APP_ATTACHED" != "None" ]; then
                                for ARN in $APP_ATTACHED; do
                                  aws iam detach-role-policy --role-name "$ROLE_NAME_APP" --policy-arn "$ARN" 2>/dev/null || true
                                done
                              fi
                              aws iam delete-role --role-name "$ROLE_NAME_APP" 2>/dev/null || true
                              echo "  ${ROLE_NAME_APP}: deleted"
                            else
                              echo "  ${ROLE_NAME_APP}: not found"
                            fi

                            VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=${ASG_PREFIX}-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || true)
                            if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
                              for SG in $(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=${VPC_ID}" --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null || true); do
                                aws ec2 delete-security-group --group-id "$SG" 2>/dev/null || true
                              done
                              for SUBNET in $(aws ec2 describe-subnets --filters "Name=vpc-id,Values=${VPC_ID}" --query 'Subnets[].SubnetId' --output text 2>/dev/null || true); do
                                aws ec2 delete-subnet --subnet-id "$SUBNET" 2>/dev/null || true
                              done
                              for RT in $(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=${VPC_ID}" --query 'RouteTables[?Associations[?Main!=`true`]].RouteTableId' --output text 2>/dev/null || true); do
                                for ASSOC in $(aws ec2 describe-route-tables --route-table-ids "$RT" --query 'RouteTables[0].Associations[?Main!=`true`].RouteTableAssociationId' --output text 2>/dev/null || true); do
                                  aws ec2 disassociate-route-table --association-id "$ASSOC" 2>/dev/null || true
                                done
                                aws ec2 delete-route-table --route-table-id "$RT" 2>/dev/null || true
                              done
                              for IGW in $(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=${VPC_ID}" --query 'InternetGateways[].InternetGatewayId' --output text 2>/dev/null || true); do
                                aws ec2 detach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$VPC_ID" 2>/dev/null || true
                                aws ec2 delete-internet-gateway --internet-gateway-id "$IGW" 2>/dev/null || true
                              done
                              aws ec2 delete-vpc --vpc-id "$VPC_ID" 2>/dev/null || true
                              echo "  ${ASG_PREFIX}-vpc: delete attempted"
                            else
                              echo "  ${ASG_PREFIX}-vpc: not found"
                            fi

                            ZONE_ID="Z031547912F6D8STOXRA2"
                            DNS_RECORD="${OWNER}-asg.harness-demo.dev"
                            CURRENT=$(aws route53 list-resource-record-sets --hosted-zone-id "${ZONE_ID}" --query "ResourceRecordSets[?Name=='${DNS_RECORD}.']" --output json 2>/dev/null)
                            if [ "$CURRENT" != "[]" ] && [ -n "$CURRENT" ]; then
                              TTL=$(echo "$CURRENT" | jq -r '.[0].TTL')
                              VALUE=$(echo "$CURRENT" | jq -r '.[0].ResourceRecords[0].Value')
                              aws route53 change-resource-record-sets --hosted-zone-id "${ZONE_ID}" --change-batch "{\"Changes\":[{\"Action\":\"DELETE\",\"ResourceRecordSet\":{\"Name\":\"${DNS_RECORD}\",\"Type\":\"CNAME\",\"TTL\":${TTL},\"ResourceRecords\":[{\"Value\":\"${VALUE}\"}]}}]}" 2>/dev/null || true
                              echo "  ${DNS_RECORD}: delete attempted"
                            else
                              echo "  ${DNS_RECORD}: not found"
                            fi
                          fi

                          echo ""
                          echo "=== K8s Namespace ==="
                          NS="harness-demo-${OWNER}"
                          echo -n "  ${NS}: "
                          if kubectl get namespace "${NS}" 2>/dev/null; then
                            kubectl delete namespace "${NS}" --wait=false 2>/dev/null && echo "deleting" || echo "failed"
                          else
                            echo "not found"
                          fi

                          echo ""
                          echo "✓ Orphan cleanup complete"
                    environmentVariables:
                      - name: OWNER
                        type: String
                        value: <+pipeline.variables.owner>
                      - name: ACCOUNT_ID
                        type: String
                        value: <+pipeline.variables.harness_account_id>
                      - name: ORG_ID
                        type: String
                        value: <+pipeline.variables.harness_org_id>
                      - name: PROJECT_ID
                        type: String
                        value: <+pipeline.variables.harness_project_id>
                      - name: API_KEY
                        type: String
                        value: <+pipeline.variables.target_api_key>
                      - name: ENDPOINT
                        type: String
                        value: <+pipeline.variables.harness_endpoint>
                      - name: AWS_DEFAULT_REGION
                        type: String
                        value: us-east-1
                    outputVariables: []
                  timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
    - stage:
        name: Bootstrap Project Governance
        identifier: bootstrap_project_governance
        description: Create or reconcile project-scoped governance assets before provisioning the sandbox workspace
        type: IACM
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.create_opa_policies> == "true"
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          workspace: <+pipeline.variables.harness_project_id>_governance
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: Plan
                  identifier: plan
                  timeout: 15m
                  spec:
                    command: plan
              - step:
                  type: Run
                  name: Show Governance Plan Summary
                  identifier: show_governance_plan_summary
                  spec:
                    shell: Bash
                    command: |
                      echo "=== Project Governance Plan Summary ==="
                      echo "Workspace: <+pipeline.variables.harness_project_id>_governance"
                      echo "Org: <+pipeline.variables.harness_org_id>"
                      echo "Project: <+pipeline.variables.harness_project_id>"
                      echo "======================================"

                      if [ -f /harness/plan.json ]; then
                        echo ""
                        echo "Resources to be created/modified:"
                        jq -r '.resource_changes[] | select(.change.actions | contains(["create"]) or contains(["update"]) or contains(["delete"])) | "  \(.change.actions[0]): \(.type).\(.name)"' /harness/plan.json 2>/dev/null || echo "  (unable to parse plan)"
                      fi
              - step:
                  type: IACMApproval
                  name: Approve Governance Plan
                  identifier: approve_governance_plan
                  spec:
                    autoApprove: true
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: MarkAsSuccess
              - step:
                  type: IACMTerraformPlugin
                  name: Apply
                  identifier: apply
                  timeout: 30m
                  spec:
                    command: apply
    - stage:
        name: Bootstrap Project Factory
        identifier: bootstrap_project_factory
        description: Create or reconcile project-scoped shared connector factory assets before provisioning the sandbox workspace
        type: IACM
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.create_project_factory> == "true"
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          workspace: <+pipeline.variables.harness_project_id>_factory
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: Plan
                  identifier: plan
                  timeout: 15m
                  spec:
                    command: plan
              - step:
                  type: Run
                  name: Show Project Factory Plan Summary
                  identifier: show_project_factory_plan_summary
                  spec:
                    shell: Bash
                    command: |
                      echo "=== Project Factory Plan Summary ==="
                      echo "Workspace: <+pipeline.variables.harness_project_id>_factory"
                      echo "Org: <+pipeline.variables.harness_org_id>"
                      echo "Project: <+pipeline.variables.harness_project_id>"
                      echo "===================================="

                      if [ -f /harness/plan.json ]; then
                        echo ""
                        echo "Resources to be created/modified:"
                        jq -r '.resource_changes[] | select(.change.actions | contains(["create"]) or contains(["update"]) or contains(["delete"])) | "  \(.change.actions[0]): \(.type).\(.name)"' /harness/plan.json 2>/dev/null || echo "  (unable to parse plan)"
                      fi
              - step:
                  type: IACMApproval
                  name: Approve Project Factory Plan
                  identifier: approve_project_factory_plan
                  spec:
                    autoApprove: true
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: MarkAsSuccess
              - step:
                  type: IACMTerraformPlugin
                  name: Apply
                  identifier: apply
                  timeout: 30m
                  spec:
                    command: apply
    - stage:
        name: Plan and Apply
        identifier: plan_and_apply
        description: Plan, approve, and apply infrastructure changes
        type: IACM
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          workspace: <+pipeline.variables.owner>_pov
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: Plan
                  identifier: plan
                  timeout: 15m
                  spec:
                    command: plan
              - step:
                  type: Run
                  name: Show Plan Summary
                  identifier: show_plan_summary
                  spec:
                    shell: Bash
                    command: |
                      RESOLVED_PROFILE="<+pipeline.stages.create_workspace.spec.execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_profile>"
                      ARTIFACT_REGISTRY_TYPE="<+pipeline.stages.create_workspace.spec.execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_artifact_registry_type>"
                      CREATE_DOCKERHUB_UPSTREAM="<+pipeline.stages.create_workspace.spec.execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_create_dockerhub_upstream>"
                      CREATE_STRATEGY_PIPELINE="<+pipeline.variables.create_strategy_pipeline>"
                      CREATE_STANDARD_CI_GRADLE="<+pipeline.variables.create_standard_ci_gradle>"
                      CREATE_ASG_STRATEGY_PIPELINE="<+pipeline.variables.create_asg_strategy_pipeline>"
                      CREATE_ASG_CI_PIPELINE="<+pipeline.variables.create_asg_ci_pipeline>"

                      if [ "<+pipeline.variables.deployment_target>" = "asg" ]; then
                        echo "=== POV Provisioning Plan Summary (ASG Stack) ==="
                      else
                        echo "=== POV Provisioning Plan Summary (EKS Stack) ==="
                      fi
                      echo "Owner: <+pipeline.variables.owner>"
                      echo "Workspace: <+pipeline.variables.owner>_pov"
                      echo "Deployment Target: <+pipeline.variables.deployment_target>"
                      echo "Sandbox Profile: ${RESOLVED_PROFILE}"
                      echo "Profile Defaults Enabled: <+pipeline.variables.use_profile_defaults>"
                      echo "EKS Cluster: <+pipeline.variables.eks_cluster_name>"
                      echo "Account: <+pipeline.variables.harness_account_id>"
                      echo "Org: <+pipeline.variables.harness_org_id>"
                      echo "Project: <+pipeline.variables.harness_project_id>"
                      echo "Harness Code Repo: true"
                      echo "Artifact Registry Type: ${ARTIFACT_REGISTRY_TYPE}"
                      echo "DockerHub Upstream: ${CREATE_DOCKERHUB_UPSTREAM}"
                      if [ "<+pipeline.variables.deployment_target>" = "asg" ]; then
                        echo "ASG Strategy Pipeline: ${CREATE_ASG_STRATEGY_PIPELINE}"
                        echo "ASG CI Pipeline: ${CREATE_ASG_CI_PIPELINE}"
                      else
                        echo "K8s Strategy Pipeline: ${CREATE_STRATEGY_PIPELINE}"
                        echo "Gradle CI Pipeline: ${CREATE_STANDARD_CI_GRADLE}"
                      fi
                      echo "================================================="

                      if [ -f /harness/plan.json ]; then
                        echo ""
                        echo "Resources to be created/modified:"
                        jq -r '.resource_changes[] | select(.change.actions | contains(["create"]) or contains(["update"])) | "  \(.change.actions[0]): \(.type).\(.name)"' /harness/plan.json 2>/dev/null || echo "  (unable to parse plan)"
                      fi
              - step:
                  type: IACMApproval
                  name: Approve Plan
                  identifier: approve_plan
                  spec:
                    autoApprove: true
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: MarkAsSuccess
              - step:
                  type: IACMTerraformPlugin
                  name: Apply
                  identifier: apply
                  timeout: 1h
                  spec:
                    command: apply
              - step:
                  type: Run
                  name: POV Ready
                  identifier: pov_ready
                  spec:
                    shell: Bash
                    command: |
                      RESOLVED_PROFILE="<+pipeline.stages.create_workspace.spec.execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_profile>"
                      ARTIFACT_REGISTRY_TYPE="<+pipeline.stages.create_workspace.spec.execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_artifact_registry_type>"
                      CREATE_STRATEGY_PIPELINE="<+pipeline.variables.create_strategy_pipeline>"
                      CREATE_STANDARD_CI_GRADLE="<+pipeline.variables.create_standard_ci_gradle>"
                      CREATE_ASG_STRATEGY_PIPELINE="<+pipeline.variables.create_asg_strategy_pipeline>"
                      CREATE_ASG_CI_PIPELINE="<+pipeline.variables.create_asg_ci_pipeline>"

                      if [ "<+pipeline.variables.deployment_target>" = "asg" ]; then
                        echo "=============================================="
                        echo "   POV Environment Ready! (ASG Stack)"
                        echo "=============================================="
                        echo ""
                        echo "Owner: <+pipeline.variables.owner>"
                        echo "Workspace: <+pipeline.variables.owner>_pov"
                        echo "Sandbox Profile: ${RESOLVED_PROFILE}"
                        echo "EKS Cluster: <+pipeline.variables.eks_cluster_name>"
                        echo ""
                        echo "Access your POV at:"
                        echo "  Harness: <+pipeline.variables.harness_endpoint>"
                        echo "  Org: <+pipeline.variables.harness_org_id>"
                        echo "  Project: <+pipeline.variables.harness_project_id>"
                        echo ""
                        echo "Resources created:"
                        echo "  - Service: <+pipeline.variables.owner>_demo_app_asg"
                        echo "  - Environment: <+pipeline.variables.owner>_dev"
                        if [ "$CREATE_ASG_STRATEGY_PIPELINE" = "true" ]; then
                          echo "  - Pipeline: <+pipeline.variables.owner>_asg_strategy_deploy"
                        fi
                        if [ "$CREATE_ASG_CI_PIPELINE" = "true" ]; then
                          echo "  - Pipeline: <+pipeline.variables.owner>_asg_ci_build"
                        fi
                        echo "  - Delivery Mode: AMI-based blue/green-ready ASG deployment"
                        echo ""
                        echo "To destroy this POV, run the 'IDP POV Destroyer' pipeline"
                        echo "with owner: <+pipeline.variables.owner> and deployment_target: asg"
                        echo ""
                      else
                        echo "=============================================="
                        echo "   POV Environment Ready! (EKS Stack)"
                        echo "=============================================="
                        echo ""
                        echo "Owner: <+pipeline.variables.owner>"
                        echo "Workspace: <+pipeline.variables.owner>_pov"
                        echo "Sandbox Profile: ${RESOLVED_PROFILE}"
                        echo "EKS Cluster: <+pipeline.variables.eks_cluster_name>"
                        echo ""
                        echo "Access your POV at:"
                        echo "  Harness: <+pipeline.variables.harness_endpoint>"
                        echo "  Org: <+pipeline.variables.harness_org_id>"
                        echo "  Project: <+pipeline.variables.harness_project_id>"
                        echo ""
                        echo "Resources created:"
                        echo "  - K8s Namespace: harness-demo-<+pipeline.variables.owner>"
                        echo "  - Service: <+pipeline.variables.owner>_demo_app"
                        echo "  - Environment: <+pipeline.variables.owner>_dev"
                        if [ "$CREATE_STRATEGY_PIPELINE" = "true" ]; then
                          echo "  - Pipeline: <+pipeline.variables.owner>_k8s_strategy_deploy"
                        fi
                        if [ "$CREATE_STANDARD_CI_GRADLE" = "true" ]; then
                          echo "  - Pipeline: <+pipeline.variables.owner>_standard_ci_gradle"
                        fi
                        echo "  - Artifact Registry: ${ARTIFACT_REGISTRY_TYPE}"
                        echo ""
                        echo "To destroy this POV, run the 'IDP POV Destroyer' pipeline"
                        echo "with owner: <+pipeline.variables.owner> and deployment_target: eks"
                        echo ""
                      fi

                      if [ -f /harness/outputs.json ]; then
                        echo "Terraform Outputs:"
                        cat /harness/outputs.json | jq '.'
                      fi
    - stage:
        name: Trigger CI Build
        identifier: trigger_ci_build
        description: Trigger the initial CI pipeline for the selected EKS or ASG stack
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Trigger Standard CI Gradle
                  identifier: trigger_ci_gradle
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/pipeline/api/pipeline/execute/<+pipeline.variables.owner>_standard_ci_gradle?accountIdentifier=<+pipeline.variables.harness_account_id>&orgIdentifier=<+pipeline.variables.harness_org_id>&projectIdentifier=<+pipeline.variables.harness_project_id>&moduleType=CI
                    method: POST
                    headers:
                      - key: x-api-key
                        value: <+pipeline.variables.target_api_key>
                      - key: Content-Type
                        value: application/yaml
                    requestBody: |
                      pipeline:
                        identifier: <+pipeline.variables.owner>_standard_ci_gradle
                        properties:
                          ci:
                            codebase:
                              build:
                                type: branch
                                spec:
                                  branch: main
                    assertion: <+httpResponseCode> == 200
                    outputVariables:
                      - name: ci_execution_id
                        value: <+json.select("data.planExecution.uuid", httpResponseBody)>
                        type: String
                  timeout: 2m
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.deployment_target> == "eks" && <+pipeline.variables.create_standard_ci_gradle> == "true"
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: Http
                  name: Trigger ASG CI Pipeline
                  identifier: trigger_asg_ci
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/pipeline/api/pipeline/execute/<+pipeline.variables.owner>_asg_ci_build?accountIdentifier=<+pipeline.variables.harness_account_id>&orgIdentifier=<+pipeline.variables.harness_org_id>&projectIdentifier=<+pipeline.variables.harness_project_id>&moduleType=CI
                    method: POST
                    headers:
                      - key: x-api-key
                        value: <+pipeline.variables.target_api_key>
                      - key: Content-Type
                        value: application/yaml
                    requestBody: |
                      pipeline:
                        identifier: <+pipeline.variables.owner>_asg_ci_build
                        properties:
                          ci:
                            codebase:
                              build:
                                type: branch
                                spec:
                                  branch: main
                    assertion: <+httpResponseCode> == 200
                    outputVariables:
                      - name: ci_execution_id
                        value: <+json.select("data.planExecution.uuid", httpResponseBody)>
                        type: String
                  timeout: 2m
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.deployment_target> == "asg" && <+pipeline.variables.create_asg_ci_pipeline> == "true"
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: ShellScript
                  name: Verify DNS Resolution
                  identifier: verify_dns
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -e
                          
                          OWNER="<+pipeline.variables.owner>"
                          if [ "<+pipeline.variables.deployment_target>" = "asg" ]; then
                            DOMAIN="${OWNER}-asg.harness-demo.dev"
                          else
                            DOMAIN="${OWNER}.harness-demo.dev"
                          fi
                          
                          echo "=============================================="
                          echo "   Verifying DNS Resolution"
                          echo "=============================================="
                          echo ""
                          echo "Checking: ${DOMAIN}"
                          echo ""
                          
                          # Try DNS resolution with retries (DNS propagation can take time)
                          MAX_RETRIES=3
                          RETRY_DELAY=10
                          DNS_OK=false
                          
                          for i in $(seq 1 $MAX_RETRIES); do
                            echo "Attempt $i of $MAX_RETRIES..."
                            if nslookup "$DOMAIN" 2>/dev/null | grep -q "Address"; then
                              DNS_OK=true
                              echo "✅ DNS resolution successful!"
                              nslookup "$DOMAIN" 2>/dev/null | tail -5
                              break
                            else
                              echo "⏳ DNS not resolving yet..."
                              if [ $i -lt $MAX_RETRIES ]; then
                                echo "   Waiting ${RETRY_DELAY}s before retry..."
                                sleep $RETRY_DELAY
                              fi
                            fi
                          done
                          
                          echo ""
                          if [ "$DNS_OK" = "true" ]; then
                            echo "✅ DNS is configured correctly for ${DOMAIN}"
                            echo "   The app will be accessible at: https://${DOMAIN}"
                          else
                            echo "⚠️  WARNING: DNS resolution failed for ${DOMAIN}"
                            echo ""
                            if [ "<+pipeline.variables.deployment_target>" = "asg" ]; then
                              echo "   This may indicate:"
                              echo "   1. DNS propagation is still in progress (wait a few minutes)"
                              echo "   2. The ASG Route53 record has not propagated yet"
                              echo ""
                              echo "   Continuing anyway - DNS may propagate later."
                            else
                              echo "   This may indicate:"
                              echo "   1. DNS propagation is still in progress (wait a few minutes)"
                              echo "   2. The shared_alb_dns_name variable may be incorrect"
                              echo ""
                              echo "   Current shared ALB: <+pipeline.variables.shared_alb_dns_name>"
                              echo ""
                              echo "   To verify/update the ALB DNS name:"
                              echo "   kubectl get ingress -A -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}'"
                              echo ""
                              echo "   Continuing anyway - DNS may propagate later."
                            fi
                          fi
                    environmentVariables: []
                    outputVariables: []
                  timeout: 2m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: ShellScript
                  name: POV Provisioning Complete
                  identifier: pov_complete
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          RESOLVED_PROFILE="<+pipeline.stages.create_workspace.spec.execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_profile>"
                          ARTIFACT_REGISTRY_TYPE="<+pipeline.stages.create_workspace.spec.execution.steps.resolve_sandbox_profile.output.outputVariables.resolved_artifact_registry_type>"
                          CREATE_STRATEGY_PIPELINE="<+pipeline.variables.create_strategy_pipeline>"
                          CREATE_STANDARD_CI_GRADLE="<+pipeline.variables.create_standard_ci_gradle>"
                          CREATE_ASG_STRATEGY_PIPELINE="<+pipeline.variables.create_asg_strategy_pipeline>"
                          CREATE_ASG_CI_PIPELINE="<+pipeline.variables.create_asg_ci_pipeline>"

                          if [ "<+pipeline.variables.deployment_target>" = "asg" ]; then
                            echo "=============================================="
                            echo "   POV Provisioning Complete! (ASG Stack)"
                            echo "=============================================="
                            echo ""
                            echo "Owner: <+pipeline.variables.owner>"
                            echo "Sandbox Profile: ${RESOLVED_PROFILE}"
                            echo "EKS Cluster: <+pipeline.variables.eks_cluster_name>"
                            echo ""
                            echo "Harness Code Repo: <+pipeline.variables.owner>-demo-app"
                            echo "  (Terraform-managed, imported from: <+pipeline.variables.source_github_repo>)"
                            echo ""
                            echo "All resources are managed by Terraform state."
                            echo "To destroy, run 'terraform destroy' or the POV Destroyer pipeline."
                            echo ""
                            if [ "$CREATE_ASG_CI_PIPELINE" = "true" ]; then
                              echo "The CI build will:"
                              echo "  1. Clone from Harness Code repo"
                              echo "  2. Build the application and bake a Packer AMI"
                              echo "  3. Publish the AMI name for ASG deployment"
                            else
                              echo "No initial CI pipeline was enabled for this sandbox profile."
                            fi
                            echo ""
                            echo "Pipelines created:"
                            if [ "$CREATE_ASG_CI_PIPELINE" = "true" ]; then
                              echo "  - <+pipeline.variables.owner>_asg_ci_build (CI)"
                            fi
                            if [ "$CREATE_ASG_STRATEGY_PIPELINE" = "true" ]; then
                              echo "  - <+pipeline.variables.owner>_asg_strategy_deploy (CD)"
                            fi
                            echo ""
                            echo "App URL: https://<+pipeline.variables.owner>-asg.harness-demo.dev"
                            echo "=============================================="
                          else
                            echo "=============================================="
                            echo "   POV Provisioning Complete! (EKS Stack)"
                            echo "=============================================="
                            echo ""
                            echo "Owner: <+pipeline.variables.owner>"
                            echo "Sandbox Profile: ${RESOLVED_PROFILE}"
                            echo "EKS Cluster: <+pipeline.variables.eks_cluster_name>"
                            echo ""
                            echo "Harness Code Repo: <+pipeline.variables.owner>-demo-app"
                            echo "  (Terraform-managed, imported from: <+pipeline.variables.source_github_repo>)"
                            echo "Artifact Registry: ${ARTIFACT_REGISTRY_TYPE}"
                            echo ""
                            echo "All resources are managed by Terraform state."
                            echo "To destroy, run 'terraform destroy' or the POV Destroyer pipeline."
                            echo ""
                            if [ "$CREATE_STANDARD_CI_GRADLE" = "true" ]; then
                              echo "The initial CI build will:"
                              echo "  1. Clone from Harness Code repo"
                              echo "  2. Run the recommended Gradle CI + intelligence flow"
                              echo "  3. Build the Docker image"
                              echo "  4. Push to ${ARTIFACT_REGISTRY_TYPE}"
                              if [ "$CREATE_STRATEGY_PIPELINE" = "true" ]; then
                                echo "  5. Trigger deployment automatically"
                              fi
                            else
                              echo "No initial CI pipeline was enabled for this sandbox profile."
                            fi
                            echo ""
                            echo "Pipelines created:"
                            if [ "$CREATE_STANDARD_CI_GRADLE" = "true" ]; then
                              echo "  - <+pipeline.variables.owner>_standard_ci_gradle (CI)"
                            fi
                            if [ "$CREATE_STRATEGY_PIPELINE" = "true" ]; then
                              echo "  - <+pipeline.variables.owner>_k8s_strategy_deploy (CD)"
                            fi
                            echo ""
                            echo "App URL: https://<+pipeline.variables.owner>.harness-demo.dev"
                            echo "=============================================="
                          fi
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
