apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-pov-app-canary
  labels:
    app: harness-pov-app
    variant: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harness-pov-app
      variant: canary
  template:
    metadata:
      labels:
        app: harness-pov-app
        variant: canary
    spec:
      containers:
        - name: harness-pov-app
          image: harness-pov-app:2.0.0-canary
          ports:
            - containerPort: 8080
          env:
            - name: DEPLOYMENT_VARIANT
              value: "canary"
            - name: VARIANT_COLOR
              value: "#F59E0B"
            - name: APP_VERSION
              value: "2.0.0-canary"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
