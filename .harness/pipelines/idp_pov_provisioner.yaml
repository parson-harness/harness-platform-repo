pipeline:
  name: IDP POV Provisioner
  identifier: idp_pov_provisioner
  projectIdentifier: parson
  orgIdentifier: sandbox
  description: IDP-triggered pipeline that creates an IACM workspace and provisions a POV environment using the decoupled EKS stack
  tags:
    idp: "true"
    pov: "true"
    iacm: "true"
  allowStageExecutions: false
  concurrency:
    maxConcurrency: 1
    label: pov_provisioner_<+pipeline.variables.owner>
  variables:
    - name: owner
      type: String
      description: Owner name (lowercase, used for resource naming and workspace ID)
      required: true
      value: <+input>
    - name: harness_account_id
      type: String
      description: Target Harness Account ID (for cross-account provisioning)
      required: true
      value: <+input>.default(<+account.identifier>)
    - name: harness_endpoint
      type: String
      description: Harness platform endpoint
      required: true
      value: <+input>.default(https://app.harness.io/gratis)
    - name: github_pat
      type: Secret
      description: GitHub PAT for importing repo to Harness Code (needs repo read access)
      required: true
      value: github_pat
    - name: source_github_repo
      type: String
      description: Source GitHub repo to import (org/repo format)
      required: true
      value: <+input>.default(parson-harness/harness-demo-app)
    - name: provisioner_api_key
      type: Secret
      description: SAT for IACM workspace management in provisioner account (sandbox/parson)
      required: true
      value: acct-automation-svc-acct
    - name: target_api_key
      type: String
      description: API Key for target Harness account (where resources are provisioned). Defaults to provisioner SAT for same-account use.
      required: false
      value: <+input>.default(<+pipeline.variables.provisioner_api_key>)
    - name: target_api_key_email
      type: String
      description: Email associated with the target account API key. Defaults to service account email.
      required: false
      value: <+input>.default(accountautomation@service.harness.io)
    - name: harness_org_id
      type: String
      description: Harness Org ID for the POV
      required: true
      value: <+org.identifier>
    - name: harness_project_id
      type: String
      description: Harness Project ID for the POV
      required: true
      value: <+project.identifier>
    - name: create_harness_org
      type: String
      description: Create new org
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: create_harness_project
      type: String
      description: Create new project
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: eks_cluster_name
      type: String
      description: Existing EKS cluster name to deploy to
      required: true
      value: <+input>.default(harness-eks-parson)
    - name: create_harness_environment
      type: String
      description: Create Harness environment
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_prod_environment
      type: String
      description: Create production environment
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: artifact_registry_type
      type: String
      description: Artifact registry type (har or ecr)
      required: false
      value: <+input>.default(har).allowedValues(har,ecr)
    - name: create_dockerhub_upstream
      type: String
      description: Create DockerHub upstream proxy for HAR (required for pulling base images)
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_strategy_pipeline
      type: String
      description: Create the strategy choice deployment pipeline
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_ci_pipeline
      type: String
      description: Create the Maven CI pipeline (basic, no security scanning - use Gradle CI instead for full features)
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: create_standard_ci_gradle
      type: String
      description: Create Standard CI Gradle pipeline (Test Intelligence, Security Scanning, Supply Chain) - RECOMMENDED
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: acm_cert_arn
      type: String
      description: ACM certificate ARN for HTTPS ingress
      required: false
      value: <+input>.default(arn:aws:acm:us-east-1:759984737373:certificate/9c90d4f8-208d-46cd-bdc1-bc13f1759c05)
    - name: shared_alb_dns_name
      type: String
      description: DNS name of the shared ALB for EKS ingress (e.g., k8s-harnessdemo-xxx.us-east-1.elb.amazonaws.com)
      required: false
      value: <+input>.default(k8s-harnessdemo-d1317bf02a-762333093.us-east-1.elb.amazonaws.com)
    - name: force_recreate
      type: String
      description: If workspace exists, destroy it first and recreate (clean slate). If false, will update existing workspace.
      required: false
      value: <+input>.default(false).allowedValues(true,false)
  stages:
    - stage:
        name: Create Workspace from Template
        identifier: create_workspace
        description: Create a new IACM workspace from the POV_Provisioner template using "Use Template" linkage
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Check Workspace Exists
                  identifier: check_workspace_exists
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov
                    method: GET
                    headers:
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    outputVariables:
                      - name: workspace_exists
                        value: <+httpResponseCode>
                        type: String
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 404
                  timeout: 1m
              - step:
                  type: Http
                  name: Create IACM Workspace
                  identifier: create_iacm_workspace
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces
                    method: POST
                    headers:
                      - key: Content-Type
                        value: application/json
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    inputVariables: []
                    outputVariables:
                      - name: workspace_id
                        value: <+json.select("identifier", httpResponseBody)>
                        type: String
                      - name: response_body
                        value: <+httpResponseBody>
                        type: String
                      - name: response_code
                        value: <+httpResponseCode>
                        type: String
                    requestBody: |
                      {
                        "identifier": "<+pipeline.variables.owner>_pov",
                        "name": "<+pipeline.variables.owner> POV Workspace (EKS)",
                        "description": "POV environment for <+pipeline.variables.owner> - EKS stack (Terraform creates Harness Code repo)",
                        "provisioner": "opentofu",
                        "provisioner_version": "1.11.2",
                        "repository_connector": "parsongh",
                        "repository": "harness-demo-app",
                        "repository_branch": "main",
                        "repository_path": "tofu/stacks/eks",
                        "provider_connector": "aws_oidc_iacm",
                        "cost_estimation_enabled": true,
                        "provider_connectors": [
                          {
                            "connector_ref": "aws_oidc_iacm",
                            "type": "aws"
                          }
                        ],
                        "default_pipelines": {
                          "provision": {
                            "project_pipeline": "pov_provisioning"
                          },
                          "destroy": {
                            "project_pipeline": "pov_destroy"
                          }
                        },
                        "terraform_variables": {
                          "owner": {
                            "key": "owner",
                            "value": "<+pipeline.variables.owner>",
                            "value_type": "string"
                          },
                          "eks_cluster_name": {
                            "key": "eks_cluster_name",
                            "value": "<+pipeline.variables.eks_cluster_name>",
                            "value_type": "string"
                          },
                          "harness_account_id": {
                            "key": "harness_account_id",
                            "value": "<+pipeline.variables.harness_account_id>",
                            "value_type": "string"
                          },
                          "harness_endpoint": {
                            "key": "harness_endpoint",
                            "value": "<+pipeline.variables.harness_endpoint>",
                            "value_type": "string"
                          },
                          "harness_api_key": {
                            "key": "harness_api_key",
                            "value": "acct-automation-svc-acct",
                            "value_type": "secret"
                          },
                          "harness_api_key_email": {
                            "key": "harness_api_key_email",
                            "value": "<+pipeline.variables.target_api_key_email>",
                            "value_type": "string"
                          },
                          "harness_org_id": {
                            "key": "harness_org_id",
                            "value": "<+pipeline.variables.harness_org_id>",
                            "value_type": "string"
                          },
                          "harness_project_id": {
                            "key": "harness_project_id",
                            "value": "<+pipeline.variables.harness_project_id>",
                            "value_type": "string"
                          },
                          "create_harness_org": {
                            "key": "create_harness_org",
                            "value": "<+pipeline.variables.create_harness_org>",
                            "value_type": "string"
                          },
                          "create_harness_project": {
                            "key": "create_harness_project",
                            "value": "<+pipeline.variables.create_harness_project>",
                            "value_type": "string"
                          },
                          "artifact_registry_type": {
                            "key": "artifact_registry_type",
                            "value": "<+pipeline.variables.artifact_registry_type>",
                            "value_type": "string"
                          },
                          "create_dockerhub_upstream": {
                            "key": "create_dockerhub_upstream",
                            "value": "<+pipeline.variables.create_dockerhub_upstream>",
                            "value_type": "string"
                          },
                          "create_strategy_pipeline": {
                            "key": "create_strategy_pipeline",
                            "value": "<+pipeline.variables.create_strategy_pipeline>",
                            "value_type": "string"
                          },
                          "create_ci_pipeline": {
                            "key": "create_ci_pipeline",
                            "value": "<+pipeline.variables.create_ci_pipeline>",
                            "value_type": "string"
                          },
                          "create_standard_ci_gradle": {
                            "key": "create_standard_ci_gradle",
                            "value": "<+pipeline.variables.create_standard_ci_gradle>",
                            "value_type": "string"
                          },
                          "acm_cert_arn": {
                            "key": "acm_cert_arn",
                            "value": "<+pipeline.variables.acm_cert_arn>",
                            "value_type": "string"
                          },
                          "use_harness_code": {
                            "key": "use_harness_code",
                            "value": "true",
                            "value_type": "string"
                          },
                          "github_repo_name": {
                            "key": "github_repo_name",
                            "value": "<+pipeline.variables.source_github_repo>",
                            "value_type": "string"
                          },
                          "github_pat": {
                            "key": "github_pat",
                            "value": "github_pat",
                            "value_type": "secret"
                          },
                          "github_repo_is_public": {
                            "key": "github_repo_is_public",
                            "value": "true",
                            "value_type": "string"
                          },
                          "create_delegate": {
                            "key": "create_delegate",
                            "value": "true",
                            "value_type": "string"
                          },
                          "manage_dns": {
                            "key": "manage_dns",
                            "value": "true",
                            "value_type": "string"
                          },
                          "shared_alb_dns_name": {
                            "key": "shared_alb_dns_name",
                            "value": "<+pipeline.variables.shared_alb_dns_name>",
                            "value_type": "string"
                          }
                        },
                        "environment_variables": {}
                      }
                    assertion: "true"
                  timeout: 2m
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "404"
              - step:
                  type: ShellScript
                  name: Validate Workspace Creation
                  identifier: validate_workspace_creation
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=== Workspace Creation Response ==="
                          echo "Response Code: <+execution.steps.create_iacm_workspace.output.outputVariables.response_code>"
                          echo "Response Body: <+execution.steps.create_iacm_workspace.output.outputVariables.response_body>"
                          echo "==================================="

                          RESPONSE_CODE="<+execution.steps.create_iacm_workspace.output.outputVariables.response_code>"
                          if [ "$RESPONSE_CODE" != "200" ] && [ "$RESPONSE_CODE" != "201" ]; then
                            echo "ERROR: Workspace creation failed with code $RESPONSE_CODE"
                            exit 1
                          fi
                          echo "Workspace created successfully"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "404"
              - step:
                  type: Http
                  name: Link Workspace to Template
                  identifier: link_workspace_template
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspace/templates
                    method: POST
                    headers:
                      - key: Content-Type
                        value: application/json
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    requestBody: |
                      {
                        "template_id": "POV_Provisioner",
                        "version": "1.0",
                        "workspace_id": "<+pipeline.variables.owner>_pov"
                      }
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 201 || <+httpResponseCode> == 409
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: Http
                  name: Update eks_cluster_name Variable
                  identifier: update_eks_cluster_name_var
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov/variables/tf/eks_cluster_name
                    method: PUT
                    headers:
                      - key: Content-Type
                        value: application/json
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    requestBody: |
                      {
                        "value": "<+pipeline.variables.eks_cluster_name>",
                        "value_type": "string"
                      }
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 201
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: ShellScript
                  name: Workspace Created
                  identifier: workspace_created
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=== IACM Workspace Created (EKS Stack) ==="
                          echo "Workspace ID: <+pipeline.variables.owner>_pov"
                          echo "Stack: tofu/stacks/eks"
                          echo ""
                          echo "Owner: <+pipeline.variables.owner>"
                          echo "EKS Cluster: <+pipeline.variables.eks_cluster_name>"
                          echo "Org: <+pipeline.variables.harness_org_id>"
                          echo "Project: <+pipeline.variables.harness_project_id>"
                          echo ""
                          echo "Proceeding to provision Harness entities..."
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
    - stage:
        name: Destroy Existing
        identifier: destroy_existing
        description: Terraform destroy existing workspace before recreating (force_recreate mode)
        type: IACM
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.create_workspace.spec.execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "200" && <+pipeline.variables.force_recreate> == "true"
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          workspace: <+pipeline.variables.owner>_pov
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: Plan Destroy
                  identifier: plan_destroy
                  timeout: 15m
                  spec:
                    command: plan-destroy
              - step:
                  type: Run
                  name: Show Destroy Plan
                  identifier: show_destroy_plan
                  spec:
                    shell: Bash
                    command: |
                      echo "=============================================="
                      echo "  Force Recreate: Destroying Existing POV"
                      echo "=============================================="
                      echo ""
                      echo "Owner: <+pipeline.variables.owner>"
                      echo "Workspace: <+pipeline.variables.owner>_pov"
                      echo ""
                      if [ -f /harness/plan.json ]; then
                        echo "Resources to be destroyed before recreating:"
                        jq -r '.resource_changes[] | select(.change.actions | contains(["delete"])) | "  ✗ \(.type).\(.name)"' /harness/plan.json 2>/dev/null || echo "  (unable to parse plan)"
                      fi
              - step:
                  type: IACMApproval
                  name: Auto Approve Destroy
                  identifier: approve_destroy
                  spec:
                    autoApprove: true
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: MarkAsSuccess
              - step:
                  type: IACMTerraformPlugin
                  name: Destroy
                  identifier: destroy
                  timeout: 30m
                  spec:
                    command: destroy
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: Run
                  name: Destroy Complete
                  identifier: destroy_complete
                  spec:
                    shell: Bash
                    command: |
                      echo "✓ Existing POV destroyed via Terraform"
                      echo "Proceeding to delete workspace and recreate..."
    - stage:
        name: Delete Old Workspace
        identifier: delete_old_workspace
        description: Delete the IACM workspace after Terraform destroy
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.create_workspace.spec.execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "200" && <+pipeline.variables.force_recreate> == "true"
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Delete IACM Workspace
                  identifier: delete_workspace
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov
                    method: DELETE
                    headers:
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 204 || <+httpResponseCode> == 404
                  timeout: 2m
              - step:
                  type: ShellScript
                  name: Workspace Deleted
                  identifier: workspace_deleted
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "✓ Old workspace deleted"
                          echo "Waiting 5 seconds for IACM to process deletion..."
                          sleep 5
                          echo "Will create fresh workspace in next stage..."
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
    - stage:
        name: Recreate Workspace
        identifier: recreate_workspace
        description: Create fresh IACM workspace after force_recreate destroy
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.create_workspace.spec.execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "200" && <+pipeline.variables.force_recreate> == "true"
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Create Fresh Workspace
                  identifier: create_fresh_workspace
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces
                    method: POST
                    headers:
                      - key: Content-Type
                        value: application/json
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    requestBody: |
                      {
                        "identifier": "<+pipeline.variables.owner>_pov",
                        "name": "<+pipeline.variables.owner> POV Workspace (EKS)",
                        "description": "POV environment for <+pipeline.variables.owner> - EKS stack (recreated)",
                        "provisioner": "opentofu",
                        "provisioner_version": "1.11.2",
                        "repository_connector": "parsongh",
                        "repository": "harness-demo-app",
                        "repository_branch": "main",
                        "repository_path": "tofu/stacks/eks",
                        "provider_connector": "aws_oidc_iacm",
                        "cost_estimation_enabled": true,
                        "provider_connectors": [
                          {
                            "connector_ref": "aws_oidc_iacm",
                            "type": "aws"
                          }
                        ],
                        "default_pipelines": {
                          "provision": {
                            "project_pipeline": "pov_provisioning"
                          },
                          "destroy": {
                            "project_pipeline": "pov_destroy"
                          }
                        },
                        "terraform_variables": {
                          "owner": {
                            "key": "owner",
                            "value": "<+pipeline.variables.owner>",
                            "value_type": "string"
                          },
                          "eks_cluster_name": {
                            "key": "eks_cluster_name",
                            "value": "<+pipeline.variables.eks_cluster_name>",
                            "value_type": "string"
                          },
                          "harness_account_id": {
                            "key": "harness_account_id",
                            "value": "<+pipeline.variables.harness_account_id>",
                            "value_type": "string"
                          },
                          "harness_endpoint": {
                            "key": "harness_endpoint",
                            "value": "<+pipeline.variables.harness_endpoint>",
                            "value_type": "string"
                          },
                          "harness_api_key": {
                            "key": "harness_api_key",
                            "value": "acct-automation-svc-acct",
                            "value_type": "secret"
                          },
                          "harness_api_key_email": {
                            "key": "harness_api_key_email",
                            "value": "<+pipeline.variables.target_api_key_email>",
                            "value_type": "string"
                          },
                          "harness_org_id": {
                            "key": "harness_org_id",
                            "value": "<+pipeline.variables.harness_org_id>",
                            "value_type": "string"
                          },
                          "harness_project_id": {
                            "key": "harness_project_id",
                            "value": "<+pipeline.variables.harness_project_id>",
                            "value_type": "string"
                          },
                          "create_harness_org": {
                            "key": "create_harness_org",
                            "value": "<+pipeline.variables.create_harness_org>",
                            "value_type": "string"
                          },
                          "create_harness_project": {
                            "key": "create_harness_project",
                            "value": "<+pipeline.variables.create_harness_project>",
                            "value_type": "string"
                          },
                          "artifact_registry_type": {
                            "key": "artifact_registry_type",
                            "value": "<+pipeline.variables.artifact_registry_type>",
                            "value_type": "string"
                          },
                          "create_dockerhub_upstream": {
                            "key": "create_dockerhub_upstream",
                            "value": "<+pipeline.variables.create_dockerhub_upstream>",
                            "value_type": "string"
                          },
                          "create_strategy_pipeline": {
                            "key": "create_strategy_pipeline",
                            "value": "<+pipeline.variables.create_strategy_pipeline>",
                            "value_type": "string"
                          },
                          "create_ci_pipeline": {
                            "key": "create_ci_pipeline",
                            "value": "<+pipeline.variables.create_ci_pipeline>",
                            "value_type": "string"
                          },
                          "create_standard_ci_gradle": {
                            "key": "create_standard_ci_gradle",
                            "value": "<+pipeline.variables.create_standard_ci_gradle>",
                            "value_type": "string"
                          },
                          "acm_cert_arn": {
                            "key": "acm_cert_arn",
                            "value": "<+pipeline.variables.acm_cert_arn>",
                            "value_type": "string"
                          },
                          "use_harness_code": {
                            "key": "use_harness_code",
                            "value": "true",
                            "value_type": "string"
                          },
                          "github_repo_name": {
                            "key": "github_repo_name",
                            "value": "<+pipeline.variables.source_github_repo>",
                            "value_type": "string"
                          },
                          "github_pat": {
                            "key": "github_pat",
                            "value": "github_pat",
                            "value_type": "secret"
                          },
                          "github_repo_is_public": {
                            "key": "github_repo_is_public",
                            "value": "true",
                            "value_type": "string"
                          },
                          "create_delegate": {
                            "key": "create_delegate",
                            "value": "true",
                            "value_type": "string"
                          },
                          "manage_dns": {
                            "key": "manage_dns",
                            "value": "true",
                            "value_type": "string"
                          },
                          "shared_alb_dns_name": {
                            "key": "shared_alb_dns_name",
                            "value": "<+pipeline.variables.shared_alb_dns_name>",
                            "value_type": "string"
                          }
                        },
                        "environment_variables": {}
                      }
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 201
                  timeout: 2m
              - step:
                  type: ShellScript
                  name: Fresh Workspace Created
                  identifier: fresh_workspace_created
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "✓ Fresh workspace created: <+pipeline.variables.owner>_pov"
                          echo "Proceeding to provision..."
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
    - stage:
        name: Orphan Cleanup
        identifier: orphan_cleanup
        description: Clean up orphaned resources when no workspace exists (API-only cleanup)
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.create_workspace.spec.execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "404"
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Cleanup Orphaned Resources
                  identifier: cleanup_orphans
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - parson-eks-delegate
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=============================================="
                          echo "  Orphan Cleanup (No Workspace Found)"
                          echo "=============================================="
                          echo ""
                          echo "No IACM workspace exists for owner: ${OWNER}"
                          echo "Cleaning up any orphaned resources before creating fresh workspace..."
                          echo ""

                          # Helper function
                          api_delete() {
                            local NAME="$1"
                            local URL="$2"
                            echo -n "  ${NAME}: "
                            RESP=$(curl -s -w "\n%{http_code}" -X DELETE "${URL}" \
                              -H "x-api-key: ${API_KEY}" 2>/dev/null)
                            HTTP_CODE=$(echo "$RESP" | tail -n1)
                            case "$HTTP_CODE" in
                              200|204) echo "deleted" ;;
                              404) echo "not found" ;;
                              *) echo "error ($HTTP_CODE)" ;;
                            esac
                          }

                          echo "=== Pipelines ==="
                          api_delete "${OWNER}_ci_build" "${ENDPOINT}/pipeline/api/pipelines/${OWNER}_ci_build?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"
                          api_delete "${OWNER}_standard_ci_gradle" "${ENDPOINT}/pipeline/api/pipelines/${OWNER}_standard_ci_gradle?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"
                          api_delete "${OWNER}_k8s_strategy_deploy" "${ENDPOINT}/pipeline/api/pipelines/${OWNER}_k8s_strategy_deploy?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"

                          echo ""
                          echo "=== Service ==="
                          api_delete "${OWNER}_demo_app" "${ENDPOINT}/ng/api/servicesV2/${OWNER}_demo_app?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true"

                          echo ""
                          echo "=== Environments ==="
                          api_delete "${OWNER}_dev" "${ENDPOINT}/ng/api/environmentsV2/${OWNER}_dev?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true"

                          echo ""
                          echo "=== Connectors ==="
                          api_delete "${OWNER}_k8s_reference_architecture" "${ENDPOINT}/ng/api/connectors/${OWNER}_k8s_reference_architecture?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true"
                          api_delete "${OWNER}_aws_reference_architecture" "${ENDPOINT}/ng/api/connectors/${OWNER}_aws_reference_architecture?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true"

                          echo ""
                          echo "=== HAR Registry ==="
                          api_delete "har-${OWNER}" "${ENDPOINT}/har/api/v1/v1/registry/${ACCOUNT_ID}/${ORG_ID}/${PROJECT_ID}/har-${OWNER}/+"

                          echo ""
                          echo "=== Harness Code Repo ==="
                          api_delete "${OWNER}-demo-app" "${ENDPOINT}/code/api/v1/repos/${OWNER}-demo-app?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"

                          echo ""
                          echo "=== K8s Namespace ==="
                          NS="harness-demo-${OWNER}"
                          echo -n "  ${NS}: "
                          if kubectl get namespace "${NS}" 2>/dev/null; then
                            kubectl delete namespace "${NS}" --wait=false 2>/dev/null && echo "deleting" || echo "failed"
                          else
                            echo "not found"
                          fi

                          echo ""
                          echo "✓ Orphan cleanup complete"
                    environmentVariables:
                      - name: OWNER
                        type: String
                        value: <+pipeline.variables.owner>
                      - name: ACCOUNT_ID
                        type: String
                        value: <+pipeline.variables.harness_account_id>
                      - name: ORG_ID
                        type: String
                        value: <+pipeline.variables.harness_org_id>
                      - name: PROJECT_ID
                        type: String
                        value: <+pipeline.variables.harness_project_id>
                      - name: API_KEY
                        type: String
                        value: <+pipeline.variables.target_api_key>
                      - name: ENDPOINT
                        type: String
                        value: <+pipeline.variables.harness_endpoint>
                    outputVariables: []
                  timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
    - stage:
        name: Plan and Apply
        identifier: plan_and_apply
        description: Plan, approve, and apply infrastructure changes
        type: IACM
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          workspace: <+pipeline.variables.owner>_pov
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: Run
                  name: Fix Stale State
                  identifier: fix_stale_state
                  spec:
                    shell: Bash
                    command: |
                      echo "=============================================="
                      echo "  Fix Stale State - Remove 404'd Resources"
                      echo "=============================================="
                      echo ""
                      echo "If the previous run partially applied then resources"
                      echo "were deleted outside Terraform, the state has stale"
                      echo "entries that crash plan during refresh. Remove them."
                      echo ""

                      # Find the tofu binary
                      TOFU=$(find /harness/.iacmbin-*/opentofu/tofu -type f 2>/dev/null | head -1)
                      if [ -z "$TOFU" ]; then
                        TOFU=$(which tofu 2>/dev/null || which terraform 2>/dev/null || echo "")
                      fi
                      if [ -z "$TOFU" ]; then
                        echo "WARNING: Cannot find tofu/terraform binary, skipping state fix"
                        exit 0
                      fi
                      echo "Using binary: $TOFU"
                      echo ""

                      # Check if there's any state at all
                      RESOURCE_COUNT=$($TOFU state list 2>/dev/null | wc -l)
                      if [ "$RESOURCE_COUNT" -eq 0 ]; then
                        echo "No resources in state - fresh workspace, nothing to fix"
                        exit 0
                      fi
                      echo "Resources in state: ${RESOURCE_COUNT}"
                      echo ""

                      # Function to check a Harness resource and remove from state if 404
                      check_and_remove() {
                        local LABEL="$1"
                        local CHECK_URL="$2"
                        local STATE_ADDR="$3"

                        echo -n "  ${LABEL}: "

                        # First check if it's even in state
                        if ! $TOFU state list 2>/dev/null | grep -qF "${STATE_ADDR}"; then
                          echo "not in state (skip)"
                          return
                        fi

                        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CHECK_URL}" \
                          -H "x-api-key: <+pipeline.variables.target_api_key>")

                        if [ "$HTTP_CODE" = "404" ]; then
                          echo "404 - removing from state"
                          $TOFU state rm "${STATE_ADDR}" 2>/dev/null || echo "    (state rm failed)"
                        elif [ "$HTTP_CODE" = "200" ]; then
                          echo "exists (OK)"
                        else
                          echo "HTTP ${HTTP_CODE} - leaving in state"
                        fi
                      }

                      OWNER="<+pipeline.variables.owner>"
                      ENDPOINT="<+pipeline.variables.harness_endpoint>"
                      ACCOUNT_ID="<+pipeline.variables.harness_account_id>"
                      ORG_ID="<+pipeline.variables.harness_org_id>"
                      PROJECT_ID="<+pipeline.variables.harness_project_id>"

                      echo "=== Harness Artifact Registry ==="
                      check_and_remove \
                        "HAR upstream proxy (${OWNER}-dockerhub-proxy)" \
                        "${ENDPOINT}/har/api/v1/registry/${ACCOUNT_ID}/${ORG_ID}/${PROJECT_ID}/${OWNER}-dockerhub-proxy/%2B" \
                        'module.har[0].harness_platform_har_registry.dockerhub_upstream[0]'

                      check_and_remove \
                        "HAR virtual registry (har-${OWNER})" \
                        "${ENDPOINT}/har/api/v1/registry/${ACCOUNT_ID}/${ORG_ID}/${PROJECT_ID}/har-${OWNER}/%2B" \
                        'module.har[0].harness_platform_har_registry.registry'

                      # Also remove the cleanup terraform_data if HAR is gone
                      HAR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                        "${ENDPOINT}/har/api/v1/registry/${ACCOUNT_ID}/${ORG_ID}/${PROJECT_ID}/${OWNER}-dockerhub-proxy/%2B" \
                        -H "x-api-key: <+pipeline.variables.target_api_key>")
                      if [ "$HAR_STATUS" = "404" ]; then
                        echo -n "  HAR cleanup data: "
                        $TOFU state rm 'module.har[0].terraform_data.cleanup_existing_registry[0]' 2>/dev/null && echo "removed" || echo "(not in state)"
                      fi

                      echo ""
                      echo "=== Harness Code Repository ==="
                      check_and_remove \
                        "Code repo (${OWNER}-demo-app)" \
                        "${ENDPOINT}/code/api/v1/repos/${OWNER}-demo-app?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}" \
                        'module.harness_code_repo[0].harness_platform_repo.main[0]'

                      echo ""
                      echo "=== Updated State ==="
                      RESOURCE_COUNT=$($TOFU state list 2>/dev/null | wc -l)
                      echo "Resources remaining in state: ${RESOURCE_COUNT}"
                      echo ""
                      echo "State fix complete. Proceeding to plan..."
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                          spec: {}
              - step:
                  type: IACMTerraformPlugin
                  name: Plan
                  identifier: plan
                  timeout: 15m
                  spec:
                    command: plan
              - step:
                  type: Run
                  name: Show Plan Summary
                  identifier: show_plan_summary
                  spec:
                    shell: Bash
                    command: |
                      echo "=== POV Provisioning Plan Summary (EKS Stack) ==="
                      echo "Owner: <+pipeline.variables.owner>"
                      echo "Workspace: <+pipeline.variables.owner>_pov"
                      echo "EKS Cluster: <+pipeline.variables.eks_cluster_name>"
                      echo "Account: <+pipeline.variables.harness_account_id>"
                      echo "Org: <+pipeline.variables.harness_org_id>"
                      echo "Project: <+pipeline.variables.harness_project_id>"
                      echo "================================================="

                      if [ -f /harness/plan.json ]; then
                        echo ""
                        echo "Resources to be created/modified:"
                        jq -r '.resource_changes[] | select(.change.actions | contains(["create"]) or contains(["update"])) | "  \(.change.actions[0]): \(.type).\(.name)"' /harness/plan.json 2>/dev/null || echo "  (unable to parse plan)"
                      fi
              - step:
                  type: IACMApproval
                  name: Approve Plan
                  identifier: approve_plan
                  spec:
                    autoApprove: true
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: MarkAsSuccess
              - step:
                  type: IACMTerraformPlugin
                  name: Apply
                  identifier: apply
                  timeout: 1h
                  spec:
                    command: apply
              - step:
                  type: Run
                  name: POV Ready
                  identifier: pov_ready
                  spec:
                    shell: Bash
                    command: |
                      echo "=============================================="
                      echo "   POV Environment Ready! (EKS Stack)"
                      echo "=============================================="
                      echo ""
                      echo "Owner: <+pipeline.variables.owner>"
                      echo "Workspace: <+pipeline.variables.owner>_pov"
                      echo "EKS Cluster: <+pipeline.variables.eks_cluster_name>"
                      echo ""
                      echo "Access your POV at:"
                      echo "  Harness: <+pipeline.variables.harness_endpoint>"
                      echo "  Org: <+pipeline.variables.harness_org_id>"
                      echo "  Project: <+pipeline.variables.harness_project_id>"
                      echo ""
                      echo "Resources created:"
                      echo "  - K8s Namespace: harness-demo-<+pipeline.variables.owner>"
                      echo "  - Service: <+pipeline.variables.owner>_demo_app"
                      echo "  - Environment: <+pipeline.variables.owner>_dev"
                      echo "  - Pipeline: <+pipeline.variables.owner>_k8s_strategy_deploy"
                      echo ""
                      echo "To destroy this POV, run the 'IDP POV Destroyer' pipeline"
                      echo "with owner: <+pipeline.variables.owner>"
                      echo ""

                      if [ -f /harness/outputs.json ]; then
                        echo "Terraform Outputs:"
                        cat /harness/outputs.json | jq '.'
                      fi
    - stage:
        name: Trigger CI Build
        identifier: trigger_ci_build
        description: Trigger the CI pipeline to build initial Docker image (prefers Gradle CI if enabled)
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Trigger Standard CI Gradle
                  identifier: trigger_ci_gradle
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/pipeline/api/pipeline/execute/<+pipeline.variables.owner>_standard_ci_gradle?accountIdentifier=<+pipeline.variables.harness_account_id>&orgIdentifier=<+pipeline.variables.harness_org_id>&projectIdentifier=<+pipeline.variables.harness_project_id>&moduleType=CI
                    method: POST
                    headers:
                      - key: x-api-key
                        value: <+pipeline.variables.target_api_key>
                      - key: Content-Type
                        value: application/yaml
                    requestBody: |
                      pipeline:
                        identifier: <+pipeline.variables.owner>_standard_ci_gradle
                        properties:
                          ci:
                            codebase:
                              build:
                                type: branch
                                spec:
                                  branch: main
                    assertion: <+httpResponseCode> == 200
                    outputVariables:
                      - name: ci_execution_id
                        value: <+json.select("data.planExecution.uuid", httpResponseBody)>
                        type: String
                  timeout: 2m
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.create_standard_ci_gradle> == "true"
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: Http
                  name: Trigger Maven CI Pipeline
                  identifier: trigger_ci_maven
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/pipeline/api/pipeline/execute/<+pipeline.variables.owner>_ci_build?accountIdentifier=<+pipeline.variables.harness_account_id>&orgIdentifier=<+pipeline.variables.harness_org_id>&projectIdentifier=<+pipeline.variables.harness_project_id>&moduleType=CI
                    method: POST
                    headers:
                      - key: x-api-key
                        value: <+pipeline.variables.target_api_key>
                      - key: Content-Type
                        value: application/yaml
                    requestBody: |
                      pipeline:
                        identifier: <+pipeline.variables.owner>_ci_build
                        properties:
                          ci:
                            codebase:
                              build:
                                type: branch
                                spec:
                                  branch: main
                    assertion: <+httpResponseCode> == 200
                    outputVariables:
                      - name: ci_execution_id
                        value: <+json.select("data.planExecution.uuid", httpResponseBody)>
                        type: String
                  timeout: 2m
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.create_ci_pipeline> == "true" && <+pipeline.variables.create_standard_ci_gradle> != "true"
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: ShellScript
                  name: Verify DNS Resolution
                  identifier: verify_dns
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -e
                          
                          OWNER="<+pipeline.variables.owner>"
                          DOMAIN="${OWNER}.harness-demo.dev"
                          
                          echo "=============================================="
                          echo "   Verifying DNS Resolution"
                          echo "=============================================="
                          echo ""
                          echo "Checking: ${DOMAIN}"
                          echo ""
                          
                          # Try DNS resolution with retries (DNS propagation can take time)
                          MAX_RETRIES=3
                          RETRY_DELAY=10
                          DNS_OK=false
                          
                          for i in $(seq 1 $MAX_RETRIES); do
                            echo "Attempt $i of $MAX_RETRIES..."
                            if nslookup "$DOMAIN" 2>/dev/null | grep -q "Address"; then
                              DNS_OK=true
                              echo "✅ DNS resolution successful!"
                              nslookup "$DOMAIN" 2>/dev/null | tail -5
                              break
                            else
                              echo "⏳ DNS not resolving yet..."
                              if [ $i -lt $MAX_RETRIES ]; then
                                echo "   Waiting ${RETRY_DELAY}s before retry..."
                                sleep $RETRY_DELAY
                              fi
                            fi
                          done
                          
                          echo ""
                          if [ "$DNS_OK" = "true" ]; then
                            echo "✅ DNS is configured correctly for ${DOMAIN}"
                            echo "   The app will be accessible at: https://${DOMAIN}"
                          else
                            echo "⚠️  WARNING: DNS resolution failed for ${DOMAIN}"
                            echo ""
                            echo "   This may indicate:"
                            echo "   1. DNS propagation is still in progress (wait a few minutes)"
                            echo "   2. The shared_alb_dns_name variable may be incorrect"
                            echo ""
                            echo "   Current shared ALB: <+pipeline.variables.shared_alb_dns_name>"
                            echo ""
                            echo "   To verify/update the ALB DNS name:"
                            echo "   kubectl get ingress -A -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}'"
                            echo ""
                            echo "   Continuing anyway - DNS may propagate later."
                          fi
                    environmentVariables: []
                    outputVariables: []
                  timeout: 2m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: ShellScript
                  name: POV Provisioning Complete
                  identifier: pov_complete
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=============================================="
                          echo "   POV Provisioning Complete! (EKS Stack)"
                          echo "=============================================="
                          echo ""
                          echo "Owner: <+pipeline.variables.owner>"
                          echo "EKS Cluster: <+pipeline.variables.eks_cluster_name>"
                          echo ""
                          echo "Harness Code Repo: <+pipeline.variables.owner>-demo-app"
                          echo "  (Terraform-managed, imported from: <+pipeline.variables.source_github_repo>)"
                          echo ""
                          echo "All resources are managed by Terraform state."
                          echo "To destroy, run 'terraform destroy' or the POV Destroyer pipeline."
                          echo ""
                          echo "The CI build will:"
                          echo "  1. Clone from Harness Code repo"
                          echo "  2. Build the Docker image"
                          echo "  3. Push to Harness Artifact Registry (har-<+pipeline.variables.owner>)"
                          echo "  4. Trigger Rolling deployment automatically (HAR artifact trigger)"
                          echo ""
                          echo "Pipelines created:"
                          echo "  - <+pipeline.variables.owner>_standard_ci_gradle (CI)"
                          echo "  - <+pipeline.variables.owner>_k8s_strategy_deploy (CD)"
                          echo ""
                          echo "App URL: https://<+pipeline.variables.owner>.harness-demo.dev"
                          echo "=============================================="
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
