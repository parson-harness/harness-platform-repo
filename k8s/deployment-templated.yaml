apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.name}}-deployment
  namespace: {{.Values.namespace}}
  labels:
    app: {{.Values.name}}
    {{- if .Values.service_identifier }}
    harness.io/serviceIdentifier: {{ .Values.service_identifier | quote }}
    {{- end }}
    {{- if .Values.env_identifier }}
    harness.io/envIdentifier: {{ .Values.env_identifier | quote }}
    {{- end }}
spec:
  replicas: {{int .Values.replicas}}
  selector:
    matchLabels:
      app: {{.Values.name}}
  template:
    metadata:
      labels:
        app: {{.Values.name}}
        {{- if .Values.service_identifier }}
        harness.io/serviceIdentifier: {{ .Values.service_identifier | quote }}
        {{- end }}
        {{- if .Values.env_identifier }}
        harness.io/envIdentifier: {{ .Values.env_identifier | quote }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: {{.Values.name}}
          image: {{ .Values.image | quote }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{int .Values.containerPort}}
              name: http
          env:
            - name: APP_NAME
              value: "{{ .Values.appName }}"
            - name: APP_VERSION
              value: "{{ .Values.appVersion }}"
            - name: CUSTOMER_NAME
              value: "{{ .Values.customerName }}"
            - name: CUSTOMER_LOGO
              value: "{{ .Values.customerLogo }}"
            - name: BUILD_ID
              value: "{{ .Values.build_id }}"
            - name: DEPLOYMENT_VARIANT
              value: {{.Values.variant}}
            - name: VARIANT_COLOR
              value: {{.Values.variantColor}}
            - name: APP_ENVIRONMENT
              value: "{{ .Values.env_identifier }}"
            - name: DEPLOYMENT_TARGET
              value: "kubernetes"
            - name: DEPLOYMENT_STRATEGY
              value: "{{ .Values.deploymentStrategy }}"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CHAOS_ENABLED
              value: "{{.Values.chaosEnabled}}"
            - name: CHAOS_LATENCY_MS
              value: "{{.Values.chaosLatencyMs}}"
            - name: CHAOS_ERROR_RATE
              value: "{{.Values.chaosErrorRate}}"
          resources:
            requests:
              memory: {{.Values.resources.requests.memory}}
              cpu: {{.Values.resources.requests.cpu}}
            limits:
              memory: {{.Values.resources.limits.memory}}
              cpu: {{.Values.resources.limits.cpu}}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{int .Values.containerPort}}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{int .Values.containerPort}}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{.Values.name}}-service
  namespace: {{.Values.namespace}}
  labels:
    app: {{.Values.name}}
spec:
  type: {{.Values.serviceType}}
  ports:
    - port: {{int .Values.servicePort}}
      targetPort: {{int .Values.containerPort}}
      protocol: TCP
      name: http
  selector:
    app: {{.Values.name}}
---
{{- if .Values.ingressEnabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{.Values.name}}-ingress
  namespace: {{.Values.namespace}}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: {{.Values.name}}.{{.Values.ingressDomain | default "example.com"}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{.Values.name}}-service
                port:
                  number: {{int .Values.servicePort}}
{{- end }}
