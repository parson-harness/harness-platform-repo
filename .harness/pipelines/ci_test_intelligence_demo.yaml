pipeline:
  name: CI Test Intelligence Demo
  identifier: ci_test_intelligence_demo
  projectIdentifier: parson
  orgIdentifier: sandbox
  description: "Demo pipeline showcasing Harness CI Intelligence features: Test Intelligence, Build Intelligence, Cache Intelligence, Docker Layer Caching"
  tags:
    pipeline-type: ci
    harness-intelligence: enabled
    demo: test-intelligence
  properties:
    ci:
      codebase:
        repoName: harness-demo-app
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build and Test
        identifier: build_and_test
        description: "Build with Gradle Build Intelligence, test with Test Intelligence, push to HAR"
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: medium
          execution:
            steps:
              - step:
                  type: Run
                  name: Build Info
                  identifier: build_info
                  spec:
                    shell: Bash
                    command: |
                      echo "╔══════════════════════════════════════════════════════════════╗"
                      echo "║           HARNESS CI - BUILD INFORMATION                     ║"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      echo "║ Pipeline:     <+pipeline.name>"
                      echo "║ Build Number: <+pipeline.sequenceId>"
                      echo "║ Branch:       <+codebase.branch>"
                      echo "║ Commit:       <+codebase.commitSha>"
                      echo "║ Trigger:      <+pipeline.triggerType>"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      echo "║ HARNESS CI INTELLIGENCE FEATURES ENABLED:                    ║"
                      echo "║ ✓ Test Intelligence  - Run only affected tests               ║"
                      echo "║ ✓ Build Intelligence - Cache Gradle build outputs            ║"
                      echo "║ ✓ Cache Intelligence - Auto-cache dependencies               ║"
                      echo "║ ✓ Docker Layer Cache - Reuse image layers                    ║"
                      echo "║ ✓ Harness Cloud      - Hosted build infrastructure           ║"
                      echo "╚══════════════════════════════════════════════════════════════╝"
                      
                      # Set image tag based on branch and build number
                      if [ "<+codebase.branch>" = "main" ]; then
                        IMAGE_TAG="<+pipeline.sequenceId>"
                      else
                        BRANCH_SAFE=$(echo "<+codebase.branch>" | sed 's/[^a-zA-Z0-9]/-/g')
                        IMAGE_TAG="${BRANCH_SAFE}-<+pipeline.sequenceId>"
                      fi
                      echo ""
                      echo "Image Tag: $IMAGE_TAG"
                    outputVariables:
                      - name: IMAGE_TAG
              - step:
                  type: Run
                  name: Gradle Build with Build Intelligence
                  identifier: gradle_build
                  spec:
                    connectorRef: account.harnessImage
                    image: gradle:8.5-jdk17
                    shell: Bash
                    command: |
                      echo "╔══════════════════════════════════════════════════════════════╗"
                      echo "║           GRADLE BUILD INTELLIGENCE                          ║"
                      echo "╚══════════════════════════════════════════════════════════════╝"
                      echo ""
                      echo "Build Intelligence caches:"
                      echo "- Compiled classes (.gradle/caches)"
                      echo "- Dependencies (~/.gradle/caches)"
                      echo "- Incremental compilation state"
                      echo ""
                      
                      # Gradle build with Build Intelligence optimizations
                      gradle build -x test --build-cache --parallel --profile
                      
                      echo ""
                      echo "✓ Gradle build complete with Build Intelligence!"
                      echo ""
                      echo "Build profile available at: build/reports/profile/"
              - stepGroup:
                  name: Test with Intelligence
                  identifier: test_with_intelligence
                  steps:
                    - step:
                        type: RunTests
                        name: Run Tests with TI
                        identifier: run_tests_ti
                        spec:
                          connectorRef: account.harnessImage
                          image: gradle:8.5-jdk17
                          language: Java
                          buildTool: Gradle
                          args: test --build-cache
                          packages: io.harness.demo
                          runOnlySelectedTests: true
                          postCommand: |
                            echo ""
                            echo "╔══════════════════════════════════════════════════════════════╗"
                            echo "║           TEST INTELLIGENCE RESULTS                          ║"
                            echo "╚══════════════════════════════════════════════════════════════╝"
                            echo "Test Intelligence analyzed code changes and selected relevant tests."
                            echo "View the Tests tab for detailed test selection visualization."
                          reports:
                            type: JUnit
                            spec:
                              paths:
                                - "build/test-results/test/*.xml"
                          enableTestSplitting: false
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Docker
                  identifier: build_push_docker
                  spec:
                    connectorRef: <+input>
                    repo: <+input>
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    caching: true
                    dockerfile: Dockerfile
                    context: .
              - step:
                  type: Run
                  name: Build Summary
                  identifier: build_summary
                  spec:
                    shell: Bash
                    command: |
                      echo ""
                      echo "╔══════════════════════════════════════════════════════════════╗"
                      echo "║           BUILD COMPLETE - SUMMARY                           ║"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      echo "║ Branch: <+codebase.branch>"
                      echo "║ Commit: <+codebase.commitSha>"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      echo "║ HARNESS CI INTELLIGENCE SAVINGS:                             ║"
                      echo "║ • Test Intelligence: Only relevant tests executed            ║"
                      echo "║ • Build Intelligence: Gradle incremental build               ║"
                      echo "║ • Cache Intelligence: Dependencies loaded from cache         ║"
                      echo "║ • Docker Layer Cache: Image layers reused                    ║"
                      echo "╚══════════════════════════════════════════════════════════════╝"
                      echo ""
                      echo "Check the Tests tab to see Test Intelligence visualization!"
