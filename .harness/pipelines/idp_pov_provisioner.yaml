pipeline:
  name: IDP POV Provisioner
  identifier: idp_pov_provisioner
  projectIdentifier: parson
  orgIdentifier: sandbox
  description: IDP-triggered pipeline that creates an IACM workspace and provisions a POV environment
  tags:
    idp: "true"
    pov: "true"
    iacm: "true"
  allowStageExecutions: false
  concurrency:
    maxConcurrency: 1
    label: pov_provisioner_<+pipeline.variables.owner>
  variables:
    - name: owner
      type: String
      description: Owner name (lowercase, used for resource naming and workspace ID)
      required: true
      value: <+input>
    - name: harness_account_id
      type: String
      description: Target Harness Account ID (for cross-account provisioning)
      required: true
      value: <+input>.default(<+account.identifier>)
    - name: harness_endpoint
      type: String
      description: Harness platform endpoint
      required: true
      value: <+input>.default(https://app.harness.io/gratis)
    - name: provisioner_api_key
      type: Secret
      description: SAT for IACM workspace management in provisioner account (sandbox/parson)
      required: true
      value: acct-automation-svc-acct
    - name: target_api_key
      type: String
      description: API Key for target Harness account (where resources are provisioned). Defaults to provisioner SAT for same-account use.
      required: false
      value: <+input>.default(<+pipeline.variables.provisioner_api_key>)
    - name: target_api_key_email
      type: String
      description: Email associated with the target account API key. Defaults to service account email.
      required: false
      value: <+input>.default(accountautomation@service.harness.io)
    - name: harness_org_id
      type: String
      description: Harness Org ID for the POV
      required: true
      value: <+org.identifier>
    - name: harness_project_id
      type: String
      description: Harness Project ID for the POV
      required: true
      value: <+project.identifier>
    - name: create_harness_org
      type: String
      description: Create new org
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: create_harness_project
      type: String
      description: Create new project
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: deployment_targets
      type: String
      description: Deployment targets (eks, ecs, lambda)
      required: true
      value: <+input>.default(eks)
    - name: create_eks_cluster
      type: String
      description: Create new EKS cluster
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: existing_cluster_name
      type: String
      description: Existing EKS cluster name
      required: false
      value: <+input>.default(harness-eks-parson)
    - name: create_harness_environment
      type: String
      description: Create Harness environment
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_prod_environment
      type: String
      description: Create production environment
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_delegate
      type: String
      description: Create Harness delegate
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: asg_create_dns_record
      type: String
      description: Create Route53 CNAME <owner>-asg.<zone> pointing to the ASG ALB (required when deployment_targets=asg)
      required: false
      value: <+input>.default(false).allowedValues(true,false)
  stages:
    - stage:
        name: Create Workspace from Template
        identifier: create_workspace
        description: Create a new IACM workspace from the POV_Provisioner template using "Use Template" linkage
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Check Workspace Exists
                  identifier: check_workspace_exists
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov
                    method: GET
                    headers:
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    outputVariables:
                      - name: workspace_exists
                        value: <+httpResponseCode>
                        type: String
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 404
                  timeout: 1m
              - step:
                  type: Http
                  name: Create IACM Workspace
                  identifier: create_iacm_workspace
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces
                    method: POST
                    headers:
                      - key: Content-Type
                        value: application/json
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    inputVariables: []
                    outputVariables:
                      - name: workspace_id
                        value: <+json.select("identifier", httpResponseBody)>
                        type: String
                    requestBody: |
                      {
                        "identifier": "<+pipeline.variables.owner>_pov",
                        "name": "<+pipeline.variables.owner> POV Workspace",
                        "description": "POV environment for <+pipeline.variables.owner>",
                        "provisioner": "opentofu",
                        "provisioner_version": "1.11.2",
                        "repository_connector": "parsongh",
                        "repository": "harness-demo-app",
                        "repository_branch": "main",
                        "repository_path": "tofu/environments/sandbox",
                        "provider_connector": "aws_oidc_iacm",
                        "cost_estimation_enabled": true,
                        "provider_connectors": [
                          {
                            "connector_ref": "aws_oidc_iacm",
                            "type": "aws"
                          }
                        ],
                        "default_pipelines": {
                          "provision": {
                            "project_pipeline": "pov_provisioning"
                          },
                          "destroy": {
                            "project_pipeline": "pov_destroy"
                          }
                        },
                        "terraform_variables": {
                          "owner": {
                            "key": "owner",
                            "value": "<+pipeline.variables.owner>",
                            "value_type": "string"
                          },
                          "harness_account_id": {
                            "key": "harness_account_id",
                            "value": "<+pipeline.variables.harness_account_id>",
                            "value_type": "string"
                          },
                          "harness_endpoint": {
                            "key": "harness_endpoint",
                            "value": "<+pipeline.variables.harness_endpoint>",
                            "value_type": "string"
                          },
                          "harness_api_key": {
                            "key": "harness_api_key",
                            "value": "<+pipeline.variables.target_api_key>",
                            "value_type": "string"
                          },
                          "harness_api_key_email": {
                            "key": "harness_api_key_email",
                            "value": "<+pipeline.variables.target_api_key_email>",
                            "value_type": "string"
                          },
                          "harness_org_id": {
                            "key": "harness_org_id",
                            "value": "<+pipeline.variables.harness_org_id>",
                            "value_type": "string"
                          },
                          "harness_project_id": {
                            "key": "harness_project_id",
                            "value": "<+pipeline.variables.harness_project_id>",
                            "value_type": "string"
                          },
                          "deployment_targets": {
                            "key": "deployment_targets",
                            "value": "[\"<+pipeline.variables.deployment_targets>\"]",
                            "value_type": "string"
                          },
                          "create_harness_org": {
                            "key": "create_harness_org",
                            "value": "<+pipeline.variables.create_harness_org>",
                            "value_type": "string"
                          },
                          "create_harness_project": {
                            "key": "create_harness_project",
                            "value": "<+pipeline.variables.create_harness_project>",
                            "value_type": "string"
                          },
                          "create_harness_environment": {
                            "key": "create_harness_environment",
                            "value": "<+pipeline.variables.create_harness_environment>",
                            "value_type": "string"
                          },
                          "create_prod_environment": {
                            "key": "create_prod_environment",
                            "value": "<+pipeline.variables.create_prod_environment>",
                            "value_type": "string"
                          },
                          "create_delegate": {
                            "key": "create_delegate",
                            "value": "<+pipeline.variables.create_delegate>",
                            "value_type": "string"
                          },
                          "create_eks_cluster": {
                            "key": "create_eks_cluster",
                            "value": "<+pipeline.variables.create_eks_cluster>",
                            "value_type": "string"
                          },
                          "existing_cluster_name": {
                            "key": "existing_cluster_name",
                            "value": "<+pipeline.variables.existing_cluster_name>",
                            "value_type": "string"
                          },
                          "create_dockerhub_upstream": {
                            "key": "create_dockerhub_upstream",
                            "value": "false",
                            "value_type": "string"
                          },
                          "import_to_harness_code": {
                            "key": "import_to_harness_code",
                            "value": "true",
                            "value_type": "string"
                          },
                          "source_github_repo": {
                            "key": "source_github_repo",
                            "value": "parson-harness/harness-demo-app",
                            "value_type": "string"
                          },
                          "asg_create_dns_record": {
                            "key": "asg_create_dns_record",
                            "value": "<+pipeline.variables.asg_create_dns_record>",
                            "value_type": "string"
                          }
                        },
                        "environment_variables": {}
                      }
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 201
                  timeout: 2m
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "404"
              - step:
                  type: Http
                  name: Link Workspace to Template
                  identifier: link_workspace_template
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspace/templates
                    method: POST
                    headers:
                      - key: Content-Type
                        value: application/json
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    requestBody: |
                      {
                        "template_id": "POV_Provisioner",
                        "version": "1.0",
                        "workspace_id": "<+pipeline.variables.owner>_pov"
                      }
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 201 || <+httpResponseCode> == 409
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: Http
                  name: Update deployment_targets Variable
                  identifier: update_deployment_targets_var
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov/variables/tf/deployment_targets
                    method: PUT
                    headers:
                      - key: Content-Type
                        value: application/json
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    requestBody: |
                      {
                        "value": "[\"<+pipeline.variables.deployment_targets>\"]",
                        "value_type": "string"
                      }
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 201
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: Http
                  name: Create asg_create_dns_record Variable
                  identifier: create_asg_create_dns_record_var
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov/variables
                    method: POST
                    headers:
                      - key: Content-Type
                        value: application/json
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    requestBody: |
                      {
                        "key": "asg_create_dns_record",
                        "kind": "tf",
                        "value": "<+pipeline.variables.asg_create_dns_record>",
                        "value_type": "string"
                      }
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 201 || <+httpResponseCode> == 409
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: Http
                  name: Update asg_create_dns_record Variable
                  identifier: update_asg_create_dns_record_var
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov/variables/tf/asg_create_dns_record
                    method: PUT
                    headers:
                      - key: Content-Type
                        value: application/json
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    requestBody: |
                      {
                        "value": "<+pipeline.variables.asg_create_dns_record>",
                        "value_type": "string"
                      }
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 201
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: ShellScript
                  name: Workspace Created
                  identifier: workspace_created
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=== IACM Workspace Created from Template ==="
                          echo "Workspace ID: <+pipeline.variables.owner>_pov"
                          echo "Template: POV_Provisioner (v1.0)"
                          echo "Linkage: Use Template (centrally managed)"
                          echo ""
                          echo "Owner: <+pipeline.variables.owner>"
                          echo "Org: <+pipeline.variables.harness_org_id>"
                          echo "Project: <+pipeline.variables.harness_project_id>"
                          echo ""
                          echo "Template changes will automatically propagate to this workspace."
                          echo "Proceeding to provision infrastructure..."
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
    - stage:
        name: Pre-Apply Cleanup
        identifier: pre_apply_cleanup
        description: Clean up orphaned Kubernetes resources before Terraform apply
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Cleanup Orphaned K8s Resources
                  identifier: cleanup_orphaned_k8s
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - parson-eks-delegate
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=== Pre-Apply Cleanup: Removing Orphaned K8s Resources ==="
                          OWNER="<+pipeline.variables.owner>"
                          CRB_NAME="harness-delegate-admin-${OWNER}"
                          NAMESPACE="harness-delegate-ng-${OWNER}"

                          # Delete ClusterRoleBinding if exists (cluster-scoped, causes "already exists" errors)
                          echo "Checking for orphaned ClusterRoleBinding: ${CRB_NAME}"
                          if kubectl get clusterrolebinding "${CRB_NAME}" 2>/dev/null; then
                            echo "  Found orphaned ClusterRoleBinding, deleting..."
                            kubectl delete clusterrolebinding "${CRB_NAME}" || true
                            echo "  Deleted"
                          else
                            echo "  Not found, skipping"
                          fi

                          # Delete delegate namespace if exists (may be orphaned from previous failed run)
                          echo ""
                          echo "Checking for orphaned delegate namespace: ${NAMESPACE}"
                          if kubectl get namespace "${NAMESPACE}" 2>/dev/null; then
                            echo "  Found orphaned namespace, deleting..."
                            kubectl delete namespace "${NAMESPACE}" --wait=false || true
                            echo "  Deletion initiated"
                          else
                            echo "  Not found, skipping"
                          fi

                          echo ""
                          echo "=== Pre-Apply Cleanup Complete ==="
                    environmentVariables: []
                    outputVariables: []
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                          spec: {}
    - stage:
        name: Plan and Apply
        identifier: plan_and_apply
        description: Plan, approve, and apply infrastructure changes
        type: IACM
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          workspace: <+pipeline.variables.owner>_pov
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: Plan
                  identifier: plan
                  timeout: 15m
                  spec:
                    command: plan
              - step:
                  type: Run
                  name: Show Plan Summary
                  identifier: show_plan_summary
                  spec:
                    shell: Bash
                    command: |
                      echo "=== POV Provisioning Plan Summary ==="
                      echo "Owner: <+pipeline.variables.owner>"
                      echo "Workspace: <+pipeline.variables.owner>_pov"
                      echo "Account: <+pipeline.variables.harness_account_id>"
                      echo "Org: <+pipeline.variables.harness_org_id>"
                      echo "Project: <+pipeline.variables.harness_project_id>"
                      echo "Deployment Targets: <+pipeline.variables.deployment_targets>"
                      echo "======================================="

                      if [ -f /harness/plan.json ]; then
                        echo ""
                        echo "Resources to be created/modified:"
                        jq -r '.resource_changes[] | select(.change.actions | contains(["create"]) or contains(["update"])) | "  \(.change.actions[0]): \(.type).\(.name)"' /harness/plan.json 2>/dev/null || echo "  (unable to parse plan)"
                      fi
              - step:
                  type: IACMApproval
                  name: Approve Plan
                  identifier: approve_plan
                  spec:
                    autoApprove: true
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: MarkAsSuccess
              - step:
                  type: IACMTerraformPlugin
                  name: Apply
                  identifier: apply
                  timeout: 1h
                  spec:
                    command: apply
              - step:
                  type: Run
                  name: POV Ready
                  identifier: pov_ready
                  spec:
                    shell: Bash
                    command: |
                      echo "=============================================="
                      echo "   POV Environment Ready!"
                      echo "=============================================="
                      echo ""
                      echo "Owner: <+pipeline.variables.owner>"
                      echo "Workspace: <+pipeline.variables.owner>_pov"
                      echo ""
                      echo "Access your POV at:"
                      echo "  Harness: <+pipeline.variables.harness_endpoint>"
                      echo "  Org: <+pipeline.variables.harness_org_id>"
                      echo "  Project: <+pipeline.variables.harness_project_id>"
                      echo ""
                      echo "Resources created:"
                      echo "  - Delegate: delegate-<+pipeline.variables.owner>"
                      echo "  - Service: <+pipeline.variables.owner>_demo_app"
                      echo "  - Environments: <+pipeline.variables.owner>_dev, <+pipeline.variables.owner>_prod"
                      echo "  - Pipelines: Canary, Blue-Green, Strategy Choice"
                      echo ""
                      echo "To destroy this POV, run the 'IDP POV Destroyer' pipeline"
                      echo "with owner: <+pipeline.variables.owner>"
                      echo ""
                      echo "CI Pipeline: <+pipeline.variables.owner>_ci_build"
                      echo ""

                      if [ -f /harness/outputs.json ]; then
                        echo "Terraform Outputs:"
                        cat /harness/outputs.json | jq '.'
                      fi
    - stage:
        name: Trigger CI Build
        identifier: trigger_ci_build
        description: Trigger the CI pipeline to build initial Docker image
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Trigger EKS CI Pipeline
                  identifier: trigger_eks_ci
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/pipeline/api/pipeline/execute/<+pipeline.variables.owner>_ci_build?accountIdentifier=<+pipeline.variables.harness_account_id>&orgIdentifier=<+pipeline.variables.harness_org_id>&projectIdentifier=<+pipeline.variables.harness_project_id>&moduleType=CI
                    method: POST
                    headers:
                      - key: x-api-key
                        value: <+pipeline.variables.target_api_key>
                      - key: Content-Type
                        value: application/yaml
                    requestBody: |
                      pipeline:
                        identifier: <+pipeline.variables.owner>_ci_build
                        properties:
                          ci:
                            codebase:
                              build:
                                type: branch
                                spec:
                                  branch: main
                    assertion: <+httpResponseCode> == 200
                    outputVariables:
                      - name: ci_execution_id
                        value: <+json.select("data.planExecution.uuid", httpResponseBody)>
                        type: String
                  timeout: 2m
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.deployment_targets> != "asg"
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: Http
                  name: Trigger ASG CI Pipeline
                  identifier: trigger_asg_ci
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/pipeline/api/pipeline/execute/<+pipeline.variables.owner>_asg_ci_build?accountIdentifier=<+pipeline.variables.harness_account_id>&orgIdentifier=<+pipeline.variables.harness_org_id>&projectIdentifier=<+pipeline.variables.harness_project_id>&moduleType=CI
                    method: POST
                    headers:
                      - key: x-api-key
                        value: <+pipeline.variables.target_api_key>
                      - key: Content-Type
                        value: application/yaml
                    requestBody: |
                      pipeline:
                        identifier: <+pipeline.variables.owner>_asg_ci_build
                        properties:
                          ci:
                            codebase:
                              build:
                                type: branch
                                spec:
                                  branch: main
                    assertion: <+httpResponseCode> == 200
                    outputVariables:
                      - name: ci_execution_id
                        value: <+json.select("data.planExecution.uuid", httpResponseBody)>
                        type: String
                  timeout: 2m
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.deployment_targets> == "asg"
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: ShellScript
                  name: CI Build Triggered
                  identifier: ci_build_triggered
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=============================================="
                          echo "   CI Build Triggered!"
                          echo "=============================================="
                          echo ""
                          echo "Pipeline: <+pipeline.variables.owner>_ci_build"
                          echo "Execution ID: <+execution.steps.trigger_ci.output.outputVariables.ci_execution_id>"
                          echo ""
                          echo "The CI build will:"
                          echo "  1. Clone the demo app repository"
                          echo "  2. Build the Docker image"
                          echo "  3. Push to Harness Artifact Registry (har-<+pipeline.variables.owner>)"
                          echo ""
                          echo "Once complete, you can deploy using:"
                          echo "  - <+pipeline.variables.owner>_k8s_strategy_deploy (Strategy Choice)"
                          echo "  - <+pipeline.variables.owner>_k8s_canary_deploy (Canary)"
                          echo "  - <+pipeline.variables.owner>_k8s_bg_canary_deploy (Blue-Green)"
                          echo ""
                          echo "=============================================="
                          echo "   POV Provisioning Complete!"
                          echo "=============================================="
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
