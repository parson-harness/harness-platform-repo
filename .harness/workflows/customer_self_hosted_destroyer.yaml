apiVersion: harness.io/v1
kind: Workflow
name: Customer Self-Hosted Destroyer
identifier: customer_self_hosted_destroyer
type: workflow
scope: project
projectIdentifier: parson
orgIdentifier: sandbox
owner: todd.parson@harness.io
metadata:
  description: |
    ADVANCED: Destroy a customer self-hosted POV environment and AWS infrastructure.
    
    ⚠️  This will destroy AWS resources in the customer's account!
    
    What gets destroyed:
    - EKS cluster and node groups
    - VPC, subnets, NAT gateways
    - IAM roles
    - Harness pipelines, services, environments
    - K8s namespaces and deployments
    
    Prerequisites:
    - Same OIDC AWS connector used for provisioning
    - Customer API key with admin permissions
  tags:
    - customer-self-hosted
    - iacm
    - own-aws
    - advanced
spec:
  presentation:
    customTitle: Customer Self-Hosted Destroyer (Advanced)
    customSubTitle: "⚠️ Destroys AWS infrastructure in customer's account"
    customCreateButtonText: Destroy Infrastructure
  
  output:
    links:
      - title: Pipeline Execution
        url: ${{ steps.trigger.output.PipelineUrl }}
  
  lifecycle: production
  
  parameters:
    - title: POV Identity
      required:
        - owner
      properties:
        owner:
          title: POV Owner
          type: string
          description: "Owner name of the POV to destroy (must match exactly)"
          pattern: "^[a-z][a-z0-9]*$"
          ui:help: "Enter the same owner name used when provisioning"
        
        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken
    
    - title: Customer Harness Account
      required:
        - harness_account_id
        - harness_org_id
        - harness_project_id
        - harness_api_key
      properties:
        harness_account_id:
          title: Customer Account ID
          type: string
          description: "Customer's Harness Account ID"
        
        harness_cluster:
          title: Harness Cluster
          type: string
          description: "Which Harness cluster is the customer account on?"
          default: "https://app.harness.io"
          enum:
            - "https://app.harness.io/gratis"
            - "https://app.harness.io"
            - "https://app3.harness.io"
          enumNames:
            - "Prod 1 - Free/Community accounts"
            - "Prod 2 - Enterprise accounts"
            - "Prod 3 - Enterprise accounts"
        
        harness_org_id:
          title: Organization ID
          type: string
          description: "Customer's Harness Organization ID"
        
        harness_project_id:
          title: Project ID
          type: string
          description: "Customer's Harness Project ID"
        
        harness_api_key:
          title: Customer API Key
          type: string
          description: "Customer's Harness API Key with admin permissions"
          ui:widget: password
    
    - title: Destruction Options
      properties:
        destroy_terraform:
          title: Destroy AWS Infrastructure?
          type: string
          description: "Run terraform destroy to remove AWS resources (EKS, VPC, IAM)"
          default: "true"
          enum:
            - "true"
            - "false"
          ui:help: "⚠️ This will destroy the EKS cluster and all AWS resources"
        
        delete_delegate:
          title: Delete Delegate?
          type: string
          description: "Delete the Harness delegate from the cluster"
          default: "true"
          enum:
            - "true"
            - "false"
        
        delete_workspace:
          title: Delete IACM Workspace?
          type: string
          description: "Delete the IACM workspace (loses Terraform state)"
          default: "false"
          enum:
            - "true"
            - "false"
          ui:help: "⚠️ Only do this after terraform destroy completes successfully"
        
        force_delete:
          title: Force Delete?
          type: string
          description: "Force delete resources even if they have dependencies"
          default: "true"
          enum:
            - "true"
            - "false"

  steps:
    - id: trigger
      name: Destroying Customer Infrastructure
      action: trigger:harness-custom-pipeline
      input:
        url: "https://app.harness.io/ng/account/EeRjnXTnS4GrLG5VNNJZUw/all/orgs/sandbox/projects/parson/pipelines/idp_pov_destroyer/pipeline-studio/?storeType=REMOTE&connectorRef=parsongh&repoName=harness-demo-app&branch=main"
        inputset:
          owner: ${{ parameters.owner }}
          harness_account_id: ${{ parameters.harness_account_id }}
          harness_endpoint: ${{ parameters.harness_cluster }}
          harness_org_id: ${{ parameters.harness_org_id }}
          harness_project_id: ${{ parameters.harness_project_id }}
          harness_api_key: ${{ parameters.harness_api_key }}
          destroy_terraform: ${{ parameters.destroy_terraform }}
          delete_delegate: ${{ parameters.delete_delegate }}
          delete_workspace: ${{ parameters.delete_workspace }}
          force_delete: ${{ parameters.force_delete }}
        apikey: ${{ parameters.token }}
