trigger:
  name: Toddfour Live on PR Create
  identifier: toddfour_live_pr_created
  enabled: true
  description: Runs the Toddfour live pipeline for pull request activity in the app GitHub repo.
  tags:
    automation: "true"
    repo: harness-demo-app
    flow: pr
  orgIdentifier: sandbox
  projectIdentifier: parson
  pipelineIdentifier: E2E_Enterprise_Pipeline_Toddfour
  pipelineBranchName: main
  inputSetRefs:
    - toddfour_pr_live_defaults
  source:
    type: Webhook
    spec:
      type: Github
      spec:
        type: PullRequest
        spec:
          connectorRef: parsongh
          autoAbortPreviousExecutions: false
          payloadConditions:
            - key: targetBranch
              operator: Equals
              value: main
          headerConditions: []
          repoName: harness-demo-app
          actions:
            - Open
            - Reopen
            - Edit
            - Synchronize
            - Close
