apiVersion: harness.io/v1
kind: Workflow
name: POV in a Box Destroyer
identifier: pov_in_a_box_destroyer
type: workflow
scope: project
projectIdentifier: parson
orgIdentifier: sandbox
owner: todd.parson@harness.io
metadata:
  description: |
    Destroy a standardized POV environment in a customer or external Harness account.
    
    Use this workflow for normal one-click cleanup of a sandbox created by the canonical provisioner lifecycle.
    Set the advanced cleanup flags only when you need to bypass Terraform or require manual approval.
  tags:
    - pov-in-a-box
    - iacm
    - cross-account
spec:
  presentation:
    customTitle: POV in a Box - Destroyer
    customSubTitle: Remove all resources from a profile-driven POV environment in a customer or external account
    customCreateButtonText: Destroy POV
  
  output:
    links:
      - title: Pipeline Execution
        url: ${{ steps.trigger.output.PipelineUrl }}
  
  lifecycle: production
  
  parameters:
    - title: POV Identity
      required:
        - owner
      properties:
        owner:
          title: POV Owner
          type: string
          description: "Owner name of the POV to destroy (e.g., 'todd' destroys 'todd_pov' workspace)"
          pattern: "^[a-z][a-z0-9]*$"
          ui:help: "Enter the owner name used when the POV was provisioned"
        
        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken
    
    - title: Harness Configuration
      required:
        - harness_account_id
        - harness_org_id
        - harness_project_id
        - target_api_key
      properties:
        harness_account_id:
          title: Target Account ID
          type: string
          description: "Harness Account ID where the POV exists"
          default: <+account.identifier>
          ui:help: "Find this in Account Settings > Overview, or in the URL after /account/"
        
        harness_cluster:
          title: Harness Cluster
          type: string
          description: "Which Harness cluster is the target account on?"
          default: "https://app.harness.io/gratis"
          enum:
            - "https://app.harness.io/gratis"
            - "https://app.harness.io"
            - "https://app3.harness.io"
          enumNames:
            - "Prod 1 - Harness Demo Account Cluster"
            - "Prod 2 - Enterprise accounts"
            - "Prod 3 - Enterprise accounts"
        
        harness_org_id:
          title: Organization ID
          type: string
          description: "Harness Organization ID where the POV exists (type manually for cross-account)"
          default: sandbox
          ui:help: "For cross-account destruction, type the org ID manually"
        
        harness_project_id:
          title: Project ID
          type: string
          description: "Harness Project ID where the POV exists (type manually for cross-account)"
          default: parson
          ui:help: "For cross-account destruction, type the project ID manually"
        
        target_api_key:
          title: Target Account API Key
          type: string
          description: "API Key (PAT or SAT) for the target Harness account with admin permissions"
          ui:widget: password

    - title: Destruction Options
      properties:
        deployment_target:
          title: Deployment Target
          type: string
          description: "Use eks for shared-cluster sandboxes and asg for fully self-contained POV environments"
          default: eks
          enum:
            - eks
            - asg

        skip_terraform_destroy:
          title: Skip Terraform Destroy?
          type: string
          description: "Advanced override. Recommended false. Set true only to bypass Terraform and run API/AWS/Kubernetes cleanup directly"
          default: "false"
          enum:
            - "true"
            - "false"

        auto_approve:
          title: Auto Approve?
          type: string
          description: "Recommended true for one-click cleanup. Set false only if you want a manual destroy approval gate"
          default: "true"
          enum:
            - "true"
            - "false"
    
  steps:
    - id: trigger
      name: Destroying POV Environment
      action: trigger:harness-custom-pipeline
      input:
        url: "https://app.harness.io/ng/account/EeRjnXTnS4GrLG5VNNJZUw/all/orgs/sandbox/projects/parson/pipelines/idp_pov_destroyer_v2/pipeline-studio/?storeType=REMOTE&connectorRef=parsongh&repoName=harness-demo-app&branch=main"
        inputset:
          owner: ${{ parameters.owner }}
          harness_account_id: ${{ parameters.harness_account_id }}
          harness_endpoint: ${{ parameters.harness_cluster }}
          harness_org_id: ${{ parameters.harness_org_id }}
          harness_project_id: ${{ parameters.harness_project_id }}
          target_api_key: ${{ parameters.target_api_key }}
          deployment_target: ${{ parameters.deployment_target }}
          skip_terraform_destroy: ${{ parameters.skip_terraform_destroy }}
          auto_approve: ${{ parameters.auto_approve }}
        apikey: ${{ parameters.token }}
