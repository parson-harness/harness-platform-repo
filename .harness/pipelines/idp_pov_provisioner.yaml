pipeline:
  name: IDP POV Provisioner
  identifier: idp_pov_provisioner
  projectIdentifier: parson
  orgIdentifier: sandbox
  description: IDP-triggered pipeline that creates an IACM workspace and provisions a POV environment
  tags:
    idp: "true"
    pov: "true"
    iacm: "true"
  allowStageExecutions: false
  concurrency:
    maxConcurrency: 1
    label: pov_provisioner_<+pipeline.variables.owner>
  variables:
    - name: owner
      type: String
      description: Owner name (lowercase, used for resource naming and workspace ID)
      required: true
      value: <+input>
    - name: harness_account_id
      type: String
      description: Target Harness Account ID (for cross-account provisioning)
      required: true
      value: <+input>.default(<+account.identifier>)
    - name: harness_endpoint
      type: String
      description: Harness platform endpoint
      required: true
      value: <+input>.default(https://app.harness.io/gratis)
    - name: harness_api_key
      type: String
      description: Harness Platform API Key (PAT or SAT)
      required: true
      value: <+input>.default(<+secrets.getValue("account.harness_api_key")>)
    - name: harness_api_key_email
      type: String
      description: Email associated with the API key
      required: true
      value: <+input>.default(todd.parson@harness.io)
    - name: harness_org_id
      type: String
      description: Harness Org ID for the POV
      required: true
      value: <+org.identifier>
    - name: harness_project_id
      type: String
      description: Harness Project ID for the POV
      required: true
      value: <+project.identifier>
    - name: create_harness_org
      type: String
      description: Create new org
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: create_harness_project
      type: String
      description: Create new project
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: deployment_targets
      type: String
      description: Deployment targets (eks, ecs, lambda)
      required: true
      value: <+input>.default(eks)
    - name: create_eks_cluster
      type: String
      description: Create new EKS cluster
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: existing_cluster_name
      type: String
      description: Existing EKS cluster name
      required: false
      value: <+input>.default(harness-eks-parson)
    - name: create_harness_environment
      type: String
      description: Create Harness environment
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_prod_environment
      type: String
      description: Create production environment
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_delegate
      type: String
      description: Create Harness delegate
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: force_recreate
      type: String
      description: Delete existing resources before provisioning
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: git_repo_url
      type: String
      description: Git repository URL for the demo app
      required: true
      value: <+input>.default(https://github.com/parson-harness/harness-demo-app.git)
  stages:
    - stage:
        name: Create Workspace from Template
        identifier: create_workspace
        description: Create a new IACM workspace from the POV_Provisioner template using "Use Template" linkage
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Check Workspace Exists
                  identifier: check_workspace_exists
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov
                    method: GET
                    headers:
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.harness_api_key>
                    outputVariables:
                      - name: workspace_exists
                        value: <+httpResponseCode>
                        type: String
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 404
                  timeout: 1m
              - step:
                  type: Http
                  name: Create IACM Workspace
                  identifier: create_iacm_workspace
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces
                    method: POST
                    headers:
                      - key: Content-Type
                        value: application/json
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.harness_api_key>
                    inputVariables: []
                    outputVariables:
                      - name: workspace_id
                        value: <+json.select("identifier", httpResponseBody)>
                        type: String
                    requestBody: |
                      {
                        "identifier": "<+pipeline.variables.owner>_pov",
                        "name": "<+pipeline.variables.owner> POV Workspace",
                        "description": "POV environment for <+pipeline.variables.owner>",
                        "provisioner": "opentofu",
                        "provisioner_version": "1.11.2",
                        "repository_connector": "parsongh",
                        "repository": "harness-demo-app",
                        "repository_branch": "main",
                        "repository_path": "tofu/environments/sandbox",
                        "provider_connector": "aws_oidc_iacm",
                        "cost_estimation_enabled": true,
                        "provider_connectors": [
                          {
                            "connector_ref": "aws_oidc_iacm",
                            "type": "aws"
                          }
                        ],
                        "default_pipelines": {
                          "provision": {
                            "project_pipeline": "pov_provisioning"
                          },
                          "destroy": {
                            "project_pipeline": "pov_destroy"
                          }
                        },
                        "terraform_variables": {
                          "owner": {
                            "key": "owner",
                            "value": "<+pipeline.variables.owner>",
                            "value_type": "string"
                          },
                          "harness_account_id": {
                            "key": "harness_account_id",
                            "value": "<+pipeline.variables.harness_account_id>",
                            "value_type": "string"
                          },
                          "harness_endpoint": {
                            "key": "harness_endpoint",
                            "value": "<+pipeline.variables.harness_endpoint>",
                            "value_type": "string"
                          },
                          "harness_api_key": {
                            "key": "harness_api_key",
                            "value": "<+pipeline.variables.harness_api_key>",
                            "value_type": "string"
                          },
                          "harness_api_key_email": {
                            "key": "harness_api_key_email",
                            "value": "<+pipeline.variables.harness_api_key_email>",
                            "value_type": "string"
                          },
                          "harness_org_id": {
                            "key": "harness_org_id",
                            "value": "<+pipeline.variables.harness_org_id>",
                            "value_type": "string"
                          },
                          "harness_project_id": {
                            "key": "harness_project_id",
                            "value": "<+pipeline.variables.harness_project_id>",
                            "value_type": "string"
                          },
                          "deployment_targets": {
                            "key": "deployment_targets",
                            "value": "[\"<+pipeline.variables.deployment_targets>\"]",
                            "value_type": "string"
                          },
                          "create_harness_org": {
                            "key": "create_harness_org",
                            "value": "<+pipeline.variables.create_harness_org>",
                            "value_type": "string"
                          },
                          "create_harness_project": {
                            "key": "create_harness_project",
                            "value": "<+pipeline.variables.create_harness_project>",
                            "value_type": "string"
                          },
                          "create_harness_environment": {
                            "key": "create_harness_environment",
                            "value": "<+pipeline.variables.create_harness_environment>",
                            "value_type": "string"
                          },
                          "create_prod_environment": {
                            "key": "create_prod_environment",
                            "value": "<+pipeline.variables.create_prod_environment>",
                            "value_type": "string"
                          },
                          "create_delegate": {
                            "key": "create_delegate",
                            "value": "<+pipeline.variables.create_delegate>",
                            "value_type": "string"
                          },
                          "create_eks_cluster": {
                            "key": "create_eks_cluster",
                            "value": "<+pipeline.variables.create_eks_cluster>",
                            "value_type": "string"
                          },
                          "existing_cluster_name": {
                            "key": "existing_cluster_name",
                            "value": "<+pipeline.variables.existing_cluster_name>",
                            "value_type": "string"
                          }
                        },
                        "environment_variables": {}
                      }
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 201
                  timeout: 2m
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "404"
              - step:
                  type: Http
                  name: Link Workspace to Template
                  identifier: link_workspace_template
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspace/templates
                    method: POST
                    headers:
                      - key: Content-Type
                        value: application/json
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.harness_api_key>
                    requestBody: |
                      {
                        "template_id": "POV_Provisioner",
                        "version": "1.0",
                        "workspace_id": "<+pipeline.variables.owner>_pov"
                      }
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 201 || <+httpResponseCode> == 409
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: ShellScript
                  name: Workspace Created
                  identifier: workspace_created
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=== IACM Workspace Created from Template ==="
                          echo "Workspace ID: <+pipeline.variables.owner>_pov"
                          echo "Template: POV_Provisioner (v1.0)"
                          echo "Linkage: Use Template (centrally managed)"
                          echo ""
                          echo "Owner: <+pipeline.variables.owner>"
                          echo "Org: <+pipeline.variables.harness_org_id>"
                          echo "Project: <+pipeline.variables.harness_project_id>"
                          echo ""
                          echo "Template changes will automatically propagate to this workspace."
                          echo "Proceeding to provision infrastructure..."
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
    - stage:
        name: Terraform Destroy
        identifier: terraform_destroy
        description: Destroy Terraform-managed resources (only if force_recreate is true)
        type: IACM
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.force_recreate> == "true"
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          workspace: <+pipeline.variables.owner>_pov
          execution:
            steps:
              - step:
                  type: Run
                  name: Pre-Destroy Cleanup
                  identifier: pre_destroy_cleanup
                  spec:
                    shell: Bash
                    command: |
                      #!/bin/bash
                      set -x
                      
                      OWNER="<+pipeline.variables.owner>"
                      CLUSTER_NAME="<+pipeline.variables.existing_cluster_name>"
                      
                      echo "=== Pre-Destroy Cleanup for owner: $OWNER ==="
                      
                      # Verify AWS credentials (IACM provides these via OIDC)
                      echo ""
                      echo "=== Verifying AWS credentials ==="
                      aws sts get-caller-identity || { echo "No AWS credentials"; exit 0; }
                      
                      # === Delete IAM Role ===
                      echo ""
                      echo "=== Cleaning up IAM Role ==="
                      IAM_ROLE_NAME="harness-demo-${OWNER}-delegate-irsa-role"
                      echo "Checking for IAM role: $IAM_ROLE_NAME"
                      
                      if aws iam get-role --role-name "$IAM_ROLE_NAME" 2>/dev/null; then
                        echo "Found IAM role, proceeding with deletion..."
                        
                        # Remove role from all instance profiles first
                        echo "Checking for instance profiles..."
                        for profile_name in $(aws iam list-instance-profiles-for-role --role-name "$IAM_ROLE_NAME" --query 'InstanceProfiles[*].InstanceProfileName' --output text 2>/dev/null); do
                          if [ -n "$profile_name" ] && [ "$profile_name" != "None" ]; then
                            echo "Removing role from instance profile: $profile_name"
                            aws iam remove-role-from-instance-profile --instance-profile-name "$profile_name" --role-name "$IAM_ROLE_NAME" || true
                          fi
                        done
                        
                        # Detach all managed policies
                        echo "Detaching managed policies..."
                        for policy_arn in $(aws iam list-attached-role-policies --role-name "$IAM_ROLE_NAME" --query 'AttachedPolicies[*].PolicyArn' --output text 2>/dev/null); do
                          if [ -n "$policy_arn" ] && [ "$policy_arn" != "None" ]; then
                            echo "Detaching policy: $policy_arn"
                            aws iam detach-role-policy --role-name "$IAM_ROLE_NAME" --policy-arn "$policy_arn" || true
                          fi
                        done
                        
                        # Delete inline policies
                        echo "Deleting inline policies..."
                        for policy_name in $(aws iam list-role-policies --role-name "$IAM_ROLE_NAME" --query 'PolicyNames[*]' --output text 2>/dev/null); do
                          if [ -n "$policy_name" ] && [ "$policy_name" != "None" ]; then
                            echo "Deleting inline policy: $policy_name"
                            aws iam delete-role-policy --role-name "$IAM_ROLE_NAME" --policy-name "$policy_name" || true
                          fi
                        done
                        
                        # Delete the role
                        echo "Deleting IAM role: $IAM_ROLE_NAME"
                        if aws iam delete-role --role-name "$IAM_ROLE_NAME"; then
                          echo "✓ IAM role deleted successfully"
                        else
                          echo "✗ Failed to delete IAM role - checking if it still exists..."
                          aws iam get-role --role-name "$IAM_ROLE_NAME" 2>/dev/null && echo "Role still exists!" || echo "Role no longer exists"
                        fi
                      else
                        echo "○ IAM role not found (already deleted or never existed)"
                      fi
                      
                      # === Delete K8s Namespaces ===
                      echo ""
                      echo "=== Cleaning up K8s Namespaces ==="
                      if [ -n "$CLUSTER_NAME" ]; then
                        echo "Configuring kubectl for cluster: $CLUSTER_NAME"
                        if aws eks update-kubeconfig --name "$CLUSTER_NAME" --region us-east-1; then
                          kubectl delete namespace "harness-demo-$OWNER" --ignore-not-found=true --wait=false || true
                          kubectl delete namespace "harness-demo-$OWNER-prod" --ignore-not-found=true --wait=false || true
                          echo "✓ K8s namespace deletion initiated"
                        else
                          echo "⚠ Could not configure kubectl"
                        fi
                      fi
                      
                      echo ""
                      echo "=== Pre-Destroy Cleanup Complete ==="
                  timeout: 5m
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: destroy_init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: Destroy
                  identifier: destroy
                  timeout: 30m
                  spec:
                    command: destroy
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsSuccess
    - stage:
        name: Cleanup Existing Resources
        identifier: cleanup_existing
        description: Delete existing Harness resources to allow fresh provisioning
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.force_recreate> == "true"
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Delete Harness Resources
                  identifier: delete_harness_resources
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -x
                          
                          echo "=== Deleting Harness Resources for owner: $OWNER ==="
                          
                          delete_resource() {
                            local url="$1"
                            local name="$2"
                            echo ""
                            echo "Deleting $name..."
                            response=$(curl -s -w "\n%{http_code}" -X DELETE "$url" -H "x-api-key: $API_KEY")
                            http_code=$(echo "$response" | tail -n1)
                            body=$(echo "$response" | sed '$d')
                            echo "Response code: $http_code"
                            if [ "$http_code" = "200" ] || [ "$http_code" = "204" ]; then
                              echo "✓ $name deleted successfully"
                            elif [ "$http_code" = "404" ] || [ "$http_code" = "400" ]; then
                              echo "○ $name not found (already deleted or doesn't exist)"
                            else
                              echo "⚠ $name deletion returned: $http_code"
                              echo "$body"
                            fi
                          }
                          
                          BASE_URL="$ENDPOINT"
                          PARAMS="accountIdentifier=$ACCOUNT_ID&orgIdentifier=$ORG_ID&projectIdentifier=$PROJECT_ID"
                          
                          delete_resource "$BASE_URL/ng/api/environmentsV2/${OWNER}_dev?$PARAMS&forceDelete=true" "Dev Environment"
                          delete_resource "$BASE_URL/ng/api/environmentsV2/${OWNER}_prod?$PARAMS&forceDelete=true" "Prod Environment"
                          delete_resource "$BASE_URL/ng/api/servicesV2/${OWNER}_demo_app?$PARAMS&forceDelete=true" "Service"
                          delete_resource "$BASE_URL/ng/api/connectors/${OWNER}_k8s_reference_architecture?$PARAMS&forceDelete=true" "K8s Connector"
                          delete_resource "$BASE_URL/ng/api/connectors/${OWNER}_aws_reference_architecture?$PARAMS&forceDelete=true" "AWS Connector"
                          delete_resource "$BASE_URL/pipeline/api/pipelines/${OWNER}_k8s_canary_deploy?$PARAMS" "Canary Pipeline"
                          delete_resource "$BASE_URL/pipeline/api/pipelines/${OWNER}_k8s_bg_canary_deploy?$PARAMS" "Blue-Green Pipeline"
                          delete_resource "$BASE_URL/pipeline/api/pipelines/${OWNER}_k8s_strategy_deploy?$PARAMS" "Strategy Choice Pipeline"
                          delete_resource "$BASE_URL/pipeline/api/pipelines/${OWNER}_ci_build?$PARAMS" "CI Pipeline"
                          
                          # Delete HAR registry (upstream proxy)
                          delete_resource "$BASE_URL/har/api/v1/registry/${OWNER}_dockerhub_upstream?space_ref=accountIdentifier%3D${ACCOUNT_ID}%2ForgIdentifier%3D${ORG_ID}" "DockerHub Upstream Proxy"
                          
                          echo ""
                          echo "=== Harness API Cleanup Complete ==="
                          
                          # === Delete K8s Namespaces ===
                          echo ""
                          echo "=== Cleaning up K8s Namespaces ==="
                          
                          # === Verify AWS credentials ===
                          echo ""
                          echo "=== Verifying AWS credentials ==="
                          if aws sts get-caller-identity; then
                            echo "✓ AWS credentials are valid"
                            AWS_AVAILABLE=true
                          else
                            echo "⚠ AWS credentials not available on this delegate"
                            AWS_AVAILABLE=false
                          fi
                          
                          # === Delete IAM Role (do this FIRST before K8s) ===
                          if [ "$AWS_AVAILABLE" = "true" ]; then
                            echo ""
                            echo "=== Cleaning up IAM Role ==="
                            IAM_ROLE_NAME="harness-demo-${OWNER}-delegate-irsa-role"
                            echo "Checking for IAM role: $IAM_ROLE_NAME"
                            
                            # Check if role exists
                            if aws iam get-role --role-name "$IAM_ROLE_NAME" 2>/dev/null; then
                              echo "Found IAM role, proceeding with deletion..."
                              
                              # First detach all managed policies from the role
                              echo "Listing attached policies..."
                              ATTACHED_POLICIES=$(aws iam list-attached-role-policies --role-name "$IAM_ROLE_NAME" --query 'AttachedPolicies[*].PolicyArn' --output text 2>/dev/null || echo "")
                              for policy_arn in $ATTACHED_POLICIES; do
                                if [ -n "$policy_arn" ] && [ "$policy_arn" != "None" ]; then
                                  echo "Detaching policy: $policy_arn"
                                  aws iam detach-role-policy --role-name "$IAM_ROLE_NAME" --policy-arn "$policy_arn" || echo "Failed to detach $policy_arn"
                                fi
                              done
                              
                              # Delete inline policies
                              echo "Listing inline policies..."
                              INLINE_POLICIES=$(aws iam list-role-policies --role-name "$IAM_ROLE_NAME" --query 'PolicyNames[*]' --output text 2>/dev/null || echo "")
                              for policy_name in $INLINE_POLICIES; do
                                if [ -n "$policy_name" ] && [ "$policy_name" != "None" ]; then
                                  echo "Deleting inline policy: $policy_name"
                                  aws iam delete-role-policy --role-name "$IAM_ROLE_NAME" --policy-name "$policy_name" || echo "Failed to delete $policy_name"
                                fi
                              done
                              
                              # Delete the role
                              echo "Deleting IAM role: $IAM_ROLE_NAME"
                              if aws iam delete-role --role-name "$IAM_ROLE_NAME"; then
                                echo "✓ IAM role deleted successfully"
                              else
                                echo "✗ Failed to delete IAM role"
                              fi
                            else
                              echo "○ IAM role not found (already deleted or doesn't exist)"
                            fi
                          else
                            echo "Skipping IAM role cleanup - no AWS credentials"
                          fi
                          
                          # === Configure kubectl for EKS cluster ===
                          if [ "$AWS_AVAILABLE" = "true" ]; then
                            echo ""
                            echo "=== Cleaning up K8s Namespaces ==="
                            CLUSTER_NAME="${EXISTING_CLUSTER_NAME:-harness-eks-${OWNER}}"
                            echo "Configuring kubectl for cluster: $CLUSTER_NAME"
                            
                            if aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "${AWS_REGION:-us-east-1}"; then
                              echo "✓ kubectl configured for EKS cluster"
                              
                              if kubectl cluster-info; then
                                echo "Deleting namespace: harness-demo-$OWNER"
                                kubectl delete namespace "harness-demo-$OWNER" --ignore-not-found=true --wait=false || true
                                
                                echo "Deleting namespace: harness-demo-$OWNER-prod"
                                kubectl delete namespace "harness-demo-$OWNER-prod" --ignore-not-found=true --wait=false || true
                                
                                # Wait for namespaces to terminate
                                echo "Waiting for namespaces to terminate..."
                                sleep 10
                                for ns in "harness-demo-$OWNER" "harness-demo-$OWNER-prod"; do
                                  if kubectl get namespace "$ns" 2>/dev/null | grep -q Terminating; then
                                    echo "Waiting for namespace $ns to terminate..."
                                    kubectl wait --for=delete namespace/"$ns" --timeout=120s 2>/dev/null || true
                                  fi
                                done
                                echo "✓ K8s namespace cleanup complete"
                              else
                                echo "⚠ Could not connect to K8s cluster"
                              fi
                            else
                              echo "⚠ Could not configure kubectl for EKS cluster"
                            fi
                          else
                            echo "Skipping K8s namespace cleanup - no AWS credentials"
                          fi
                          
                          echo ""
                          echo "=== Full Cleanup Complete ==="
                    environmentVariables:
                      - name: OWNER
                        type: String
                        value: <+pipeline.variables.owner>
                      - name: ACCOUNT_ID
                        type: String
                        value: <+pipeline.variables.harness_account_id>
                      - name: ORG_ID
                        type: String
                        value: <+pipeline.variables.harness_org_id>
                      - name: PROJECT_ID
                        type: String
                        value: <+pipeline.variables.harness_project_id>
                      - name: ENDPOINT
                        type: String
                        value: <+pipeline.variables.harness_endpoint>
                      - name: API_KEY
                        type: String
                        value: <+pipeline.variables.harness_api_key>
                      - name: EXISTING_CLUSTER_NAME
                        type: String
                        value: <+pipeline.variables.existing_cluster_name>
                      - name: AWS_REGION
                        type: String
                        value: us-east-1
                    outputVariables: []
                  timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
        delegateSelectors:
          - harness-delegate-ng
    - stage:
        name: Plan and Apply
        identifier: plan_and_apply
        description: Plan, approve, and apply infrastructure changes
        type: IACM
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          workspace: <+pipeline.variables.owner>_pov
          execution:
            steps:
              - step:
                  type: Run
                  name: Pre-Apply Cleanup
                  identifier: pre_apply_cleanup
                  spec:
                    shell: Bash
                    command: |
                      #!/bin/bash
                      set -x
                      
                      OWNER="<+pipeline.variables.owner>"
                      CLUSTER_NAME="<+pipeline.variables.existing_cluster_name>"
                      FORCE_RECREATE="<+pipeline.variables.force_recreate>"
                      
                      # Only run cleanup if force_recreate is true
                      if [ "$FORCE_RECREATE" != "true" ]; then
                        echo "force_recreate is not true, skipping pre-apply cleanup"
                        exit 0
                      fi
                      
                      echo "=== Pre-Apply Cleanup for owner: $OWNER ==="
                      
                      # Verify AWS credentials (IACM provides these via OIDC)
                      echo ""
                      echo "=== Verifying AWS credentials ==="
                      aws sts get-caller-identity || { echo "No AWS credentials"; exit 0; }
                      
                      # === Delete IAM Role ===
                      echo ""
                      echo "=== Cleaning up IAM Role ==="
                      IAM_ROLE_NAME="harness-demo-${OWNER}-delegate-irsa-role"
                      echo "Checking for IAM role: $IAM_ROLE_NAME"
                      
                      if aws iam get-role --role-name "$IAM_ROLE_NAME" 2>/dev/null; then
                        echo "Found IAM role, proceeding with deletion..."
                        
                        # Remove role from all instance profiles first
                        echo "Checking for instance profiles..."
                        for profile_name in $(aws iam list-instance-profiles-for-role --role-name "$IAM_ROLE_NAME" --query 'InstanceProfiles[*].InstanceProfileName' --output text 2>/dev/null); do
                          if [ -n "$profile_name" ] && [ "$profile_name" != "None" ]; then
                            echo "Removing role from instance profile: $profile_name"
                            aws iam remove-role-from-instance-profile --instance-profile-name "$profile_name" --role-name "$IAM_ROLE_NAME" || true
                          fi
                        done
                        
                        # Detach all managed policies
                        echo "Detaching managed policies..."
                        for policy_arn in $(aws iam list-attached-role-policies --role-name "$IAM_ROLE_NAME" --query 'AttachedPolicies[*].PolicyArn' --output text 2>/dev/null); do
                          if [ -n "$policy_arn" ] && [ "$policy_arn" != "None" ]; then
                            echo "Detaching policy: $policy_arn"
                            aws iam detach-role-policy --role-name "$IAM_ROLE_NAME" --policy-arn "$policy_arn" || true
                          fi
                        done
                        
                        # Delete inline policies
                        echo "Deleting inline policies..."
                        for policy_name in $(aws iam list-role-policies --role-name "$IAM_ROLE_NAME" --query 'PolicyNames[*]' --output text 2>/dev/null); do
                          if [ -n "$policy_name" ] && [ "$policy_name" != "None" ]; then
                            echo "Deleting inline policy: $policy_name"
                            aws iam delete-role-policy --role-name "$IAM_ROLE_NAME" --policy-name "$policy_name" || true
                          fi
                        done
                        
                        # Delete the role
                        echo "Deleting IAM role: $IAM_ROLE_NAME"
                        if aws iam delete-role --role-name "$IAM_ROLE_NAME"; then
                          echo "✓ IAM role deleted successfully"
                        else
                          echo "✗ Failed to delete IAM role - checking if it still exists..."
                          aws iam get-role --role-name "$IAM_ROLE_NAME" 2>/dev/null && echo "Role still exists!" || echo "Role no longer exists"
                        fi
                      else
                        echo "○ IAM role not found (already deleted or never existed)"
                      fi
                      
                      # === Delete K8s Namespaces ===
                      echo ""
                      echo "=== Cleaning up K8s Namespaces ==="
                      if [ -n "$CLUSTER_NAME" ]; then
                        echo "Configuring kubectl for cluster: $CLUSTER_NAME"
                        if aws eks update-kubeconfig --name "$CLUSTER_NAME" --region us-east-1; then
                          kubectl delete namespace "harness-demo-$OWNER" --ignore-not-found=true --wait=false || true
                          kubectl delete namespace "harness-demo-$OWNER-prod" --ignore-not-found=true --wait=false || true
                          # Wait a bit for namespace deletion to propagate
                          sleep 5
                          echo "✓ K8s namespace deletion initiated"
                        else
                          echo "⚠ Could not configure kubectl"
                        fi
                      fi
                      
                      echo ""
                      echo "=== Pre-Apply Cleanup Complete ==="
                  timeout: 5m
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: Plan
                  identifier: plan
                  timeout: 15m
                  spec:
                    command: plan
              - step:
                  type: Run
                  name: Show Plan Summary
                  identifier: show_plan_summary
                  spec:
                    shell: Bash
                    command: |
                      echo "=== POV Provisioning Plan Summary ==="
                      echo "Owner: <+pipeline.variables.owner>"
                      echo "Workspace: <+pipeline.variables.owner>_pov"
                      echo "Account: <+pipeline.variables.harness_account_id>"
                      echo "Org: <+pipeline.variables.harness_org_id>"
                      echo "Project: <+pipeline.variables.harness_project_id>"
                      echo "Deployment Targets: <+pipeline.variables.deployment_targets>"
                      echo "======================================="

                      if [ -f /harness/plan.json ]; then
                        echo ""
                        echo "Resources to be created/modified:"
                        jq -r '.resource_changes[] | select(.change.actions | contains(["create"]) or contains(["update"])) | "  \(.change.actions[0]): \(.type).\(.name)"' /harness/plan.json 2>/dev/null || echo "  (unable to parse plan)"
                      fi
              - step:
                  type: IACMApproval
                  name: Approve Plan
                  identifier: approve_plan
                  spec:
                    autoApprove: false
                  timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: MarkAsSuccess
              - step:
                  type: IACMTerraformPlugin
                  name: Apply
                  identifier: apply
                  timeout: 1h
                  spec:
                    command: apply
              - step:
                  type: Run
                  name: POV Ready
                  identifier: pov_ready
                  spec:
                    shell: Bash
                    command: |
                      echo "=============================================="
                      echo "   POV Environment Ready!"
                      echo "=============================================="
                      echo ""
                      echo "Owner: <+pipeline.variables.owner>"
                      echo "Workspace: <+pipeline.variables.owner>_pov"
                      echo ""
                      echo "Access your POV at:"
                      echo "  Harness: <+pipeline.variables.harness_endpoint>"
                      echo "  Org: <+pipeline.variables.harness_org_id>"
                      echo "  Project: <+pipeline.variables.harness_project_id>"
                      echo ""
                      echo "Resources created:"
                      echo "  - Delegate: delegate-<+pipeline.variables.owner>"
                      echo "  - Service: <+pipeline.variables.owner>_demo_app"
                      echo "  - Environments: <+pipeline.variables.owner>_dev, <+pipeline.variables.owner>_prod"
                      echo "  - Pipelines: Canary, Blue-Green, Strategy Choice"
                      echo ""
                      echo "To destroy this POV, run the 'IDP POV Destroyer' pipeline"
                      echo "with owner: <+pipeline.variables.owner>"
                      echo ""
                      echo "CI Pipeline: <+pipeline.variables.owner>_ci_build"
                      echo ""

                      if [ -f /harness/outputs.json ]; then
                        echo "Terraform Outputs:"
                        cat /harness/outputs.json | jq '.'
                      fi
    - stage:
        name: Trigger CI Build
        identifier: trigger_ci_build
        description: Trigger the CI pipeline to build initial Docker image
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Trigger CI Pipeline
                  identifier: trigger_ci
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/pipeline/api/pipeline/execute/<+pipeline.variables.owner>_ci_build?accountIdentifier=<+pipeline.variables.harness_account_id>&orgIdentifier=<+pipeline.variables.harness_org_id>&projectIdentifier=<+pipeline.variables.harness_project_id>&moduleType=CI
                    method: POST
                    headers:
                      - key: x-api-key
                        value: <+pipeline.variables.harness_api_key>
                      - key: Content-Type
                        value: application/yaml
                    requestBody: |
                      pipeline:
                        identifier: <+pipeline.variables.owner>_ci_build
                        variables:
                          - name: git_branch
                            type: String
                            value: main
                          - name: git_repo_url
                            type: String
                            value: <+pipeline.variables.git_repo_url>
                    assertion: <+httpResponseCode> == 200
                    outputVariables:
                      - name: ci_execution_id
                        value: <+json.select("data.planExecution.uuid", httpResponseBody)>
                        type: String
                  timeout: 2m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: ShellScript
                  name: CI Build Triggered
                  identifier: ci_build_triggered
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=============================================="
                          echo "   CI Build Triggered!"
                          echo "=============================================="
                          echo ""
                          echo "Pipeline: <+pipeline.variables.owner>_ci_build"
                          echo "Execution ID: <+execution.steps.trigger_ci.output.outputVariables.ci_execution_id>"
                          echo ""
                          echo "The CI build will:"
                          echo "  1. Clone the demo app repository"
                          echo "  2. Build the Docker image"
                          echo "  3. Push to Harness Artifact Registry (har-<+pipeline.variables.owner>)"
                          echo ""
                          echo "Once complete, you can deploy using:"
                          echo "  - <+pipeline.variables.owner>_k8s_strategy_deploy (Strategy Choice)"
                          echo "  - <+pipeline.variables.owner>_k8s_canary_deploy (Canary)"
                          echo "  - <+pipeline.variables.owner>_k8s_bg_canary_deploy (Blue-Green)"
                          echo ""
                          echo "=============================================="
                          echo "   POV Provisioning Complete!"
                          echo "=============================================="
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
