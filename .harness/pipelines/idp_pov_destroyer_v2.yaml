pipeline:
  name: IDP POV Destroyer v2
  identifier: idp_pov_destroyer_v2
  projectIdentifier: parson
  orgIdentifier: sandbox
  description: |
    Robust POV destroyer that properly uses Terraform state.

    Strategy:
    1. Pre-flight: Verify workspace exists, get state inventory
    2. Unblock: Delete K8s deployments that prevent Harness service deletion
    3. Terraform Destroy: Let Terraform handle resource deletion with proper ordering
    4. Cleanup Orphans: API-delete any resources Terraform couldn't remove
    5. Delete Workspace: Remove IACM workspace after successful destroy
  tags:
    idp: "true"
    pov: "true"
    iacm: "true"
    version: "2"
  variables:
    - name: owner
      type: String
      description: Owner name (identifies the workspace to destroy)
      required: true
      value: <+input>
    - name: deployment_target
      type: String
      description: Deployment target stack to destroy. Use eks for shared-cluster sandboxes and asg for fully self-contained POV environments.
      required: false
      value: <+input>.default(eks).allowedValues(eks,asg)
    - name: harness_account_id
      type: String
      description: Target Harness Account ID
      required: true
      value: <+input>.default(<+account.identifier>)
    - name: harness_endpoint
      type: String
      description: Harness platform endpoint
      required: true
      value: <+input>.default(https://app.harness.io/gratis)
    - name: provisioner_api_key
      type: Secret
      description: SAT for IACM workspace management
      required: true
      value: acct-automation-svc-acct
    - name: target_api_key
      type: Secret
      description: API Key for target Harness account
      required: false
      value: acct-automation-svc-acct
    - name: harness_org_id
      type: String
      description: Harness Org ID
      required: true
      value: <+org.identifier>
    - name: harness_project_id
      type: String
      description: Harness Project ID
      required: true
      value: <+project.identifier>
    - name: eks_cluster_name
      type: String
      description: EKS cluster name (for kubectl access)
      required: false
      value: <+input>.default(harness-eks-parson)
    - name: skip_terraform_destroy
      type: String
      description: Advanced override. Recommended false. Set true only to bypass Terraform and run API/AWS/Kubernetes cleanup directly.
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: auto_approve
      type: String
      description: Recommended true for one-click cleanup. Set false only if you want a manual destroy approval gate.
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: create_standard_ci_gradle
      type: String
      description: Legacy compatibility placeholder for workspace variable mapping. Not used by the destroyer.
      required: false
      value: "false"
  stages:
    - stage:
        name: Pre-flight
        identifier: preflight
        description: Verify workspace exists and gather state information
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Check Workspace Exists
                  identifier: check_workspace
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov
                    method: GET
                    headers:
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    outputVariables:
                      - name: workspace_exists
                        value: <+httpResponseCode>
                        type: String
                      - name: workspace_data
                        value: <+httpResponseBody>
                        type: String
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 404
                  timeout: 1m
              - step:
                  type: ShellScript
                  name: Analyze Workspace
                  identifier: analyze_workspace
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=============================================="
                          echo "  POV Destroyer v2 - Pre-flight Analysis"
                          echo "=============================================="
                          echo ""
                          echo "Owner: <+pipeline.variables.owner>"
                          echo "Workspace: <+pipeline.variables.owner>_pov"
                          echo "Deployment Target: <+pipeline.variables.deployment_target>"
                          echo "Org: <+pipeline.variables.harness_org_id>"
                          echo "Project: <+pipeline.variables.harness_project_id>"
                          echo ""

                          WORKSPACE_STATUS="<+execution.steps.check_workspace.output.outputVariables.workspace_exists>"
                          SKIP_TERRAFORM="<+pipeline.variables.skip_terraform_destroy>"

                          if [ "$WORKSPACE_STATUS" = "200" ]; then
                            echo "✓ Workspace EXISTS - Terraform state is available"
                            export HAS_WORKSPACE="true"
                          else
                            echo "○ Workspace NOT FOUND - No Terraform state"
                            export HAS_WORKSPACE="false"
                          fi

                          echo ""
                          if [ "$SKIP_TERRAFORM" = "true" ]; then
                            echo "Requested Cleanup Mode: API/AWS/Kubernetes cleanup only"
                            echo "  Terraform destroy will be bypassed even if workspace state exists"
                          elif [ "$WORKSPACE_STATUS" = "200" ]; then
                            echo "Requested Cleanup Mode: Standard state-aware destroy"
                            echo "  Terraform destroy will run only if state health checks pass"
                          else
                            echo "Requested Cleanup Mode: Orphan cleanup"
                            echo "  No workspace state exists, so API/AWS/Kubernetes cleanup will be used"
                          fi
                          echo ""
                          echo "Skip Terraform: <+pipeline.variables.skip_terraform_destroy>"
                          echo "Auto Approve: <+pipeline.variables.auto_approve>"
                    environmentVariables: []
                    outputVariables:
                      - name: has_workspace
                        type: String
                        value: HAS_WORKSPACE
                  timeout: 1m
        delegateSelectors:
          - parson-eks-delegate
    - stage:
        name: Unblock Destroy
        identifier: unblock_destroy
        description: Delete K8s deployments that block Harness service deletion
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Delete K8s Deployments
                  identifier: delete_k8s_deployments
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - parson-eks-delegate
                    source:
                      type: Inline
                      spec:
                        script: |
                          if [ "<+pipeline.variables.deployment_target>" = "asg" ]; then
                            echo "=============================================="
                            echo "  Unblocking Terraform Destroy"
                            echo "=============================================="
                            echo ""
                            echo "ASG target selected - no app Kubernetes deployments to remove"
                            echo "Delegate namespace cleanup happens later"
                          else
                            echo "=============================================="
                            echo "  Unblocking Terraform Destroy"
                            echo "=============================================="
                            echo ""
                            echo "Deleting K8s deployments that would block Harness service deletion..."
                            echo ""

                            OWNER="<+pipeline.variables.owner>"
                            NAMESPACE="harness-demo-${OWNER}"

                            if kubectl get namespace "${NAMESPACE}" 2>/dev/null; then
                              echo "Found namespace: ${NAMESPACE}"
                              echo "  Deleting deployments..."
                              kubectl delete deployment --all -n "${NAMESPACE}" --wait=false 2>/dev/null || true
                              echo "  Deleting services..."
                              kubectl delete service --all -n "${NAMESPACE}" --wait=false 2>/dev/null || true
                              echo "  Deleting pods..."
                              kubectl delete pod --all -n "${NAMESPACE}" --grace-period=0 --force 2>/dev/null || true
                              echo "  Waiting for resources to terminate..."
                              sleep 5
                              echo ""
                              echo "Remaining resources in ${NAMESPACE}:"
                              kubectl get all -n "${NAMESPACE}" 2>/dev/null || echo "  (namespace empty or deleted)"
                            else
                              echo "Namespace ${NAMESPACE} does not exist - nothing to clean up"
                            fi
                          fi

                          echo ""
                          echo "✓ Destroy unblocked"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
        delegateSelectors:
          - parson-eks-delegate
    - stage:
        name: Check State Health
        identifier: check_state_health
        description: Determine whether Terraform destroy can safely run or whether cleanup should fall back to API/AWS/Kubernetes deletion.
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.preflight.spec.execution.steps.check_workspace.output.outputVariables.workspace_exists> == "200" && <+pipeline.variables.skip_terraform_destroy> == "false"
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Check Harness Code Repo
                  identifier: check_code_repo
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/code/api/v1/repos/<+pipeline.variables.owner>-demo-app?accountIdentifier=<+pipeline.variables.harness_account_id>&orgIdentifier=<+pipeline.variables.harness_org_id>&projectIdentifier=<+pipeline.variables.harness_project_id>
                    method: GET
                    headers:
                      - key: x-api-key
                        value: <+pipeline.variables.target_api_key>
                    outputVariables:
                      - name: repo_exists
                        value: <+httpResponseCode>
                        type: String
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 404
                  timeout: 1m
              - step:
                  type: Http
                  name: Check HAR Upstream Proxy
                  identifier: check_har_registry
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/har/api/v1/registry/<+pipeline.variables.harness_account_id>/<+pipeline.variables.harness_org_id>/<+pipeline.variables.harness_project_id>/<+pipeline.variables.owner>-dockerhub-proxy/%2B
                    method: GET
                    headers:
                      - key: x-api-key
                        value: <+pipeline.variables.target_api_key>
                    outputVariables:
                      - name: har_exists
                        value: <+httpResponseCode>
                        type: String
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 404
                  timeout: 1m
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.deployment_target> == "eks"
              - step:
                  type: ShellScript
                  name: Evaluate State Health
                  identifier: evaluate_state_health
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=============================================="
                          echo "  State Health Check"
                          echo "=============================================="
                          echo ""
                          REPO_STATUS="<+execution.steps.check_code_repo.output.outputVariables.repo_exists>"
                          TARGET="<+pipeline.variables.deployment_target>"

                          if [ "$TARGET" = "asg" ]; then
                            HAR_STATUS="SKIPPED"
                          else
                            HAR_STATUS="<+execution.steps.check_har_registry.output.outputVariables.har_exists>"
                          fi

                          echo "Harness Code Repo: $REPO_STATUS"
                          echo "HAR Registry: $HAR_STATUS"
                          echo ""

                          if [ "$TARGET" = "asg" ]; then
                            if [ "$REPO_STATUS" = "404" ]; then
                              echo "⚠️  Harness Code repo already deleted - state is stale"
                              echo "   Will skip Terraform and use AWS/API cleanup"
                              export STATE_HEALTHY="false"
                            else
                              echo "✓ Key resources exist - Terraform destroy can proceed"
                              export STATE_HEALTHY="true"
                            fi
                          else
                            if [ "$REPO_STATUS" = "404" ]; then
                              echo "⚠️  Harness Code repo already deleted - state is stale"
                              echo "   Will skip Terraform and use API-only cleanup"
                              export STATE_HEALTHY="false"
                            elif [ "$HAR_STATUS" = "404" ]; then
                              echo "⚠️  HAR registry already deleted - state is stale"
                              echo "   Will skip Terraform and use API-only cleanup"
                              export STATE_HEALTHY="false"
                            else
                              echo "✓ Key resources exist - Terraform destroy can proceed"
                              export STATE_HEALTHY="true"
                            fi
                          fi
                    environmentVariables: []
                    outputVariables:
                      - name: state_healthy
                        type: String
                        value: STATE_HEALTHY
                  timeout: 1m
        delegateSelectors:
          - parson-eks-delegate
    - stage:
        name: Terraform Destroy
        identifier: terraform_destroy
        description: Use Terraform to destroy resources with proper dependency ordering
        type: IACM
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.preflight.spec.execution.steps.check_workspace.output.outputVariables.workspace_exists> == "200" && <+pipeline.variables.skip_terraform_destroy> == "false" && <+pipeline.stages.check_state_health.spec.execution.steps.evaluate_state_health.output.outputVariables.state_healthy> == "true"
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          workspace: <+pipeline.variables.owner>_pov
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: Run
                  name: Fix Stale State
                  identifier: fix_stale_state
                  spec:
                    shell: Bash
                    command: |
                      echo "==============================================" 
                      echo "  Fix Stale State - Remove 404'd Resources"
                      echo "==============================================" 
                      echo ""
                      echo "Checking for resources that were deleted outside Terraform..."
                      echo ""

                      # Find the tofu binary
                      TOFU=$(find /harness/.iacmbin-*/opentofu/tofu -type f 2>/dev/null | head -1)
                      if [ -z "$TOFU" ]; then
                        TOFU=$(which tofu 2>/dev/null || which terraform 2>/dev/null || echo "")
                      fi
                      if [ -z "$TOFU" ]; then
                        echo "WARNING: Cannot find tofu/terraform binary, skipping state fix"
                        exit 0
                      fi
                      echo "Using binary: $TOFU"
                      echo ""

                      # Function to check a Harness resource and remove from state if 404
                      check_and_remove() {
                        local LABEL="$1"
                        local CHECK_URL="$2"
                        local STATE_ADDR="$3"

                        echo -n "  ${LABEL}: "
                        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CHECK_URL}" \
                          -H "x-api-key: <+pipeline.variables.target_api_key>")

                        if [ "$HTTP_CODE" = "404" ]; then
                          echo "404 - removing from state"
                          $TOFU state rm "${STATE_ADDR}" 2>/dev/null || echo "    (not in state)"
                        elif [ "$HTTP_CODE" = "200" ]; then
                          echo "exists"
                        else
                          echo "HTTP ${HTTP_CODE} - leaving in state"
                        fi
                      }

                      OWNER="<+pipeline.variables.owner>"
                      ENDPOINT="<+pipeline.variables.harness_endpoint>"
                      ACCOUNT_ID="<+pipeline.variables.harness_account_id>"
                      ORG_ID="<+pipeline.variables.harness_org_id>"
                      PROJECT_ID="<+pipeline.variables.harness_project_id>"

                      echo "=== Harness Artifact Registry ==="
                      check_and_remove \
                        "HAR upstream proxy (${OWNER}-dockerhub-proxy)" \
                        "${ENDPOINT}/har/api/v1/registry/${ACCOUNT_ID}/${ORG_ID}/${PROJECT_ID}/${OWNER}-dockerhub-proxy/%2B" \
                        'module.har[0].harness_platform_har_registry.dockerhub_upstream[0]'

                      check_and_remove \
                        "HAR virtual registry (har-${OWNER})" \
                        "${ENDPOINT}/har/api/v1/registry/${ACCOUNT_ID}/${ORG_ID}/${PROJECT_ID}/har-${OWNER}/%2B" \
                        'module.har[0].harness_platform_har_registry.registry'

                      # Also remove the cleanup terraform_data if HAR is gone
                      # (it references the deleted registry)
                      HAR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                        "${ENDPOINT}/har/api/v1/registry/${ACCOUNT_ID}/${ORG_ID}/${PROJECT_ID}/${OWNER}-dockerhub-proxy/%2B" \
                        -H "x-api-key: <+pipeline.variables.target_api_key>")
                      if [ "$HAR_STATUS" = "404" ]; then
                        echo -n "  HAR cleanup data: "
                        $TOFU state rm 'module.har[0].terraform_data.cleanup_existing_registry[0]' 2>/dev/null && echo "removed" || echo "(not in state)"
                      fi

                      echo ""
                      echo "=== Harness Code Repository ==="
                      check_and_remove \
                        "Code repo (${OWNER}-demo-app)" \
                        "${ENDPOINT}/code/api/v1/repos/${OWNER}-demo-app?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}" \
                        'module.harness_code_repo[0].harness_platform_repo.main[0]'

                      echo ""
                      echo "=== IRSA Delegate Role (Import Orphaned) ==="
                      ROLE_NAME="harness-demo-${OWNER}-delegate-irsa-role"
                      echo -n "  IRSA role (${ROLE_NAME}): "
                      if $TOFU state list 2>/dev/null | grep -q 'module.irsa_delegate_role\[0\].aws_iam_role.delegate\[0\]'; then
                        echo "already in state"
                      else
                        echo "NOT in state - attempting import..."
                        if $TOFU import 'module.irsa_delegate_role[0].aws_iam_role.delegate[0]' "$ROLE_NAME" 2>&1; then
                          echo "  ✓ Imported orphaned IRSA role - Terraform destroy will now delete it"
                        else
                          echo "  Role does not exist in AWS or import failed (OK - nothing to destroy)"
                        fi
                      fi

                      echo ""
                      echo "=== Current State ==="
                      RESOURCE_COUNT=$($TOFU state list 2>/dev/null | wc -l)
                      echo "Resources remaining in state: ${RESOURCE_COUNT}"
                      echo ""
                      echo "State fix complete. Proceeding to plan-destroy..."
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                          spec: {}
              - step:
                  type: IACMTerraformPlugin
                  name: Plan Destroy
                  identifier: plan_destroy
                  timeout: 15m
                  spec:
                    command: plan-destroy
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                          spec: {}
              - step:
                  type: Run
                  name: Show Destroy Plan
                  identifier: show_destroy_plan
                  spec:
                    shell: Bash
                    command: |
                      echo "=============================================="
                      echo "  Terraform Destroy Plan"
                      echo "=============================================="
                      echo ""
                      echo "Owner: <+pipeline.variables.owner>"
                      echo "Workspace: <+pipeline.variables.owner>_pov"
                      echo ""

                      if [ -f /harness/plan.json ]; then
                        echo "Resources to be DESTROYED:"
                        echo ""
                        jq -r '.resource_changes[] | select(.change.actions | contains(["delete"])) | "  ✗ \(.type).\(.name)"' /harness/plan.json 2>/dev/null || echo "  (unable to parse plan)"
                        echo ""
                        DESTROY_COUNT=$(jq '[.resource_changes[] | select(.change.actions | contains(["delete"]))] | length' /harness/plan.json 2>/dev/null || echo "?")
                        echo "Total resources to destroy: ${DESTROY_COUNT}"
                      else
                        echo "  (plan file not available)"
                      fi

                      echo ""
                      echo "⚠️  This action is IRREVERSIBLE!"
              - step:
                  type: IACMApproval
                  name: Approve Destroy
                  identifier: approve_destroy
                  spec:
                    autoApprove: <+pipeline.variables.auto_approve>
                  timeout: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: MarkAsSuccess
              - step:
                  type: IACMTerraformPlugin
                  name: Destroy
                  identifier: destroy
                  timeout: 30m
                  spec:
                    command: destroy
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                          spec: {}
              - step:
                  type: Run
                  name: Check Destroy Result
                  identifier: check_destroy_result
                  spec:
                    shell: Bash
                    command: |
                      echo "Terraform destroy completed."
                      echo "Any remaining resources will be cleaned up in the next stage."
        delegateSelectors:
          - parson-eks-delegate
    - stage:
        name: AWS Cleanup
        identifier: aws_cleanup
        description: Clean up AWS resources using delegate with IRSA permissions
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Delete IRSA Role and DNS Records
                  identifier: delete_aws_resources
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - parson-eks-delegate
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=== AWS Resource Cleanup (using parson-eks-delegate IRSA) ==="
                          echo ""
                          OWNER="<+pipeline.variables.owner>"
                          TARGET="<+pipeline.variables.deployment_target>"
                          NAME_PREFIX="harness-demo-${OWNER}"
                          
                          # Verify AWS credentials are working
                          echo "Verifying AWS credentials..."
                          aws sts get-caller-identity || { echo "ERROR: AWS credentials not configured"; exit 1; }
                          echo ""
                          
                          # Delete IRSA Role
                          ROLE_NAME="harness-demo-${OWNER}-delegate-irsa-role"
                          echo "=== IAM IRSA Role: ${ROLE_NAME} ==="
                          
                          # Check if role exists first
                          if aws iam get-role --role-name "${ROLE_NAME}" 2>/dev/null >/dev/null; then
                            echo "Role found, deleting..."
                            
                            # First delete inline policies
                            POLICIES=$(aws iam list-role-policies --role-name "${ROLE_NAME}" --query 'PolicyNames[]' --output text 2>/dev/null || true)
                            if [ -n "$POLICIES" ] && [ "$POLICIES" != "None" ]; then
                              echo "Deleting inline policies..."
                              for POLICY in $POLICIES; do
                                echo -n "  Policy ${POLICY}: "
                                aws iam delete-role-policy --role-name "${ROLE_NAME}" --policy-name "$POLICY" && echo "deleted" || echo "failed"
                              done
                            fi
                            
                            # Delete attached policies
                            ATTACHED=$(aws iam list-attached-role-policies --role-name "${ROLE_NAME}" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null || true)
                            if [ -n "$ATTACHED" ] && [ "$ATTACHED" != "None" ]; then
                              echo "Detaching managed policies..."
                              for ARN in $ATTACHED; do
                                echo -n "  Policy ${ARN}: "
                                aws iam detach-role-policy --role-name "${ROLE_NAME}" --policy-arn "$ARN" && echo "detached" || echo "failed"
                              done
                            fi
                            
                            # Delete the role
                            echo -n "Role ${ROLE_NAME}: "
                            aws iam delete-role --role-name "${ROLE_NAME}" && echo "deleted" || echo "failed"
                          else
                            echo "Role ${ROLE_NAME}: not found (ok)"
                          fi
                          
                          echo ""
                          if [ "$TARGET" = "asg" ]; then
                            echo "=== ASG AWS Resources ==="

                            ASG_PREFIX="${NAME_PREFIX}-asg"
                            ASGS=$(aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, '${ASG_PREFIX}')].AutoScalingGroupName" --output text 2>/dev/null || true)
                            if [ -n "$ASGS" ] && [ "$ASGS" != "None" ]; then
                              for ASG in $ASGS; do
                                echo "ASG ${ASG}: deleting"
                                aws autoscaling update-auto-scaling-group --auto-scaling-group-name "$ASG" --min-size 0 --max-size 0 --desired-capacity 0 2>/dev/null || true
                                aws autoscaling delete-auto-scaling-group --auto-scaling-group-name "$ASG" --force-delete 2>/dev/null || true
                              done
                            else
                              echo "No ASGs found with prefix ${ASG_PREFIX}"
                            fi

                            LT_NAME="${ASG_PREFIX}-lt"
                            LT_ID=$(aws ec2 describe-launch-templates --filters "Name=launch-template-name,Values=${LT_NAME}" --query 'LaunchTemplates[0].LaunchTemplateId' --output text 2>/dev/null || true)
                            if [ -n "$LT_ID" ] && [ "$LT_ID" != "None" ]; then
                              echo "Launch Template ${LT_NAME}: deleting"
                              aws ec2 delete-launch-template --launch-template-id "$LT_ID" 2>/dev/null || true
                            else
                              echo "Launch Template ${LT_NAME}: not found (ok)"
                            fi

                            ALB_ARN=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?LoadBalancerName=='${ASG_PREFIX}-alb'].LoadBalancerArn" --output text 2>/dev/null || true)
                            if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
                              echo "ALB ${ASG_PREFIX}-alb: deleting"
                              aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN" 2>/dev/null || true
                            else
                              echo "ALB ${ASG_PREFIX}-alb: not found (ok)"
                            fi

                            for TG in "${ASG_PREFIX}-prod-tg" "${ASG_PREFIX}-stage-tg"; do
                              TG_ARN=$(aws elbv2 describe-target-groups --names "$TG" --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || true)
                              if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
                                echo "Target Group ${TG}: deleting"
                                aws elbv2 delete-target-group --target-group-arn "$TG_ARN" 2>/dev/null || true
                              else
                                echo "Target Group ${TG}: not found (ok)"
                              fi
                            done

                            PROFILE_NAME="${ASG_PREFIX}-instance-profile"
                            ROLE_NAME_APP="${ASG_PREFIX}-instance-role"
                            if aws iam get-instance-profile --instance-profile-name "$PROFILE_NAME" 2>/dev/null >/dev/null; then
                              echo "Instance Profile ${PROFILE_NAME}: deleting"
                              aws iam remove-role-from-instance-profile --instance-profile-name "$PROFILE_NAME" --role-name "$ROLE_NAME_APP" 2>/dev/null || true
                              aws iam delete-instance-profile --instance-profile-name "$PROFILE_NAME" 2>/dev/null || true
                            else
                              echo "Instance Profile ${PROFILE_NAME}: not found (ok)"
                            fi

                            if aws iam get-role --role-name "$ROLE_NAME_APP" 2>/dev/null >/dev/null; then
                              echo "Instance Role ${ROLE_NAME_APP}: deleting"
                              APP_POLICIES=$(aws iam list-role-policies --role-name "$ROLE_NAME_APP" --query 'PolicyNames[]' --output text 2>/dev/null || true)
                              if [ -n "$APP_POLICIES" ] && [ "$APP_POLICIES" != "None" ]; then
                                for POLICY in $APP_POLICIES; do
                                  aws iam delete-role-policy --role-name "$ROLE_NAME_APP" --policy-name "$POLICY" 2>/dev/null || true
                                done
                              fi
                              APP_ATTACHED=$(aws iam list-attached-role-policies --role-name "$ROLE_NAME_APP" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null || true)
                              if [ -n "$APP_ATTACHED" ] && [ "$APP_ATTACHED" != "None" ]; then
                                for ARN in $APP_ATTACHED; do
                                  aws iam detach-role-policy --role-name "$ROLE_NAME_APP" --policy-arn "$ARN" 2>/dev/null || true
                                done
                              fi
                              aws iam delete-role --role-name "$ROLE_NAME_APP" 2>/dev/null || true
                            else
                              echo "Instance Role ${ROLE_NAME_APP}: not found (ok)"
                            fi

                            PACKER_USER="harness-packer-ci-${OWNER}"
                            if aws iam get-user --user-name "$PACKER_USER" 2>/dev/null >/dev/null; then
                              echo "Packer IAM User ${PACKER_USER}: deleting"
                              PACKER_KEYS=$(aws iam list-access-keys --user-name "$PACKER_USER" --query 'AccessKeyMetadata[].AccessKeyId' --output text 2>/dev/null || true)
                              if [ -n "$PACKER_KEYS" ] && [ "$PACKER_KEYS" != "None" ]; then
                                for KEY_ID in $PACKER_KEYS; do
                                  aws iam delete-access-key --user-name "$PACKER_USER" --access-key-id "$KEY_ID" 2>/dev/null || true
                                done
                              fi
                              PACKER_POLICIES=$(aws iam list-user-policies --user-name "$PACKER_USER" --query 'PolicyNames[]' --output text 2>/dev/null || true)
                              if [ -n "$PACKER_POLICIES" ] && [ "$PACKER_POLICIES" != "None" ]; then
                                for POLICY in $PACKER_POLICIES; do
                                  aws iam delete-user-policy --user-name "$PACKER_USER" --policy-name "$POLICY" 2>/dev/null || true
                                done
                              fi
                              PACKER_ATTACHED=$(aws iam list-attached-user-policies --user-name "$PACKER_USER" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null || true)
                              if [ -n "$PACKER_ATTACHED" ] && [ "$PACKER_ATTACHED" != "None" ]; then
                                for ARN in $PACKER_ATTACHED; do
                                  aws iam detach-user-policy --user-name "$PACKER_USER" --policy-arn "$ARN" 2>/dev/null || true
                                done
                              fi
                              PACKER_GROUPS=$(aws iam list-groups-for-user --user-name "$PACKER_USER" --query 'Groups[].GroupName' --output text 2>/dev/null || true)
                              if [ -n "$PACKER_GROUPS" ] && [ "$PACKER_GROUPS" != "None" ]; then
                                for GROUP in $PACKER_GROUPS; do
                                  aws iam remove-user-from-group --user-name "$PACKER_USER" --group-name "$GROUP" 2>/dev/null || true
                                done
                              fi
                              aws iam delete-login-profile --user-name "$PACKER_USER" 2>/dev/null || true
                              aws iam delete-user --user-name "$PACKER_USER" 2>/dev/null || true
                            else
                              echo "Packer IAM User ${PACKER_USER}: not found (ok)"
                            fi

                            VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=${ASG_PREFIX}-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || true)
                            if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
                              for SG in $(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=${VPC_ID}" --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null || true); do
                                aws ec2 delete-security-group --group-id "$SG" 2>/dev/null || true
                              done
                              for SUBNET in $(aws ec2 describe-subnets --filters "Name=vpc-id,Values=${VPC_ID}" --query 'Subnets[].SubnetId' --output text 2>/dev/null || true); do
                                aws ec2 delete-subnet --subnet-id "$SUBNET" 2>/dev/null || true
                              done
                              for RT in $(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=${VPC_ID}" --query 'RouteTables[?Associations[?Main!=`true`]].RouteTableId' --output text 2>/dev/null || true); do
                                for ASSOC in $(aws ec2 describe-route-tables --route-table-ids "$RT" --query 'RouteTables[0].Associations[?Main!=`true`].RouteTableAssociationId' --output text 2>/dev/null || true); do
                                  aws ec2 disassociate-route-table --association-id "$ASSOC" 2>/dev/null || true
                                done
                                aws ec2 delete-route-table --route-table-id "$RT" 2>/dev/null || true
                              done
                              for IGW in $(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=${VPC_ID}" --query 'InternetGateways[].InternetGatewayId' --output text 2>/dev/null || true); do
                                aws ec2 detach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$VPC_ID" 2>/dev/null || true
                                aws ec2 delete-internet-gateway --internet-gateway-id "$IGW" 2>/dev/null || true
                              done
                              aws ec2 delete-vpc --vpc-id "$VPC_ID" 2>/dev/null || true
                            else
                              echo "VPC ${ASG_PREFIX}-vpc: not found (ok)"
                            fi
                          fi

                          echo ""
                          echo "=== Route53 DNS Records ==="
                          ZONE_ID="Z031547912F6D8STOXRA2"

                          if [ "$TARGET" = "asg" ]; then
                            PROD_RECORD="${OWNER}-asg.harness-demo.dev"
                            echo -n "Record ${PROD_RECORD}: "
                            CURRENT=$(aws route53 list-resource-record-sets --hosted-zone-id "${ZONE_ID}" \
                              --query "ResourceRecordSets[?Name=='${PROD_RECORD}.']" --output json 2>/dev/null)
                            if [ "$CURRENT" != "[]" ] && [ -n "$CURRENT" ]; then
                              TTL=$(echo "$CURRENT" | jq -r '.[0].TTL')
                              VALUE=$(echo "$CURRENT" | jq -r '.[0].ResourceRecords[0].Value')
                              aws route53 change-resource-record-sets --hosted-zone-id "${ZONE_ID}" \
                                --change-batch "{\"Changes\":[{\"Action\":\"DELETE\",\"ResourceRecordSet\":{\"Name\":\"${PROD_RECORD}\",\"Type\":\"CNAME\",\"TTL\":${TTL},\"ResourceRecords\":[{\"Value\":\"${VALUE}\"}]}}]}" && echo "deleted" || echo "failed"
                            else
                              echo "not found (ok)"
                            fi
                          else
                            PROD_RECORD="${OWNER}.harness-demo.dev"
                            echo -n "Record ${PROD_RECORD}: "
                            CURRENT=$(aws route53 list-resource-record-sets --hosted-zone-id "${ZONE_ID}" \
                              --query "ResourceRecordSets[?Name=='${PROD_RECORD}.']" --output json 2>/dev/null)
                            if [ "$CURRENT" != "[]" ] && [ -n "$CURRENT" ]; then
                              TTL=$(echo "$CURRENT" | jq -r '.[0].TTL')
                              VALUE=$(echo "$CURRENT" | jq -r '.[0].ResourceRecords[0].Value')
                              aws route53 change-resource-record-sets --hosted-zone-id "${ZONE_ID}" \
                                --change-batch "{\"Changes\":[{\"Action\":\"DELETE\",\"ResourceRecordSet\":{\"Name\":\"${PROD_RECORD}\",\"Type\":\"CNAME\",\"TTL\":${TTL},\"ResourceRecords\":[{\"Value\":\"${VALUE}\"}]}}]}" && echo "deleted" || echo "failed"
                            else
                              echo "not found (ok)"
                            fi

                            STAGE_RECORD="${OWNER}-stage.harness-demo.dev"
                            echo -n "Record ${STAGE_RECORD}: "
                            CURRENT=$(aws route53 list-resource-record-sets --hosted-zone-id "${ZONE_ID}" \
                              --query "ResourceRecordSets[?Name=='${STAGE_RECORD}.']" --output json 2>/dev/null)
                            if [ "$CURRENT" != "[]" ] && [ -n "$CURRENT" ]; then
                              TTL=$(echo "$CURRENT" | jq -r '.[0].TTL')
                              VALUE=$(echo "$CURRENT" | jq -r '.[0].ResourceRecords[0].Value')
                              aws route53 change-resource-record-sets --hosted-zone-id "${ZONE_ID}" \
                                --change-batch "{\"Changes\":[{\"Action\":\"DELETE\",\"ResourceRecordSet\":{\"Name\":\"${STAGE_RECORD}\",\"Type\":\"CNAME\",\"TTL\":${TTL},\"ResourceRecords\":[{\"Value\":\"${VALUE}\"}]}}]}" && echo "deleted" || echo "failed"
                            else
                              echo "not found (ok)"
                            fi
                          fi
                          
                          echo ""
                          echo "✓ AWS cleanup complete"
                    environmentVariables:
                      - name: AWS_DEFAULT_REGION
                        type: String
                        value: us-east-1
                  timeout: 5m
        when:
          pipelineStatus: Success
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsSuccess
    - stage:
        name: Cleanup Orphans
        identifier: cleanup_orphans
        description: Force-delete any remaining Harness resources via API
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Force Delete Remaining Resources
                  identifier: force_delete_remaining
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - parson-eks-delegate
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=============================================="
                          echo "  Cleanup Orphans - Force Delete via API"
                          echo "=============================================="
                          echo ""
                          echo "This stage catches any resources that:"
                          echo "  - Terraform couldn't delete (dependency issues)"
                          echo "  - Were created outside Terraform"
                          echo "  - Exist without a workspace (orphaned)"
                          echo ""

                          # Helper function for API calls
                          api_delete() {
                            local NAME="$1"
                            local URL="$2"
                            echo -n "  ${NAME}: "
                            RESP=$(curl -s -w "\n%{http_code}" -X DELETE "${URL}" \
                              -H "x-api-key: ${API_KEY}" \
                              -H "Content-Type: application/json" 2>/dev/null)
                            HTTP_CODE=$(echo "$RESP" | tail -n1)
                            case "$HTTP_CODE" in
                              200|204) echo "deleted" ;;
                              404) echo "not found (ok)" ;;
                              *) echo "failed ($HTTP_CODE)" ;;
                            esac
                          }

                          echo "=== Pipelines ==="
                          for P in ci_build k8s_strategy_deploy k8s_canary_deploy k8s_bg_canary_deploy canary_deployment blue_green_deployment strategy_choice standard_ci_gradle; do
                            api_delete "${OWNER}_${P}" "${ENDPOINT}/pipeline/api/pipelines/${OWNER}_${P}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"
                          done
                          for P in asg_ci_build asg_strategy_deploy; do
                            api_delete "${OWNER}_${P}" "${ENDPOINT}/pipeline/api/pipelines/${OWNER}_${P}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"
                          done

                          echo ""
                          echo "=== Service ==="
                          api_delete "${OWNER}_demo_app" "${ENDPOINT}/ng/api/servicesV2/${OWNER}_demo_app?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true"
                          api_delete "${OWNER}_demo_app_asg" "${ENDPOINT}/ng/api/servicesV2/${OWNER}_demo_app_asg?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true"

                          echo ""
                          echo "=== Infrastructures ==="
                          for ENV in dev prod; do
                            api_delete "${OWNER}_k8s_${ENV}" "${ENDPOINT}/ng/api/infrastructures/${OWNER}_k8s_${ENV}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&environmentIdentifier=${OWNER}_${ENV}&forceDelete=true"
                          done
                          api_delete "${OWNER}_asg_dev" "${ENDPOINT}/ng/api/infrastructures/${OWNER}_asg_dev?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&environmentIdentifier=${OWNER}_dev&forceDelete=true"

                          echo ""
                          echo "=== Environments ==="
                          for ENV in dev prod; do
                            api_delete "${OWNER}_${ENV}" "${ENDPOINT}/ng/api/environmentsV2/${OWNER}_${ENV}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true"
                          done

                          echo ""
                          echo "=== Connectors ==="
                          for CONN in k8s_reference_architecture aws_reference_architecture github_reference_architecture; do
                            api_delete "${OWNER}_${CONN}" "${ENDPOINT}/ng/api/connectors/${OWNER}_${CONN}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&forceDelete=true"
                          done

                          echo ""
                          echo "=== HAR Registry ==="
                          api_delete "har-${OWNER}" "${ENDPOINT}/har/api/v1/registry/${ACCOUNT_ID}/${ORG_ID}/${PROJECT_ID}/har-${OWNER}/+"
                          api_delete "${OWNER}-dockerhub-proxy" "${ENDPOINT}/har/api/v1/registry/${ACCOUNT_ID}/${ORG_ID}/${PROJECT_ID}/${OWNER}-dockerhub-proxy/+"

                          echo ""
                          echo "=== Harness Code Repository ==="
                          api_delete "${OWNER}-demo-app" "${ENDPOINT}/code/api/v1/repos/${OWNER}-demo-app?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"

                          echo ""
                          echo "=== OPA Policies ==="
                          for POLICY in require_tests_in_ci require_cache_intelligence require_harness_cloud require_docker_layer_caching no_hardcoded_secrets recommend_artifact_scanning require_test_reports require_harness_scanners require_pipeline_tags; do
                            api_delete "$POLICY" "${ENDPOINT}/pm/api/v1/policies/${POLICY}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"
                          done

                          echo ""
                          echo "=== OPA Policy Sets ==="
                          for POLICYSET in ci_pipeline_standards ci_pipeline_standards_on_run security_standards security_standards_on_run build_quality_gates; do
                            api_delete "$POLICYSET" "${ENDPOINT}/pm/api/v1/policysets/${POLICYSET}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"
                          done

                          echo ""
                          echo "=== Delegate Token ==="
                          # List and delete matching tokens
                          TOKENS=$(curl -s "${ENDPOINT}/ng/api/delegate-token-ng?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}" \
                            -H "x-api-key: ${API_KEY}" | grep -o '"name":"[^"]*"' | sed 's/"name":"//g' | sed 's/"//g' | grep "^${OWNER}-delegate-token" || true)
                          if [ -n "$TOKENS" ]; then
                            for TOKEN in $TOKENS; do
                              api_delete "$TOKEN" "${ENDPOINT}/ng/api/delegate-token-ng?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&tokenName=$TOKEN"
                            done
                          else
                            echo "  No matching delegate tokens found"
                          fi

                          echo ""
                          echo "✓ API cleanup complete"
                    environmentVariables:
                      - name: OWNER
                        type: String
                        value: <+pipeline.variables.owner>
                      - name: ACCOUNT_ID
                        type: String
                        value: <+pipeline.variables.harness_account_id>
                      - name: ORG_ID
                        type: String
                        value: <+pipeline.variables.harness_org_id>
                      - name: PROJECT_ID
                        type: String
                        value: <+pipeline.variables.harness_project_id>
                      - name: API_KEY
                        type: String
                        value: <+pipeline.variables.target_api_key>
                      - name: ENDPOINT
                        type: String
                        value: <+pipeline.variables.harness_endpoint>
                    outputVariables: []
                  timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: ShellScript
                  name: Delete K8s Namespace
                  identifier: delete_k8s_namespace
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - parson-eks-delegate
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=== Cleaning up Kubernetes resources ==="
                          OWNER="<+pipeline.variables.owner>"

                          # Delete app namespace
                          NS="harness-demo-${OWNER}"
                          echo -n "Namespace ${NS}: "
                          if kubectl get namespace "${NS}" 2>/dev/null; then
                            kubectl delete namespace "${NS}" --wait=false 2>/dev/null && echo "deleting" || echo "failed"
                          else
                            echo "not found (ok)"
                          fi

                          # Delete delegate namespace
                          DELEGATE_NS="harness-delegate-ng-${OWNER}"
                          echo -n "Namespace ${DELEGATE_NS}: "
                          if kubectl get namespace "${DELEGATE_NS}" 2>/dev/null; then
                            kubectl delete namespace "${DELEGATE_NS}" --wait=false 2>/dev/null && echo "deleting" || echo "failed"
                          else
                            echo "not found (ok)"
                          fi

                          # Delete cluster role binding
                          CRB="harness-delegate-admin-${OWNER}"
                          echo -n "ClusterRoleBinding ${CRB}: "
                          if kubectl get clusterrolebinding "${CRB}" 2>/dev/null; then
                            kubectl delete clusterrolebinding "${CRB}" 2>/dev/null && echo "deleted" || echo "failed"
                          else
                            echo "not found (ok)"
                          fi

                          echo ""
                          echo "✓ Kubernetes cleanup complete"
                          echo "(AWS resources cleaned up in previous IACM stage)"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
        delegateSelectors:
          - parson-eks-delegate
    - stage:
        name: Delete Workspace
        identifier: delete_workspace
        description: Delete the IACM workspace after successful destroy
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.preflight.spec.execution.steps.check_workspace.output.outputVariables.workspace_exists> == "200"
        spec:
          execution:
            steps:
              - step:
                  type: Http
                  name: Delete IACM Workspace
                  identifier: delete_workspace
                  spec:
                    url: <+pipeline.variables.harness_endpoint>/iacm/api/orgs/<+pipeline.variables.harness_org_id>/projects/<+pipeline.variables.harness_project_id>/workspaces/<+pipeline.variables.owner>_pov
                    method: DELETE
                    headers:
                      - key: Harness-Account
                        value: <+pipeline.variables.harness_account_id>
                      - key: x-api-key
                        value: <+pipeline.variables.provisioner_api_key>
                    assertion: <+httpResponseCode> == 200 || <+httpResponseCode> == 204 || <+httpResponseCode> == 404
                  timeout: 2m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  type: ShellScript
                  name: Destroy Complete
                  identifier: destroy_complete
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          WORKSPACE_STATUS="<+pipeline.stages.preflight.spec.execution.steps.check_workspace.output.outputVariables.workspace_exists>"
                          SKIP_TERRAFORM="<+pipeline.variables.skip_terraform_destroy>"
                          STATE_HEALTHY="<+pipeline.stages.check_state_health.spec.execution.steps.evaluate_state_health.output.outputVariables.state_healthy>"

                          echo "=============================================="
                          echo "   POV Environment Destroyed Successfully"
                          echo "=============================================="
                          echo ""
                          echo "Owner: <+pipeline.variables.owner>"
                          echo "Deployment Target: <+pipeline.variables.deployment_target>"
                          echo ""
                          echo "Cleanup Summary:"
                          echo "  ✓ Destroy unblock step completed"
                          if [ "$SKIP_TERRAFORM" = "true" ]; then
                            echo "  ○ Terraform destroy skipped by operator request"
                          elif [ "$WORKSPACE_STATUS" = "200" ] && [ "$STATE_HEALTHY" = "true" ]; then
                            echo "  ✓ Terraform destroy completed"
                          else
                            echo "  ○ Terraform destroy skipped because workspace state was stale"
                          fi
                          echo "  ✓ Orphaned resources force-deleted"
                          echo "  ✓ AWS and Kubernetes cleanup completed"
                          echo "  ✓ IACM workspace deleted"
                          echo ""
                          echo "The POV environment for '<+pipeline.variables.owner>' no longer exists."
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
        delegateSelectors:
          - parson-eks-delegate
    - stage:
        name: Orphan Cleanup Complete
        identifier: orphan_cleanup_complete
        description: Summary when running orphan-only cleanup (no workspace)
        type: Custom
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.preflight.spec.execution.steps.check_workspace.output.outputVariables.workspace_exists> == "404"
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Orphan Cleanup Summary
                  identifier: orphan_summary
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=============================================="
                          echo "   Orphan Cleanup Complete"
                          echo "=============================================="
                          echo ""
                          echo "Owner: <+pipeline.variables.owner>"
                          echo "Deployment Target: <+pipeline.variables.deployment_target>"
                          echo ""
                          echo "No IACM workspace was found for this owner."
                          echo "Performed API-only cleanup of orphaned resources."
                          echo ""
                          echo "Cleanup Summary:"
                          echo "  ○ Terraform destroy skipped (no state)"
                          echo "  ✓ Orphaned Harness resources force-deleted"
                          echo "  ✓ AWS and Kubernetes cleanup completed"
                          echo ""
                          echo "Any resources matching '<+pipeline.variables.owner>_*' pattern have been removed."
                    environmentVariables: []
                    outputVariables: []
                  timeout: 1m
        delegateSelectors:
          - parson-eks-delegate
