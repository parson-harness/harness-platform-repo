          condition: <+pipeline.stages.create_workspace.spec.execution.steps.check_workspace_exists.output.outputVariables.workspace_exists> == "200" && (<+pipeline.variables.force_recreate> == "true" || <+pipeline.stages.create_workspace.spec.execution.steps.check_state_health.output.outputVariables.state_stale> == "true")
        spec:
