apiVersion: v1
kind: Service
metadata:
  name: {{.Values.name}}-svc
  namespace: {{.Values.namespace}}
  labels:
    app: {{.Values.name}}
  {{- with .Values.service.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  type: {{.Values.service.type | default "ClusterIP"}}
  selector:
    app: {{.Values.name}}
  ports:
    - name: http
      port: {{int .Values.service.port | default 80}}
      targetPort: {{int .Values.containerPort | default 8080}}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
