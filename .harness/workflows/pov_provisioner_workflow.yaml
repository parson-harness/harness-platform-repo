apiVersion: harness.io/v1
kind: Workflow
name: POV in a Box Provisioner
identifier: pov_in_a_box_provisioner
type: workflow
scope: project
projectIdentifier: parson
orgIdentifier: sandbox
owner: todd.parson@harness.io
metadata:
  description: |
    Provision a complete Harness POV in a customer account using shared infrastructure.
    
    What gets created:
    - Harness CI pipeline (builds from Harness Code Repo, pushes to HAR)
    - Harness CD pipelines (Canary, Blue-Green, Strategy Choice)
    - Harness Service and Environments (Dev, Prod)
    - K8s namespaces in shared EKS cluster
    - Harness Artifact Registry for Docker images
    
    Prerequisites:
    - Customer Harness account with org/project created
    - Customer API key with admin permissions
    - Access to shared EKS cluster (harness-eks-parson)
  tags:
    - pov-in-a-box
    - iacm
    - cross-account
    - shared-infra
spec:
  presentation:
    customTitle: POV in a Box
    customSubTitle: Deploy a complete Harness demo into a customer account (uses shared EKS cluster)
    customCreateButtonText: Provision POV
  
  output:
    links:
      - title: Pipeline Execution
        url: ${{ steps.trigger.output.PipelineUrl }}
      - title: EKS App URL
        url: http://${{ parameters.owner }}.harness-demo.dev
      - title: ASG App URL
        url: https://${{ parameters.owner }}-asg.harness-demo.dev
      - title: Project Pipelines
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/pipelines
      - title: Project Services
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/services
      - title: Artifact Registry
        url: https://app.harness.io/ng/account/${{ parameters.harness_account_id }}/all/orgs/${{ parameters.harness_org_id }}/projects/${{ parameters.harness_project_id }}/artifacts
  
  lifecycle: production
  
  parameters:
    - title: POV Identity
      required:
        - owner
      properties:
        owner:
          title: POV Owner
          type: string
          description: "Owner name (lowercase, alphanumeric). Used for resource naming (e.g., 'todd' creates 'todd_pov' workspace)"
          pattern: "^[a-z][a-z0-9]*$"
          ui:help: "Must start with a letter, lowercase alphanumeric only"
        
        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken
    
    - title: Harness Configuration
      required:
        - harness_account_id
        - harness_org_id
        - harness_project_id
        - target_api_key
        - target_api_key_email
      properties:
        harness_account_id:
          title: Target Account ID
          type: string
          description: "Harness Account ID where the POV will be provisioned"
          default: <+account.identifier>
          ui:help: "Find this in Account Settings > Overview, or in the URL after /account/"
        
        harness_cluster:
          title: Harness Cluster
          type: string
          description: "Which Harness cluster is the target account on?"
          default: "https://app.harness.io/gratis"
          enum:
            - "https://app.harness.io/gratis"
            - "https://app.harness.io"
            - "https://app3.harness.io"
          enumNames:
            - "Prod 1 - Harness Demo Account Cluster"
            - "Prod 2 - Enterprise accounts"
            - "Prod 3 - Enterprise accounts"
        
        harness_org_id:
          title: Organization ID
          type: string
          description: "Harness Organization ID for the POV (type manually for cross-account)"
          default: sandbox
          ui:help: "For cross-account provisioning, type the org ID manually instead of using the picker"
        
        harness_project_id:
          title: Project ID
          type: string
          description: "Harness Project ID for the POV (type manually for cross-account)"
          default: parson
          ui:help: "For cross-account provisioning, type the project ID manually"
        
        target_api_key:
          title: Target Account API Key
          type: string
          description: "API Key (PAT or SAT) for the target Harness account with admin permissions"
          ui:widget: password
        
        target_api_key_email:
          title: API Key Email
          type: string
          description: "Email associated with the target account API key"
          format: email
    
    - title: Infrastructure
      properties:
        deployment_target:
          title: Deployment Target
          type: string
          description: "Where to deploy the demo app"
          default: eks
          enum:
            - eks
            - asg

        eks_cluster_name:
          title: EKS Cluster
          type: string
          description: "Shared EKS cluster for deployments"
          default: "harness-eks-parson"
          ui:readonly: true
          ui:help: "POV in a Box uses the shared Harness EKS cluster. No AWS setup required in customer account."
    
    - title: Harness Resources
      properties:
        create_harness_environment:
          title: Create Harness Environment?
          type: string
          description: "Create Harness dev environment and infrastructure"
          default: "true"
          enum:
            - "true"
            - "false"
        
        create_prod_environment:
          title: Create Prod Environment?
          type: string
          description: "Create Harness prod environment and infrastructure"
          default: "true"
          enum:
            - "true"
            - "false"
        
  steps:
    - id: trigger
      name: Provisioning POV Environment
      action: trigger:harness-custom-pipeline
      input:
        url: "https://app.harness.io/ng/account/EeRjnXTnS4GrLG5VNNJZUw/all/orgs/sandbox/projects/parson/pipelines/idp_pov_provisioner/pipeline-studio/?storeType=REMOTE&connectorRef=parsongh&repoName=harness-demo-app&branch=main"
        inputset:
          owner: ${{ parameters.owner }}
          harness_account_id: ${{ parameters.harness_account_id }}
          harness_endpoint: ${{ parameters.harness_cluster }}
          harness_org_id: ${{ parameters.harness_org_id }}
          harness_project_id: ${{ parameters.harness_project_id }}
          target_api_key: ${{ parameters.target_api_key }}
          target_api_key_email: ${{ parameters.target_api_key_email }}
          deployment_target: ${{ parameters.deployment_target }}
          eks_cluster_name: ${{ parameters.eks_cluster_name }}
          create_harness_environment: ${{ parameters.create_harness_environment }}
          create_prod_environment: ${{ parameters.create_prod_environment }}
        apikey: ${{ parameters.token }}
