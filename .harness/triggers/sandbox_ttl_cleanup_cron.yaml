trigger:
  name: Weekly Sandbox TTL Cleanup
  identifier: weekly_sandbox_ttl_cleanup
  enabled: true
  description: "Runs every Sunday at 2 AM UTC to audit and clean up expired template-linked POV sandboxes"
  tags:
    automation: "true"
    cleanup: "true"
  orgIdentifier: sandbox
  projectIdentifier: parson
  pipelineIdentifier: sandbox_ttl_cleanup
  source:
    type: Scheduled
    spec:
      type: Cron
      spec:
        expression: "0 2 * * 0"
  inputYaml: |
    pipeline:
      identifier: sandbox_ttl_cleanup
      variables:
        - name: dry_run
          type: String
          value: "false"
        - name: template_id
          type: String
          value: "all"
        - name: sandbox_profile_filter
          type: String
          value: "all"
        - name: deployment_target_filter
          type: String
          value: "all"
        - name: harness_api_key
          type: Secret
          value: <+secrets.getValue("account.harness_api_key")>
