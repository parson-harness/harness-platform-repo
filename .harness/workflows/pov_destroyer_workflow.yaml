apiVersion: harness.io/v1
kind: Workflow
name: POV in a Box Destroyer
identifier: pov_in_a_box_destroyer
type: workflow
scope: project
projectIdentifier: parson
orgIdentifier: sandbox
owner: todd.parson@harness.io
metadata:
  description: "Destroy a POV environment in a customer or external Harness account"
  tags:
    - pov-in-a-box
    - iacm
    - cross-account
spec:
  presentation:
    customTitle: POV in a Box - Destroyer
    customSubTitle: Remove all resources from a POV in a customer or external account
    customCreateButtonText: Destroy POV
  
  output:
    links:
      - title: Pipeline Execution
        url: ${{ steps.trigger.output.PipelineUrl }}
  
  lifecycle: production
  
  parameters:
    - title: POV Identity
      required:
        - owner
      properties:
        owner:
          title: POV Owner
          type: string
          description: "Owner name of the POV to destroy (e.g., 'todd' destroys 'todd_pov' workspace)"
          pattern: "^[a-z][a-z0-9]*$"
          ui:help: "Enter the owner name used when the POV was provisioned"
        
        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken
    
    - title: Harness Configuration
      required:
        - harness_account_id
        - harness_org_id
        - harness_project_id
        - harness_api_key
      properties:
        harness_account_id:
          title: Target Account ID
          type: string
          description: "Harness Account ID where the POV exists"
          default: <+account.identifier>
          ui:help: "Find this in Account Settings > Overview, or in the URL after /account/"
        
        harness_cluster:
          title: Harness Cluster
          type: string
          description: "Which Harness cluster is the target account on?"
          default: "https://app.harness.io/gratis"
          enum:
            - "https://app.harness.io/gratis"
            - "https://app.harness.io"
            - "https://app3.harness.io"
          enumNames:
            - "Prod 1 - Harness Demo Account Cluster"
            - "Prod 2 - Enterprise accounts"
            - "Prod 3 - Enterprise accounts"
        
        harness_org_id:
          title: Organization ID
          type: string
          description: "Harness Organization ID where the POV exists (type manually for cross-account)"
          default: sandbox
          ui:help: "For cross-account destruction, type the org ID manually"
        
        harness_project_id:
          title: Project ID
          type: string
          description: "Harness Project ID where the POV exists (type manually for cross-account)"
          default: parson
          ui:help: "For cross-account destruction, type the project ID manually"
        
        harness_api_key:
          title: Harness API Key
          type: string
          description: "Harness Platform API Key (PAT or SAT) with admin permissions"
          ui:widget: password
    
    - title: Destruction Options
      properties:
        destroy_terraform:
          title: Destroy Terraform Resources?
          type: string
          description: "Run terraform destroy to remove infrastructure (K8s namespaces, IAM roles, HAR registry)"
          default: "true"
          enum:
            - "true"
            - "false"
        
        delete_harness_resources:
          title: Delete Harness Resources?
          type: string
          description: "Delete Harness pipelines, environments, services, and connectors"
          default: "true"
          enum:
            - "true"
            - "false"
        
        delete_delegate:
          title: Delete Delegate?
          type: string
          description: "Delete the Harness delegate from the cluster"
          default: "true"
          enum:
            - "true"
            - "false"
        
        delete_workspace:
          title: Delete IACM Workspace?
          type: string
          description: "Delete the IACM workspace after destruction"
          default: "false"
          enum:
            - "true"
            - "false"
          ui:help: "Warning: This permanently removes the workspace and its state"

  steps:
    - id: trigger
      name: Destroying POV Environment
      action: trigger:harness-custom-pipeline
      input:
        url: "https://app.harness.io/ng/account/EeRjnXTnS4GrLG5VNNJZUw/all/orgs/sandbox/projects/parson/pipelines/idp_pov_destroyer/pipeline-studio/?storeType=REMOTE&connectorRef=parsongh&repoName=harness-demo-app&branch=main"
        inputset:
          owner: ${{ parameters.owner }}
          harness_account_id: ${{ parameters.harness_account_id }}
          harness_endpoint: ${{ parameters.harness_cluster }}
          harness_org_id: ${{ parameters.harness_org_id }}
          harness_project_id: ${{ parameters.harness_project_id }}
          harness_api_key: ${{ parameters.harness_api_key }}
          destroy_terraform: ${{ parameters.destroy_terraform }}
          delete_harness_resources: ${{ parameters.delete_harness_resources }}
          delete_delegate: ${{ parameters.delete_delegate }}
          delete_workspace: ${{ parameters.delete_workspace }}
        apikey: ${{ parameters.token }}
