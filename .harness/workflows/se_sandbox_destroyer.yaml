apiVersion: harness.io/v1
kind: Workflow
name: SE Sandbox Destroyer
identifier: se_sandbox_destroyer
type: workflow
scope: project
projectIdentifier: parson
orgIdentifier: sandbox
owner: todd.parson@harness.io
metadata:
  description: "Destroy an SE sandbox environment in the current account"
  tags:
    - se-sandbox
    - iacm
    - self-service
spec:
  presentation:
    customTitle: Destroy SE Sandbox
    customSubTitle: Remove all resources from your sandbox environment
    customCreateButtonText: Destroy Sandbox
  
  output:
    links:
      - title: Pipeline Execution
        url: ${{ steps.trigger.output.PipelineUrl }}
  
  lifecycle: production
  
  parameters:
    - title: Sandbox Identity
      required:
        - owner
      properties:
        owner:
          title: Sandbox Owner
          type: string
          description: "Owner name of the sandbox to destroy (must match exactly)"
          pattern: "^[a-z][a-z0-9]*$"
          ui:help: "Enter the same owner name used when provisioning"
        
        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken
    
    - title: Target Location
      required:
        - harness_org_id
        - harness_project_id
      properties:
        harness_org_id:
          title: Organization
          type: string
          description: "Organization where the sandbox exists"
          default: sandbox
          ui:field: HarnessOrgPicker
        
        harness_project_id:
          title: Project
          type: string
          description: "Project where the sandbox exists"
          default: parson
          ui:field: HarnessProjectPicker

    - title: Destruction Options
      properties:
        deployment_target:
          title: Deployment Target
          type: string
          description: "Which target stack should be destroyed"
          default: eks
          enum:
            - eks
            - asg

        skip_terraform_destroy:
          title: Skip Terraform Destroy?
          type: string
          description: "Use API-only/orphan cleanup instead of Terraform destroy"
          default: "false"
          enum:
            - "true"
            - "false"

        auto_approve:
          title: Auto Approve?
          type: string
          description: "Auto-approve the destroy pipeline"
          default: "true"
          enum:
            - "true"
            - "false"

  steps:
    - id: trigger
      name: Destroying SE Sandbox
      action: trigger:harness-custom-pipeline
      input:
        url: "https://app.harness.io/ng/account/EeRjnXTnS4GrLG5VNNJZUw/all/orgs/sandbox/projects/parson/pipelines/idp_pov_destroyer_v2/pipeline-studio/?storeType=REMOTE&connectorRef=parsongh&repoName=harness-demo-app&branch=main"
        inputset:
          owner: ${{ parameters.owner }}
          harness_account_id: <+account.identifier>
          harness_endpoint: "https://app.harness.io/gratis"
          harness_org_id: ${{ parameters.harness_org_id }}
          harness_project_id: ${{ parameters.harness_project_id }}
          deployment_target: ${{ parameters.deployment_target }}
          skip_terraform_destroy: ${{ parameters.skip_terraform_destroy }}
          auto_approve: ${{ parameters.auto_approve }}
        apikey: ${{ parameters.token }}
